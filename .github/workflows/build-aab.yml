name: Gerar AAB para a Play Store

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-aab.yml"

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android e ícones
        run: npm run android:init

      - name: Impressão nativa e compartilhamento
        run: |
          cp android-native/MainActivity.java android/app/src/main/java/br/com/leomedvet/app/MainActivity.java
          X=android/app/src/main/res/xml/file_paths.xml
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<paths xmlns:android="http://schemas.android.com/apk/res/android">' '    <external-path name="my_images" path="." />' '    <cache-path name="my_cache_images" path="." />' '</paths>' > $X

      - name: Versão (versionCode = número da execução)
        run: |
          G=android/app/build.gradle
          VC=$((100 + ${{ github.run_number }}))
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"2.1.$VC\"/" $G
          grep -nE "versionCode|versionName|targetSdk|minSdk" $G android/variables.gradle || true

      - name: Compilar AAB (release, sem assinatura)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/ClinicaVetPro-unsigned.aab"

      - name: Publicar AAB (pré-lançamento)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-${{ github.run_number }}
          name: AAB Play Store — build ${{ github.run_number }}
          body: Pacote para a Play Store (precisa ser assinado antes do envio).
          files: ClinicaVetPro-unsigned.aab
          prerelease: true
          make_latest: false
