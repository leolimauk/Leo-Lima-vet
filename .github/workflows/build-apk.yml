name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "index.html"
      - "assets/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android e ícones
        run: npm run android:init

      - name: Compilar APK (debug, instalável)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/LeoMedVet.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LeoMedVet-apk
          path: LeoMedVet.apk
          retention-days: 30
