name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "capacitor.config.json"
      - "package.json"
      - "android-native/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android e ícones
        run: npm run android:init

      - name: Permitir câmera (fotos dos pacientes)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          grep -n 'CAMERA' $M

      - name: Ativar impressão nativa (Imprimir / PDF) e compartilhamento de arquivos
        run: |
          cp android-native/MainActivity.java android/app/src/main/java/br/com/leomedvet/app/MainActivity.java
          X=android/app/src/main/res/xml/file_paths.xml
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<paths xmlns:android="http://schemas.android.com/apk/res/android">' '    <external-path name="my_images" path="." />' '    <cache-path name="my_cache_images" path="." />' '</paths>' > $X
          cat $X
          grep -n "FileProvider\|file_paths" android/app/src/main/AndroidManifest.xml

      - name: Compilar APK (debug, instalável)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ClinicaVetPro.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ClinicaVetPro-apk
          path: ClinicaVetPro.apk
          retention-days: 30

      - name: Publicar APK como Release (download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Clínica Vet Pro — APK build ${{ github.run_number }}
          body: APK de instalação direta (debug). No Android, permita instalar de fontes desconhecidas.
          files: ClinicaVetPro.apk
          make_latest: true
