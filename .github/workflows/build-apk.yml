name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "index.html"
      - "assets/**"
      - "capacitor.config.json"
      - "package.json"
      - "android-native/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android e ícones
        run: npm run android:init

      - name: Ativar impressão nativa (Imprimir / PDF)
        run: cp android-native/MainActivity.java android/app/src/main/java/br/com/leomedvet/app/MainActivity.java

      - name: Compilar APK (debug, instalável)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ClinicaVetPro.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ClinicaVetPro-apk
          path: ClinicaVetPro.apk
          retention-days: 30

      - name: Publicar APK como Release (download direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Clínica Vet Pro — APK build ${{ github.run_number }}
          body: APK de instalação direta (debug). No Android, permita instalar de fontes desconhecidas.
          files: ClinicaVetPro.apk
          make_latest: true
