<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Clínica Odonto Pro" />
<meta name="description" content="Bulário odontológico, anestésicos locais, calculadoras, urgências, odontograma, casos clínicos e receituário para cirurgiões-dentistas e estudantes." />
<title>Clínica Odonto Pro</title>
<link rel="icon" href="__LOGO__" />
<link rel="apple-touch-icon" href="__LOGO__" />
<style>
:root{
  --navy:#0f172a;--royal:#0369a1;--royal-2:#0ea5e9;--copper:#d97706;--copper-2:#0ea5e9;
  --bg:#f7f8fa;--surface:#ffffff;--surface-2:#f9fafb;--ink:#111827;--muted:#6b7280;--line:#eceef1;--line-2:#dfe3e8;
  --accent:#0369a1;--accent-soft:#e0f2fe;--ok:#047857;--ok-soft:#d1fae5;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;--info:#0369a1;--info-soft:#e0f2fe;
  --shadow:0 1px 2px rgba(17,24,39,.04);
  --radius:16px;--nav-h:66px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f14;--surface:#12171e;--surface-2:#171d25;--ink:#e6edf7;--muted:#93a3bc;--line:#222a35;--line-2:#2c3644;
  --accent:#38bdf8;--accent-soft:#0c2a3d;--ok:#34d399;--ok-soft:#0f2e26;--warn:#fbbf24;--warn-soft:#33270b;--bad:#f87171;--bad-soft:#3a1717;--info:#38bdf8;--info-soft:#0c2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0b0f14;--surface:#12171e;--surface-2:#171d25;--ink:#e6edf7;--muted:#93a3bc;--line:#222a35;--line-2:#2c3644;
  --accent:#38bdf8;--accent-soft:#0c2a3d;--ok:#34d399;--ok-soft:#0f2e26;--warn:#fbbf24;--warn-soft:#33270b;--bad:#f87171;--bad-soft:#3a1717;--info:#38bdf8;--info-soft:#0c2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- Topbar ---------- */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#0b1224 0%,#13265c 60%,#1e3a8a 100%);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(2,6,23,.35)}
.top .back{display:none}
.top.sub .back{display:flex}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:#fff}
.brand img{width:40px;height:40px;border-radius:12px;border:2px solid var(--copper-2);background:#fff;flex:none}
.brand b{display:block;font-size:17px;font-weight:850;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:#c7d2fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tbtn:active{transform:scale(.96)}
/* ---------- Layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.layout{display:block}
.side{display:none}
@media (min-width:980px){
  body{padding-bottom:24px}
  .layout{display:grid;grid-template-columns:220px 1fr;gap:20px;max-width:1300px;margin:0 auto;padding:0 16px}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px;height:calc(100vh - 90px);padding-top:16px}
  .side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:650}
  .side a:hover{background:var(--surface)}
  .side a.on{background:var(--accent-soft);color:var(--accent)}
  .dock{display:none!important}
  .wrap{padding:16px 0}
}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b));box-shadow:0 -4px 18px rgba(15,23,42,.06)}
.dock a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 2px;border-radius:12px;min-width:0}
.dock a.on{color:var(--accent)}
.dock a.on svg{stroke-width:2.4}
/* ---------- Generic ---------- */
h1,h2,h3{margin:0;letter-spacing:-.015em}
h1{font-size:22px;font-weight:850}
h2{font-size:18px;font-weight:800}
h3{font-size:15.5px;font-weight:800}
.muted{color:var(--muted)}
.sm{font-size:13px}.xs{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2m{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-title h2{font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px;min-height:42px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0b1120}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0b1120}}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:800;line-height:1.5;white-space:nowrap}
.t-a1{background:#fef9c3;color:#854d0e;border:1px solid #fde047}
.t-b1{background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd}
.t-c1,.t-ctl{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
.t-atb{background:#dcfce7;color:#166534;border:1px solid #86efac}
.t-cls{background:var(--accent-soft);color:var(--accent)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-info{background:var(--info-soft);color:var(--info)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:750;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;min-height:44px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:84px;resize:vertical}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:40px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:14px 0}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note b{font-weight:800}
/* ---------- Home ---------- */
.hero{background:radial-gradient(120% 140% at 0% 0%,#1d4ed8 0%,#13265c 45%,#0b1224 100%);color:#fff;border-radius:22px;padding:20px;display:flex;gap:16px;align-items:center;box-shadow:0 14px 30px rgba(2,6,23,.25);overflow:hidden;position:relative}
.hero img{width:92px;height:92px;border-radius:22px;border:3px solid var(--copper-2);background:#fff;flex:none}
.hero h1{font-size:22px;color:#fff}
.hero p{margin:6px 0 0;color:#c7d2fe;font-size:13.5px}
.hero .search{margin-top:12px}
.hero .inp{background:rgba(255,255,255,.96);color:#0f172a;border-color:transparent}
.hero .search svg{color:#475569}
@media (max-width:520px){.hero{flex-direction:column;align-items:flex-start;padding:18px}.hero img{width:64px;height:64px;border-radius:16px}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-height:96px}
.tile .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.tile b{font-size:14.5px}
.tile span{font-size:12px;color:var(--muted)}
.ic.c1{background:#dbeafe;color:#1d4ed8}.ic.c2{background:#fef3c7;color:#b45309}.ic.c3{background:#fee2e2;color:#b91c1c}.ic.c4{background:#d1fae5;color:#047857}.ic.c5{background:#ede9fe;color:#6d28d9}.ic.c6{background:#e0f2fe;color:#0369a1}.ic.c7{background:#fce7f3;color:#be185d}.ic.c8{background:#f1f5f9;color:#334155}
.sp-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:420px){.sp-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.sp-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:11.5px;font-weight:700;text-align:center}
.sp-btn em{font-style:normal;font-size:24px;line-height:1.1}
/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);cursor:pointer}
.item:active{background:var(--surface-2)}
.item .t{font-weight:800;font-size:15px}
.item .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.spi{font-size:15px;letter-spacing:1px}
.sev{width:10px;height:10px;border-radius:50%;flex:none}
.sev.Fatal{background:#dc2626}.sev.Grave{background:#ea580c}.sev.Moderada{background:#d97706}.sev.Leve{background:#65a30d}
/* ---------- Detail ---------- */
.dhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dhead h1{font-size:22px}
.kv{display:grid;gap:10px}
.kv .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.kv .v{margin-top:2px}
.dose-t{width:100%;border-collapse:separate;border-spacing:0}
.dose-row{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.dose-row:first-child{border-top:0}
.dose-row .e{font-size:24px;line-height:1}
.dose-row .d{font-weight:850;font-size:15.5px;font-variant-numeric:tabular-nums}
.dose-row .m{font-size:13px;color:var(--muted);margin-top:2px}
.dose-row .o{font-size:13px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- Calc ---------- */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.tools{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tool{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:750;font-size:13px}
.tool.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (max-width:639px){.tools{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.tools::-webkit-scrollbar{display:none}.tool{flex:none;white-space:nowrap}}
.out{border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1.5px solid var(--accent)}
.out .big{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.out .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.res-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.res b{display:block;font-size:19px;font-weight:850;font-variant-numeric:tabular-nums}
.res span{font-size:12px;color:var(--muted);font-weight:650}
.wstep{display:flex;gap:6px}
.wstep button{min-width:44px}
input[type=range]{width:100%;accent-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl td.n{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.scroll-x{overflow-x:auto}
/* ---------- Overlay / modal ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(2,6,23,.55);display:none;align-items:flex-start;justify-content:center;padding:calc(12px + var(--safe-t)) 12px 12px}
.ov.show{display:flex}
.ov .box{background:var(--surface);border-radius:20px;width:100%;max-width:720px;max-height:calc(100vh - 24px);overflow:auto;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.case-q{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px;font-weight:750}
.pts{margin:0;padding-left:20px}
.pts li{margin:6px 0}
.take{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px;font-weight:750}
.disc{font-size:12px;color:var(--muted);text-align:center;margin:28px 8px 8px}
.lg{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 120% at 0% 0%,#1d4ed8 0%,#13265c 45%,#0b1224 100%);display:none;align-items:center;justify-content:center;padding:20px}
.lg.show{display:flex}
.lg .box{background:var(--surface);border-radius:22px;padding:22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lg img{width:84px;height:84px;border-radius:20px;border:3px solid var(--copper-2);display:block;margin:0 auto 10px}

/* ===== Clean theme overrides ===== */
.top{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:none}
.brand{color:var(--ink)}.brand img{border:0;border-radius:10px;width:36px;height:36px;background:none}
.brand b{font-size:16.5px;font-weight:800}.brand b span{color:var(--accent)}.brand small{color:var(--muted)}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--ink)}
.hero{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.hero img{border:0;background:none;border-radius:20px}.hero h1{color:var(--ink)}.hero p{color:var(--muted)}
.hero .inp{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line-2)}.hero .search svg{color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.out{background:var(--accent-soft);border:1px solid var(--accent)}
.tile{box-shadow:none}.card{box-shadow:none}
.lg{background:var(--bg)}.lg .box{border:1px solid var(--line);box-shadow:0 10px 40px rgba(17,24,39,.08)}.lg img{border:0;border-radius:20px}
.dock{box-shadow:none}
.fig{width:100%;height:auto;display:block}
.figbox{max-width:260px;margin:10px auto 0;background:var(--surface-2);border-radius:14px;padding:8px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:700px){.dgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dcard{display:flex;flex-direction:column;gap:8px}
.dthumb{background:var(--surface-2);border-radius:10px;padding:4px;height:110px;display:flex;align-items:center;justify-content:center}
.dthumb svg{height:100%;width:auto}
.pchart{width:100%;min-width:560px;height:150px;display:block}
.tsel{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.tb{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 0;font-size:11px;font-weight:800;color:var(--ink);cursor:pointer}
.tb.ok{background:var(--ok-soft);border-color:var(--ok)}.tb.bad{background:var(--warn-soft);border-color:var(--warn)}.tb.aus{opacity:.35;text-decoration:line-through}
.tb.on{outline:2px solid var(--accent);outline-offset:1px}
.pin{min-height:38px;padding:6px 4px;text-align:center;width:48px;font-size:15px}
.ptbl td,.ptbl th{padding:5px 3px;text-align:center}
.ptbl td:first-child,.ptbl th:first-child{text-align:left;min-width:92px}
/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  body{background:#fff;padding:0;color:#000}
  .top,.dock,.layout,.ov,.toast{display:none!important}
  #printArea{display:block}
  .rx-page{page-break-after:always;padding:18mm 16mm;font-family:Georgia,serif;color:#000;min-height:260mm;position:relative}
  .rx-page:last-child{page-break-after:auto}
  .rx-h{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
  .rx-h b{font-size:18px}
  .rx-item{margin:12px 0}
  .rx-foot{position:absolute;bottom:18mm;left:16mm;right:16mm;text-align:center;border-top:1px solid #000;padding-top:6px}
}
</style>
</head>
<body>
<header class="top" id="top">
  <button class="tbtn back" onclick="goBack()" aria-label="Voltar">__I_BACK__</button>
  <a class="brand" href="#/">
    <img src="__LOGO__" alt="Clínica Odonto Pro" />
    <div style="min-width:0"><b>Clínica Odonto <span>Pro</span></b><small id="topSub">Farmacologia &amp; Clínica Odontológica</small></div>
  </a>
  <button class="tbtn" onclick="openSearch()" aria-label="Buscar">__I_SEARCH__</button>

<script>
"use strict";
const DATA = /*__DATA__*/null;

/* ================= Base ================= */
const SP = [

  atb:{n:"Antibióticos",c:"c4"},afung:{n:"Antifúngicos",c:"c4"},avir:{n:"Antivirais",c:"c4"},antis:{n:"Antissépticos e uso clínico",c:"c6"},
  hemo:{n:"Hemostáticos",c:"c3"},fluor:{n:"Flúor e dessensibilizantes",c:"c6"},seda:{n:"Ansiolíticos e sedação",c:"c5"},emerg:{n:"Emergências",c:"c3"},
  dtm:{n:"Dor orofacial e DTM",c:"c7"},sup:{n:"Suporte (antieméticos, IBP, antialérgicos)",c:"c8"},endo:{n:"Endodontia",c:"c1"},clar:{n:"Clareamento",c:"c7"},
  sist:{n:"Fármacos do paciente (sistêmicos)",c:"c8"}
};
const CTL = {
  A1:{s:"A1 · Amarela",c:"t-a1",l:"Lista A1 (entorpecentes) — Notificação de Receita A (amarela), talonário numerado fornecido pela Vigilância Sanitária. Validade 30 dias."},
  B1:{s:"B1 · Azul",c:"t-b1",l:"Lista B1 (psicotrópicos) — Notificação de Receita B (azul). Validade 30 dias, até 60 dias de tratamento."},
  C1:{s:"C1 · 2 vias",c:"t-c1",l:"Lista C1 — Receita de Controle Especial em 2 vias (1ª retida na farmácia). Validade 30 dias. O cirurgião-dentista prescreve para uso odontológico."},
  CTL:{s:"Controlado",c:"t-ctl",l:"Substância sujeita a controle especial (Portaria SVS/MS 344/98) — confirme a lista vigente; em geral Receita de Controle Especial em 2 vias."},
  C5:{s:"C5 · Anabolizante",c:"t-c1",l:"Lista C5 (anabolizantes) — Receita de Controle Especial em 2 vias; validade 30 dias."},
  CANN:{s:"Cannabis · Receita retida",c:"t-b1",l:"Cannabis medicinal: o médico-veterinário pode prescrever produtos registrados/autorizados pela ANVISA (RDC 327/2019) e produtos veterinários regularizados pelo MAPA (decisão ANVISA 30/10/2024; RDC 936/2024 — Lista A3). Receita especial retida na farmácia. Manipulação proibida. Confirme a norma vigente no CRMV/MAPA."},
  ATB:{s:"Antibiótico",c:"t-atb",l:"Antimicrobiano — receita em 2 vias com retenção da 1ª via na farmácia, validade 10 dias (RDC ANVISA 471/2021). Prescreva só quando houver infecção com sinais sistêmicos ou disseminação, sempre com remoção da causa."}
};
const UNIT = {
  mg:{k:"mg/kg",t:"mg",c:"mg/mL"},mcg:{k:"mcg/kg",t:"mcg",c:"mcg/mL"},UI:{k:"UI/kg",t:"UI",c:"UI/mL"},mEq:{k:"mEq/kg",t:"mEq",c:"mEq/mL"},
  mL:{k:"mL/kg",t:"mL",c:""},g:{k:"g/kg",t:"g",c:""},m2:{k:"mg/m²",t:"mg",c:"mg/mL"},mcgmin:{k:"mcg/kg/min",t:"mcg/min",c:"mcg/mL"},"":{k:"",t:"",c:""}
};
const ICONS = __ICONS__;
function ic(n,s){return '<svg class="i" viewBox="0 0 24 24"'+(s?' style="width:'+s+'px;height:'+s+'px'+(n==="starf"?';fill:currentColor':'')+'"':(n==="starf"?' style="fill:currentColor"':''))+'><path d="'+ICONS[n]+'"/></svg>'}

const store = {
  get(k,d){try{const v=localStorage.getItem("lmo_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("lmo_"+k,JSON.stringify(v))}catch(e){}}
};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const fmt = (n,d) => {
  if(!isFinite(n)) return "—";
  if(d==null){ const a=Math.abs(n); d = a>=100?0:a>=10?1:a>=1?2:a>=0.1?3:4; }
  return n.toLocaleString("pt-BR",{maximumFractionDigits:d,minimumFractionDigits:0});
};
const num = v => { const x=parseFloat(String(v).replace(",",".")); return isFinite(x)?x:0; };
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200)}
function copy(txt){
  const done=()=>toast("Copiado para a área de transferência");
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,()=>fallback())}else fallback();
  function fallback(){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){toast("Não foi possível copiar")}ta.remove()}
}

/* ================= Data prep ================= */
const DRUGS = DATA.drugs.map((d,i)=>{
  d.id = norm(d.n).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  d.x = d.x||{}; d.d = d.d||{};
  d._s = norm([d.n,d.b,d.i,d.p,CLS[d.c]&&CLS[d.c].n].join(" "));
  return d;
}).sort((a,b)=>a.n.localeCompare(b.n,"pt-BR"));
const DM = Object.fromEntries(DRUGS.map(d=>[d.id,d]));
const TOX = DATA.tox.map((t,i)=>{t.id="t"+i;t._s=norm([t.n,t.t,t.sp,t.mech,t.sx,t.ant].join(" "));return t});
function spGroup(s){s=norm(s);if(/crian/.test(s))return"ped";if(/gestan/.test(s))return"ges";if(/idos/.test(s))return"ido";return"ad";}
const CASES = DATA.cases.map((c,i)=>{c.id="c"+(i+1);c.g=spGroup(c.sp);c._s=norm([c.title,c.sp,c.spec,c.ctx].join(" "));return c});

/* ================= Interações ================= */
const IG=DATA.ig,INTER=DATA.inter;
const GLBL={VASO_EPI:"Anestésicos com epinefrina",AINE:"AINEs",CORT:"Corticoides",ANTICOAG:"Anticoagulantes/antiagregantes",BZD:"Benzodiazepínicos",OPIOIDE:"Opioides",SEROT:"Serotoninérgicos",TRICICL:"Tricíclicos",CYP3A_INIB:"Inibidores do CYP3A4",AZOL_SIST:"Azóis",MACRO:"Macrolídeos",QT:"Prolongadores de QT",METHB:"Indutores de meta-hemoglobina",SEDATIVO:"Sedativos",IMUNOSSUP:"Imunossupressores",DIABET:"Antidiabéticos"};
const EVL={B:"Bula/diretriz",V:"Estudos clínicos",H:"Farmacologia/relatos"};
function inSide(side,name){return side===name||(IG[side]&&IG[side].includes(name))}
function sideLbl(side){return IG[side]?(GLBL[side]||side):side}
function interPairs(names){const out=[],seen=new Set();
  for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){const x=names[i],y=names[j];if(x===y)continue;
    INTER.forEach((r,k)=>{const hit=(inSide(r.a,x)&&inSide(r.b,y))||(inSide(r.a,y)&&inSide(r.b,x));const key=k+"|"+[x,y].sort().join("|");if(hit&&!seen.has(key)){seen.add(key);out.push({r,x,y})}})}
  const o={Grave:0,Moderada:1,Leve:2};return out.sort((p,q)=>o[p.r.sev]-o[q.r.sev])}
function interFor(name){return INTER.filter(r=>inSide(r.a,name)||inSide(r.b,name)).map(r=>({r,other:inSide(r.a,name)?r.b:r.a}))}
function sevTag(s){return '<span class="tag '+(s==="Grave"?"t-bad":s==="Moderada"?"t-warn":"t-info")+'">'+s+'</span>'}
function interCard(p){const r=p.r;return '<div class="card" style="border-left:4px solid '+(r.sev==="Grave"?"var(--bad)":r.sev==="Moderada"?"var(--warn)":"var(--info)")+'"><div class="row wrapf" style="gap:6px">'+sevTag(r.sev)+'<span class="tag t-cls">'+EVL[r.ev]+'</span></div><h3 style="margin-top:8px">'+esc(p.x?p.x+" + "+p.y:sideLbl(p.other))+'</h3>'+(p.other&&IG[p.other]?'<div class="xs muted" style="margin-top:2px">'+esc(IG[p.other].join(", "))+'</div>':"")+'<div class="kv" style="margin-top:10px">'+kv("Efeito",r.eff)+kv("Mecanismo",r.mech)+kv("Conduta",r.cond)+'</div></div>'}

/* ================= State ================= */
const S = {
  q:"",sp:store.get("medSp",""),cls:"",ctl:"",
  favs:new Set(store.get("favs",[])),recent:store.get("recent",[]),
  calcSp:store.get("calcSp","ped"),calcW:store.get("calcW",{}),calcDrug:"",
  toxT:"",caseSp:"",caseQ:"",done:new Set(store.get("doneCases",[])),
  rx:store.get("rx",{items:[],pat:{},tut:{}}),
  doc:store.get("doc",{nome:"",crmv:"",clinica:"",end:"",tel:""}),tooth:"",odSet:"perm"
};
function saveFavs(){store.set("favs",[...S.favs])}
function toggleFav(id){S.favs.has(id)?S.favs.delete(id):S.favs.add(id);saveFavs();toast(S.favs.has(id)?"Adicionado aos favoritos":"Removido dos favoritos");route()}
function pushRecent(id){S.recent=[id,...S.recent.filter(x=>x!==id)].slice(0,8);store.set("recent",S.recent)}

/* ================= Theme ================= */
function applyTheme(){const t=store.get("theme","auto");const r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);
  const dark=t==="dark"||(t==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.getElementById("themeBtn").innerHTML=dark?ic("sun"):ic("moon")}

/* ================= Router ================= */
const AFTER=[];
const NAV=[["#/","Início","home"],["#/bulario","Bulário","pill"],["#/diagnosticos","Diagnóst.","search"],["#/calc","Cálculos","calc"],["#/tox","Urgências","alert"]];
const SIDE=NAV.concat([["#/emergencia","Emergências","cross"],["#/prontuario","Prontuário e fotos","camera"],["#/imagem","Exames de imagem","xray"],["#/materiais","Materiais dentários","layers"],["#/estomato","Estomatologia","eye"],["#/casos","Casos clínicos","book"],["#/periograma","Periograma","chart"],["#/odontograma","Odontograma","tooth"],["#/receita","Receituário","file"],["#/favoritos","Favoritos","star"],["#/legislacao","Legislação","scale"],["#/ajustes","Ajustes","gear"]]);
function goBack(){if(history.length>1)history.back();else location.hash="#/"}
function route(){
  const h=location.hash||"#/";const parts=h.replace(/^#\/?/,"").split("/").map(decodeURIComponent);
  const page=parts[0]||"";const arg=parts[1]||"";
  const app=document.getElementById("app");

    case "imagem":html=vImg(arg);sub="Exames de imagem";break;

    case "estomato":html=vStom(arg,parts[2]);isSub=!!arg;sub="Estomatologia";break;

    case "receita":html=vRx();sub="Receituário";break;

    case "legislacao":html=vReg();sub="Legislação & Receituário";break;

    default:html=vHome();
  }
  app.innerHTML=html;
  AFTER.splice(0).forEach(fn=>{try{fn()}catch(e){console.error(e)}});
  document.getElementById("topSub").textContent=sub;
  const lb=document.getElementById("logoutBtn");if(lb)lb.style.display=(typeof AUTH_ON!=="undefined"&&AUTH_ON&&store.get("auth",null))?"flex":"none";
  document.getElementById("top").classList.toggle("sub",isSub);
  const base="#/"+page;
  const mk=(arr,cls)=>arr.map(([href,l,i])=>'<a href="'+href+'" class="'+((href===base||(href==="#/"&&page===""))?"on":"")+'">'+ic(i,cls?20:22)+'<span>'+l+'</span></a>').join("");
  document.getElementById("dock").innerHTML=mk(NAV);
  document.getElementById("side").innerHTML=mk(SIDE,1);
  if(!route._keep)window.scrollTo(0,0);route._keep=false;
  if(page==="calc")calcRun();
}
window.addEventListener("hashchange",route);
function rerender(){route._keep=true;route()}

/* ================= Components ================= */
function labInfo(d,sp){return{on:true,tag:"",why:""}}
function ctlTag(c){return c&&CTL[c]?'<span class="tag '+CTL[c].c+'">'+CTL[c].s+'</span>':""}
function clsTag(c){return CLS[c]?'<span class="tag t-cls">'+CLS[c].n+'</span>':""}
function spIcons(d){return SP.filter(s=>d.d[s.id]).map(s=>s.e).join("")}
function doseText(d,sp){const e=d.d[sp];if(!e)return"";const u=UNIT[d.u||""];
  if(e[0]==null)return e[4]||"Ver observações";
  return (e[0]===e[1]?fmt(e[0]):fmt(e[0])+"–"+fmt(e[1]))+" "+u.k;}
function drugItem(d){
  const spTxt=S.sp&&d.d[S.sp]?'<div class="sm" style="margin-top:6px"><b>'+SPM[S.sp].e+" "+esc(doseText(d,S.sp))+'</b> <span class="muted">· '+esc(d.d[S.sp][2]||"")+" · "+esc(d.d[S.sp][3]||"")+'</span></div>':(S.sp&&d.x[S.sp]?'<div class="sm" style="margin-top:6px;color:var(--bad)"><b>⛔ '+SPM[S.sp].n+":</b> "+esc(d.x[S.sp])+'</div>':"");
  return '<a class="item" href="#/bulario/'+d.id+'"><div class="row between"><div class="t">'+esc(d.n)+'</div>'+(S.favs.has(d.id)?'<span style="color:var(--copper)">'+ic("starf",18)+'</span>':"")+'</div><div class="s">'+esc(d.b)+'</div>'+spTxt+
  '<div class="tags">'+clsTag(d.c)+ctlTag(d.ctl)+'<span class="spi" title="Perfis com posologia">'+spIcons(d)+'</span></div></a>';
}

/* ================= Home ================= */
function vHome(){
  const day=Math.floor(Date.now()/864e5);const cd=CASES[day%CASES.length];
  const fav=[...S.favs].map(id=>DM[id]).filter(Boolean).slice(0,6);
  const rec=S.recent.map(id=>DM[id]).filter(Boolean).slice(0,6);
  return '<section class="hero"><img src="'+LOGO+'" alt="" /><div style="flex:1;min-width:0;width:100%"><h1>Clínica Odonto Pro</h1><p>Bulário odontológico, anestésicos, urgências, odontograma e casos clínicos — funciona offline.</p>'+
  '<div class="search">'+ic("search")+'<input class="inp" placeholder="Buscar: articaína, amoxicilina, alveolite, anafilaxia..." onfocus="openSearch(this.value);this.blur()" readonly /></div></div></section>'+
  '<div class="stats"><div class="stat"><b>'+DRUGS.length+'</b><span>fármacos e produtos</span></div><div class="stat"><b>'+TOX.length+'</b><span>urgências médicas</span></div><div class="stat"><b>'+INTER.length+'</b><span>regras de interação</span></div><div class="stat"><b>'+CASES.length+'</b><span>casos clínicos</span></div></div>'+
  '<div class="sec-title"><h2>Ferramentas</h2></div><div class="tiles">'+
  tile("#/emergencia","cross","c3","Emergências","RCP · doses · trauma dentário")+tile("#/prontuario","camera","c2","Prontuário","Evolução e fotos pelo celular")+
  tile("#/imagem","xray","c5","Exames de imagem","Requisição: panorâmica, tomografia")+tile("#/materiais","layers","c7","Materiais dentários","Restauração, endodontia, prótese")+
  tile("#/calc/anest","calc","c1","Anestésicos locais","Dose máxima em tubetes")+tile("#/odontograma","tooth","c6","Odontograma","Anatomia e anestesia por dente")+
  tile("#/calc/profi","shield","c4","Profilaxia antibiótica","Endocardite (AHA)")+tile("#/calc/emerg","heart","c3","Kit de emergência","Doses por peso")+
  tile("#/calc/dose","drop","c5","Doses pediátricas","mg/kg → mL e gotas")+tile("#/calc/inter","alert","c2","Interações","Varfarina, epinefrina, AINEs...")+
  tile("#/tox","alert","c3","Urgências","Síncope, anafilaxia, LAST")+tile("#/receita","file","c8","Receituário","Com CRO e 2 vias")+
  tile("#/estomato","eye","c7","Estomatologia","Atlas, diferencial, biópsia, câncer")+tile("#/diagnosticos","search","c5","Diagnósticos","Com ilustrações e assistente")+tile("#/periograma","chart","c6","Periograma","Gráfico e estadiamento")+
  tile("#/casos","book","c4","Casos clínicos","Modo estudo")+tile("#/diagnosticos/assistente","shield","c7","Assistente pulpar","Testes → diagnóstico AAE")+'</div>'+
  '<div class="sec-title"><h2>Bulário por perfil de paciente</h2></div><div class="sp-grid">'+SP.slice(0,5).map(s=>'<a class="sp-btn" href="#/bulario" onclick="setMedSp(\''+s.id+'\')"><em>'+s.e+'</em>'+s.n+'</a>').join("")+'</div>'+

  disclaimer();
}
function tile(h,i,c,t,s){return '<a class="tile" href="'+h+'"><div class="ic '+c+'">'+ic(i)+'</div><b>'+t+'</b><span>'+s+'</span></a>'}
function disclaimer(){return '<p class="disc">Ferramenta de apoio à decisão clínica para cirurgiões-dentistas e estudantes. Conteúdo baseado em referências de terapêutica odontológica (ex.: Andrade — Terapêutica Medicamentosa em Odontologia; Malamed — Manual de Anestesia Local; diretrizes AHA/ADA) e pode variar entre fontes — confira a bula, a legislação vigente e o julgamento clínico. Não substitui avaliação profissional.</p>'}
function setMedSp(s){S.sp=s;store.set("medSp",s)}

/* ================= Bulário ================= */
function filteredDrugs(){
  const q=norm(S.q).trim().split(/\s+/).filter(Boolean);
  return DRUGS.filter(d=>(!S.cls||d.c===S.cls)&&(!S.sp||d.d[S.sp]||d.x[S.sp])&&(!S.ctl||(S.ctl==="ctl"?["A1","B1","C1","CTL"].includes(d.ctl):d.ctl===S.ctl))&&q.every(w=>d._s.includes(w)));
}
function vMeds(){
  const clsCount={};DRUGS.forEach(d=>clsCount[d.c]=(clsCount[d.c]||0)+1);
  return '<div class="stack"><div class="row between"><h1>Bulário</h1><span class="muted sm" id="medCount"></span></div>'+
  '<div class="search">'+ic("search")+'<input class="inp" id="medQ" value="'+esc(S.q)+'" placeholder="Nome, marca comercial ou indicação" oninput="S.q=this.value;medList()" /></div>'+
  '<div class="chips">'+'<button class="chip '+(!S.sp?"on":"")+'" onclick="S.sp=\'\';store.set(\'medSp\',\'\');rerender()">Todos os perfis</button>'+SP.map(s=>'<button class="chip '+(S.sp===s.id?"on":"")+'" onclick="S.sp=\''+s.id+'\';store.set(\'medSp\',S.sp);rerender()">'+s.e+" "+s.n+'</button>').join("")+'</div>'+
  '<div class="chips"><button class="chip '+(!S.cls?"on":"")+'" onclick="S.cls=\'\';rerender()">Todas as classes</button>'+Object.keys(CLS).filter(k=>clsCount[k]).map(k=>'<button class="chip '+(S.cls===k?"on":"")+'" onclick="S.cls=\''+k+'\';rerender()">'+CLS[k].n+' <span class="muted">'+clsCount[k]+'</span></button>').join("")+'</div>'+
  '<div class="chips">'+[["","Todos"],["ctl","Controlados"],["A1","A1 Amarela"],["B1","B1 Azul"],["C1","C1"],["ATB","Antimicrobianos"]].map(([k,l])=>'<button class="chip '+(S.ctl===k?"on":"")+'" onclick="S.ctl=\''+k+'\';rerender()">'+l+'</button>').join("")+'</div>'+
  '<div class="list" id="medList"></div></div>'+disclaimer()+(AFTER.push(medList),"");
}
function medList(){
  const el=document.getElementById("medList");if(!el)return;const r=filteredDrugs();
  document.getElementById("medCount").textContent=r.length+" de "+DRUGS.length;
  el.innerHTML=r.length?r.map(drugItem).join(""):'<div class="empty">Nenhum fármaco encontrado.<br/>Tente outro termo ou limpe os filtros.</div>';
}
function vDrug(id){
  const d=DM[id];if(!d)return'<div class="empty">Fármaco não encontrado.</div>';
  pushRecent(id);
  const rows=SP.filter(s=>d.d[s.id]).map(s=>{const e=d.d[s.id];
    return '<div class="dose-row"><div class="e">'+s.e+'</div><div><div class="row between wrapf" style="gap:6px"><div><div class="xs muted" style="font-weight:800">'+s.n.toUpperCase()+'</div><div class="d">'+esc(doseText(d,s.id))+'</div></div>'+
    (e[0]!=null?'<a class="btn sm" href="#/calc/dose/'+d.id+'" onclick="S.calcSp=\''+s.id+'\';store.set(\'calcSp\',S.calcSp)">'+ic("calc",16)+' Calcular</a>':"")+'</div>'+
    '<div class="m">'+esc([e[2],e[3]].filter(Boolean).join(" · "))+'</div><div style="margin-top:5px">'+labInfo(d,s.id).tag+'</div>'+(e[4]&&e[0]!=null?'<div class="o">'+esc(e[4])+'</div>':"")+'</div></div>'}).join("");
  const xs=Object.keys(d.x).filter(k=>SPM[k]);
  return '<div class="stack"><div class="card"><div class="dhead"><div style="min-width:0"><h1>'+esc(d.n)+'</h1><div class="muted sm" style="margin-top:4px">'+esc(d.b)+'</div></div>'+
  '<button class="tbtn" style="background:var(--surface-2);color:'+(S.favs.has(d.id)?"var(--copper)":"var(--muted)")+';border-color:var(--line)" onclick="toggleFav(\''+d.id+'\')" aria-label="Favoritar">'+ic(S.favs.has(d.id)?"starf":"star")+'</button></div>'+
  '<div class="row wrapf" style="margin-top:10px;gap:6px">'+clsTag(d.c)+ctlTag(d.ctl)+'</div>'+
  (d.ctl?'<div class="note '+(d.ctl==="ATB"?"ok":"warn")+'" style="margin-top:12px">'+esc(CTL[d.ctl].l)+'</div>':"")+
  '<div class="actions" style="margin-top:12px"><button class="btn sm" onclick="addRxDrug(\''+d.id+'\')">'+ic("plus",16)+' Receita</button><button class="btn sm" onclick="copyDrug(\''+d.id+'\')">'+ic("copy",16)+' Copiar</button></div></div>'+
  (xs.length?'<div class="note bad"><b>⛔ Contraindicado / evitar:</b><br/>'+xs.map(k=>SPM[k].e+" <b>"+SPM[k].n+":</b> "+esc(d.x[k])).join("<br/>")+'</div>':"")+
  (rows?'<div class="card"><h2 style="margin-bottom:4px">Posologia por perfil de paciente</h2>'+rows+'</div>':'<div class="note info">Uso conforme técnica/produto — veja as observações abaixo.</div>')+
  (function(){const L=interFor(d.n);return L.length?'<div class="card"><h2>Interações ('+L.length+')</h2><p class="xs muted" style="margin:4px 0 8px">Use o verificador para checar uma combinação específica.</p><div class="stack">'+L.map(interCard).join("")+'</div><a class="btn sm" style="margin-top:10px" href="#/calc/inter" onclick="S.interSel=[\''+d.id+'\']">Verificar com outros fármacos</a></div>':''})()+'<div class="card kv">'+kv("Apresentações",d.p)+kv("Mecanismo de ação",d.m)+kv("Indicações",d.i)+kv("Contraindicações e precauções",d.ci)+kv("Efeitos adversos e alertas",d.ae)+(d.wd?kv("Carência / observações regulatórias",d.wd):"")+'</div></div>'+disclaimer();
}
function kv(k,v){return v?'<div><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>':""}
function copyDrug(id){const d=DM[id];const L=[d.n+" ("+d.b+")","Classe: "+(CLS[d.c]?CLS[d.c].n:""),d.ctl?"Controle: "+CTL[d.ctl].l:"","Apresentações: "+d.p,"Indicações: "+d.i,"Doses:"];
  SP.forEach(s=>{const e=d.d[s.id];if(e)L.push("• "+s.n+": "+doseText(d,s.id)+" "+[e[2],e[3]].filter(Boolean).join(" ")+(e[4]&&e[0]!=null?" ("+e[4]+")":""))});
  Object.keys(d.x).forEach(k=>SPM[k]&&L.push("⛔ "+SPM[k].n+": "+d.x[k]));L.push("Contraindicações: "+d.ci,"Efeitos adversos: "+d.ae);copy(L.filter(Boolean).join("\n"))}

/* ================= Favoritos ================= */
function vFavs(){const f=[...S.favs].map(id=>DM[id]).filter(Boolean);
  return '<div class="stack"><h1>Favoritos</h1>'+(f.length?'<div class="list">'+f.map(drugItem).join("")+'</div>':'<div class="card empty">Toque na ⭐ de qualquer fármaco para salvá-lo aqui.</div>')+'</div>'}

/* ================= Busca global ================= */
function openSearch(v){const o=document.getElementById("searchOv");o.classList.add("show");const i=document.getElementById("gq");i.value=v||"";renderSearch(i.value);setTimeout(()=>i.focus(),30)}
function closeSearch(){document.getElementById("searchOv").classList.remove("show")}
function renderSearch(v){
  const q=norm(v).trim().split(/\s+/).filter(Boolean);const el=document.getElementById("gres");
  if(!q.length){el.innerHTML='<div class="muted sm">Dica: busque por princípio ativo, nome comercial (ex.: <b>Septanest</b>, <b>Clavulin</b>), indicação (<b>alveolite</b>), urgência (<b>anafilaxia</b>) ou caso (<b>terceiro molar</b>).</div>';return}
  const m=o=>q.every(w=>o._s.includes(w));
  const dr=DRUGS.filter(m).slice(0,25),tx=TOX.filter(m).slice(0,10),cs=CASES.filter(m).slice(0,10),st=(typeof STOMS!=='undefined'?STOMS:[]).filter(m).slice(0,10);
  const go="onclick=\"closeSearch()\"";
  el.innerHTML=(dr.length?'<div class="xs muted" style="font-weight:800;margin:6px 2px">MEDICAMENTOS ('+dr.length+')</div><div class="list">'+dr.map(d=>'<a class="item" '+go+' href="#/bulario/'+d.id+'"><div class="t">'+esc(d.n)+'</div><div class="s">'+esc(d.b)+'</div></a>').join("")+'</div>':"")+
  (tx.length?'<div class="xs muted" style="font-weight:800;margin:14px 2px 6px">TOXICOLOGIA ('+tx.length+')</div><div class="list">'+tx.map(t=>'<a class="item" '+go+' href="#/tox/'+t.id+'"><div class="row"><span class="sev '+t.sev+'"></span><div class="t">'+esc(t.n)+'</div></div><div class="s">'+esc(t.t+" · "+t.sp)+'</div></a>').join("")+'</div>':"")+
  (st.length?'<div class="xs muted" style="font-weight:800;margin:14px 2px 6px">ESTOMATOLOGIA ('+st.length+')</div><div class="list">'+st.map(l=>'<a class="item" '+go+' href="#/estomato/l/'+l.id+'"><div class="t">'+esc(l.n)+'</div><div class="s">'+esc(l.el)+'</div></a>').join("")+'</div>':"")+
  (cs.length?'<div class="xs muted" style="font-weight:800;margin:14px 2px 6px">CASOS CLÍNICOS ('+cs.length+')</div><div class="list">'+cs.map(c=>'<a class="item" '+go+' href="#/casos/'+c.id+'"><div class="t">'+esc(c.title)+'</div><div class="s">'+esc(c.sp+" · "+c.spec)+'</div></a>').join("")+'</div>':"")+
  (!dr.length&&!tx.length&&!cs.length&&!st.length?'<div class="empty">Nada encontrado para “'+esc(v)+'”.</div>':"");
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSearch();if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();openSearch()}});

/* ================= Calculadoras ================= */
const TOOLS=[["anest","Anestésicos","calc"],["dose","Doses pediátricas","drop"],["profi","Profilaxia ATB","shield"],["emerg","Emergências","heart"],["inter","Interações","alert"],["cortic","Corticoides","flask"],["conv","Diluições","swap"]];
function vCalc(tool,arg){if(tool==="dose"&&!arg)tool=tool;if(!CALC[tool])tool="anest";
  if(tool==="dose"&&arg&&DM[arg])S.calcDrug=arg;
  return '<div class="stack"><h1>Calculadoras</h1><div class="tools">'+TOOLS.map(([k,l,i])=>'<a class="tool '+(k===tool?"on":"")+'" href="#/calc/'+k+'">'+ic(i,18)+l+'</a>').join("")+'</div>'+
  '<div class="card" id="calcBox">'+(CALC[tool]||CALC.dose)()+'</div></div>'+disclaimer();
}
function spSelect(id,val,onch){return '<select class="inp" id="'+id+'" onchange="'+onch+'">'+SP.map(s=>'<option value="'+s.id+'" '+(s.id===val?"selected":"")+'>'+s.e+" "+s.n+'</option>').join("")+'</select>'}
function f(id,label,val,extra){return '<div class="field"><label for="'+id+'">'+label+'</label><input class="inp" type="number" inputmode="decimal" step="any" id="'+id+'" value="'+val+'" oninput="calcRun()" '+(extra||"")+' /></div>'}
function gv(id){const e=document.getElementById(id);return e?num(e.value):0}
function bsa(sp,w){return SPM[sp].k*Math.pow(w,2/3)/100}

function calcAnest(){const a=AN[num(document.getElementById("aA").value)],w=gv("aW"),lim=num(document.getElementById("aC").value),used=gv("aU");const o=document.getElementById("aOut");if(!o)return;
  S.calcW.ad=w;store.set("calcW",S.calcW);
  const mg=Math.min(a.max*w,a.abs),tubAn=mg/a.mg,tubEpi=a.epi?lim/a.epi:Infinity,tub=Math.min(tubAn,tubEpi),rest=tub-used;
  const lim2=tubEpi<tubAn;
  o.innerHTML='<div class="lbl">Máximo nesta sessão</div><div class="big">'+fmt(Math.floor(tub*10)/10,1)+' tubetes</div><div class="sm muted">'+(lim2?"Limitado pelo vasoconstritor":"Limitado pelo anestésico")+'</div>'+
  '<div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(mg,0)+' mg</b><span>dose máxima ('+fmt(a.max)+' mg/kg; teto '+a.abs+' mg)</span></div><div class="res"><b>'+fmt(tubAn,1)+'</b><span>tubetes pelo anestésico ('+a.mg+' mg/tubete)</span></div>'+
  (a.epi?'<div class="res"><b>'+fmt(tubEpi,1)+'</b><span>tubetes pelo vasoconstritor ('+fmt(a.epi,3)+' mg/tubete; máx. '+lim+' mg)</span></div>':'<div class="res"><b>—</b><span>sem epinefrina</span></div>')+
  '<div class="res"><b style="color:'+(rest<0?"var(--bad)":"inherit")+'">'+fmt(Math.max(rest,0),1)+'</b><span>tubetes restantes ('+fmt(used)+' usados)</span></div></div>'+
  (rest<0?'<div class="note bad" style="margin-top:10px"><b>Dose máxima ULTRAPASSADA</b> — observe sinais de toxicidade (gosto metálico, zumbido, tremores, convulsão).</div>':"")+
  (/Prilocaína/.test(a.n)?'<div class="note warn" style="margin-top:10px">Evitar em gestantes (felipressina) e em risco de meta-hemoglobinemia.</div>':"")+(/Articaína/.test(a.n)&&w<20?'<div class="note warn" style="margin-top:10px">Articaína: uso a partir de 4 anos.</div>':"")+(/Bupivacaína/.test(a.n)&&w<40?'<div class="note bad" style="margin-top:10px">Bupivacaína não é recomendada em crianças.</div>':"")+

function calcDose(){
  const d=DM[S.calcDrug];const out=document.getElementById("cOut");if(!d||!out)return;
  const sp=S.calcSp,e=d.d[sp],u=UNIT[d.u||"mg"];const w=gv("cW"),dose=gv("cDose"),conc=gv("cConc"),tab=gv("cTab");
  if(w<=0){out.innerHTML='<div class="muted">Informe o peso.</div>';return}

  if(d.u==="mcgmin"){
    const mcgmin=total,mgh=mcgmin*60/1000;const bag=gv("cBag"),rate=gv("cRate");
    const mlh=conc>0?mcgmin*60/conc:NaN;const addMl=(conc>0&&rate>0)?(mcgmin*60/rate)*bag/conc:NaN;
    html='<div class="lbl">Taxa de fármaco</div><div class="big">'+fmt(mcgmin)+' mcg/min</div><div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(mgh)+' mg/h</b><span>quantidade por hora</span></div><div class="res"><b>'+fmt(mlh)+' mL/h</b><span>fármaco puro ('+fmt(conc)+' mcg/mL)</span></div></div>'+
    (isFinite(addMl)?'<div class="note ok" style="margin-top:10px"><b>Preparo:</b> adicionar <b>'+fmt(addMl)+' mL</b> do fármaco em '+fmt(bag)+' mL de diluente e infundir a <b>'+fmt(rate)+' mL/h</b>.'+(addMl>bag*0.2?" <b>Volume de fármaco alto — aumente a taxa ou reduza o volume da bolsa.</b>":"")+'</div>':"");
    lastCalc={d,txt:"Infusão contínua a "+fmt(dose)+" mcg/kg/min: adicionar "+fmt(addMl)+" mL em "+fmt(bag)+" mL e infundir a "+fmt(rate)+" mL/h."};
  }else{
    const vol=conc>0&&u.c?total/conc:NaN;const tabs=tab>0?total/tab:NaN;const gtm=gv("cGt")||20;const gts=vol*gtm;
    html='<div class="lbl">Dose total por administração</div><div class="big">'+fmt(total)+" "+u.t+'</div>'+

    '<div class="res-grid" style="margin-top:10px">'+(u.c?'<div class="res"><b>'+(isFinite(vol)?fmt(vol)+" mL":"—")+'</b><span>volume ('+(conc?fmt(conc)+" "+u.c:"informe a concentração")+')</span></div>':'')+
    (isFinite(gts)&&d.gt?'<div class="res"><b>≈ '+(gts<1?fmt(gts,1):Math.round(gts))+' gota'+(gts>=1.5?'s':'')+'</b><span>líquido oral/gotas ('+fmt(gtm)+' gotas/mL)'+(gts<1?' — volume pequeno: prefira seringa':'')+'</span></div>':"")+(isFinite(tabs)?'<div class="res"><b>'+fmt(tabs,2)+' comp.</b><span>≈ '+frac(tabs)+' de '+fmt(tab)+" "+u.t+'</span></div>':"")+
    '<div class="res"><b>'+esc(e[2]||"—")+'</b><span>via</span></div><div class="res"><b style="font-size:15px">'+esc(e[3]||"—")+'</b><span>frequência</span></div></div>';
    const via=(e[2]||"").split(/[\/ ]/)[0];
    lastCalc={d,txt:(isFinite(vol)?"Administrar "+fmt(vol)+" mL"+(/VO|oral/i.test(e[2]||"")&&gts>=1?" (≈ "+Math.round(gts)+" gotas)":"")+" ("+fmt(total)+" "+u.t+")":isFinite(tabs)?"Administrar "+frac(tabs)+" comprimido(s) de "+fmt(tab)+" "+u.t+" ("+fmt(total)+" "+u.t+")":"Administrar "+fmt(total)+" "+u.t)+(via?" por via "+via:"")+", "+(e[3]||"")+".",pres:(isFinite(vol)&&conc?fmt(conc)+" "+u.c:isFinite(tabs)?fmt(tab)+" "+u.t:"")};
  }

}

function calcCRI(){const w=gv("iW"),U=document.getElementById("iU").value,d=gv("iD"),c=gv("iC"),V=gv("iV"),R=gv("iR");const o=document.getElementById("iOut");if(!o)return;
  let perH; // em mg/h (ou UI/h)
  if(U==="mcgkgmin")perH=d*w*60/1000;else if(U==="mcgkgh")perH=d*w/1000;else if(U==="mgkgh"||U==="uikgh")perH=d*w;else perH=d*w/24;
  const mlDrugH=c>0?perH/c:NaN;const hours=R>0?V/R:NaN;const amt=perH*hours;const addMl=c>0?amt/c:NaN;const un=U==="uikgh"?"UI":"mg";
  o.innerHTML='<div class="lbl">Quantidade por hora</div><div class="big">'+fmt(perH)+" "+un+'/h</div><div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(mlDrugH)+' mL/h</b><span>se fármaco puro (bomba de seringa)</span></div><div class="res"><b>'+fmt(hours)+' h</b><span>duração da bolsa</span></div></div>'+
  '<div class="note ok" style="margin-top:10px"><b>Preparo:</b> adicionar <b>'+fmt(addMl)+' mL</b> ('+fmt(amt)+" "+un+') do fármaco a '+fmt(V)+' mL e infundir a <b>'+fmt(R)+' mL/h</b>. Considere retirar da bolsa o mesmo volume adicionado.</div>';}
function calcFluid(){const sp=document.getElementById("fSp").value,w=gv("fW"),D=num(document.getElementById("fD").value),T=gv("fT")||24,L=gv("fL"),E=num(document.getElementById("fE").value);const o=document.getElementById("fOut");
  const s=SPM[sp];const maint=s.mlExp===0.75?s.ml*Math.pow(w,0.75):s.ml*w;const def=w*D*10;const first=(def/T)+(maint+L)/24;const after=(maint+L)/24;const tot24=def+maint+L;
  const gt=r=>r*E/60;
  o.innerHTML='<div class="lbl">Taxa nas primeiras '+fmt(T)+' h</div><div class="big">'+fmt(first,1)+' mL/h</div><div class="sm muted">≈ '+fmt(gt(first),1)+' gotas/min · 1 gota a cada '+fmt(60/gt(first),1)+' s</div>'+
  '<div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(def,0)+' mL</b><span>déficit ('+D+'%)</span></div><div class="res"><b>'+fmt(maint,0)+' mL/dia</b><span>manutenção ('+fmt(maint/w,0)+' mL/kg/dia)</span></div><div class="res"><b>'+fmt(after,1)+' mL/h</b><span>após corrigir déficit</span></div><div class="res"><b>'+fmt(tot24,0)+' mL</b><span>total estimado 24 h</span></div></div>';}

  const R=[["Adrenalina (dose baixa)",0.01,1,"mg","IV/IO a cada 3–5 min (ciclos alternados)"],["Adrenalina (intratraqueal)",0.02,1,"mg","diluir em salina, via tubo"],["Vasopressina",0.8,20,"UI","IV/IO, alternativa à adrenalina"],["Atropina",0.04,0.5,"mg","IV/IO — assistolia/AESP vagal"],
   ["Lidocaína (FV refratária — cães)",2,20,"mg","IV/IO lento"],["Amiodarona (FV refratária)",5,50,"mg","IV/IO lento"],["Naloxona (reversão opioide)",0.04,0.4,"mg","IV/IO"],["Flumazenil (reversão BZD)",0.01,0.1,"mg","IV/IO"],["Atipamezol (reversão alfa-2)",0.1,5,"mg","IM/IV"],
   ["Gluconato de cálcio 10%",50,100,"mg","IV lento — hipocalcemia/hipercalemia"],["Bicarbonato 8,4% (RCP > 10 min)",1,1,"mEq","IV lento"],["Glicose 50% (diluir)",0.5,500,"g","= 1 mL/kg diluído 1:2"]];
  const rows=R.map(([n,dk,c,un,ob])=>{if(sp==="cat"&&n.startsWith("Lidocaína"))return"";let tot=dk*w,vol;if(un==="g"){tot=dk*w;vol=tot*1000/c}else vol=tot/c;

  '<div class="res-grid" style="margin-top:12px"><div class="res"><b>'+fmt(4*w,0)+"–"+fmt(6*w,0)+' J</b><span>desfibrilação monofásica externa (4–6 J/kg)</span></div><div class="res"><b>'+fmt(2*w,0)+"–"+fmt(4*w,0)+' J</b><span>desfibrilação bifásica externa (2–4 J/kg)</span></div><div class="res"><b>'+fmt(10*w,0)+' mL</b><span>volume corrente (10 mL/kg)</span></div><div class="res"><b>'+(sp==="cat"?"2,5–4,5":w<5?"3–5":w<15?"5–7":w<30?"7–9":"9–11")+'</b><span>sonda endotraqueal sugerida (mm DI)</span></div></div>'+
  '<div class="note warn" style="margin-top:10px">Concentrações: adrenalina 1 mg/mL, vasopressina 20 UI/mL, atropina 0,5 mg/mL, lidocaína 2%, amiodarona 50 mg/mL, naloxona 0,4 mg/mL, flumazenil 0,1 mg/mL, atipamezol 5 mg/mL, Ca 10% (100 mg/mL), bicarbonato 1 mEq/mL. Confira as ampolas disponíveis.</div>';}

function calcRER(){const w=gv("eW"),fc=num(document.getElementById("eF").value),kc=gv("eK");const o=document.getElementById("eOut");if(!o)return;
  const rer=70*Math.pow(w,0.75),mer=rer*fc;const g=kc>0?mer/kc*1000:NaN;

function calcKCl(){const [meq,mlkgh]=document.getElementById("kK").value.split("|").map(Number);const w=gv("kW"),V=gv("kV"),s=num(document.getElementById("kS").value),R=gv("kR");const o=document.getElementById("kOut");
  const add=meq*V/1000,ml=add/s,maxRateScott=mlkgh*w,maxRateSafe=0.5*w/(meq/1000),rateK=R*meq/1000/w;
  o.innerHTML='<div class="lbl">Adicionar à bolsa</div><div class="big">'+fmt(ml,1)+' mL de KCl</div><div class="sm muted">'+fmt(add,1)+' mEq em '+fmt(V)+' mL → '+meq+' mEq/L</div><div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(Math.min(maxRateScott,maxRateSafe),0)+' mL/h</b><span>taxa máxima (escala / 0,5 mEq/kg/h)</span></div><div class="res"><b style="color:'+(rateK>0.5?"var(--bad)":"inherit")+'">'+fmt(rateK,3)+' mEq/kg/h</b><span>na taxa planejada de '+fmt(R)+' mL/h</span></div></div>'+(rateK>0.5?'<div class="note bad" style="margin-top:10px"><b>Atenção:</b> taxa planejada excede 0,5 mEq/kg/h — risco de arritmia/parada cardíaca.</div>':"");}
