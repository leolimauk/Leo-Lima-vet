function pT(n){const P=perioGet();if(!P.t[n])P.t[n]={ps:[0,0,0,0,0,0],mg:[0,0,0,0,0,0],bop:[0,0,0,0,0,0],pl:[0,0,0,0,0,0],mob:0,fur:0,aus:0};return P.t[n]}
function perioCalc(){const P=perioGet();let sites=0,bop=0,pl=0,ps4=0,ps6=0,calSum=0,teeth=0,interMax={};const toothCal=[];
  [...PT_UP,...PT_LO].forEach(n=>{const t=P.t[n];if(!t||t.aus)return;const filled=t.ps.some(x=>x>0);if(!filled)return;teeth++;let tmax=0;
    for(let i=0;i<6;i++){sites++;if(t.bop[i])bop++;if(t.pl[i])pl++;if(t.ps[i]>=4)ps4++;if(t.ps[i]>=6)ps6++;const cal=t.ps[i]+t.mg[i];calSum+=cal;
      if([0,2,3,5].includes(i))tmax=Math.max(tmax,cal);}
    toothCal.push({n,cal:tmax})});
  const ausentes=[...PT_UP,...PT_LO].filter(n=>P.t[n]&&P.t[n].aus).length;
  const maxCal=toothCal.reduce((a,b)=>Math.max(a,b.cal),0);const comCAL=toothCal.filter(t=>t.cal>=2).length;
  let est="—",ext="";
  if(teeth){if(maxCal<=0&&bop/sites>=0.1)est="Gengivite (sem perda de inserção)";else if(maxCal<=0)est="Saúde periodontal (ou gengivite localizada)";
    else if(maxCal<=2)est="Estágio I";else if(maxCal<=4)est="Estágio II";else est=(ausentes>=5?"Estágio IV":"Estágio III")+(ausentes>=5?" (≥ 5 dentes perdidos por periodontite?)":"");
    if(maxCal>0)ext=(comCAL/teeth<0.3?"localizada (< 30% dos dentes)":"generalizada (≥ 30% dos dentes)")}
  let grau="—";const idade=num(P.idade),osso=num(P.osso);
  if(idade>0&&osso>0){const r=osso/idade;grau=r<0.25?"Grau A (progressão lenta)":r<=1?"Grau B (moderada)":"Grau C (rápida)"}
  if(P.fumo==="2"||P.dm==="2")grau=(grau==="—"?"":grau+" → ")+"Grau C por modificador ("+[P.fumo==="2"?"fumo ≥ 10 cig/dia":"",P.dm==="2"?"HbA1c ≥ 7%":""].filter(Boolean).join(", ")+")";
  else if((P.fumo==="1"||P.dm==="1")&&!/C/.test(grau))grau=(grau==="—"?"":grau+" → ")+"pelo menos Grau B por modificador";
  return{sites,teeth,bopP:sites?bop/sites*100:0,plP:sites?pl/sites*100:0,ps4,ps6,calM:sites?calSum/sites:0,maxCal,est,ext,grau,ausentes}}
function perioChart(arr,face){// face: 0 = vestibular (sítios 0,1,2), 1 = lingual/palatina (3,4,5)
  const P=perioGet();const cw=40,top=24,sc=6,H=top+16*sc;let s='<svg viewBox="0 0 '+(arr.length*cw)+' '+(H+18)+'" class="pchart" preserveAspectRatio="none">';
  for(let mm=0;mm<=12;mm+=3)s+='<line x1="0" x2="'+(arr.length*cw)+'" y1="'+(top+mm*sc)+'" y2="'+(top+mm*sc)+'" stroke="var(--line)" stroke-width="'+(mm===0?1.6:0.6)+'"/>';
  const mgPts=[],psPts=[];
  arr.forEach((n,k)=>{const t=P.t[n];const x0=k*cw;s+='<text x="'+(x0+cw/2)+'" y="14" font-size="11" text-anchor="middle" fill="var(--muted)" font-weight="700">'+n+'</text>';
    if(t&&t.aus){s+='<line x1="'+(x0+6)+'" y1="'+top+'" x2="'+(x0+cw-6)+'" y2="'+(H-4)+'" stroke="var(--muted)" stroke-width="1.5"/><line x1="'+(x0+cw-6)+'" y1="'+top+'" x2="'+(x0+6)+'" y2="'+(H-4)+'" stroke="var(--muted)" stroke-width="1.5"/>';return}
    for(let j=0;j<3;j++){const i=face*3+j;const x=x0+8+j*12;const mg=t?t.mg[i]:0,ps=t?t.ps[i]:0;const yM=top+mg*sc,yP=top+(mg+ps)*sc;mgPts.push(x+","+yM);psPts.push(x+","+yP);
      if(ps>0)s+='<line x1="'+x+'" x2="'+x+'" y1="'+yM+'" y2="'+yP+'" stroke="'+(ps>=6?"#c62828":ps>=4?"#ef6c00":"#1e88e5")+'" stroke-width="5" stroke-linecap="round"/>';
      if(t&&t.bop[i])s+='<circle cx="'+x+'" cy="'+(H+8)+'" r="3.5" fill="#d32f2f"/>';if(t&&t.pl[i])s+='<circle cx="'+x+'" cy="'+(H+8)+'" r="3.5" fill="none" stroke="#7b5" stroke-width="1.6" transform="translate(0,0)"/>';}
    if(t&&t.mob)s+='<text x="'+(x0+cw/2)+'" y="'+(H-2)+'" font-size="9" text-anchor="middle" fill="var(--warn)">M'+t.mob+'</text>';if(t&&t.fur)s+='<text x="'+(x0+cw/2)+'" y="'+(top+10)+'" font-size="9" text-anchor="middle" fill="var(--warn)">F'+t.fur+'</text>'});
  s+='<polyline points="'+mgPts.join(" ")+'" fill="none" stroke="#e91e63" stroke-width="1.6"/><polyline points="'+psPts.join(" ")+'" fill="none" stroke="#1e88e5" stroke-width="1.2" stroke-dasharray="3 2"/></svg>';return s}
function vPerio(){const P=perioGet();const c=perioCalc();const sel=S.ptooth||16;const t=pT(sel);const up=PT_UP.includes(+sel);

  const numIn=(arr,i,k)=>'<input class="inp pin" type="number" inputmode="numeric" min="-5" max="15" value="'+(t[arr][i]||"")+'" oninput="pT('+sel+').'+arr+'['+i+']=num(this.value);perioSave();perioRefresh()" aria-label="'+k+'" />';
  const tog=(arr,i,lbl,col)=>'<button class="chip '+(t[arr][i]?"on":"")+'" style="padding:4px 8px;'+(t[arr][i]?"background:"+col+";border-color:"+col:"")+'" onclick="pT('+sel+').'+arr+'['+i+']^=1;perioSave();rerender()">'+lbl+'</button>';
  const grid=arr=>'<div class="tsel">'+arr.map(n=>{const x=P.t[n];const st=x&&x.aus?"aus":x&&x.ps.some(v=>v>=4)?"bad":x&&x.ps.some(v=>v>0)?"ok":"";return '<button class="tb '+st+(n==sel?" on":"")+'" onclick="S.ptooth='+n+';rerender()">'+n+'</button>'}).join("")+'</div>';
  return '<div class="stack"><div class="row between"><h1>Periograma</h1><div class="row" style="gap:6px"><button class="btn sm" onclick="perioPrint()">'+ic("print",16)+' Imprimir</button><button class="btn sm" onclick="if(confirm(\'Iniciar novo periograma? O atual será apagado.\')){S.perio=perioNew();perioSave();rerender()}">Novo</button></div></div>'+
  '<div class="card"><div class="grid g2m">'+
  '<div class="field"><label>Paciente</label><input class="inp" value="'+esc(P.pac)+'" oninput="perioGet().pac=this.value;perioSave()" /></div>'+
  '<div class="field"><label>Data</label><input class="inp" value="'+esc(P.data)+'" oninput="perioGet().data=this.value;perioSave()" /></div>'+
  '<div class="field"><label>Idade</label><input class="inp" type="number" value="'+esc(P.idade)+'" oninput="perioGet().idade=this.value;perioSave();perioRefresh()" /></div>'+
  '<div class="field"><label>% perda óssea (Rx, dente mais afetado)</label><input class="inp" type="number" value="'+esc(P.osso)+'" oninput="perioGet().osso=this.value;perioSave();perioRefresh()" /></div>'+
  '<div class="field"><label>Tabagismo</label><select class="inp" onchange="perioGet().fumo=this.value;perioSave();perioRefresh()"><option value="0" '+(P.fumo==="0"?"selected":"")+'>Não fumante</option><option value="1" '+(P.fumo==="1"?"selected":"")+'>< 10 cigarros/dia</option><option value="2" '+(P.fumo==="2"?"selected":"")+'>≥ 10 cigarros/dia</option></select></div>'+
  '<div class="field"><label>Diabetes</label><select class="inp" onchange="perioGet().dm=this.value;perioSave();perioRefresh()"><option value="0" '+(P.dm==="0"?"selected":"")+'>Não</option><option value="1" '+(P.dm==="1"?"selected":"")+'>HbA1c < 7%</option><option value="2" '+(P.dm==="2"?"selected":"")+'>HbA1c ≥ 7%</option></select></div></div></div>'+
  '<div class="card"><h3>1. Escolha o dente</h3><p class="xs muted" style="margin:4px 0 8px">Verde: registrado · Laranja: bolsa ≥ 4 mm · Cinza: ausente</p>'+grid(PT_UP)+'<div style="height:6px"></div>'+grid(PT_LO)+'</div>'+
  '<div class="card"><div class="row between"><h3>2. Dente '+sel+'</h3><button class="chip '+(t.aus?"on":"")+'" onclick="pT('+sel+').aus^=1;perioSave();rerender()">Ausente</button></div>'+
  (t.aus?'<div class="empty">Dente marcado como ausente.</div>':
  '<div class="scroll-x"><table class="tbl ptbl"><thead><tr><th></th>'+sites.map(x=>'<th>'+x+'</th>').join("")+'</tr></thead><tbody>'+
  '<tr><td><b>PS</b><div class="xs muted">sondagem (mm)</div></td>'+sites.map((_,i)=>'<td>'+numIn("ps",i,"PS "+sites[i])+'</td>').join("")+'</tr>'+
  '<tr><td><b>MG</b><div class="xs muted">recessão + / aumento −</div></td>'+sites.map((_,i)=>'<td>'+numIn("mg",i,"MG "+sites[i])+'</td>').join("")+'</tr>'+
  '<tr><td><b>NIC</b><div class="xs muted">= PS + MG</div></td>'+sites.map((_,i)=>'<td class="n" id="nic'+i+'">'+((t.ps[i]||0)+(t.mg[i]||0))+'</td>').join("")+'</tr>'+
  '<tr><td><b>SS</b></td>'+sites.map((_,i)=>'<td>'+tog("bop",i,"●","#d32f2f")+'</td>').join("")+'</tr>'+
  '<tr><td><b>Placa</b></td>'+sites.map((_,i)=>'<td>'+tog("pl",i,"●","#689f38")+'</td>').join("")+'</tr></tbody></table></div>'+
  '<div class="grid g2m" style="margin-top:10px"><div class="field"><label>Mobilidade</label><select class="inp" onchange="pT('+sel+').mob=num(this.value);perioSave();perioRefresh()">'+[0,1,2,3].map(v=>'<option '+(t.mob==v?"selected":"")+'>'+v+'</option>').join("")+'</select></div><div class="field"><label>Furca</label><select class="inp" onchange="pT('+sel+').fur=num(this.value);perioSave();perioRefresh()">'+[0,1,2,3].map(v=>'<option '+(t.fur==v?"selected":"")+'>'+v+'</option>').join("")+'</select></div></div>'+
  '<div class="row" style="gap:6px;margin-top:10px"><button class="btn sm" onclick="perioNext(-1)">← Anterior</button><button class="btn sm pri" onclick="perioNext(1)">Próximo dente →</button></div>')+'</div>'+
  '<div class="card"><h3>3. Gráfico periodontal</h3><p class="xs muted" style="margin:4px 0 8px"><span style="color:#e91e63">━</span> margem gengival · barras = profundidade de sondagem (azul &lt; 4, laranja 4–5, vermelho ≥ 6 mm) · <span style="color:#d32f2f">●</span> sangramento · arraste o gráfico para o lado</p><div id="pcharts">'+perioCharts()+'</div></div>'+
  '<div class="out" id="psum">'+perioSum(c)+'</div></div>'+disclaimer()}
function perioCharts(){return '<div class="xs muted" style="font-weight:800">SUPERIOR — VESTIBULAR</div><div class="scroll-x">'+perioChart(PT_UP,0)+'</div><div class="xs muted" style="font-weight:800;margin-top:6px">SUPERIOR — PALATINA</div><div class="scroll-x">'+perioChart(PT_UP,1)+'</div><div class="xs muted" style="font-weight:800;margin-top:10px">INFERIOR — VESTIBULAR</div><div class="scroll-x">'+perioChart(PT_LO,0)+'</div><div class="xs muted" style="font-weight:800;margin-top:6px">INFERIOR — LINGUAL</div><div class="scroll-x">'+perioChart(PT_LO,1)+'</div>'}
function perioSum(c){return '<div class="lbl">Resumo</div><div class="big" style="font-size:20px">'+esc(c.est)+(c.ext?" · "+esc(c.ext):"")+'</div><div class="sm" style="margin-top:4px">'+esc(c.grau)+'</div>'+
  '<div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(c.bopP,0)+'%</b><span>sangramento à sondagem</span></div><div class="res"><b>'+fmt(c.plP,0)+'%</b><span>índice de placa</span></div><div class="res"><b>'+c.ps4+'</b><span>sítios PS ≥ 4 mm</span></div><div class="res"><b>'+c.ps6+'</b><span>sítios PS ≥ 6 mm</span></div><div class="res"><b>'+fmt(c.calM,1)+' mm</b><span>NIC médio</span></div><div class="res"><b>'+c.teeth+'</b><span>dentes avaliados ('+c.ausentes+' ausentes)</span></div></div>'+
  '<div class="xs muted" style="margin-top:8px">Estadiamento sugerido pelo maior NIC interproximal (AAP/EFP 2017): I = 1–2 mm, II = 3–4 mm, III/IV ≥ 5 mm (IV se ≥ 5 dentes perdidos por periodontite ou reabilitação complexa). Grau pela razão % perda óssea/idade e modificadores. Confirme com radiografias e o quadro clínico.</div>'}
function perioRefresh(){const c=perioCalc();const a=document.getElementById("psum");if(a)a.innerHTML=perioSum(c);const b=document.getElementById("pcharts");if(b)b.innerHTML=perioCharts();const t=pT(S.ptooth||16);for(let i=0;i<6;i++){const e=document.getElementById("nic"+i);if(e)e.textContent=(t.ps[i]||0)+(t.mg[i]||0)}}
function perioNext(d){const all=[...PT_UP,...PT_LO];let i=all.indexOf(+(S.ptooth||16))+d;if(i<0)i=all.length-1;if(i>=all.length)i=0;S.ptooth=all[i];rerender()}

function vBiopsia(){const B=S.bio||(S.bio=store.get("bio",{}));const inp=(k,l,ph)=>'<div class="field"><label>'+l+'</label><input class="inp" value="'+esc(B[k]||"")+'" placeholder="'+(ph||"")+'" oninput="S.bio.'+k+'=this.value;store.set(\'bio\',S.bio)" /></div>';
  return '<div class="stack"><h1>Biópsia</h1><div class="card"><h3>Quando biopsiar</h3><ul class="pts sm" style="margin-top:8px"><li>Lesão que persiste > 2–3 semanas após remover possíveis causas.</li><li>Desordens potencialmente malignas (leucoplasia, eritroplasia, líquen atípico, queilite actínica).</li><li>Úlcera endurecida, lesão com crescimento rápido, sangramento, parestesia ou fixa a planos profundos.</li><li>Lesões ósseas sem diagnóstico radiográfico definido; pigmentações únicas recentes.</li><li>Diagnóstico de doenças sistêmicas (pênfigo/penfigoide — imunofluorescência; Sjögren — glândulas labiais).</li></ul></div>'+
  '<div class="card"><h3>Técnica</h3><ul class="pts sm" style="margin-top:8px"><li><b>Excisional:</b> lesões pequenas (< 1 cm) e de aspecto benigno — remoção total com margem.</li><li><b>Incisional:</b> lesões grandes ou suspeitas de malignidade — fragmento representativo (área mais endurecida/vermelha), incluindo tecido normal adjacente, com no mínimo ~5 mm de profundidade. Evitar áreas necróticas.</li><li>Anestesia à distância (não infiltrar na lesão); evitar pinçar o espécime (artefato).</li><li><b>Fixação:</b> formol a 10% com volume 10–20x o tamanho da peça, imediatamente. Imunofluorescência: meio de Michel ou soro fisiológico (não usar formol).</li><li><b>Citologia esfoliativa:</b> útil para candidíase e pênfigo; NÃO substitui biópsia em lesões suspeitas.</li><li>Lesões vasculares (hemangioma): não biopsiar sem investigação prévia.</li></ul></div>'+
  '<div class="card"><h3>Requisição de exame anatomopatológico</h3><div class="grid g2m" style="margin-top:10px">'+inp("pac","Paciente")+inp("idade","Idade")+inp("sexo","Sexo")+inp("fumo","Tabagismo/etilismo","ex.: 20 cigarros/dia há 30 anos")+inp("local","Localização da lesão")+inp("tam","Tamanho")+inp("tempo","Tempo de evolução")+inp("tipo","Tipo de biópsia","incisional/excisional")+'</div>'+
  '<div class="field" style="margin-top:10px"><label>Aspecto clínico</label><textarea class="inp" oninput="S.bio.cli=this.value;store.set(\'bio\',S.bio)" placeholder="Use o gerador em Exame estomatológico">'+esc(B.cli||"")+'</textarea></div>'+
  '<div class="field" style="margin-top:10px"><label>Hipóteses diagnósticas</label><input class="inp" value="'+esc(B.hip||"")+'" oninput="S.bio.hip=this.value;store.set(\'bio\',S.bio)" /></div>'+
  '<div class="actions" style="margin-top:12px"><button class="btn pri" onclick="bioPrint()">'+ic("print",18)+' Imprimir / PDF</button><button class="btn" onclick="copy(bioText())">'+ic("copy",18)+' Copiar</button><button class="btn" onclick="S.desc&&S.desc.el&&(S.bio.cli=descText(),store.set(\'bio\',S.bio),rerender())">Usar descrição do exame</button></div></div></div>'+disclaimer()}
function bioText(){const B=S.bio||{},D=S.doc;return ["REQUISIÇÃO DE EXAME ANATOMOPATOLÓGICO","Solicitante: "+(D.nome||"")+(D.crmv?" — CRO "+D.crmv:""),"Paciente: "+(B.pac||"")+" | Idade: "+(B.idade||"")+" | Sexo: "+(B.sexo||""),"Hábitos: "+(B.fumo||""),"Localização: "+(B.local||"")+" | Tamanho: "+(B.tam||"")+" | Evolução: "+(B.tempo||""),"Biópsia: "+(B.tipo||"")+" | Fixação: formol 10%","Aspecto clínico: "+(B.cli||""),"Hipóteses: "+(B.hip||""),"Data: "+new Date().toLocaleDateString("pt-BR")].join("\n")}
function bioPrint(){document.getElementById("printArea").innerHTML='<div class="rx-page"><div class="rx-h"><b>'+esc(S.doc.clinica||"Requisição de Exame Anatomopatológico")+'</b></div><pre style="white-space:pre-wrap;font-family:Georgia,serif;font-size:14px;line-height:1.7">'+esc(bioText())+'</pre><div class="rx-foot">_______________________________________<br/>'+esc(S.doc.nome||"Assinatura e carimbo")+(S.doc.crmv?" — CRO "+esc(S.doc.crmv):"")+'</div></div>';

function vCancer(){return '<div class="stack"><h1>Câncer bucal</h1><div class="note bad"><b>Regra de ouro:</b> toda lesão que não cicatriza em 2–3 semanas, após remoção de possíveis causas, deve ser biopsiada ou encaminhada.</div>'+
  '<div class="card"><h3>Fatores de risco</h3><ul class="pts sm" style="margin-top:8px"><li>Tabaco (inclusive cachimbo, narguilé, mascado) e álcool — efeito sinérgico (risco até 30x).</li><li>Exposição solar crônica (lábio inferior).</li><li>HPV-16 (orofaringe: base de língua, tonsilas) — mais jovens, não fumantes.</li><li>Idade > 45 anos, imunossupressão, desordens potencialmente malignas, dieta pobre em frutas/vegetais.</li></ul></div>'+
  '<div class="card"><h3>Sinais de alarme</h3><ul class="pts sm" style="margin-top:8px"><li>Úlcera indolor, endurecida, de bordas elevadas.</li><li>Placa vermelha (eritroplasia) ou branca e vermelha.</li><li>Nódulo de crescimento progressivo; mobilidade dentária sem doença periodontal; alvéolo que não cicatriza.</li><li>Parestesia de lábio/língua, disfagia, odinofagia, otalgia reflexa, trismo.</li><li>Linfonodo cervical endurecido, indolor e fixo.</li></ul></div>'+
  '<div class="card"><h3>Locais de maior risco</h3><p class="sm" style="margin:6px 0 0">Borda lateral e ventre de língua, assoalho bucal (área em ferradura), complexo retromolar/palato mole, lábio inferior.</p></div>'+
  '<div class="card"><h3>Conduta do cirurgião-dentista</h3><ul class="pts sm" style="margin-top:8px"><li>Exame estomatológico em TODA consulta inicial e anualmente (especialmente em fumantes > 40 anos).</li><li>Biópsia incisional ou encaminhamento urgente a estomatologista/cirurgião de cabeça e pescoço (rede SUS: CEO — Centros de Especialidades Odontológicas).</li><li>Aconselhamento para cessação do tabagismo e álcool.</li><li>Adequação bucal antes da radioterapia (ver Paciente oncológico).</li></ul></div>'+
  '<div class="card"><h3>Autoexame (orientar o paciente)</h3><p class="sm" style="margin:6px 0 0">Mensalmente, diante do espelho: lábios, gengivas, bochechas, céu da boca, língua (puxar com gaze e olhar as bordas e embaixo), assoalho e pescoço. Procurar o dentista se houver ferida que não cicatriza em 15 dias, manchas brancas/vermelhas, caroços ou dormência.</p></div></div>'+disclaimer()}

const OMS_MUC=[["0","Sem alterações"],["1","Eritema e dor, sem úlceras"],["2","Eritema e úlceras; consegue ingerir sólidos"],["3","Úlceras; dieta somente líquida"],["4","Alimentação via oral impossível"]];
function vOnco(){const g=S.muc||"";return '<div class="stack"><h1>Paciente oncológico</h1>'+
  '<div class="card"><h3>Mucosite oral — escala da OMS</h3><div class="list" style="margin-top:8px">'+OMS_MUC.map(([v,t])=>'<button class="item" style="text-align:left;'+(g===v?"border-color:var(--accent);background:var(--accent-soft)":"")+'" onclick="S.muc=\''+v+'\';rerender()"><div class="t">Grau '+v+'</div><div class="s" style="white-space:normal">'+t+'</div></button>').join("")+'</div>'+
  (g?'<div class="out" style="margin-top:10px"><div class="lbl">Conduta sugerida — grau '+g+'</div><div class="sm" style="margin-top:6px">'+({"0":"Prevenção: higiene oral com escova macia, bochechos com soro/bicarbonato, benzidamina (radioterapia de cabeça e pescoço), fotobiomodulação preventiva, hidratação labial.","1":"Manter prevenção; fotobiomodulação; dieta branda; evitar alimentos ácidos/picantes; analgesia com paracetamol/dipirona.","2":"Fotobiomodulação terapêutica diária; anestésico tópico (lidocaína viscosa) antes das refeições; analgesia escalonada; investigar candidíase/herpes sobrepostos.","3":"Analgesia com opioides (equipe médica); suporte nutricional; tratar infecções secundárias; fotobiomodulação.","4":"Internação/suporte nutricional enteral ou parenteral; manejo da dor com a equipe; cuidado com infecções sistêmicas."})[g]+'</div></div>':"")+'</div>'+
  '<div class="card"><h3>Antes da radioterapia de cabeça e pescoço</h3><ul class="pts sm" style="margin-top:8px"><li>Avaliação odontológica o mais cedo possível.</li><li>Exodontias de dentes com prognóstico ruim no campo de radiação idealmente 14–21 dias ANTES do início (prevenção de osteorradionecrose).</li><li>Adequação: restaurações, raspagem, remoção de focos, ajuste de próteses.</li><li>Moldeiras para aplicação diária de flúor gel neutro 1,1% (prevenção de cárie de radiação) e orientações de higiene.</li></ul></div>'+
  '<div class="card"><h3>Durante e após a radioterapia</h3><ul class="pts sm" style="margin-top:8px"><li><b>Xerostomia:</b> saliva artificial, hidratação, pilocarpina 5 mg 3x/dia (se glândulas residuais), dentifrício 5.000 ppm F.</li><li><b>Cárie de radiação:</b> flúor diário em moldeira, controle a cada 3 meses.</li><li><b>Trismo:</b> exercícios de abertura (fisioterapia) desde o início.</li><li><b>Candidíase:</b> nistatina; <b>disgeusia:</b> acompanhamento.</li><li><b>Osteorradionecrose:</b> evitar exodontias em área irradiada (> 60 Gy); se inevitáveis, técnica atraumática, antibiótico, considerar câmara hiperbárica/pentoxifilina+tocoferol (protocolo PENTO) com a equipe.</li></ul></div>'+
  '<div class="card"><h3>Quimioterapia</h3><ul class="pts sm" style="margin-top:8px"><li>Procedimentos invasivos com hemograma: neutrófilos > 1.000–1.500/mm³ e plaquetas > 50.000–75.000/mm³ (discutir com o oncologista).</li><li>Mucosite, infecções oportunistas (Candida, herpes), sangramento gengival.</li><li>Bisfosfonatos/denosumabe IV: risco de osteonecrose — ver Bulário.</li></ul></div></div>'+disclaimer()}
function vSistem(){return '<div class="stack"><h1>Manifestações orais de doenças sistêmicas</h1>'+SISTEMS.map(x=>'<div class="card"><h3>'+esc(x.n)+'</h3><div class="kv" style="margin-top:8px">'+kv("Achados orais",x.o)+kv("Conduta",x.c)+'</div></div>').join("")+'</div>'+disclaimer()}

const FOTODB={db:null,open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);if(!window.indexedDB)return rej(new Error("sem IndexedDB"));const r=indexedDB.open("lmo_fotos",1);r.onupgradeneeded=()=>{r.result.createObjectStore("f",{keyPath:"id"})};r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
 tx(mode,fn){return this.open().then(db=>new Promise((res,rej)=>{const t=db.transaction("f",mode);const st=t.objectStore("f");const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error)}))},
 put(o){return this.tx("readwrite",st=>st.put(o))},get(id){return this.tx("readonly",st=>st.get(id))},del(id){return this.tx("readwrite",st=>st.delete(id))}};

function fotoReduz(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const M=1600;let w=im.width,h=im.height;if(Math.max(w,h)>M){const r=M/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",0.82))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function fotoAdd(id,files){files=files?Array.from(files):[];if(!files.length)return;const p=prP(id);let n=0;toast("Salvando foto(s)...");

 p.up=Date.now();prSave();toast(n?n+" foto(s) salva(s)":"Não foi possível salvar a foto");rerender()}

function oDz(a,conc,u){const w=eW();const [lo,hi]=String(a).split("-").map(Number);const U=u||"mg";const base=(hi?fmt(lo)+"–"+fmt(hi):fmt(lo))+" "+U+"/kg";if(!w)return base;const t=(hi?fmt(lo*w)+"–"+fmt(hi*w):fmt(lo*w))+" "+U;return base+" → <b>"+t+"</b>"+(conc?" = <b>"+(hi?fmt(lo*w/conc)+"–"+fmt(hi*w/conc):fmt(lo*w/conc))+" mL</b>":"")}
function oDzText(s){return esc(s).replace(/\[\[([\d.\-]+)\|([\d.]+)\|([^\]]*)\]\]/g,(m,a,c,u)=>'<span>'+oDz(a,+c,u)+'</span>')}

function vEmergO(arg,id){arg=arg||"plantao";const tabs=[["plantao","Modo Emergência"],["protocolos","Emergências odontológicas"]];let body="";

  return '<div class="stack"><h1>'+esc(P.n)+'</h1><span class="tag">'+esc(P.g)+'</span>'+(P.k?eBar():"")+'<div class="card"><h3>Reconhecimento</h3><p class="sm" style="margin:6px 0 0">'+esc(P.s)+'</p></div><div class="card"><h3>Conduta</h3><ol class="sm" style="margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px">'+P.p.map(t=>'<li>'+oDzText(t)+'</li>').join("")+'</ol></div>'+(P.a?'<div class="note warn"><b>Atenção:</b> '+esc(P.a)+'</div>':"")+'<div class="actions"><a class="btn" href="#/emergencia/protocolos">Todas as emergências</a><a class="btn" href="#/tox">Urgências médicas</a></div></div>'}
 if(arg==="protocolos"){const G=[...new Set(PROTO.map(x=>x.g))];body='<p class="muted sm" style="margin:0">Emergências de origem odontológica — trauma, dor, infecção, hemorragia e complicações cirúrgicas. Para emergências médicas no consultório (síncope, anafilaxia, convulsão, PCR...), veja <a href="#/tox">Urgências</a>.</p>'+G.map(g=>'<div class="sec-title"><h2>'+g+'</h2></div><div class="list">'+PROTO.filter(x=>x.g===g).map(p=>'<a class="item" href="#/emergencia/protocolos/'+p.id+'"><div class="t">'+esc(p.n)+'</div><div class="s">'+esc(p.s.slice(0,90))+'…</div></a>').join("")+'</div>').join("")}
 if(arg==="plantao"){const w=eW(),kid=eKid();const R=S.ercp||(S.ercp=store.get("ercp",{t0:0,log:[]}));
  body=eBar()+'<div class="note bad"><b>Emergência grave: ligue 192 (SAMU)</b>, interrompa o procedimento, remova objetos da boca, posicione o paciente e ofereça O₂. Tenha o kit de emergência e um DEA acessíveis.</div>'+

  '<div class="actions" style="margin-top:8px">'+(R.t0?['DEA conectado','Choque aplicado','Adrenalina','Via aérea / ventilação','SAMU chegou'].map(e=>'<button class="btn" onclick="ercpEv(\''+e+'\')">'+e+'</button>').join("")+'<button class="btn pri" onclick="ercpEv(\'Retorno da circulação\');ercpStop()">Retorno da circulação</button><button class="btn" onclick="if(confirm(\'Encerrar?\')){ercpEv(\'RCP encerrada\');ercpStop()}">Encerrar</button>':'<button class="btn pri" onclick="ercpStart()">▶ Iniciar RCP</button>')+'</div>'+

function mmssO(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ercpStart(){S.ercp={t0:Date.now(),log:[{d:0,e:"Início da RCP"}],lc:1};store.set("ercp",S.ercp);oBeep();rerender()}
function ercpStop(){S.ercp.t0=0;store.set("ercp",S.ercp);rerender()}
function ercpEv(e){const R=S.ercp;R.log.push({d:R.t0?Date.now()-R.t0:0,e});store.set("ercp",R);toast(e+" registrado");rerender()}
function oBeep(){try{const C=window.AudioContext||window.webkitAudioContext;const a=oBeep.c||(oBeep.c=new C());const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.value=0.2;o.start();o.stop(a.currentTime+0.35)}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
function ercpTick(){const R=S.ercp;const c=document.getElementById("ercpClock");if(!c||!R||!R.t0)return;const el=Date.now()-R.t0,cyc=Math.floor(el/120000)+1;c.textContent=mmssO(el);
 const la=[...R.log].reverse().find(l=>/Adrenalina/.test(l.e));document.getElementById("ercpCyc").innerHTML='Ciclo <b>'+cyc+'</b> · troca de compressor/análise do DEA em <b>'+mmssO(120000-el%120000)+'</b>'+(la?'<br/>Última adrenalina há <b>'+mmssO(el-la.d)+'</b>'+(el-la.d>=180000?' — <span style="color:var(--bad)"><b>nova dose indicada (equipe avançada)</b></span>':""):"");
 if(cyc>(R.lc||1)){R.lc=cyc;store.set("ercp",R);oBeep();toast("Ciclo "+cyc+": trocar o compressor e deixar o DEA analisar")}}
setInterval(()=>{try{ercpTick()}catch(e){}},1000);

{id:"alveolite",g:"Complicações cirúrgicas",n:"Alveolite (osteíte alveolar)",s:"Dor intensa e irradiada 2 a 4 dias após exodontia (sobretudo terceiros molares inferiores), alvéolo vazio ou com coágulo desintegrado, halitose. Fatores: tabagismo, contraceptivos orais, trauma cirúrgico, má higiene.",p:[

const TT={ // tipos de dente
 IC:{n:"Incisivo central",r:"1 raiz",ca:"1 canal",an:{s:"Infiltrativa (supraperiosteal) vestibular + nasopalatino para a palatina",i:"Infiltrativa vestibular (articaína é eficaz) ou bloqueio do nervo incisivo/mentual"}},
 IL:{n:"Incisivo lateral",r:"1 raiz",ca:"1 canal (inferior: 2 canais em ~20–40%)",an:{s:"Infiltrativa vestibular + nasopalatino/infiltração palatina",i:"Infiltrativa vestibular ou bloqueio incisivo"}},
 C:{n:"Canino",r:"1 raiz (a mais longa da arcada)",ca:"1 canal (inferior: 2 em ~5%)",an:{s:"Infiltrativa vestibular (alveolar superior anterior) + palatina",i:"Bloqueio incisivo/mentual ou alveolar inferior"}},
 PM1:{n:"1º pré-molar",r:"sup.: 2 raízes (V e P) · inf.: 1 raiz",ca:"sup.: 2 canais · inf.: 1 (2 em ~25%)",an:{s:"Infiltrativa vestibular (alveolar superior médio) + palatino maior/infiltração palatina",i:"Bloqueio do alveolar inferior ou mentual/incisivo"}},
 PM2:{n:"2º pré-molar",r:"1 raiz",ca:"sup.: 1–2 canais · inf.: 1 canal",an:{s:"Infiltrativa vestibular + palatino maior",i:"Bloqueio do alveolar inferior ou mentual/incisivo"}},
 M1:{n:"1º molar",r:"sup.: 3 raízes (MV, DV, P) · inf.: 2 raízes (M e D)",ca:"sup.: 3–4 canais (MV2 em ~60–90%) · inf.: 3 canais (4 em ~30%)",an:{s:"Alveolar superior posterior (ou infiltrativa) + palatino maior; raiz MV pode exigir infiltração adicional",i:"Bloqueio do alveolar inferior + bucal; complementar com infiltração vestibular de articaína 4%"}},
 M2:{n:"2º molar",r:"sup.: 3 raízes · inf.: 2 raízes (podem ser fusionadas)",ca:"sup.: 3–4 canais · inf.: 3 canais (C-shaped em asiáticos)",an:{s:"Alveolar superior posterior + palatino maior",i:"Bloqueio do alveolar inferior + bucal"}},
 M3:{n:"3º molar (siso)",r:"Variável, frequentemente fusionadas/dilaceradas",ca:"Variável",an:{s:"Alveolar superior posterior + palatino maior",i:"Bloqueio do alveolar inferior + lingual + bucal (Gow-Gates/Vazirani-Akinosi como alternativas)"}}
};
const ERUP={ // erupção dentes permanentes (anos) sup / inf
 1:["7–8","6–7"],2:["8–9","7–8"],3:["11–12","9–10"],4:["10–11","10–12"],5:["10–12","11–12"],6:["6–7","6–7"],7:["12–13","11–13"],8:["17–21","17–21"]};
const DTT={1:"Incisivo central decíduo",2:"Incisivo lateral decíduo",3:"Canino decíduo",4:"1º molar decíduo",5:"2º molar decíduo"};
const DERUP={1:["~10 meses","~8 meses"],2:["~11 meses","~13 meses"],3:["~19 meses","~20 meses"],4:["~16 meses","~16 meses"],5:["~29 meses","~27 meses"]};
function pickSI(t,sup){const p=t.split(" · ");const f=p.find(x=>x.startsWith(sup?"sup.":"inf."));return f?f.replace(/^(sup|inf)\.:\s*/,""):t}
function toothType(n){return ["","IC","IL","C","PM1","PM2","M1","M2","M3"][n]}
function toothSVG(num,sel,up){const d=num%10;const w=d>=6||(num>50&&d>=4)?34:d>=4?28:26;const crown=d>=6||(num>50&&d>=4)?'M2 14 Q2 2 10 3 Q'+(w/2)+' 6 '+(w-10)+' 3 Q'+(w-2)+' 2 '+(w-2)+' 14 Z':'M3 14 Q3 2 '+(w/2)+' 2 Q'+(w-3)+' 2 '+(w-3)+' 14 Z';
  const roots=(d>=6||(num>50&&d>=4))?'M5 14 L7 34 L11 34 L12 16 M'+(w-12)+' 16 L'+(w-11)+' 34 L'+(w-7)+' 34 L'+(w-5)+' 14':'M'+(w/2-4)+' 14 L'+(w/2-2)+' 36 L'+(w/2+2)+' 36 L'+(w/2+4)+' 14';
  return '<svg viewBox="0 0 '+w+' 40" width="'+w+'" height="40" style="transform:'+(up?"scaleY(-1)":"none")+'"><path d="'+roots+'" fill="'+(sel?"var(--accent-soft)":"var(--surface-2)")+'" stroke="var(--muted)" stroke-width="1.2"/><path d="'+crown+'" fill="'+(sel?"var(--accent)":"var(--surface)")+'" stroke="'+(sel?"var(--accent)":"var(--ink)")+'" stroke-width="1.4"/></svg>'}
function vOdonto(){const perm=S.odSet!=="dec";const Q=perm?[[18,17,16,15,14,13,12,11],[21,22,23,24,25,26,27,28],[48,47,46,45,44,43,42,41],[31,32,33,34,35,36,37,38]]:[[55,54,53,52,51],[61,62,63,64,65],[85,84,83,82,81],[71,72,73,74,75]];
  const btn=n=>'<button onclick="S.tooth='+n+';rerender()" style="background:none;border:0;padding:2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink)" aria-label="Dente '+n+'">'+(String(n)[0]<"3"||String(n)[0]==="5"||String(n)[0]==="6"?'<span class="xs" style="font-weight:800">'+n+'</span>'+toothSVG(n,S.tooth==n,true):toothSVG(n,S.tooth==n,false)+'<span class="xs" style="font-weight:800">'+n+'</span>')+'</button>';
  const row=(a,b)=>'<div style="display:flex;justify-content:center;gap:2px"><div style="display:flex;gap:1px;padding-right:6px;border-right:2px solid var(--line-2)">'+a.map(btn).join("")+'</div><div style="display:flex;gap:1px;padding-left:6px">'+b.map(btn).join("")+'</div></div>';
  let info='<div class="empty">Toque em um dente para ver anatomia, erupção e técnica anestésica.</div>';const t=+S.tooth;
  if(t){const q=Math.floor(t/10),d=t%10,sup=[1,2,5,6].includes(q);
    if(q<=4){const T=TT[toothType(d)];info='<div class="card"><div class="xs muted" style="font-weight:800">DENTE '+t+' · '+(sup?"SUPERIOR":"INFERIOR")+' '+([1,4,5,8].includes(q)?"DIREITO":"ESQUERDO")+'</div><h2 style="margin-top:4px">'+T.n+(sup?" superior":" inferior")+'</h2><div class="kv" style="margin-top:10px">'+kv("Raízes",pickSI(T.r,sup))+kv("Canais (mais comum)",pickSI(T.ca,sup))+kv("Erupção",ERUP[d][sup?0:1]+" anos")+kv("Anestesia indicada",sup?T.an.s:T.an.i)+'</div></div>';}
    else{info='<div class="card"><div class="xs muted" style="font-weight:800">DENTE '+t+' · DECÍDUO '+(sup?"SUPERIOR":"INFERIOR")+'</div><h2 style="margin-top:4px">'+DTT[d]+'</h2><div class="kv" style="margin-top:10px">'+kv("Erupção (média)",DERUP[d][sup?0:1])+kv("Esfoliação",{1:"6–7 anos",2:"7–8 anos",3:"9–12 anos",4:"9–11 anos",5:"10–12 anos"}[d])+kv("Sucessor permanente",String((q===5?1:q===6?2:q===7?3:4))+d)+kv("Anestesia",sup?"Infiltrativa vestibular (osso fino); palatina com técnica indolor":"Infiltrativa costuma bastar em molares decíduos; bloqueio do alveolar inferior se necessário (forame mais baixo na criança)")+'</div><a class="btn sm" style="margin-top:10px" href="#/calc/anest">Calcular dose máxima pelo peso</a></div>';}}
  return '<div class="stack"><div class="row between"><h1>Odontograma</h1><div class="row" style="gap:6px"><button class="chip '+(perm?"on":"")+'" onclick="S.odSet=\'perm\';S.tooth=\'\';rerender()">Permanente</button><button class="chip '+(!perm?"on":"")+'" onclick="S.odSet=\'dec\';S.tooth=\'\';rerender()">Decíduo</button></div></div>'+
  '<div class="card scroll-x" style="padding:12px 4px"><div style="min-width:'+(perm?"560":"360")+'px" class="stack">'+row(Q[0],Q[1])+'<div style="height:2px;background:var(--line-2);margin:4px 8px"></div>'+row(Q[2],Q[3])+'</div></div><p class="xs muted" style="text-align:center;margin:0">Notação FDI · arraste para os lados no celular</p>'+info+'</div>';}

function saveRx(){store.set("rx",S.rx)}
function addRxDrug(id,txt,pres){const d=DM[id];S.rx.items.push({n:d.n,pres:pres||d.p.split(";")[0],qty:"",pos:txt||"",ctl:d.ctl||""});saveRx();toast("Adicionado ao receituário");location.hash="#/receita"}
function addRxFromCalc(){if(!lastCalc)return;addRxDrug(lastCalc.d.id,lastCalc.txt+" Por ___ dias.",lastCalc.pres)}
function rxType(){const c=S.rx.items.map(i=>i.ctl);
  if(c.includes("A1"))return["bad","Contém substância da lista A1: exige Notificação de Receita A (amarela) do talonário oficial — esta folha serve apenas como rascunho/orientação ao tutor."];
  if(c.includes("B1"))return["bad","Contém substância da lista B1: exige Notificação de Receita B (azul) do talonário próprio — esta folha serve como rascunho/orientação."];
  if(c.includes("CANN"))return["bad","Contém cannabis: produto registrado/autorizado (ANVISA RDC 327/2019 ou MAPA), em receita especial retida na farmácia. Manipulação proibida. Confirme a norma vigente."];
  if(c.includes("C1")||c.includes("CTL")||c.includes("C5"))return["warn","Receita de Controle Especial em 2 vias (1ª via retida na farmácia). Inclua endereço completo do pacienor."];
  if(c.includes("ATB"))return["warn","Antimicrobiano: emita 2 vias quando a dispensação for em farmácia humana (RDC 471/2021 — validade 10 dias)."];
  return["ok","Receita simples."];}

function printRx(){const R=S.rx,P=R.pat||{},T=R.tut||{},D=S.doc;const c=R.items.map(i=>i.ctl);const two=c.some(x=>["C1","CTL","ATB","A1","B1","C5","CANN"].includes(x));

const IDT="https://identitytoolkit.googleapis.com/v1/accounts:";

  if(!r.ok)throw new Error(j.error&&j.error.message);const sid=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());try{await setSession(j.idToken,sid)}catch(e){console.warn("sessão",e)}store.set("auth",{email:j.email,rt:j.refreshToken,ok:Date.now(),sid});document.getElementById("login").classList.remove("show");document.getElementById("lgP").value="";route();toast("Bem-vindo(a), "+j.email)}
 catch(e){showLogin(e instanceof TypeError?"Sem conexão com a internet. O primeiro acesso precisa de internet.":authMsg(e.message),true)}finally{b.disabled=false;b.textContent="Entrar"}}
async function verifyAuth(){const a=store.get("auth",null);if(!a)return;
 try{const r=await fetch("https://securetoken.googleapis.com/v1/token?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(a.rt)});const j=await r.json();

 catch(e){if(Date.now()-a.ok>GRACE_DAYS*864e5)showLogin("Conecte-se à internet para validar seu acesso (verificação a cada "+GRACE_DAYS+" dias).",true)}}

 if(!a)showLogin();else if(Date.now()-a.ok>GRACE_DAYS*864e5){showLogin("Validando acesso...");verifyAuth().then(()=>{const b=store.get("auth",null);if(b&&Date.now()-b.ok<6e4)document.getElementById("login").classList.remove("show")})}else verifyAuth();
