<style>
:root{
  --navy:#0f172a;--royal:#0369a1;--royal-2:#0ea5e9;--copper:#d97706;--copper-2:#0ea5e9;
  --bg:#f7f8fa;--surface:#ffffff;--surface-2:#f9fafb;--ink:#111827;--muted:#6b7280;--line:#eceef1;--line-2:#dfe3e8;
  --accent:#0369a1;--accent-soft:#e0f2fe;--ok:#047857;--ok-soft:#d1fae5;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;--info:#0369a1;--info-soft:#e0f2fe;
  --shadow:0 1px 2px rgba(17,24,39,.04);
  --radius:16px;--nav-h:66px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f14;--surface:#12171e;--surface-2:#171d25;--ink:#e6edf7;--muted:#93a3bc;--line:#222a35;--line-2:#2c3644;
  --accent:#38bdf8;--accent-soft:#0c2a3d;--ok:#34d399;--ok-soft:#0f2e26;--warn:#fbbf24;--warn-soft:#33270b;--bad:#f87171;--bad-soft:#3a1717;--info:#38bdf8;--info-soft:#0c2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0b0f14;--surface:#12171e;--surface-2:#171d25;--ink:#e6edf7;--muted:#93a3bc;--line:#222a35;--line-2:#2c3644;
  --accent:#38bdf8;--accent-soft:#0c2a3d;--ok:#34d399;--ok-soft:#0f2e26;--warn:#fbbf24;--warn-soft:#33270b;--bad:#f87171;--bad-soft:#3a1717;--info:#38bdf8;--info-soft:#0c2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- Topbar ---------- */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#0b1224 0%,#13265c 60%,#1e3a8a 100%);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(2,6,23,.35)}
.top .back{display:none}
.top.sub .back{display:flex}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:#fff}
.brand img{width:40px;height:40px;border-radius:12px;border:2px solid var(--copper-2);background:#fff;flex:none}
.brand b{display:block;font-size:17px;font-weight:850;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:#c7d2fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tbtn:active{transform:scale(.96)}
/* ---------- Layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.layout{display:block}
.side{display:none}
@media (min-width:980px){
  body{padding-bottom:24px}
  .layout{display:grid;grid-template-columns:220px 1fr;gap:20px;max-width:1300px;margin:0 auto;padding:0 16px}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px;height:calc(100vh - 90px);padding-top:16px}
  .side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:650}
  .side a:hover{background:var(--surface)}
  .side a.on{background:var(--accent-soft);color:var(--accent)}
  .dock{display:none!important}
  .wrap{padding:16px 0}
}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b));box-shadow:0 -4px 18px rgba(15,23,42,.06)}
.dock a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 2px;border-radius:12px;min-width:0}
.dock a.on{color:var(--accent)}
.dock a.on svg{stroke-width:2.4}
/* ---------- Generic ---------- */
h1,h2,h3{margin:0;letter-spacing:-.015em}
h1{font-size:22px;font-weight:850}
h2{font-size:18px;font-weight:800}
h3{font-size:15.5px;font-weight:800}
.muted{color:var(--muted)}
.sm{font-size:13px}.xs{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2m{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-title h2{font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px;min-height:42px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0b1120}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0b1120}}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:800;line-height:1.5;white-space:nowrap}
.t-a1{background:#fef9c3;color:#854d0e;border:1px solid #fde047}
.t-b1{background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd}
.t-c1,.t-ctl{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
.t-atb{background:#dcfce7;color:#166534;border:1px solid #86efac}
.t-cls{background:var(--accent-soft);color:var(--accent)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-info{background:var(--info-soft);color:var(--info)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:750;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;min-height:44px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:84px;resize:vertical}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:40px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:14px 0}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note b{font-weight:800}
/* ---------- Home ---------- */
.hero{background:radial-gradient(120% 140% at 0% 0%,#1d4ed8 0%,#13265c 45%,#0b1224 100%);color:#fff;border-radius:22px;padding:20px;display:flex;gap:16px;align-items:center;box-shadow:0 14px 30px rgba(2,6,23,.25);overflow:hidden;position:relative}
.hero img{width:92px;height:92px;border-radius:22px;border:3px solid var(--copper-2);background:#fff;flex:none}
.hero h1{font-size:22px;color:#fff}
.hero p{margin:6px 0 0;color:#c7d2fe;font-size:13.5px}
.hero .search{margin-top:12px}
.hero .inp{background:rgba(255,255,255,.96);color:#0f172a;border-color:transparent}
.hero .search svg{color:#475569}
@media (max-width:520px){.hero{flex-direction:column;align-items:flex-start;padding:18px}.hero img{width:64px;height:64px;border-radius:16px}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-height:96px}
.tile .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.tile b{font-size:14.5px}
.tile span{font-size:12px;color:var(--muted)}
.ic.c1{background:#dbeafe;color:#1d4ed8}.ic.c2{background:#fef3c7;color:#b45309}.ic.c3{background:#fee2e2;color:#b91c1c}.ic.c4{background:#d1fae5;color:#047857}.ic.c5{background:#ede9fe;color:#6d28d9}.ic.c6{background:#e0f2fe;color:#0369a1}.ic.c7{background:#fce7f3;color:#be185d}.ic.c8{background:#f1f5f9;color:#334155}
.sp-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:420px){.sp-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.sp-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:11.5px;font-weight:700;text-align:center}
.sp-btn em{font-style:normal;font-size:24px;line-height:1.1}
/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);cursor:pointer}
.item:active{background:var(--surface-2)}
.item .t{font-weight:800;font-size:15px}
.item .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.spi{font-size:15px;letter-spacing:1px}
.sev{width:10px;height:10px;border-radius:50%;flex:none}
.sev.Fatal{background:#dc2626}.sev.Grave{background:#ea580c}.sev.Moderada{background:#d97706}.sev.Leve{background:#65a30d}
/* ---------- Detail ---------- */
.dhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dhead h1{font-size:22px}
.kv{display:grid;gap:10px}
.kv .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.kv .v{margin-top:2px}
.dose-t{width:100%;border-collapse:separate;border-spacing:0}
.dose-row{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.dose-row:first-child{border-top:0}
.dose-row .e{font-size:24px;line-height:1}
.dose-row .d{font-weight:850;font-size:15.5px;font-variant-numeric:tabular-nums}
.dose-row .m{font-size:13px;color:var(--muted);margin-top:2px}
.dose-row .o{font-size:13px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- Calc ---------- */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.tools{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tool{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:750;font-size:13px}
.tool.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (max-width:639px){.tools{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.tools::-webkit-scrollbar{display:none}.tool{flex:none;white-space:nowrap}}
.out{border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1.5px solid var(--accent)}
.out .big{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.out .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.res-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.res b{display:block;font-size:19px;font-weight:850;font-variant-numeric:tabular-nums}
.res span{font-size:12px;color:var(--muted);font-weight:650}
.wstep{display:flex;gap:6px}
.wstep button{min-width:44px}
input[type=range]{width:100%;accent-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl td.n{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.scroll-x{overflow-x:auto}
/* ---------- Overlay / modal ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(2,6,23,.55);display:none;align-items:flex-start;justify-content:center;padding:calc(12px + var(--safe-t)) 12px 12px}
.ov.show{display:flex}
.ov .box{background:var(--surface);border-radius:20px;width:100%;max-width:720px;max-height:calc(100vh - 24px);overflow:auto;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.case-q{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px;font-weight:750}
.pts{margin:0;padding-left:20px}
.pts li{margin:6px 0}
.take{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px;font-weight:750}
.disc{font-size:12px;color:var(--muted);text-align:center;margin:28px 8px 8px}
.lg{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 120% at 0% 0%,#1d4ed8 0%,#13265c 45%,#0b1224 100%);display:none;align-items:center;justify-content:center;padding:20px}
.lg.show{display:flex}
.lg .box{background:var(--surface);border-radius:22px;padding:22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lg img{width:84px;height:84px;border-radius:20px;border:3px solid var(--copper-2);display:block;margin:0 auto 10px}

/* ===== Clean theme overrides ===== */
.top{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:none}
.brand{color:var(--ink)}.brand img{border:0;border-radius:10px;width:36px;height:36px;background:none}
.brand b{font-size:16.5px;font-weight:800}.brand b span{color:var(--accent)}.brand small{color:var(--muted)}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--ink)}
.hero{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.hero img{border:0;background:none;border-radius:20px}.hero h1{color:var(--ink)}.hero p{color:var(--muted)}
.hero .inp{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line-2)}.hero .search svg{color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.out{background:var(--accent-soft);border:1px solid var(--accent)}
.tile{box-shadow:none}.card{box-shadow:none}
.lg{background:var(--bg)}.lg .box{border:1px solid var(--line);box-shadow:0 10px 40px rgba(17,24,39,.08)}.lg img{border:0;border-radius:20px}
.dock{box-shadow:none}
.fig{width:100%;height:auto;display:block}
.figbox{max-width:260px;margin:10px auto 0;background:var(--surface-2);border-radius:14px;padding:8px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:700px){.dgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dcard{display:flex;flex-direction:column;gap:8px}
.dthumb{background:var(--surface-2);border-radius:10px;padding:4px;height:110px;display:flex;align-items:center;justify-content:center}
.dthumb svg{height:100%;width:auto}
.pchart{width:100%;min-width:560px;height:150px;display:block}
.tsel{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.tb{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 0;font-size:11px;font-weight:800;color:var(--ink);cursor:pointer}
.tb.ok{background:var(--ok-soft);border-color:var(--ok)}.tb.bad{background:var(--warn-soft);border-color:var(--warn)}.tb.aus{opacity:.35;text-decoration:line-through}
.tb.on{outline:2px solid var(--accent);outline-offset:1px}
.pin{min-height:38px;padding:6px 4px;text-align:center;width:48px;font-size:15px}
.ptbl td,.ptbl th{padding:5px 3px;text-align:center}
.ptbl td:first-child,.ptbl th:first-child{text-align:left;min-width:92px}
/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  body{background:#fff;padding:0;color:#000}
  .top,.dock,.layout,.ov,.toast{display:none!important}
  #printArea{display:block}
  .rx-page{page-break-after:always;padding:18mm 16mm;font-family:Georgia,serif;color:#000;min-height:260mm;position:relative}
  .rx-page:last-child{page-break-after:auto}
  .rx-h{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
  .rx-h b{font-size:18px}
  .rx-item{margin:12px 0}
  .rx-foot{position:absolute;bottom:18mm;left:16mm;right:16mm;text-align:center;border-top:1px solid #000;padding-top:6px}
}
</style>

:{"s":"jugal","c":"branca","k":"estrias"},"cli":"Estrias brancas rendilhadas (estrias de Wickham), bilaterais e simétricas; formas reticular (assintomática), erosiva/atrófica (dolorosa), em placa e bolhosa.","loc":"Mucosa jugal posterior bilateral, língua, gengiva (gengivite descamativa).","epi":"Mulheres 30–60 anos.","dif":"Lesão liquenoide (amálgama, fármacos, DECH), leucoplasia, lúpus, candidíase.","ex":"Clínico (reticular típico); biópsia nas formas atípicas, erosivas ou unilaterais.","cd":"Reticular assintomático: acompanhar. Sintomático: corticoide tópico (clobetasol/triancinolona) + antifúngico; refratário: tacrolimo tópico ou corticoide sistêmico. Acompanhamento anual.","far":["Clobetasol 0,05% (orabase/manipulado)","Triancinolona Acetonida 0,1% em Orabase","Nistatina (suspensão oral)"]},{"id":"lesao-liquenoide","n":"Lesão liquenoide (contato/medicamentosa)","el":"Branca","risco":1,"f":{"s":"jugal","c":"branca","k":"estrias"},"cli":"Lesão semelhante ao líquen, geralmente unilateral e em contato com restauração de amálgama, ou associada a fármacos (anti-hipertensivos, AINEs, antimaláricos).","loc":"Mucosa em contato com restauração.","epi":"Adultos.","dif":"Líquen plano.","ex":"Teste de contato/troca da restauração; biópsia se dúvida.","cd":"Substituir a restauração; discutir troca do fármaco com o médico.","far":[]},{"id":"candidiase-pseudo","n":"Candidíase pseudomembranosa (sapinho)","el":"Branca","risco":0,"f":{"s":"lingua","c":"branca","k":"pontos"},"cli":"Placas brancas cremosas que SE REMOVEM à raspagem, deixando base eritematosa.","loc":"Língua, palato, mucosa jugal, orofaringe.","epi":"Bebês, idosos, imunossuprimidos, uso de antibióticos/corticoide inalatório, xerostomia.","dif":"Leucoplasia (não sai), restos alimentares.","ex":"Clínico; citologia esfoliativa se dúvida.","cd":"Nistatina suspensão; miconazol gel (EVITAR com varfarina); fluconazol em refratários/imunossuprimidos; corrigir fatores predisponentes.","far":["Nistatina (suspensão oral)","Miconazol Gel Oral 2%","Fluconazol"]},{"id":"leucoedema","n":"Leucoedema","el":"Branca","risco":0,"f":{"s":"jugal","c":"branca","k":"difusa"},"cli":"Aspecto branco-acinzentado, opalescente e difuso que DESAPARECE ao estirar a mucosa.","loc":"Mucosa jugal bilateral.","epi":"Comum, especialmente em pessoas negras.","dif":"Leucoplasia, nevo branco esponjoso.","ex":"Manobra de estiramento.","cd":"Variação da normalidade — nenhum tratamento.","far":[]},{"id":"linha-alba","n":"Linha alba / mordiscamento (morsicatio buccarum)","el":"Branca","risco":0,"f":{"s":"jugal","c":"branca","k":"linha"},"cli":"Linha branca no plano oclusal ou áreas brancas esfarrapadas por mordiscamento crônico.","loc":"Mucosa jugal, bordas de língua, lábios.","epi":"Ansiedade, parafunção.","dif":"Leucoplasia, líquen.","ex":"Clínico.","cd":"Orientação, placa oclusal; sem tratamento específico.","far":[]},{"id":"ceratose-friccional","n":"Ceratose friccional","el":"Branca","risco":0,"f":{"s":"gengiva","c":"branca","k":"placa"},"cli":"Placa branca em área de trauma crônico (prótese, dente fraturado, escovação).","loc":"Rebordo, mucosa jugal, língua.","epi":"Qualquer idade.","dif":"Leucoplasia.","ex":"Remover a causa e reavaliar em 2–4 semanas — deve regredir; se persistir, biópsia.","cd":"Eliminar o trauma.","far":[]},{"id":"leucoplasia-pilosa","n":"Leucoplasia pilosa oral","el":"Branca","risco":1,"f":{"s":"lingua","c":"branca","k":"estrias"},"cli":"Placas brancas corrugadas, verticais, não removíveis, em borda lateral de língua.","loc":"Borda lateral de língua bilateral.","epi":"Associada ao vírus Epstein-Barr em imunossuprimidos (HIV).","dif":"Leucoplasia, candidíase hiperplásica.","ex":"Biópsia; investigar HIV.","cd":"Tratar a imunossupressão; lesão em si é benigna.","far":[]},{"id":"queilite-actinica","n":"Queilite actínica","el":"Branca","risco":2,"f":{"s":"labio","c":"mista","k":"difusa"},"cli":"Perda da nitidez do limite vermelhão-pele, ressecamento, descamação, áreas brancas e eritematosas no lábio ecorrentes, defeitos de esmalte (celíaca); Crohn: edema labial, mucosa em 'paralelepípedo', úlceras lineares.","c":"Encaminhar ao gastroenterologista."},{"n":"Lúpus eritematoso","o":"Lesões discoides (área central eritematosa com estrias brancas radiadas), úlceras palatinas.","c":"Biópsia; reumatologista."},{"n":"Síndrome de Sjögren","o":"Xerostomia, cárie de colo, candidíase, aumento de parótidas.","c":"Sialometria; biópsia de glândulas salivares menores do lábio; reumatologista."},{"n":"Doença de Addison","o":"Pigmentação melânica difusa da mucosa + pele bronzeada.","c":"Cortisol/ACTH — médico."},{"n":"Sífilis","o":"Cancro (primária), placas mucosas e lesões em 'rasto de lesma' (secundária), goma palatina (terciária); congênita: dentes de Hutchinson e molares em amora.","c":"VDRL/FTA-Abs; notificação; penicilina benzatina (médico)."},{"n":"Deficiência de vitamina C (escorbuto)","o":"Gengiva edemaciada, hemorrágica, violácea; mobilidade dentária.","c":"Avaliação nutricional; reposição."},{"n":"Uso de bisfosfonatos/denosumabe","o":"Osteonecrose dos maxilares (osso exposto > 8 semanas).","c":"Prevenção antes do início; técnicas atraumáticas (ver Bulário — Fármacos do paciente)."},{"n":"Doença do enxerto contra o hospedeiro (DECH)","o":"Lesões liquenoides, xerostomia, mucoceles superficiais, risco de CEC.","c":"Acompanhamento conjunto com a equipe de transplante."}],"diag":[{"id":"pulpa-normal","g":"Pulpar","n":"Polpa normal","fig":{"t":"dente","caries":0,"pulp":"normal"},"sx":"Assintomático.","tst":"Frio: resposta leve a moderada que desaparece em 1–2 s após remover o estímulo. Percussão e palpação negativas. Radiografia sem alterações.","dif":"—","cd":"Nenhum tratamento pulpar necessário.","far":[]},{"id":"pulpite-reversivel","g":"Pulpar","n":"Pulpite reversível","fig":{"t":"dente","caries":2,"pulp":"inflam"},"sx":"Dor provocada (frio, doce), aguda e de curta duração, que cessa poucos segundos após remover o estímulo. Sem dor espontânea.","tst":"Frio: dor exagerada que cede em < 10 s. Percussão negativa. Rx: cárie/restauração profunda, periápice normal.","dif":"Hipersensibilidade dentinária, pulpite irreversível.","cd":"Remoção da cárie e restauração (forramento/proteção pulpar indireta). Reavaliar a vitalidade.","far":["Ibuprofeno","Paracetamol (Acetaminofeno)"]},{"id":"pulpite-irrev-sint","g":"Pulpar","n":"Pulpite irreversível sintomática","fig":{"t":"dente","caries":3,"pulp":"inflam"},"sx":"Dor espontânea, intensa, pulsátil, que pode irradiar, piorar ao deitar e com calor; dor ao frio que persiste > 10 s (lingering).","tst":"Frio: dor prolongada. Percussão pode ser positiva (envolvimento apical inicial). Rx: cárie profunda; periápice normal ou espessamento do ligamento.","dif":"Pulpite reversível, dor referida, sinusite, DTM, neuralgia.","cd":"Pulpectomia/pulpotomia (adultos jovens: pulpotomia com biocerâmico é opção). Antibiótico NÃO indicado. Analgesia: AINE + paracetamol.","far":["Ibuprofeno","Paracetamol (Acetaminofeno)","Articaína 4% com Epinefrina","Dexametasona"]},{"id":"pulpite-irrev-ass","g":"Pulpar","n":"Pulpite irreversível assintomática","fig":{"t":"dente","caries":3,"pulp":"inflam"},"sx":"Sem sintomas, mas cárie profunda com exposição pulpar provável/confirmada.","tst":"Testes de vitalidade positivos sem dor prolongada; exposição pulpar à remoção da cárie.","dif":"Pulpite reversível.","cd":"Tratamento endodôntico (ou pulpotomia em dentes com rizogênese incompleta).","far":[]},{"id":"necrose","g":"Pulpar","n":"Necrose pulpar","fig":{"t":"dente","caries":3,"pulp":"necrose"},"sx":"Geralmente assintomática na polpa; pode haver escurecimento da coroa; sintomas surgem com o envolvimento periapical.","tst":"Frio e teste elétrico negativos (atenção a falsos negativos em dentes calcificados/traumatizados).","dif":"Calcificação pulpar, rizogênese incompleta, trauma recente (resposta negativa transitória).","cd":"Tratamento endodôntico (necropulpectomia) ou exodontia.","far":["Hidróxido de Cálcio (pasta/medicação intracanal)"]},{"id":"previamente-tratado","g":"Pulpar","n":"Dente previamente tratado","fig":{"t":"dente","caries":0,"pulp":"tratado"},"sx":"Dente com tratamento endodôntico prévio; sintomas dependem da condição periapical.","tst":"Testes térmicos negativos. Rx: material obturador; avaliar qualidade da obturação e periápice.","dif":"—","cd":"Se lesão periapical persistente: retratamento ou cirurgia parendodôntica.","far":[]},{"id":"periodontite-apical-sint","g":"Periapical","n":"Periodontite apical sintomática","fig":{"t":"dente","caries":3,"pulp":"necrose","apical":"lp"},"sx":"Dor à mastigação/percussão, sensação de dente 'crescido'.","tst":"Percussão positiva (dor), palpação pode ser positiva. Rx: espessamento do ligamento periodontal ou lesão periapical.","dif":"Trauma oclusal, síndrome do dente rachado, periodontite marginal.","cd":"Tratamento endodôntico (remover a causa), ajuste oclusal se necessário. Antibiótico não indicado sem disseminação.","far":["Ibuprofeno","Corticoide + Antibiótico Intracanal (Otosporin)"]},{"id":"periodontite-apical-ass","g":"Periapical","n":"Periodontite apical assintomática","fig":{"t":"dente","caries":3,"pulp":"necrose","apical":"lesao"},"sx":"Assintomática; achado radiográfico.","tst":"Rx: área radiolúcida periapical. Testes de vitalidade negativos. Percussão negativa.","dif":"Cisto periapical, granuloma, lesões não endodônticas (cisto ósseo, displasias — vitalidade positiva!).","cd":"Tratamento endodôntico e controle radiográfico (6–12 meses).","far":[]},{"id":"abscesso-agudo","g":"Periapical","n":"Abscesso apical agudo","fig":{"t":"dente","caries":3,"pulp":"necrose","apical":"abscesso"},"sx":"Início rápido, dor espontânea intensa, edema, sensibilidade à palpação; pode haver febre, mal-estar e linfadenopatia.","tst":"Percussão e palpação positivas; flutuação; Rx pode não mostrar lesão no início.","dif":"Abscesso periodontal, celulite, pericoronarite.","cd":"Drenagem (via canal e/ou incisão) + acesso endodôntico ou exodontia. Antibiótico SE houver sinais sistêmicos/disseminação (amoxicilina; alérgicos: clindamicina/azitromicina). Encaminhar se dispneia/disfagia.","far":["Amoxicilina","Amoxicilina + Clavulanato","Metronidazol","Clindamicina","Ibuprofeno","Dipirona (Metamizol)"]},{"id":"abscesso-cronico","g":"Periapical","n":"Abscesso apical crônico","fig":{"t":"dente","caries":3,"pulp":"necrose","apical":"fistula"},"sx":"Pouco ou nenhum desconforto; fístula intraoral com drenagem intermitente.","tst":"Rastreamento da fístula com cone de guta-percha na radiografia (aponta o dente de origem). Testes de vitalidade negativos.","dif":"Abscesso periodontal crônico, fístula de outro dente.","cd":"Tratamento endodôntico — a fístula fecha com a resolução da infecção. Antibiótico não indicado.","far":["Hidróxido de Cálcio (pasta/medicação intracanal)"]},{"id":"osteite-condensante","g":"Periapical","n":"Osteíte condensante","fig":{"t":"dente","caries":3,"pulp":"inflam","apical":"condensante"},"sx":"Geralmente assintomática.","tst":"Rx: área radiopaca difusa no periápice (reação óssea a estímulo inflamatório de baixa intensidade).","dif":"Osteoesclerose idiopática (dente vital, sem causa), displasia cemento-óssea.","cd":"Tratar a causa pulpar (endodontia); controle radiográfico.","far":[]},{"id":"gengivite","g":"Periodontal","n":"Gengivite induzida por biofilme","fig":{"t":"dente","gum":"gengivite","calculus":true},"sx":"Sangramento à escovação, gengiva vermelha e edemaciada; geralmente indolor.","tst":"Sangramento à sondagem ≥ 10% dos sítios, sem perda de inserção (ou em periodonto reduzido estável). Índice de placa elevado.","dif":"Gengivite associada a hormônios, fármacos (hiperplasia), leucemia, deficiências.","cd":"Orientação de higiene, remoção de biofilme e cálculo (profilaxia/raspagem supragengival). Clorexidina 0,12% como adjuvante temporário.","far":["Clorexidina 0,12% (colutório)","Cloreto de Cetilpiridínio"]},{"id":"periodontite","g":"Periodontal","n":"Periodontite (estágios I–IV)","fig":{"t":"dente","gum":"gengivite","bone":"perda","pocket":true,"calculus":true},"sx":"Sangramento, bolsas periodontais, recessão, mobilidade, migração dentária, halitose; geralmente indolor.","tst":"Perda de inserção clínica interproximal ≥ 2 mm em ≥ 2 dentes não adjacentes ou ≥ 3 mm vestibular/lingual com bolsa ≥ 3 mm. Rx: perda óssea horizontal/vertical. Use o PERIOGRAMA para estadiar.","dif":"Lesão endo-perio, fratura radicular, recessão por trauma de escovação.","cd":"Controle de fatores de risco (fumo, diabetes), raspagem e alisamento radicular, reavaliação em 6–8 semanas, cirurgia periodontal se necessário, terapia de suporte a cada 3–4 meses. Grau C/jovens: amoxicilina + metronidazol adjuvantes.","far":["Amoxicilina","Metronidazol","Clorexidina 0,12% (colutório)","Doxiciclina"]},{"id":"pericoronarite","g":"Periodontal","n":"Pericoronarite","fig":{"t":"dente","perico":true},"sx":"Dor e edema no capuz gengival de dente parcialmente erupcionado (geralmente 3º molar inferior), trismo, halitose, dor ao deglutir; pode haver febre.","tst":"Exame clínico: opérculo edemaciado, secreção purulenta; trauma pelo antagonista.","dif":"Abscesso periapical, abscesso periodontal, alveolite.","cd":"Irrigação sob o capuz (soro/clorexidina), remoção do trauma oclusal, analgesia; antibiótico se sinais sistêmicos (amoxicilina ± metronidazol); exodontia após a fase aguda se recorrente.","far":["Clorexidina 0,12% (colutório)","Amoxicilina","Metronidazol","Ibuprofeno"]},{"id":"abscesso-periodontal","g":"Periodontal","n":"Abscesso periodontal","fig":{"t":"dente","gum":"gengivite","bone":"perda","pocket":true,"apical":"none","calculus":true},"sx":"Elevação ovoide na gengiva lateral, dor, mobilidade; dente geralmente com vitalidade.","tst":"Bolsa profunda com supuração; testes pulpares positivos (diferencia do periapical).","dif":"Abscesso periapical, lesão endo-perio, fratura radicular vertical.","cd":"Drenagem pela bolsa, raspagem, irrigação; antibiótico se sinais sistêmicos.","far":["Amoxicilina","Metronidazol","Clorexidina 0,12% (colutório)"]},{"id":"necrosante","g":"Periodontal","n":"Doenças periodontais necrosantes (GUN/PUN)","fig":{"t":"dente","gum":"gengivite","bone":"perda"},"sx":"Dor gengival intensa de início súbito, papilas 'em saca-bocado' com pseudomembrana, sangramento espontâneo, halitose fétida.","tst":"Diagnóstico clínico. Investigar estresse, tabagismo, imunossupressão (HIV, leucemias).","dif":"Gengivoestomatite herpética primária, leucemia.","cd":"Debridamento suave, clorexidina, metronidazol se sinais sistêmicos, analgesia.","far":["Metronidazol","Clorexidina 0,12% (colutório)","Paracetamol (Acetaminofeno)"]},{"id":"recessao","g":"Periodontal","n":"Recessão gengival","fig":{"t":"dente","gum":"recessao"},"sx":"Exposição radicular, hipersensibilidade, queixa estética.","tst":"Medir recessão (JCE à margem gengival), classificar (Cairo RT1–RT3 conforme perda interproximal).","dif":"—","cd":"Corrigir fatores (escovação traumática, ortodontia), dessensibilizantes, enxerto de tecido conjuntivo em indicações estéticas/funcionais.","far":["Dessensibilizantes (nitrato de potássio, oxalato, glutaraldeído/HEMA)"]},{"id":"hiperplasia-medic","g":"Periodontal","n":"Aumento gengival medicamentoso","fig":{"t":"dente","gum":"aumento"},"sx":"Aumento gengival firme, iniciando nas papilas.","tst":"Anamnese: fenitoína, nifedipina/anlodipino, ciclosporina.","dif":"Hiperplasia inflamatória, fibromatose hereditária, leucemia.","cd":"Controle de biofilme rigoroso, raspagem; discutir troca do fármaco com o médico; gengivectomia.","far":["Clorexidina 0,12% (colutório)"]},{"id":"carie-esmalte","g":"Cárie e estrutura dentária","n":"Cárie inicial de esmalte (mancha branca — ICDAS 1–2)","fig":{"t":"dente","caries":1},"sx":"Assintomática; mancha branca opaca após secagem.","tst":"ICDAS 1 (visível após secar) / 2 (visível úmido). Lesão ativa: opaca e rugosa; inativa: brilhante e lisa.","dif":"Fluorose, hipomineralização molar-incisivo (HMI).","cd":"Não invasivo: flúor (verni
