iações como Torsilax)."},{"a":"AINE","b":"CORT","sev":"Moderada","ev":"B","mech":"Somatório de lesão de mucosa gástrica.","eff":"Úlcera/sangramento GI (risco maior em idosos e uso prolongado).","cond":"Dose única pré-operatória de corticoide + AINE por poucos dias é usual; em uso prolongado associar IBP."},{"a":"AINE","b":"Anti-hipertensivos (IECA, BRA, diuréticos)","sev":"Moderada","ev":"V","mech":"Retenção de sódio e redução da perfusão renal mediada por prostaglandinas.","eff":"Perda do controle pressórico; lesão renal em idosos/desidratados (tríade com diurético).","cond":"Uso curto (≤ 5 dias) com monitoração de PA; preferir paracetamol/dipirona em renais e idosos."},{"a":"AINE","b":"Lítio","sev":"Grave","ev":"B","mech":"Redução da excreção renal de lítio.","eff":"Intoxicação por lítio (tremor, confusão, arritmia).","cond":"Evitar AINEs; usar paracetamol."},{"a":"AINE","b":"Metotrexato","sev":"Grave","ev":"B","mech":"Redução da excreção renal de metotrexato.","eff":"Mielossupressão, mucosite.","cond":"Evitar (especialmente em doses oncológicas); contato com o médico."},{"a":"AINE","b":"IMUNOSSUP","sev":"Moderada","ev":"H","mech":"Nefrotoxicidade somada.","eff":"Lesão renal.","cond":"Preferir paracetamol."},{"a":"AINE","b":"Antidepressivos ISRS/IRSN (fluoxetina, sertralina, venlafaxina)","sev":"Moderada","ev":"V","mech":"ISRS reduzem serotonina plaquetária.","eff":"Aumento do risco de sangramento GI.","cond":"Uso curto; considerar IBP."},{"a":"Ibuprofeno","b":"Antiagregantes (AAS dose baixa, clopidogrel, ticagrelor, prasugrel)","sev":"Moderada","ev":"V","mech":"Ibuprofeno compete pelo sítio da COX-1 plaquetária e bloqueia o efeito irreversível do AAS.","eff":"Perda da cardioproteção do AAS + sangramento.","cond":"Tomar o AAS 2 h antes do ibuprofeno ou preferir paracetamol/dipirona."},{"a":"Miconazol Gel Oral 2%","b":"Varfarina","sev":"Grave","ev":"B","mech":"Inibição do CYP2C9 (o gel oral é absorvido sistemicamente).","eff":"Elevação acentuada do INR — hemorragias graves (relatos fatais).","cond":"CONTRAINDICADO: usar nistatina."},{"a":"Fluconazol","b":"Varfarina","sev":"Grave","ev":"B","mech":"Inibição do CYP2C9.","eff":"Elevação do INR.","cond":"Evitar ou monitorar INR com o médico; preferir nistatina."},{"a":"Metronidazol","b":"Varfarina","sev":"Grave","ev":"B","mech":"Inibição do metabolismo da S-varfarina.","eff":"Elevação do INR e sangramento.","cond":"Evitar; se indispensável, INR em 3–5 dias."},{"a":"MACRO","b":"Varfarina","sev":"Moderada","ev":"V","mech":"Inibição do CYP3A4/alteração da flora produtora de vitamina K.","eff":"Elevação do INR (claritromicina > azitromicina).","cond":"Monitorar INR."},{"a":"Amoxicilina","b":"Varfarina","sev":"Leve","ev":"V","mech":"Alteração da flora intestinal produtora de vitamina K.","eff":"Elevação discreta do INR.","cond":"Orientar sinais de sangramento; INR se uso > 5 dias."},{"a":"Amoxicilina + Clavulanato","b":"Varfarina","sev":"Leve","ev":"V","mech":"Alteração da flora intestinal.","eff":"Elevação discreta do INR.","cond":"Orientar e monitorar."},{"a":"Paracetamol (Acetaminofeno)","b":"Varfarina","sev":"Leve","ev":"V","mech":"Uso regular > 2 g/dia por vários dias aumenta o INR.","eff":"Elevação do INR.","cond":"Preferido mesmo assim; usar ≤ 2 g/dia e por poucos dias."},{"a":"Metronidazol","b":"Lítio","sev":"Moderada","ev":"V","mech":"Redução da excreção de lítio.","eff":"Toxicidade do lítio.","cond":"Evitar ou monitorar com o psiquiatra."},{"a":"Metronidazol","b":"Fenitoína","sev":"Moderada","ev":"V","mech":"Inibição do metabolismo da fenitoína.","eff":"Toxicidade (ataxia, nistagmo).","cond":"Monitorar."},{"a":"Fluconazol","b":"Fenitoína","sev":"Moderada","ev":"V","mech":"Inibição do CYP2C9.","eff":"Toxicidade da fenitoína.","cond":"Monitorar."},{"a":"CYP3A_INIB","b":"BZD","sev":"Grave","ev":"B","mech":"Inibição do CYP3A4 (midazolam, alprazolam, diazepam).","eff":"Sedação profunda e prolongada, depressão respiratória.","cond":"Contraindicado com midazolam oral; preferir azitromicina; reduzir/evitar BZD."},{"a":"CYP3A_INIB","b":"IMUNOSSUP","sev":"Grave","ev":"B","mech":"Inibição do CYP3A4.","eff":"Níveis tóxicos de ciclosporina/tacrolimo (nefrotoxicidade).","cond":"Preferir azitromicina; contato com a equipe de transplante."},{"a":"CYP3A_INIB","b":"Carbamazepina","sev":"Moderada","ev":"B","mech":"Inibição do metabolismo da carbamazepina.","eff":"Toxicidade (tontura, ataxia, diplopia).","cond":"Evitar claritromicina; monitorar."},{"a":"OPIOIDE","b":"BZD","sev":"Grave","ev":"B","mech":"Depressão somada do SNC e respiratória (alerta FDA).","eff":"Sedação profunda, depressão respiratória, morte.","cond":"Evitar associação em ambulatório; se usar, menores doses e monitoração."},{"a":"OPIOIDE","b":"SEDATIVO","sev":"Moderada","ev":"H","mech":"Depressão do SNC somada.","eff":"Sonolência, risco de quedas/acidentes.","cond":"Orientar a não dirigir."},{"a":"BZD","b":"SEDATIVO","sev":"Moderada","ev":"H","mech":"Depressão do SNC somada.","eff":"Sedação excessiva.","cond":"Reduzir doses."},{"a":"Tramadol","b":"SEROT","sev":"Grave","ev":"B","mech":"Excesso de serotonina + redução do limiar convulsivo.","eff":"Síndrome serotoninérgica (agitação, hipertermia, tremores) e convulsões.","cond":"Evitar tramadol em usuários de antidepressivos/IMAO/ciclobenzaprina; preferir dipirona/paracetamol ± AINE."},{"a":"Paracetamol + Codeína","b":"Antidepressivos ISRS/IRSN (fluoxetina, sertralina, venlafaxina)","sev":"Moderada","ev":"V","mech":"Fluoxetina e paroxetina inibem o CYP2D6 (ativação da codeína em morfina).","eff":"Perda do efeito analgésico da codeína.","cond":"Preferir outro analgésico."},{"a":"Ciclobenzaprina","b":"Inibidores da Monoaminoxidase (IMAO)","sev":"Grave","ev":"B","mech":"Estrutura tricíclica.","eff":"Crise hipertensiva, convulsões, síndrome serotoninérgica.","cond":"Contraindicado (intervalo de 14 dias)."},{"a":"QT","b":"QT","sev":"Moderada","ev":"H","mech":"Prolongamento somado do intervalo QT.","eff":"Arritmias ventriculares (torsades) em predispostos.","cond":"Evitar associações em cardiopatas/QT longo; preferir amoxicilina."},{"a":"METHB","b":"METHB","sev":"Moderada","ev":"H","mech":"Somatório de agentes oxidantes da hemoglobina.","eff":"Meta-hemoglobinemia.","cond":"Evitar benzocaína tópica extensa com prilocaína em doses altas, especialmente em crianças."},{"a":"Prilocaína 3% com Felipressina","b":"Dinitrato de Isossorbida (sublingual)","sev":"Leve","ev":"H","mech":"Nitratos também induzem meta-hemoglobina.","eff":"Meta-hemoglobinemia aditiva.","cond":"Atenção em doses altas."},{"a":"Doxiciclina","b":"Sulfato Ferroso","sev":"Moderada","ev":"B","mech":"Quelação pelo ferro.","eff":"Redução da absorção da doxiciclina.","cond":"Separar por 2–3 h."},{"a":"Doxiciclina","b":"Carbamazepina","sev":"Moderada","ev":"V","mech":"Indução enzimática.","eff":"Redução da meia-vida da doxiciclina.","cond":"Considerar outro antibiótico."},{"a":"Carbamazepina","b":"Contraceptivos Orais","sev":"Moderada","ev":"B","mech":"Indução enzimática.","eff":"Falha contraceptiva.","cond":"Método adicional."},{"a":"Carbamazepina","b":"Varfarina","sev":"Moderada","ev":"B","mech":"Indução do metabolismo da varfarina.","eff":"Redução do INR (risco trombótico).","cond":"Monitorar INR com o médico."},{"a":"CORT","b":"DIABET","sev":"Moderada","ev":"B","mech":"Resistência insulínica induzida por glicocorticoide.","eff":"Hiperglicemia (mesmo com dose única de dexametasona por 24–48 h).","cond":"Orientar monitoração glicêmica; preferir menor dose."},{"a":"Itraconazol","b":"Omeprazol","sev":"Moderada","ev":"V","mech":"Absorção da cápsula depende de pH ácido.","eff":"Falha antifúngica.","cond":"Evitar associação ou usar solução oral."},{"a":"Ondansetrona","b":"Tramadol","sev":"Moderada","ev":"H","mech":"Bloqueio 5-HT3 reduz analgesia do tramadol; somatório serotoninérgico.","eff":"Menor analgesia.","cond":"Preferir dimenidrinato."},{"a":"Bifosfonatos (alendronato, risedronato, ácido zoledrônico)","b":"CORT","sev":"Leve","ev":"V","mech":"Corticoterapia é fator de risco adicional para osteonecrose.","eff":"Maior risco de MRONJ.","cond":"Planejamento cirúrgico atraumático."},{"a":"Denosumabe","b":"Bifosfonatos (alendronato, risedronato, ácido zoledrônico)","sev":"Moderada","ev":"V","mech":"Antirreabsortivos sequenciais/combinados.","eff":"Risco aumentado de MRONJ.","cond":"Avaliação cuidadosa antes de procedimentos invasivos."}],"tox":[{"n":"Síncope Vasovagal (lipotimia)","t":"Cardiovascular","sp":"Jovens ansiosos, jejum, dor, visão de agulha/sangue","sev":"Moderada","dose":"Ansiedade, jejum, calor, posição sentada/de pé, dor durante anestesia.","mech":"Reflexo vagal: vasodilatação e bradicardia → hipoperfusão cerebral transitória.","sx":"Palidez, sudorese fria, náusea, tontura, bocejos, bradicardia → perda breve da consciência (< 1 min).","tx":"Interromper o procedimento; posição supina com pernas elevadas (Trendelenburg modificado); afrouxar roupas; O2; monitorar sinais vitais. Recuperação em 1–2 min. Se não recuperar em 1–2 min ou bradicardia persistente: atropina 0,5 mg IV/IM e acionar SAMU (192).","ant":"Posição + oxigênio (atropina se bradicardia persistente)."},{"n":"Hipotensão Ortostática","t":"Cardiovascular","sp":"Idosos, anti-hipertensivos, sedação","sev":"Leve","dose":"Levantar rapidamente da cadeira após longo período reclinado.","mech":"Falha do reflexo barorreceptor.","sx":"Tontura, escurecimento visual ao levantar, queda.","tx":"Deitar o paciente; elevar pernas; levantar em etapas (sentar 1–2 min antes de ficar de pé).","ant":"Posicionamento."},{"n":"Hiperventilação / Crise de Ansiedade","t":"Respiratória","sp":"Pacientes ansiosos (15–40 anos)","sev":"Leve","dose":"Medo odontológico.","mech":"Hiperventilação → alcalose respiratória (hipocapnia) → vasoconstrição cerebral e hipocalcemia ionizada.","sx":"Respiração rápida, parestesia perioral e de extremidades, espasmo carpopedal, tontura, sensação de morte.","tx":"Interromper; posição sentada; tranquilizar; respiração lenta e controlada (contar); NÃO administrar O2. Se persistir: benzodiazepínico (diazepam/midazolam).","ant":"Controle respiratório (sem oxigênio)."},{"n":"Hipoglicemia","t":"Metabólica","sp":"Diabéticos (insulina, sulfonilureias), jejum prolongado","sev":"Grave","dose":"Jejum para o procedimento sem ajustar a medicação; consulta longa.","mech":"Glicemia < 70 mg/dL → neuroglicopenia e resposta adrenérgica.","sx":"Sudorese, tremor, taquicardia, fome, confusão, alteração de comportamento → convulsão, coma.","tx":"Consciente: 15–20 g de açúcar VO (suco, açúcar, glicose gel); repetir em 15 min se glicemia < 70. Inconsciente: NADA VO — glicose 50% 25–50 mL IV ou glucagon 1 mg IM; lateralizar; SAMU.","ant":"Glicose / glucagon."},{"n":"Anafilaxia","t":"Alérgica","sp":"Alergia a látex, antibióticos (penicilinas), AINEs, clorexidina, sulfitos","sev":"Fatal","dose":"Exposição a alérgeno (minutos após).","mech":"Reação de hipersensibilidade sistêmica mediada por IgE (liberação maciça de histamina e mediadores).","sx":"Urticária/angioedema + dispneia, sibilos, estridor, hipotensão, taquicardia, vômitos, colapso.","tx":"ADRENALINA IM IMEDIATA (0,5 mg adulto; 0,01 mg/kg criança, máx. 0,3–0,5 mg) na coxa, repetir a cada 5–15 min; posição supina (sentado se dispneia); O2 alto fluxo; acionar SAMU; após adrenalina: anti-histamínico, corticoide, salbutamol se broncoespasmo. Iniciar RCP se parada.","ant":"ADRENALINA IM."},{"n":"Reação Alérgica Leve (urticária localizada)","t":"Alérgica","sp":"Qualquer paciente","sev":"Leve","dose":"Medicamentos, látex.","mech":"Hipersensibilidade local.","sx":"Prurido, placas urticariformes sem comprometimento respiratório ou hemodinâmico.","tx":"Suspender o agente; anti-histamínico (loratadina/cetirizina VO ou difenidramina/prometazina IM); observar 1 h — progressão = tratar como anafilaxia.","ant":"Anti-histamínico H1."},{"n":"Crise Asmática / Broncoespasmo","t":"Respiratória","sp":"Asmáticos; AINE-exacerbada; sulfitos","sev":"Grave","dose":"Ansiedade, AINEs, sulfitos, frio, esquecimento da bombinha.","mech":"Broncoconstrição, edema e hipersecreção.","sx":"Dispneia, sibilos, tosse, uso de musculatura acessória; grave: fala entrecortada, cianose, silêncio auscultatório.","tx":"Posição sentada; salbutamol 4–8 jatos com espaçador a cada 20 min (até 3x); O2. Grave/sem resposta: adrenalina 0,3–0,5 mg IM e SAMU.","ant":"Salbutamol inalatório."},{"n":"Angina Pectoris / Suspeita de Infarto","t":"Cardiovascular","sp":"Coronariopatas, idosos, diabéticos, tabagistas","sev":"Fatal","dose":"Estresse, dor, excesso de vasoconstritor.","mech":"Desequilíbrio oferta/demanda de O2 miocárdica.","sx":"Dor/opressão retroesternal irradiada para braço esquerdo, mandíbula ou dentes; sudorese, náusea, dispneia.","tx":"Interromper; posição confortável (semissentado); O2 se SpO2 < 94%; nitrato sublingual (isossorbida 5 mg) se PAS > 90 e sem uso de sildenafila; sem melhora em 5 min ou dor > 10 min: SAMU (192) + AAS 160–325 mg mastigado; preparar para RCP/DEA.","ant":"Nitrato SL + AAS mastigado."},{"n":"Crise Hipertensiva","t":"Cardiovascular","sp":"Hipertensos não controlados, ansiedade, vasoconstritor","sev":"Grave","dose":"PA ≥ 180/120.","mech":"Elevação abrupta da pressão com (emergência) ou sem (urgência) lesão de órgão-alvo.","sx":"Cefaleia, visão turva, dor torácica, déficit neurológico, dispneia (emergência). Muitas vezes assintomática.","tx":"Interromper/adiar o procedimento; repetir a medida após repouso de 5–10 min; com sintomas de lesão de órgão-alvo: SAMU. Assintomático: encaminhar ao médico. NÃO usar nifedipina SL (risco de AVC/IAM).","ant":"Encaminhamento (sem anti-hipertensivo SL)."},{"n":"Convulsão","t":"Neurológica","sp":"Epilépticos, hipoglicemia, toxicidade por anestésico local","sev":"Grave","dose":"Esquecimento de anticonvulsivante, privação de sono, luz do refletor, estresse.","mech":"Descarga neuronal sincronizada.","sx":"Perda de consciência, movimentos tônico-clônicos, liberação esfincteriana, período pós-ictal.","tx":"Proteger a cabeça, afastar objetos/instrumentos; NÃO colocar nada na boca; lateralizar após a crise; O2; glicemia capilar. Crise > 5 min: midazolam 10 mg IM ou IN (5 mg se 13–40 kg) e SAMU.","ant":"Midazolam IM/intranasal (> 5 min)."},{"n":"Toxicidade Sistêmica por Anestésico Local (LAST)","t":"Medicamentosa","sp":"Crianças, idosos, injeção intravascular, doses repetidas","sev":"Fatal","dose":"Dose acima do máximo por peso (ver calculadora) ou injeção intravascular sem aspiração.","mech":"Bloqueio de canais de sódio no SNC e no coração.","sx":"Gosto metálico, dormência perioral, zumbido, tontura, fala arrastada, agitação → tremores, convulsão → depressão respiratória, bradicardia, arritmia, parada.","tx":"Parar a injeção; O2; posição supina; controlar convulsão (midazolam); suporte ventilatório; SAMU. Em ambiente hospitalar: emulsão lipídica 20% 1,5 mL/kg.","ant":"Benzodiazepínico + suporte; emulsão lipídica (hospitalar)."},{"n":"Meta-hemoglobinemia (prilocaína/benzocaína)","t":"Medicamentosa","sp":"Doses altas de prilocaína, benzocaína em crianças","sev":"Grave","dose":"Prilocaína > 8 mg/kg; benzocaína em < 2 anos ou excesso.","mech":"Oxidação do ferro da hemoglobina (Fe3+) — perde capacidade de transportar O2.","sx":"Cianose cinza-azulada 1–3 h após, que não melhora com O2; SpO2 ~85%; cefaleia, dispneia, letargia.","tx":"O2; encaminhar a hospital: azul de metileno 1–2 mg/kg IV.","ant":"Azul de metileno."},{"n":"Obstrução de Via Aérea por Corpo Estranho","t":"Respiratória","sp":"Procedimentos em cadeira reclinada (coroas, limas, brocas, gaze)","sev":"Fatal","dose":"Ausência de isolamento absoluto/barreira de gaze.","mech":"Aspiração ou deglutição de instrumentos/materiais.","sx":"Engasgo, tosse; obstrução total: incapacidade de falar/tossir, cianose, mãos no pescoço.","tx":"Obstrução parcial: estimular a tosse. Total: manobra de Heimlich (adulto/criança > 1 ano) — lactente: 5 golpes nas costas + 5 compressões torácicas. Inconsciente: RCP. Sempre encaminhar para radiografia (tórax/abdome) se o objeto não for recuperado.","ant":"Manobra de Heimlich."},{"n":"Parada Cardiorrespiratória (PCR)","t":"Cardiovascular","sp":"Qualquer paciente","sev":"Fatal","dose":"IAM, anafilaxia, LAST, obstrução de via aérea.","mech":"Ausência de circulação efetiva.","sx":"Paciente não responde, sem respiração normal (ou gasping), sem pulso.","tx":"Chamar ajuda e SAMU (192); pegar o DEA; compressões torácicas de alta qualidade (100–120/min, 5–6 cm, retorno completo) — 30:2 com ventilação (AMBU); DEA assim que disponível; manter até chegada do SAMU.","ant":"RCP + DEA."},{"n":"Acidente Vascular Cerebral (AVC)","t":"Neurológica","sp":"Hipertensos, idosos, fibrilação atrial","sev":"Fatal","dose":"Fatores de risco cardiovascular.","mech":"Isquemia ou hemorragia cerebral.","sx":"Escala SAMU: Sorriso assimétrico, Abraço (fraqueza em um braço), Música (fala alterada), Urgente — ligar 192. Anotar o horário de início.","tx":"Acionar SAMU imediatamente; posição com cabeça elevada 30°; O2 se SpO2 < 94%; não dar nada VO nem AAS.","ant":"Tempo (janela de trombólise)."},{"n":"Acidente com Hipoclorito de Sódio","t":"Medicamentosa","sp":"Tratamento endodôntico (extravasamento periapical)","sev":"Grave","dose":"Agulha travada no canal, pressão excessiva, ápice aberto, perfuração.","mech":"Necrose tecidual química pelo hipoclorito nos tecidos periapicais/espaços faciais.","sx":"Dor intensa súbita, edema e equimose rápidos e extensos, sangramento pelo canal.","tx":"Interromper; irrigar o canal com soro; analgesia (anestesia local, AINE/opioide), compressas frias nas primeiras 24 h e mornas depois; corticoide; antibiótico se infecção secundária; acompanhamento diário; grave/edema de via aérea: hospital.","ant":"Suporte (sem antídoto)."},{"n":"Hemorragia Pós-Exodontia","t":"Hemorrágica","sp":"Anticoagulados, antiagregados, hepatopatas, hemofílicos","sev":"Moderada","dose":"Trauma cirúrgico, não cumprimento das orientações, coagulopatias.","mech":"Falha da hemostasia local/sistêmica.","sx":"Sangramento persistente pelo alvéolo.","tx":"Remover coágulo frouxo, comprimir com gaze por 30 min (mordendo); anestesia com vasoconstritor local; esponja hemostática + sutura; gaze embebida em ácido tranexâmico; investigar coagulopatia; persistente: encaminhar.","ant":"Hemostasia local + ácido tranexâmico."},{"n":"Insuficiência Adrenal Aguda","t":"Metabólica","sp":"Usuários crônicos de corticoide, doença de Addison","sev":"Grave","dose":"Estresse cirúrgico sem dose de estresse.","mech":"Deficiência de cortisol diante do estresse.","sx":"Fraqueza, confusão, náusea, dor abdominal, hipotensão refratária.","tx":"Posição supina; O2; SAMU; hidrocortisona 100 mg IV/IM.","ant":"Hidrocortisona."},{"n":"Enfisema Subcutâneo","t":"Iatrogênica","sp":"Uso de seringa tríplice ou caneta de alta rotação com ar em cirurgias/endodontia","sev":"Moderada","dose":"Ar sob pressão em tecidos abertos.","mech":"Ar dissecando planos fasciais.","sx":"Edema súbito com CREPITAÇÃO à palpação; pode estender-se a pescoço/mediastino.","tx":"Tranquilizar; observação; compressas; antibiótico profilático (amoxicilina) pela contaminação; extensão a pescoço/tórax ou dispneia: hospital.","ant":"Observação + antibiótico."}],"cases":[{"sp":"Adulto","spec":"Endodontia","title":"Pulpite irreversível sintomática em molar inferior — antibiótico?","ctx":"Homem, 32 anos, saudável, dor espontânea, intensa e pulsátil no 46 há 2 dias, que piora com calor e à noite. Teste térmico ao frio com dor prolongada. Sem edema, sem febre, sem alteração periapical radiográfica.","q":"Qual a conduta e há indicação de antibiótico?","pts":["Diagnóstico: pulpite irreversível sintomática.","Tratamento: pulpectomia (ou pulpotomia de urgência) — a remoção do tecido pulpar inflamado é o que resolve a dor.","Anestesia: bloqueio do alveolar inferior + bucal; complementar com infiltração vestibular de articaína 4% (aumenta o sucesso em molares com pulpite).","Analgesia pós-operatória: ibuprofeno 400–600 mg 6/6h + paracetamol 500–1.000 mg 6/6h por 2–3 dias (associação mais eficaz que opioides).","NÃO prescrever antibiótico: pulpite é inflamação, sem infecção disseminada (Diretriz ADA 2019) — antibiótico não reduz a dor e aumenta resistência."],"take":"Pulpite se trata com intervenção, não com antibiótico."},{"sp":"Adulto","spec":"Endodontia / Infecção","title":"Abscesso periapical agudo com celulite e febre","ctx":"Mulher, 45 anos, dor e edema em face do lado direito há 2 dias, 48 com necrose pulpar, febre 38,4 °C, linfadenopatia submandibular, trismo leve. Sem dispneia ou disfagia.","q":"Quando prescrever antibiótico e qual?","pts":["Infecção odontogênica com sinais sistêmicos (febre, linfadenopatia, celulite, trismo) = indicação de antibiótico SEMPRE associado à remoção da causa.","Drenagem (via canal e/ou incisão em ponto de flutuação) + acesso endodôntico ou exodontia.","Amoxicilina 500 mg 8/8h (ou 875 mg 12/12h) por 5–7 dias; sem resposta em 48–72 h: amoxicilina + clavulanato ou associar metronidazol 400 mg 8/8h.","Alérgica à penicilina: clindamicina 300 mg 8/8h ou azitromicina 500 mg/dia por 3 dias.","Sinais de alarme para encaminhar ao hospital: dispneia, disfagia, elevação do assoalho bucal, edema periorbital, febre alta, trismo grave (angina de Ludwig, celulite orbitária)."],"take":"Antibiótico é adjuvante; a drenagem resolve."},{"sp":"Adulto","spec":"Cirurgia","title":"Exodontia de terceiros molares inclusos — protocolo farmacológico","ctx":"Estudante, 22 anos, saudável, 60 kg, indicação de remoção dos 38 e 48 inclusos (classe II B de Pell & Gregory). Ansiedade moderada.","q":"Monte o protocolo farmacológico perioperatório.","pts":["Ansiedade: midazolam 7,5 mg VO 30 min antes (paciente acompanhado e sem dirigir) — exige receita B (azul).","Analgesia preventiva + controle de edema: dexametasona 8 mg VO 1 h antes (dose única) + ibuprofeno 400–600 mg 1 h antes.","Anestesia: lidocaína 2% c/ epinefrina 1:100.000 — dose máxima 7 mg/kg = 420 mg ≈ 11 tubetes; normalmente 3–5 tubetes bastam; bupivacaína 0,5% opcional para analgesia prolongada.","Pós-operatório: ibuprofeno 400 mg 6/6h por 3 dias + dipirona 1 g 6/6h se necessário; clorexidina 0,12% a partir de 24 h.","Antibiótico profilático não é rotina em pacientes saudáveis (considerar amoxicilina 2 g 1 h antes em casos de maior risco/osteotomia extensa — evidência moderada)."],"take":"Dexametasona pré-operatória + AINE preventivo reduzem dor, edema e trismo."},{"sp":"Adulto","spec":"Cirurgia","title":"Alveolite seca após exodontia","ctx":"Mulher, 28 anos, tabagista, usa contraceptivo oral, extração do 37 há 3 dias. Dor intensa irradiada para o ouvido, alvéolo vazio, odor fétido, osso exposto.","q":"Qual o diagnóstico e o tratamento?","pts":["Diagnóstico: alveolite seca (osteíte alveolar) — fatores de risco: tabagismo, contraceptivo, extrações traumáticas de molares inferiores.","Anestesia local; irrigação suave do alvéolo com soro fisiológico (sem curetagem agressiva do osso).","Curativo intra-alveolar com pasta (iodofórmio + eugenol + anestésico — ex.: Alveolex), trocado a cada 2–3 dias até alívio.","Analgesia: ibuprofeno + paracetamol/dipirona.","Antibiótico só se houver sinais de infecção disseminada. Orientar a cessação do tabagismo."],"take":"Alveolite é dor por exposição óssea — curativo local resolve."},{"sp":"Adulto","spec":"Pacientes especiais","title":"Exodontia em paciente em uso de varfarina","ctx":"Homem, 68 anos, fibrilação atrial, varfarina 5 mg/dia. Precisa extrair o 24 (resto radicular). INR de ontem: 2,6.","q":"Precisa suspender a varfarina?","pts":["NÃO suspender: risco de AVC supera o de sangramento. Exodontias simples são seguras com INR ≤ 3,5 medido até 24 h antes.","Técnica atraumática, anestesia com vasoconstritor, esponja hemostática + sutura, compressão com gaze embebida em ácido tranexâmico.","Bochecho com ácido tranexâmico 5% (10 mL, 4x/dia por 2–5 dias).","Analgesia: paracetamol ≤ 2 g/dia ou dipirona — evitar AINEs.","NÃO prescrever miconazol gel, metronidazol ou fluconazol (elevam o INR); amoxicilina com cautela."],"take":"Anticoagulante se mantém; a hemostasia é local."},{"sp":"Adulto","spec":"Pacientes especiais","title":"Hipertenso em uso de propranolol — escolha do anestésico","ctx":"Homem, 55 anos, hipertenso e com enxaqueca, usa propranolol 40 mg 12/12h. PA no consultório: 142/88. Necessita restauração e raspagem por quadrante.","q":"Qual anestésico e dose?","pts":["Propranolol é betabloqueador NÃO seletivo: epinefrina causa hipertensão por estímulo alfa sem oposição, com bradicardia reflexa.","Limitar epinefrina a 0,04 mg (≈ 2 tubetes de lidocaína 1:100.000) com aspiração e injeção lenta, aferindo PA antes e após.","Alternativas: prilocaína 3% com felipressina ou mepivacaína 3% sem vasoconstritor.","PA ≥ 180/110 no dia: adiar procedimento eletivo e encaminhar.","Consultas curtas, pela manhã, com controle de ansiedade."],"take":"Betabloqueador não seletivo + epinefrina = dose mínima e monitoração."},{"sp":"Gestante","spec":"Pacientes especiais","title":"Gestante de 24 semanas com dor de dente","ctx":"Gestante, 29 anos, 24 semanas, sem comorbidades, dor por cárie profunda no 36 com pulpite irreversível. Teme que o tratamento prejudique o bebê.","q":"Pode atender? Quais fármacos?","pts":["Sim: o 2º trimestre é o período ideal, e postergar uma infecção/dor traz mais risco que o tratamento.","Anestésico: lidocaína 2% com epinefrina 1:100.000 (escolha na gestação), com aspiração — até 2 tubetes resolvem a maioria dos procedimentos. Evitar prilocaína com felipressina.","Analgesia: paracetamol 500–750 mg 6/6h. EVITAR AINEs a partir de 20 semanas (oligoâmnio, fechamento do ducto arterial).","Se precisar de antibiótico: amoxicilina (ou cefalexina/azitromicina em alérgicas). Evitar tetraciclinas, metronidazol no 1º trimestre e fluoroquinolonas.","Posição semissentada / decúbito lateral esquerdo para evitar hipotensão supina (compressão da veia cava); radiografia com avental de chumbo quando necessária."],"take":"Gestante deve ser tratada — lidocaína com epinefrina, paracetamol e amoxicilina."},{"sp":"Criança","spec":"Odontopediatria","title":"Criança de 6 anos — dose máxima de anestésico","ctx":"Criança, 6 anos, 20 kg, precisa de pulpotomia no 75 e restauração no 84 na mesma sessão.","q":"Quantos tubetes podem ser usados com segurança?","pts":["Dose máxima de lidocaína 2% c/ epinefrina: 7 mg/kg → 140 mg ÷ 36 mg/tubete = 3,9 tubetes (limite absoluto; usar o mínimo necessário).","Mepivacaína 3% (54 mg/tubete; máx. 6,6 mg/kg = 132 mg) → 2,4 tubetes apenas — atenção, crianças intoxicam com poucos tubetes de mepivacaína 3%.","Articaína 4% permitida a partir de 4 anos: 7 mg/kg = 140 mg ÷ 72 mg = 1,9 tubete.","Evitar bupivacaína (lesão por mordedura de lábio/língua) e benzocaína em excesso (meta-hemoglobinemia).","Orientar os pais sobre não morder o lábio anestesiado; anotar a dose total no prontuário."],"take":"Em crianças, calcule sempre a dose máxima pelo peso — use a calculadora."},{"sp":"Criança","spec":"Odontopediatria / Estomatologia","title":"Gengivoestomatite herpética primária","ctx":"Criança, 3 anos, 14 kg, febre 38,5 °C há 2 dias, irritabilidade, recusa alimentar, gengiva edemaciada e sangrante, múltiplas vesículas/úlceras em lábios, língua e palato.","q":"Qual a conduta?","pts":["Diagnóstico clínico: primoinfecção pelo HSV-1.","Aciclovir 15 mg/kg 5x/dia por 7 dias se iniciado nas primeiras 72 h (reduz duração das lesões e da febre).","Hidratação (principal preocupação — risco de desidratação), dieta fria e pastosa.","Analgesia/antipirético: paracetamol 10–15 mg/kg 6/6h ou dipirona.","Evitar contato com recém-nascidos e lesões oculares (autoinoculação); sinais de desidratação: encaminhar."],"take":"Hidratação + aciclovir precoce + analgesia."},{"sp":"Adulto","spec":"Estomatologia","title":"Candidíase em usuário de prótese total","ctx":"Mulher, 72 anos, prótese total superior usada dia e noite, palato eritematoso com limites da prótese, ardência, diabetes tipo 2 e uso de varfarina.","q":"Qual antifúngico e quais cuidados?","pts":["Diagnóstico: estomatite protética (candidíase eritematosa).","Higiene e desinfecção da prótese (escovação + imersão em hipoclorito 0,5–1% por 10 min ou clorexidina), remover à noite, avaliar reembasamento.","Nistatina suspensão 100.000 UI/mL — 5 mL bochecho 4x/dia por 14 dias (aplicar também na base da prótese).","NÃO usar miconazol gel nem fluconazol: paciente em varfarina (elevação grave do INR).","Avaliar controle glicêmico (fator predisponente)."],"take":"Miconazol oral + varfarina = contraindicação absoluta."},{"sp":"Adulto","spec":"Periodontia","title":"Gengivite ulcerativa necrosante (GUN)","ctx":"Universitário, 21 anos, período de provas, tabagista, dor gengival intensa de início súbito, papilas interdentais 'em saca-bocado' com pseudomembrana, sangramento e halitose fétida.","q":"Tratamento local e sistêmico?","pts":["Debridamento ultrassônico suave sob anestesia tópica/local nas primeiras sessões.","Clorexidina 0,12% 12/12h; peróxido de hidrogênio 1,5% pode ajudar na fase aguda.","Metronidazol 400 mg 8/8h por 5–7 dias se houver sinais sistêmicos (febre, linfadenopatia) — proibir álcool.","Analgesia, orientação de higiene, cessação do tabagismo, manejo do estresse e nutrição.","Recorrente ou grave: investigar imunossupressão (HIV, leucemias)."],"take":"Debridamento + metronidazol (se sistêmico) + clorexidina."},{"sp":"Adulto","spec":"Urgência médica","title":"Síncope durante anestesia","ctx":"Jovem, 19 anos, em jejum, muito ansioso. Durante o bloqueio do alveolar inferior, fica pálido, sudoreico, refere náusea e perde a consciência por 20 segundos. Pulso 48 bpm.","q":"Qual a conduta imediata?","pts":["Diagnóstico mais provável: síncope vasovagal.","Interromper; posição supina com pernas elevadas; afrouxar roupas; O2 por máscara; monitorar pulso e PA.","Recuperação esperada em 1–2 min; oferecer açúcar após recuperação (jejum).","Se a bradicardia persistir ou não recuperar a consciência: atropina 0,5 mg IM/IV e SAMU (192).","Prevenção: alimentar-se antes, anestesiar com o paciente reclinado, controle de ansiedade."],"take":"Posição supina + pernas elevadas resolve a maioria das síncopes."},{"sp":"Adulto","spec":"Urgência médica","title":"Anafilaxia após primeira dose de amoxicilina no consultório","ctx":"Mulher, 34 anos, tomou amoxicilina 2 g (profilaxia) e 15 min depois apresenta urticária generalizada, rouquidão, sibilos e PA 80/50.","q":"Qual o primeiro fármaco e a sequência de atendimento?","pts":["Anafilaxia (envolvimento cutâneo + respiratório + hipotensão).","ADRENALINA 0,5 mg IM na face anterolateral da coxa IMEDIATAMENTE; repetir a cada 5–15 min se necessário.","Chamar SAMU (192); posição supina com pernas elevadas (sentada se predominar dispneia); O2 alto fluxo.","Após adrenalina: anti-histamínico (difenidramina/prometazina), hidrocortisona 100 mg, salbutamol se broncoespasmo.","Não atrasar a adrenalina para dar anti-histamínico ou corticoide (erro frequente). Registrar alergia e encaminhar para observação hospitalar (reação bifásica)."],"take":"Anafilaxia = adrenalina IM primeiro."},{"sp":"Adulto","spec":"Urgência médica","title":"Hipoglicemia em diabético insulinodependente","ctx":"Homem, 50 anos, diabetes tipo 1, aplicou insulina e não tomou café por causa do procedimento. Após 40 min fica sudoreico, trêmulo, confuso e irritado.","q":"Conduta?","pts":["Suspeita de hipoglicemia — confirmar com glicemia capilar (< 70 mg/dL), mas não atrasar o tratamento.","Consciente e cooperativo: 15–20 g de açúcar VO (1 colher de sopa de açúcar em água ou 150 mL de suco); repetir em 15 min se necessário; depois lanche.","Inconsciente: NADA por via oral; glucagon 1 mg IM ou glicose 50% IV; lateralizar; SAMU.","Prevenção: consultas pela manhã após café, perguntar sobre alimentação e insulina, ter glicosímetro e glicose no consultório."],"take":"Diabético estranho no consultório = glicemia e açúcar."},{"sp":"Adulto","spec":"Urgência médica","title":"Dor torácica durante cirurgia periodontal","ctx":"Homem, 63 anos, hipertenso, diabético, tabagista, durante raspagem a campo aberto refere aperto no peito irradiado para mandíbula e braço esquerdo, sudorese. PA 160/95.","q":"O que fazer?","pts":["Suspeita de síndrome coronariana aguda — interromper o procedimento imediatamente.","Posição semissentada; O2 se SpO2 < 94%; acionar SAMU (192).","AAS 160–325 mg mastigado (sem alergia ou sangramento ativo).","Isossorbida 5 mg SL se PAS > 90 mmHg e sem uso de sildenafila/tadalafila — pode repetir a cada 5 min (até 3).","Monitorar sinais vitais e estar pronto para RCP/DEA."],"take":"Dor torácica: parar, SAMU, AAS mastigado, nitrato se PA permitir."},{"sp":"Adulto","spec":"Pacientes especiais","title":"Paciente em uso de bifosfonato que precisa de exodontia","ctx":"Mulher, 70 anos, osteoporose, alendronato 70 mg semanal há 6 anos. Necessita extrair o 45 com fratura radicular.","q":"Quais cuidados para prevenir MRONJ?","pts":["Risco de osteonecrose existe mas é baixo com bifosfonato oral para osteoporose (aumenta com > 4 anos de uso e corticoide).","Considerar alternativas (endodontia + sepultamento radicular) quando possível.","Se extrair: técnica atraumática, regularização de bordas ósseas, fechamento primário, clorexidina 0,12% antes e depois.","'Drug holiday' é controverso — decidir com o médico; pode ser considerado em uso > 4 anos.","Acompanhar a cicatrização por 8 semanas (osso exposto > 8 semanas = MRONJ)."],"take":"Bifosfonato oral: extrair com técnica atraumática e acompanhar."},{"sp":"Adulto","spec":"Pacientes especiais","title":"Profilaxia antibiótica em paciente com prótese valvar","ctx":"Mulher, 58 anos, prótese valvar mecânica (também em varfarina), alérgica à penicilina (urticária no passado). Fará raspagem subgengival.","q":"Ela precisa de profilaxia? Qual?","pts":["Sim: prótese valvar é condição de alto risco para endocardite (AHA 2021) e raspagem manipula gengiva.","Alérgica à penicilina: azitromicina 500 mg ou claritromicina 500 mg (CUIDADO: claritromicina com varfarina eleva INR) ou doxiciclina 100 mg, 30–60 min antes.","Cefalexina 2 g só se a alergia NÃO foi anafilaxia, angioedema ou urticária — nesse caso (urticária) está contraindicada.","Clindamicina não é mais recomendada (AHA 2021).","Varfarina: INR ≤ 3,5 e hemostasia local."],"take":"Alto risco + alergia à penicilina = azitromicina 500 mg dose única."},{"sp":"Adulto","spec":"Dor orofacial / DTM","title":"DTM muscular com dor matinal","ctx":"Mulher, 35 anos, dor em masseteres e temporais ao acordar, cansaço mastigatório, bruxismo do sono relatado pelo parceiro, alto nível de estresse.","q":"Qual o manejo inicial?","pts":["Diagnóstico (DC/TMD): mialgia/dor miofascial.","Educação e autocuidado: dieta macia temporária, calor úmido, evitar parafunções diurnas, higiene do sono, manejo do estresse.","Placa oclusal estabilizadora de uso noturno (rígida, superior ou inferior).","Farmacológico de curto prazo: AINE (ibuprofeno/naproxeno) por 5–7 dias; ciclobenzaprina 5–10 mg à noite por até 2–3 semanas.","Cronicidade: amitriptilina 10–25 mg à noite, fisioterapia; encaminhar se fatores psicossociais importantes."],"take":"DTM muscular: conservador primeiro."},{"sp":"Adulto","spec":"Dor orofacial","title":"Neuralgia do trigêmeo","ctx":"Mulher, 62 anos, crises de dor em choque elétrico na face direita (ramo mandibular), duração de segundos, desencadeadas por escovar os dentes e falar. Já extraiu 2 dentes sem melhora.","q":"Diagnóstico e tratamento?","pts":["Neuralgia trigeminal clássica: dor paroxística, em choque, com zonas-gatilho e períodos sem dor.","Exodontias são iatrogenia comum — o dente não é a causa.","Carbamazepina 100–200 mg 12/12h, titulando até controle (1ª linha); alternativa: oxcarbazepina.","Monitorar hemograma, sódio e enzimas hepáticas; atenção às interações (indutor enzimático).","Encaminhar ao neurologista (ressonância para descartar compressão vascular/tumor/esclerose múltipla)."],"take":"Dor em choque com gatilho = carbamazepina, não exodontia."},{"sp":"Adulto","spec":"Estomatologia","title":"Úlcera aftosa recorrente","ctx":"Mulher, 25 anos, episódios mensais de úlceras dolorosas, rasas, arredondadas, com halo eritematoso em mucosa jugal e lábios, cicatrizam em 7–10 dias.","q":"Tratamento e investigação?","pts":["Estomatite aftosa recorrente (forma menor).","Tópico: triancinolona 0,1% em orabase 3x/dia; alívio: benzidamina ou lidocaína viscosa.","Investigar deficiência de ferro, B12, folato e doença celíaca/inflamatória intestinal se recorrência frequente.","Evitar traumas e dentifrícios com lauril sulfato de sódio.","Formas maiores/graves: prednisona sistêmica curta e encaminhar ao estomatologista (descartar Behçet)."],"take":"Corticoide tópico + investigação de deficiências."},{"sp":"Adulto","spec":"Estomatologia","title":"Herpes labial recorrente antes de clareamento","ctx":"Mulher, 30 anos, tem herpes labial 4x/ano, desencadeado por estresse e sol. Quer fazer clareamento e procedimento estético labial.","q":"Como prevenir e tratar?","pts":["Tratamento no pródromo (formigamento): valaciclovir 2 g 12/12h por 1 dia ou aciclovir 400 mg 5x/dia por 5 dias; penciclovir creme como alternativa tópica.","Profilaxia antes de procedimentos: valaciclovir 500 mg 12/12h iniciando no dia anterior por 3–5 dias.","Fotoproteção labial.","Não atender eletivamente com vesículas ativas (contágio e piora)."],"take":"Antiviral no pródromo; profilaxia antes de procedimentos."},{"sp":"Idoso","spec":"Estomatologia / Oncologia","title":"Úlcera indolor em borda de língua que não cicatriza","ctx":"Homem, 66 anos, tabagista e etilista, úlcera endurecida de 1,5 cm em borda lateral de língua há 5 semanas, indolor, sem trauma aparente, linfonodo cervical endurecido.","q":"Qual a conduta?","pts":["Úlcera > 2–3 semanas sem causa aparente, endurecida, em área de risco = suspeita de carcinoma espinocelular.","Remover fatores traumáticos e reavaliar em no máximo 2 semanas; se persistir ou houver sinais de malignidade (como aqui), BIÓPSIA sem demora (ou encaminhar com urgência ao estomatologista/cabeça e pescoço).","Não prescrever corticoide tópico 'para ver se melhora' (atrasa o diagnóstico).","Orientar cessação de tabaco e álcool."],"take":"Úlcera que não cicatriza em 2–3 semanas = biópsia."},{"sp":"Adulto","spec":"Pacientes especiais","title":"Paciente em uso de antidepressivo com dor pós-operatória","ctx":"Mulher, 40 anos, usa sertralina 100 mg/dia, após exodontia de 3 molares refere dor intensa. Pergunta se pode tomar tramadol que tem em casa.","q":"Qual analgesia é segura?","pts":["Tramadol + ISRS: risco de síndrome serotoninérgica e convulsões — evitar.","Preferir ibuprofeno 400–600 mg + paracetamol 1 g alternados/associados (máx. 3 dias) ou dipirona.","ISRS + AINE aumenta discretamente o risco de sangramento GI — curto prazo é aceitável (considerar omeprazol se risco).","Se opioide for indispensável: codeína perde efeito com fluoxetina/paroxetina (CYP2D6); avaliar com o médico."],"take":"Antidepressivo serotoninérgico: evitar tramadol."},{"sp":"Adulto","spec":"Endodontia","title":"Acidente com hipoclorito de sódio","ctx":"Durante irrigação do 23 com hipoclorito 2,5%, paciente refere dor súbita e intensa; em minutos surge edema em lábio e região infraorbitária com equimose.","q":"Conduta imediata e acompanhamento?","pts":["Interromper e irrigar o canal com soro fisiológico abundante; permitir sangramento pelo canal.","Anestesia local para dor; analgesia (AINE + paracetamol, opioide se necessário).","Compressas frias nas primeiras 24 h, depois mornas; corticoide (dexametasona) para edema.","Antibiótico se houver risco de infecção secundária (necrose extensa); acompanhamento diário; edema de via aérea: hospital.","Prevenção: agulha com saída lateral 2–3 mm aquém do comprimento de trabalho, sem travar, irrigação lenta."],"take":"Irrigar com soro, controlar dor e edema, acompanhar."},{"sp":"Criança","spec":"Odontopediatria","title":"Avulsão de incisivo permanente","ctx":"Menino, 9 anos, caiu de bicicleta há 30 min; o 11 foi avulsionado e está sendo trazido em leite. Saudável, vacinação em dia.","q":"Qual a conduta (IADT)?","pts":["Reimplantar o mais rápido possível: dente armazenado em leite < 60 min — lavar com soro, irrigar o alvéolo, reimplantar com pressão suave.","Contenção flexível por 2 semanas; radiografia.","Antibiótico sistêmico: amoxicilina (dose pediátrica por peso) por 7 dias; doxiciclina não em < 12 anos (manchamento).","Profilaxia antitetânica se necessário (avaliar vacinação).","Rizogênese incompleta: chance de revascularização — acompanhar; completa: endodontia em 7–10 dias."],"take":"Avulsão: reimplante imediato e meio de armazenamento é decisivo."},{"sp":"Adulto","spec":"Implantodontia","title":"Protocolo medicamentoso para implante unitário","ctx":"Homem, 48 anos, saudável, implante no 36 com osso adequado, sem enxerto.","q":"Antibiótico profilático é necessário?","pts":["Evidência (revisões Cochrane) mostra redução de falhas precoces com amoxicilina 2 g dose única pré-operatória (NNT alto, ~25).","Antibiótico pós-operatório prolongado não traz benefício adicional em casos simples.","Dexametasona 4–8 mg pré-operatória opcional; ibuprofeno pós-operatório por 2–3 dias.","Clorexidina 0,12% pré-operatória e 7–14 dias após.","Fumantes e diabéticos descompensados: maior risco de falha."],"take":"Amoxicilina 2 g dose única pré-operatória; nada de 7 dias de antibiótico de rotina."},{"sp":"Adulto","spec":"Periodontia","title":"Periodontite estágio III grau C em jovem","ctx":"Mulher, 26 anos, perda de inserção rápida em molares e incisivos, bolsas de 6–8 mm, saudável, não fumante.","q":"Antibiótico sistêmico tem papel?","pts":["Raspagem e alisamento radicular (de preferência full-mouth em 24 h) é o tratamento principal.","Adjuvante sistêmico em grau C/jovens: amoxicilina 500 mg + metronidazol 400 mg 8/8h por 7 dias, iniciado junto com a raspagem.","Proibir álcool (metronidazol).","Reavaliação em 6–8 semanas; terapia de suporte a cada 3 meses."],"take":"Amoxicilina + metronidazol como adjuvante na periodontite grau C."},{"sp":"Idoso","spec":"Pacientes especiais","title":"Idosa com polifarmácia e xerostomia","ctx":"Mulher, 78 anos, usa hidroclorotiazida, amitriptilina, omeprazol e alprazolam; queixa de boca seca, cáries radiculares múltiplas e prótese que machuca.","q":"Como manejar?","pts":["Xerostomia medicamentosa (diurético, tricíclico, benzodiazepínico) — discutir com o médico possibilidade de troca/redução.","Saliva artificial, hidratação, goma/xilitol; pilocarpina apenas se glândulas funcionais e sem contraindicações.","Prevenção de cárie: dentifrício 5.000 ppm F, verniz fluoretado trimestral, diamino fluoreto de prata em lesões radiculares.","Ajuste da prótese; atenção à candidíase.","Prescrever com cautela: evitar novos fármacos anticolinérgicos e sedativos (critérios de Beers)."],"take":"Boca seca no idoso é quase sempre medicamentosa — prevenção com flúor."},{"sp":"Adulto","spec":"Urgência médica","title":"Convulsão em paciente epiléptico na cadeira","ctx":"Homem, 30 anos, epilepsia, esqueceu a medicação hoje. Durante a restauração, perde a consciência e inicia movimentos tônico-clônicos.","q":"O que fazer?","pts":["Remover instrumentos, afastar equipamentos, reclinar a cadeira; proteger a cabeça; NÃO colocar nada na boca.","Cronometrar; após a crise: lateralizar, aspirar secreções, O2, glicemia capilar.","Crise > 5 min ou repetidas: midazolam 10 mg IM/IN e SAMU.","Pós-ictal: confusão é esperada — não liberar sozinho."],"take":"Proteger, cronometrar; midazolam se > 5 min."},{"sp":"Criança","spec":"Odontopediatria","title":"Ingestão de dentifrício fluoretado por criança","ctx":"Criança, 3 anos, 15 kg, comeu quase um tubo inteiro de dentifrício (90 g, 1.450 ppm F) há 20 min. Está assintomática.","q":"Há risco de toxicidade?","pts":["Fluoreto ingerido ≈ 90 g × 1,45 mg/g ≈ 130 mg F → 8,7 mg F/kg — ACIMA da dose provavelmente tóxica (5 mg F/kg).","Dar leite ou cálcio oral (liga o flúor) e encaminhar ao pronto-socorro para observação (náusea, vômito, dor abdominal, hipocalcemia).","Não induzir vômito.","Orientação: crianças < 3 anos devem usar quantidade de 'grão de arroz' e < 6 anos 'grão de ervilha', com supervisão; guardar fora do alcance."],"take":"> 5 mg F/kg = cálcio oral e pronto-socorro."},{"sp":"Adulto","spec":"Estomatologia","title":"Líquen plano oral erosivo","ctx":"Mulher, 52 anos, estrias brancas reticulares bilaterais em mucosa jugal com áreas erosivas dolorosas, ardência com alimentos condimentados. Biópsia confirmou líquen plano.","q":"Tratamento?","pts":["Corticoide tópico de alta potência: clobetasol 0,05% em orabase 2–3x/dia (ou triancinolona) nas fases sintomáticas.","Associar antifúngico (nistatina/miconazol se sem varfarina) para prevenir candidíase.","Casos refratários: corticoide sistêmico curto ou tacrolimo tópico (com estomatologista).","Acompanhamento periódico (desordem potencialmente maligna)."],"take":"Clobetasol tópico + acompanhamento."},{"sp":"Adulto","spec":"Pacientes especiais","title":"Paciente renal crônico em hemodiálise","ctx":"Homem, 60 anos, doença renal crônica dialítica (3x/semana), heparina na diálise, necessita exodontia e tratamento de abscesso.","q":"Ajustes de medicamentos e agendamento?","pts":["Agendar no dia seguinte à diálise (heparina já metabolizada, paciente com menos uremia).","Evitar AINEs; analgésico: paracetamol (dipirona com cautela).","Antibióticos: amoxicilina com intervalo ajustado (500 mg 12/12h a 24/24h conforme ClCr — dose após a diálise); evitar tetraciclinas (exceto doxiciclina) e aminoglicosídeos.","Hemostasia local reforçada; aferir PA no braço sem fístula arteriovenosa.","Avaliar necessidade de profilaxia conforme o nefrologista."],"take":"DRC: atender no dia pós-diálise, sem AINE, ajustar antibiótico."},{"sp":"Adulto","spec":"Urgência médica","title":"Toxicidade por anestésico local em idosa de baixo peso","ctx":"Mulher, 80 anos, 45 kg, recebeu 6 tubetes de articaína 4% para múltiplas extrações. Após 10 min refere gosto metálico, zumbido, fica agitada e tem tremores.","q":"O que aconteceu e como agir?","pts":["Dose máxima de articaína: 7 mg/kg × 45 = 315 mg ÷ 72 = 4,4 tubetes — 6 tubetes (432 mg) excederam o limite.","Quadro inicial de toxicidade sistêmica (LAST): parar, O2, posição supina, monitorar.","Convulsão: midazolam; suporte ventilatório; SAMU. Hospital: emulsão lipídica 20%.","Prevenção: calcular a dose por peso, aspirar, injetar lentamente, fracionar procedimentos em idosos de baixo peso."],"take":"Sempre calcule a dose máxima — idosos de baixo peso intoxicam."},{"sp":"Gestante","spec":"Urgência","title":"Gestante de 36 semanas que desmaia na cadeira","ctx":"Gestante de 36 semanas, deitada em posição supina há 15 min para tratamento endodôntico, refere tontura, náusea e fica pálida e hipotensa.","q":"Qual a causa e conduta?","pts":["Síndrome da hipotensão supina: o útero comprime a veia cava inferior, reduzindo o retorno venoso.","Virar a paciente para decúbito lateral esquerdo (ou deslocar o útero / coxim sob o quadril direito).","O2 e monitorar; geralmente recupera em minutos.","Prevenção: atender gestantes do 3º trimestre semissentadas e com coxim sob o quadril direito; consultas curtas."],"take":"Gestante no 3º trimestre: nunca totalmente deitada."},{"sp":"Adulto","spec":"Cirurgia / Pacientes especiais","title":"Exodontia em paciente com dupla antiagregação após stent","ctx":"Homem, 59 anos, angioplastia com stent farmacológico há 4 meses, em AAS 100 mg + clopidogrel 75 mg. Precisa extrair 2 molares com doença periodontal avançada.","q":"Suspender os antiagregantes?","pts":["NÃO suspender: suspensão nos primeiros 6–12 meses de stent tem alto risco de trombose (potencialmente fatal).","Discutir o caso com o cardiologista, mas o procedimento pode ser feito com antiagregação mantida.","Hemostasia local: sutura, esponja hemostática, ácido tranexâmico tópico, compressão.","Evitar AINEs; analgesia com paracetamol/dipirona.","Extrações em sessões separadas para limitar a área cirúrgica."],"take":"Stent recente: manter antiagregação e caprichar na hemostasia local."},{"sp":"Adulto","spec":"Endodontia","title":"Paciente alérgico a penicilina com abscesso e uso de sinvastatina","ctx":"Homem, 55 anos, abscesso com celulite no 35, alérgico à penicilina (anafilaxia), usa sinvastatina 40 mg e midazolam para dormir eventualmente.","q":"Qual antibiótico escolher?","pts":["Evitar betalactâmicos (anafilaxia) — inclusive cefalosporinas.","Claritromicina é inibidor potente do CYP3A4: com sinvastatina → rabdomiólise; com midazolam → sedação profunda. EVITAR.","Opções: clindamicina 300 mg 8/8h (atenção a C. difficile) ou azitromicina 500 mg/dia (menos interações).","Sempre drenagem e remoção da causa."],"take":"Alérgico à penicilina: escolha o antibiótico olhando as interações."},{"sp":"Adulto","spec":"Prótese / Estomatologia","title":"Queilite angular em usuário de prótese","ctx":"Homem, 68 anos, prótese total antiga com dimensão vertical reduzida, fissuras eritematosas nas comissuras labiais bilaterais.","q":"Tratamento?","pts":["Etiologia multifatorial: Candida + Staphylococcus aureus + umidade por perda de dimensão vertical; avaliar deficiências (B12, ferro).","Miconazol creme/gel (ativo contra Candida e Gram+) nas comissuras 2–3x/dia por 14 dias (sem uso de varfarina) ou clotrimazol creme.","Corrigir a dimensão vertical (nova prótese) e higiene da prótese.","Recorrência: investigar diabetes e deficiências nutricionais."],"take":"Queilite angular: antifúngico tópico + corrigir a causa protética."},{"sp":"Criança","spec":"Odontopediatria","title":"Sedação mínima em criança não cooperativa","ctx":"Criança, 5 anos, 18 kg, saudável (ASA I), ansiosa, precisa de 4 restaurações. Técnicas de manejo comportamental falharam.","q":"Como fazer sedação oral com segurança?","pts":["Opções: óxido nitroso/oxigênio (30–50%, com habilitação) ou midazolam oral 0,25–0,5 mg/kg (máx. 15 mg) 30–45 min antes.","Midazolam para 18 kg: 4,5–9 mg (solução oral); jejum adequado; receita B.","Monitoração com oxímetro, profissional habilitado, flumazenil e equipamento de ventilação disponíveis.","Liberação apenas quando acordada e com responsável; anotar em prontuário e TCLE."],"take":"Sedação pediátrica: dose por peso, monitoração e antídoto à mão."},{"sp":"Adulto","spec":"Estomatologia","title":"Placa branca em borda de língua de fumante","ctx":"Homem, 58 anos, fuma 1 maço/dia há 35 anos e bebe diariamente. Placa branca de 2,5 cm em borda lateral esquerda de língua, com áreas avermelhadas e superfície levemente nodular, que não sai à raspagem. Sem trauma local.","q":"Qual a hipótese e a conduta?","pts":["Hipótese: leucoplasia não homogênea (eritroleucoplasia) — desordem potencialmente maligna de alto risco pela localização, componente vermelho e hábitos.","Não há fator traumático a remover: indicação de BIÓPSIA incisional imediata nas áreas vermelhas/nodulares (ou encaminhamento ao estomatologista).","Palpar linfonodos cervicais.","Conduta conforme o laudo: displasia moderada/grave ou carcinoma → excisão/encaminhamento oncológico.","Aconselhamento intensivo para cessação de tabaco e álcool; acompanhamento a cada 3 meses."],"take":"Branca + vermelha em fumante = biópsia sem demora."},{"sp":"Adulto","spec":"Estomatologia","title":"Estrias brancas bilaterais com ardência","ctx":"Mulher, 46 anos, ardência ao comer alimentos condimentados há 6 meses. Estrias brancas rendilhadas bilaterais em mucosa jugal posterior com áreas eritematosas e erosões à direita. Sem restaurações de amálgama próximas.","q":"Diagnóstico e tratamento?","pts":["Hipótese: líquen plano oral (forma erosiva) — bilateral e simétrico.","Biópsia na área erosiva (forma atípica/sintomática) para confirmar e excluir displasia.","Tratamento: clobetasol 0,05% em orabase 2–3x/dia por 2–4 semanas + nistatina preventiva.","Investigar hepatite C conforme o contexto; evitar irritantes.","Acompanhamento anual (risco baixo de transformação maligna)."],"take":"Líquen erosivo: corticoide tópico potente + antifúngico + acompanhamento."},{"sp":"Criança","spec":"Estomatologia","title":"Bolha azulada no lábio inferior","ctx":"Menino, 11 anos, 'bolinha' no lábio inferior que enche, estoura e volta há 2 meses. Tem hábito de morder o lábio. Lesão de 8 mm, flutuante, azulada, indolor.","q":"Diagnóstico e conduta?","pts":["Mucocele (fenômeno de extravasamento de muco) — lábio inferior, trauma, crianças.","Diferencial: hemangioma (diascopia esvazia a cor), tumor de glândula salivar (raro no lábio inferior).","Excisão cirúrgica incluindo as glândulas salivares menores adjacentes (reduz recidiva); exame histopatológico.","Orientar sobre o hábito de morder o lábio."],"take":"Lábio inferior + flutuante + recidivante = mucocele."},{"sp":"Adulto","spec":"Estomatologia","title":"Mancha negra no palato","ctx":"Homem, 62 anos, notou mancha escura no palato duro há 3 meses, que aumentou. Lesão de 1,8 cm, enegrecida com áreas azuladas, bordas irregulares e assimétricas. Nunca teve restaurações nessa região.","q":"Qual a principal preocupação?","pts":["Melanoma oral até prova em contrário: palato duro é o local mais comum; assimetria, bordas irregulares, cores múltiplas e crescimento.","Diferenciais: tatuagem por amálgama (sem relação com restaurações aqui), mácula melanótica, nevo.","Encaminhar com URGÊNCIA ao cirurgião de cabeça e pescoço/estomatologista para biópsia e estadiamento.","Prognóstico depende de diagnóstico precoce — não aguardar."],"take":"Pigmentação nova e crescente no palato: melanoma até prova em contrário."},{"sp":"Adulto","spec":"Estomatologia","title":"Úlcera 'em amora' em trabalhador rural","ctx":"Homem, 50 anos, lavrador, tabagista, úlceras dolorosas na gengiva e lábio há 2 meses, com fundo granuloso e pontos vermelhos. Emagrecimento e tosse.","q":"Qual a hipótese?","pts":["Paracoccidioidomicose — estomatite moriforme, micose endêmica no Brasil em homens rurais tabagistas.","Diferenciais: carcinoma espinocelular, tuberculose function inSide(side,name){return side===name||(IG[side]&&IG[side].includes(name))}
function sideLbl(side){return IG[side]?(GLBL[side]||side):side}
function interPairs(names){const out=[],seen=new Set();
  for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){const x=names[i],y=names[j];if(x===y)continue;
    INTER.forEach((r,k)=>{const hit=(inSide(r.a,x)&&inSide(r.b,y))||(inSide(r.a,y)&&inSide(r.b,x));const key=k+"|"+[x,y].sort().join("|");if(hit&&!seen.has(key)){seen.add(key);out.push({r,x,y})}})}
  const o={Grave:0,Moderada:1,Leve:2};return out.sort((p,q)=>o[p.r.sev]-o[q.r.sev])}
function interFor(name){return INTER.filter(r=>inSide(r.a,name)||inSide(r.b,name)).map(r=>({r,other:inSide(r.a,name)?r.b:r.a}))}

const NAV=[["#/","Início","home"],["#/bulario","Bulário","pill"],["#/diagnosticos","Diagnóst.","search"],["#/calc","Cálculos","calc"],["#/tox","Urgências","alert"]];
const SIDE=NAV.concat([["#/emergencia","Emergências","cross"],["#/prontuario","Prontuário e fotos","camera"],["#/imagem","Exames de imagem","xray"],["#/materiais","Materiais dentários","layers"],["#/estomato","Estomatologia","eye"],["#/casos","Casos clínicos","book"],["#/periograma","Periograma","chart"],["#/odontograma","Odontograma","tooth"],["#/receita","Receituário","file"],["#/favoritos","Favoritos","star"],["#/legislacao","Legislação","scale"],["#/ajustes","Ajustes","gear"]]);
function goBack(){if(history.length>1)history.back();else location.hash="#/"}
function route(){
  const h=location.hash||"#/";const parts=h.replace(/^#\/?/,"").split("/").map(decodeURIComponent);
  const page=parts[0]||"";const arg=parts[1]||"";
  const app=document.getElementById("app");
  let html="",sub="Farmacologia & Clínica Odontológica",isSub=false;
  switch(page){
    case "":html=vHome();break;
    case "bulario":if(arg){html=vDrug(arg);isSub=true;sub="Bulário"}else{html=vMeds();sub="Bulário Odontológico"}break;
    case "calc":html=vCalc(arg||"dose",parts[2]);sub="Calculadoras Clínicas";break;
    case "tox":if(arg){html=vToxD(arg);isSub=true;sub="Urgências médicas"}else{html=vTox();sub="Urgências no Consultório"}break;
    case "odontograma":html=vOdonto();sub="Odontograma";break;
    case "diagnosticos":if(arg){html=vDiag(arg);isSub=true;sub="Diagnóstico"}else{html=vDiags();sub="Diagnósticos"}break;
    case "periograma":html=vPerio();sub="Periograma";break;
    case "emergencia":html=vEmergO(arg,parts[2]);isSub=!!parts[2];sub="Emergências";break;
    case "prontuario":html=vPront(arg,parts[2]);isSub=!!arg;sub="Prontuário";break;
    case "imagem":html=vImg(arg);sub="Exames de imagem";break;
    case "materiais":html=vMat(arg);isSub=!!arg;sub="Materiais dentários";break;
    case "estomato":html=vStom(arg,parts[2]);isSub=!!arg;sub="Estomatologia";break;
    case "casos":if(arg){html=vCase(arg);isSub=true;sub="Caso Clínico"}else{html=vCases();sub="Casos Clínicos"}break;
    case "receita":html=vRx();sub="Receituário";break;
    case "favoritos":html=vFavs();sub="Favoritos";break;
    case "legislacao":html=vReg();sub="Legislação & Receituário";break;
    case "ajustes":html=vSettings();sub="Ajustes";break;
    default:html=vHome();
  }
  app.innerHTML=html;
  AFTER.splice(0).forEach(fn=>{try{fn()}catch(e){console.error(e)}});
  document.getElementById("topSub").textContent=sub;
  const lb=document.getElementById("logoutBtn");if(lb)lb.style.display=(typeof AUTH_ON!=="undefined"&&AUTH_ON&&store.get("auth",null))?"flex":"none";
  document.getElementById("top").classList.toggle("sub",isSub);
  const base="#/"+page;
  const mk=(arr,cls)=>arr.map(([href,l,i])=>'<a href="'+href+'" class="'+((href===base||(href==="#/"&&page===""))?"on":"")+'">'+ic(i,cls?20:22)+'<span>'+l+'</span></a>').join("");
  document.getElementById("dock").innerHTML=mk(NAV);
  document.getElementById("side").innerHTML=mk(SIDE,1);
  if(!route._keep)window.scrollTo(0,0);route._keep=false;
  if(page==="calc")calcRun();
}
window.addEventListener("hashchange",route);
function rerender(){route._keep=true;route()}

/* ================= Components ================= */
function labInfo(d,sp){return{on:true,tag:"",why:""}}
function ctlTag(c){return c&&CTL[c]?'<span class="tag '+CTL[c].c+'">'+CTL[c].s+'</span>':""}
function clsTag(c){return CLS[c]?'<span class="tag t-cls">'+CLS[c].n+'</span>':""}
function spIcons(d){return SP.filter(s=>d.d[s.id]).map(s=>s.e).join("")}
function doseText(d,sp){const e=d.d[sp];if(!e)return"";const u=UNIT[d.u||""];
  if(e[0]==null)return e[4]||"Ver observações";
  return (e[0]===e[1]?fmt(e[0]):fmt(e[0])+"–"+fmt(e[1]))+" "+u.k;}
function drugItem(d){
  const spTxt=S.sp&&d.d[S.sp]?'<div class="sm" style="margin-top:6px"><b>'+SPM[S.sp].e+" "+esc(doseText(d,S.sp))+'</b> <span class="muted">· '+esc(d.d[S.sp][2]||"")+" · "+esc(d.d[S.sp][3]||"")+'</span></div>':(S.sp&&d.x[S.sp]?'<div class="sm" style="margin-top:6px;color:var(--bad)"><b>⛔ '+SPM[S.sp].n+":</b> "+esc(d.x[S.sp])+'</div>':"");
  return '<a class="item" href="#/bulario/'+d.id+'"><div class="row between"><div class="t">'+esc(d.n)+'</div>'+(S.favs.has(d.id)?'<span style="color:var(--copper)">'+ic("starf",18)+'</span>':"")+'</div><div class="s">'+esc(d.b)+'</div>'+spTxt+
  '<div class="tags">'+clsTag(d.c)+ctlTag(d.ctl)+'<span class="spi" title="Perfis com posologia">'+spIcons(d)+'</span></div></a>';
}

  tile("#/imagem","xray","c5","Exames de imagem","Requisição: panorâmica, tomografia")+tile("#/materiais","layers","c7","Materiais dentários","Restauração, endodontia, prótese")+
  tile("#/calc/anest","calc","c1","Anestésicos locais","Dose máxima em tubetes")+tile("#/odontograma","tooth","c6","Odontograma","Anatomia e anestesia por dente")+
  tile("#/calc/profi","shield","c4","Profilaxia antibiótica","Endocardite (AHA)")+tile("#/calc/emerg","heart","c3","Kit de emergência","Doses por peso")+
  tile("#/calc/dose","drop","c5","Doses pediátricas","mg/kg → mL e gotas")+tile("#/calc/inter","alert","c2","Interações","Varfarina, epinefrina, AINEs...")+
  tile("#/tox","alert","c3","Urgências","Síncope, anafilaxia, LAST")+tile("#/receita","file","c8","Receituário","Com CRO e 2 vias")+
  tile("#/estomato","eye","c7","Estomatologia","Atlas, diferencial, biópsia, câncer")+tile("#/diagnosticos","search","c5","Diagnósticos","Com ilustrações e assistente")+tile("#/periograma","chart","c6","Periograma","Gráfico e estadiamento")+
  tile("#/casos","book","c4","Casos clínicos","Modo estudo")+tile("#/diagnosticos/assistente","shield","c7","Assistente pulpar","Testes → diagnóstico AAE")+'</div>'+
  '<div class="sec-title"><h2>Bulário por perfil de paciente</h2></div><div class="sp-grid">'+SP.slice(0,5).map(s=>'<a class="sp-btn" href="#/bulario" onclick="setMedSp(\''+s.id+'\')"><em>'+s.e+'</em>'+s.n+'</a>').join("")+'</div>'+
  (fav.length?'<div class="sec-title"><h2>Favoritos</h2><a class="btn sm ghost" href="#/favoritos">Ver todos</a></div><div class="list">'+fav.map(drugItem).join("")+'</div>':"")+
  (rec.length?'<div class="sec-title"><h2>Vistos recentemente</h2></div><div class="list">'+rec.map(drugItem).join("")+'</div>':"")+

function tile(h,i,c,t,s){return '<a class="tile" href="'+h+'"><div class="ic '+c+'">'+ic(i)+'</div><b>'+t+'</b><span>'+s+'</span></a>'}
function disclaimer(){return '<p class="disc">Ferramenta de apoio à decisão clínica para cirurgiões-dentistas e estudantes. Conteúdo baseado em referências de terapêutica odontológica (ex.: Andrade — Terapêutica Medicamentosa em Odontologia; Malamed — Manual de Anestesia Local; diretrizes AHA/ADA) e pode variar entre fontes — confira a bula, a legislação vigente e o julgamento clínico. Não substitui avaliação profissional.</p>'}
function setMedSp(s){S.sp=s;store.set("medSp",s)}

/* ================= Bulário ================= */
function filteredDrugs(){
  const q=norm(S.q).trim().split(/\s+/).filter(Boolean);
  return DRUGS.filter(d=>(!S.cls||d.c===S.cls)&&(!S.sp||d.d[S.sp]||d.x[S.sp])&&(!S.ctl||(S.ctl==="ctl"?["A1","B1","C1","CTL"].includes(d.ctl):d.ctl===S.ctl))&&q.every(w=>d._s.includes(w)));
}
function vMeds(){
  const clsCount={};DRUGS.forEach(d=>clsCount[d.c]=(clsCount[d.c]||0)+1);
  return '<div class="stack"><div class="row between"><h1>Bulário</h1><span class="muted sm" id="medCount"></span></div>'+
  '<div class="search">'+ic("search")+'<input class="inp" id="medQ" value="'+esc(S.q)+'" placeholder="Nome, marca comercial ou indicação" oninput="S.q=this.value;medList()" /></div>'+
  '<div class="chips">'+'<button class="chip '+(!S.sp?"on":"")+'" onclick="S.sp=\'\';store.set(\'medSp\',\'\');rerender()">Todos os perfis</button>'+SP.map(s=>'<button class="chip '+(S.sp===s.id?"on":"")+'" onclick="S.sp=\''+s.id+'\';store.set(\'medSp\',S.sp);rerender()">'+s.e+" "+s.n+'</button>').join("")+'</div>'+
  '<div class="chips"><button class="chip '+(!S.cls?"on":"")+'" onclick="S.cls=\'\';rerender()">Todas as classes</button>'+Object.keys(CLS).filter(k=>clsCount[k]).map(k=>'<button class="chip '+(S.cls===k?"on":"")+'" onclick="S.cls=\''+k+'\';rerender()">'+CLS[k].n+' <span class="muted">'+clsCount[k]+'</span></button>').join("")+'</div>'+
  '<div class="chips">'+[["","Todos"],["ctl","Controlados"],["A1","A1 Amarela"],["B1","B1 Azul"],["C1","C1"],["ATB","Antimicrobianos"]].map(([k,l])=>'<button class="chip '+(S.ctl===k?"on":"")+'" onclick="S.ctl=\''+k+'\';rerender()">'+l+'</button>').join("")+'</div>'+
  '<div class="list" id="medList"></div></div>'+disclaimer()+(AFTER.push(medList),"");
}
function medList(){
  const el=document.getElementById("medList");if(!el)return;const r=filteredDrugs();
  document.getElementById("medCount").textContent=r.length+" de "+DRUGS.length;
  el.innerHTML=r.length?r.map(drugItem).join(""):'<div class="empty">Nenhum fármaco encontrado.<br/>Tente outro termo ou limpe os filtros.</div>';
}
function vDrug(id){
  const d=DM[id];if(!d)return'<div class="empty">Fármaco não encontrado.</div>';
  pushRecent(id);
  const rows=SP.filter(s=>d.d[s.id]).map(s=>{const e=d.d[s.id];
    return '<div class="dose-row"><div class="e">'+s.e+'</div><div><div class="row between wrapf" style="gap:6px"><div><div class="xs muted" style="font-weight:800">'+s.n.toUpperCase()+'</div><div class="d">'+esc(doseText(d,s.id))+'</div></div>'+
    (e[0]!=null?'<a class="btn sm" href="#/calc/dose/'+d.id+'" onclick="S.calcSp=\''+s.id+'\';store.set(\'calcSp\',S.calcSp)">'+ic("calc",16)+' Calcular</a>':"")+'</div>'+
    '<div class="m">'+esc([e[2],e[3]].filter(Boolean).join(" · "))+'</div><div style="margin-top:5px">'+labInfo(d,s.id).tag+'</div>'+(e[4]&&e[0]!=null?'<div class="o">'+esc(e[4])+'</div>':"")+'</div></div>'}).join("");
  const xs=Object.keys(d.x).filter(k=>SPM[k]);
  return '<div class="stack"><div class="card"><div class="dhead"><div style="min-width:0"><h1>'+esc(d.n)+'</h1><div class="muted sm" style="margin-top:4px">'+esc(d.b)+'</div></div>'+
  '<button class="tbtn" style="background:var(--surface-2);color:'+(S.favs.has(d.id)?"var(--copper)":"var(--muted)")+';border-color:var(--line)" onclick="toggleFav(\''+d.id+'\')" aria-label="Favoritar">'+ic(S.favs.has(d.id)?"starf":"star")+'</button></div>'+
  '<div class="row wrapf" style="margin-top:10px;gap:6px">'+clsTag(d.c)+ctlTag(d.ctl)+'</div>'+
  (d.ctl?'<div class="note '+(d.ctl==="ATB"?"ok":"warn")+'" style="margin-top:12px">'+esc(CTL[d.ctl].l)+'</div>':"")+
  '<div class="actions" style="margin-top:12px"><button class="btn sm" onclick="addRxDrug(\''+d.id+'\')">'+ic("plus",16)+' Receita</button><button class="btn sm" onclick="copyDrug(\''+d.id+'\')">'+ic("copy",16)+' Copiar</button></div></div>'+
  (xs.length?'<div class="note bad"><b>⛔ Contraindicado / evitar:</b><br/>'+xs.map(k=>SPM[k].e+" <b>"+SPM[k].n+":</b> "+esc(d.x[k])).join("<br/>")+'</div>':"")+
  (rows?'<div class="card"><h2 style="margin-bottom:4px">Posologia por perfil de paciente</h2>'+rows+'</div>':'<div class="note info">Uso conforme técnica/produto — veja as observações abaixo.</div>')+
  (function(){const L=interFor(d.n);return L.length?'<div class="card"><h2>Interações ('+L.length+')</h2><p class="xs muted" style="margin:4px 0 8px">Use o verificador para checar uma combinação específica.</p><div class="stack">'+L.map(interCard).join("")+'</div><a class="btn sm" style="margin-top:10px" href="#/calc/inter" onclick="S.interSel=[\''+d.id+'\']">Verificar com outros fármacos</a></div>':''})()+'<div class="card kv">'+kv("Apresentações",d.p)+kv("Mecanismo de ação",d.m)+kv("Indicações",d.i)+kv("Contraindicações e precauções",d.ci)+kv("Efeitos adversos e alertas",d.ae)+(d.wd?kv("Carência / observações regulatórias",d.wd):"")+'</div></div>'+disclaimer();
}
function kv(k,v){return v?'<div><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>':""}
function copyDrug(id){const d=DM[id];const L=[d.n+" ("+d.b+")","Classe: "+(CLS[d.c]?CLS[d.c].n:""),d.ctl?"Controle: "+CTL[d.ctl].l:"","Apresentações: "+d.p,"Indicações: "+d.i,"Doses:"];
  SP.forEach(s=>{const e=d.d[s.id];if(e)L.push("• "+s.n+": "+doseText(d,s.id)+" "+[e[2],e[3]].filter(Boolean).join(" ")+(e[4]&&e[0]!=null?" ("+e[4]+")":""))});
  Object.keys(d.x).forEach(k=>SPM[k]&&L.push("⛔ "+SPM[k].n+": "+d.x[k]));L.push("Contraindicações: "+d.ci,"Efeitos adversos: "+d.ae);copy(L.filter(Boolean).join("\n"))}

/* ================= Busca global ================= */
function openSearch(v){const o=document.getElementById("searchOv");o.classList.add("show");const i=document.getElementById("gq");i.value=v||"";renderSearch(i.value);setTimeout(()=>i.focus(),30)}
function closeSearch(){document.getElementById("searchOv").classList.remove("show")}
function renderSearch(v){
  const q=norm(v).trim().split(/\s+/).filter(Boolean);const el=document.getElementById("gres");
  if(!q.length){el.innerHTML='<div class="muted sm">Dica: busque por princípio ativo, nome comercial (ex.: <b>Septanest</b>, <b>Clavulin</b>), indicação (<b>alveolite</b>), urgência (<b>anafilaxia</b>) ou caso (<b>terceiro molar</b>).</div>';return}
  const m=o=>q.every(w=>o._s.includes(w));
  const dr=DRUGS.filter(m).slice(0,25),tx=TOX.filter(m).slice(0,10),cs=CASES.filter(m).slice(0,10),st=(typeof STOMS!=='undefined'?STOMS:[]).filter(m).slice(0,10);
  const go="onclick=\"closeSearch()\"";
  el.innerHTML=(dr.length?'<div class="xs muted" style="font-weight:800;margin:6px 2px">MEDICAMENTOS ('+dr.length+')</div><div class="list">'+dr.map(d=>'<a class="item" '+go+' href="#/bulario/'+d.id+'"><div class="t">'+esc(d.n)+'</div><div class="s">'+esc(d.b)+'</div></a>').join("")+'</div>':"")+
  (tx.length?'<div class="xs muted" style="font-weight:800;margin:14px 2px 6px">TOXICOLOGIA ('+tx.length+')</div><div class="list">'+tx.map(t=>'<a class="item" '+go+' href="#/tox/'+t.id+'"><div class="row"><span class="sev '+t.sev+'"></span><div class="t">'+esc(t.n)+'</div></div><div class="s">'+esc(t.t+" · "+t.sp)+'</div></a>').join("")+'</div>':"")+
  (st.length?'<div class="xs muted" style="font-weight:800;margin:14px 2px 6px">ESTOMATOLOGIA ('+st.length+')</div><div class="list">'+st.map(l=>'<a class="item" '+go+' href="#/estomato/l/'+l.id+'"><div class="t">'+esc(l.n)+'</div><div class="s">'+esc(l.el)+'</div></a>').join("")+'</div>':"")+
  (cs.length?'<div class="xs muted" style="font-weight:800;margin:14px 2px 6px">CASOS CLÍNICOS ('+cs.length+')</div><div class="list">'+cs.map(c=>'<a class="item" '+go+' href="#/casos/'+c.id+'"><div class="t">'+esc(c.title)+'</div><div class="s">'+esc(c.sp+" · "+c.spec)+'</div></a>').join("")+'</div>':"")+
  (!dr.length&&!tx.length&&!cs.length&&!st.length?'<div class="empty">Nada encontrado para “'+esc(v)+'”.</div>':"");
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSearch();if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();openSearch()}});

/* ================= Calculadoras ================= */
const TOOLS=[["anest","Anestésicos","calc"],["dose","Doses pediátricas","drop"],["profi","Profilaxia ATB","shield"],["emerg","Emergências","heart"],["inter","Interações","alert"],["cortic","Corticoides","flask"],["conv","Diluições","swap"]];
function vCalc(tool,arg){if(tool==="dose"&&!arg)tool=tool;if(!CALC[tool])tool="anest";
  if(tool==="dose"&&arg&&DM[arg])S.calcDrug=arg;
  return '<div class="stack"><h1>Calculadoras</h1><div class="tools">'+TOOLS.map(([k,l,i])=>'<a class="tool '+(k===tool?"on":"")+'" href="#/calc/'+k+'">'+ic(i,18)+l+'</a>').join("")+'</div>'+
  '<div class="card" id="calcBox">'+(CALC[tool]||CALC.dose)()+'</div></div>'+disclaimer();
}
function spSelect(id,val,onch){return '<select class="inp" id="'+id+'" onchange="'+onch+'">'+SP.map(s=>'<option value="'+s.id+'" '+(s.id===val?"selected":"")+'>'+s.e+" "+s.n+'</option>').join("")+'</select>'}
function f(id,label,val,extra){return '<div class="field"><label for="'+id+'">'+label+'</label><input class="inp" type="number" inputmode="decimal" step="any" id="'+id+'" value="'+val+'" oninput="calcRun()" '+(extra||"")+' /></div>'}
function gv(id){const e=document.getElementById(id);return e?num(e.value):0}
function bsa(sp,w){return SPM[sp].k*Math.pow(w,2/3)/100}
let calcRun=()=>{};
const CALC={
anest(){calcRun=calcAnest;const w=S.calcW.ad!=null?S.calcW.ad:70;
  return '<h2>Dose máxima de anestésico local</h2><p class="muted sm" style="margin:4px 0 12px">Calcula o máximo seguro em mg e em tubetes de 1,8 mL pelo peso, considerando também o limite do vasoconstritor. Use sempre a MENOR dose eficaz, com aspiração.</p><div class="grid g2m">'+
  '<div class="field"><label>Anestésico</label><select class="inp" id="aA" onchange="calcRun()">'+AN.map((a,i)=>'<option value="'+i+'">'+a.n+'</option>').join("")+'</select></div>'+
  f("aW","Peso do paciente (kg)",w)+'<div class="field"><label>Condição cardiovascular</label><select class="inp" id="aC" onchange="calcRun()"><option value="0.2">Saudável (ASA I/II) — máx. 0,2 mg de epinefrina</option><option value="0.04">Cardiopata/hipertenso controlado/betabloqueador — máx. 0,04 mg</option></select></div>'+
  f("aU","Tubetes já utilizados nesta sessão",0)+'</div><div class="out" id="aOut" style="margin-top:14px"></div>'},

function calcAnest(){const a=AN[num(document.getElementById("aA").value)],w=gv("aW"),lim=num(document.getElementById("aC").value),used=gv("aU");const o=document.getElementById("aOut");if(!o)return;

  const lim2=tubEpi<tubAn;
  o.innerHTML='<div class="lbl">Máximo nesta sessão</div><div class="big">'+fmt(Math.floor(tub*10)/10,1)+' tubetes</div><div class="sm muted">'+(lim2?"Limitado pelo vasoconstritor":"Limitado pelo anestésico")+'</div>'+
  '<div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(mg,0)+' mg</b><span>dose máxima ('+fmt(a.max)+' mg/kg; teto '+a.abs+' mg)</span></div><div class="res"><b>'+fmt(tubAn,1)+'</b><span>tubetes pelo anestésico ('+a.mg+' mg/tubete)</span></div>'+
  (a.epi?'<div class="res"><b>'+fmt(tubEpi,1)+'</b><span>tubetes pelo vasoconstritor ('+fmt(a.epi,3)+' mg/tubete; máx. '+lim+' mg)</span></div>':'<div class="res"><b>—</b><span>sem epinefrina</span></div>')+
  '<div class="res"><b style="color:'+(rest<0?"var(--bad)":"inherit")+'">'+fmt(Math.max(rest,0),1)+'</b><span>tubetes restantes ('+fmt(used)+' usados)</span></div></div>'+
  (rest<0?'<div class="note bad" style="margin-top:10px"><b>Dose máxima ULTRAPASSADA</b> — observe sinais de toxicidade (gosto metálico, zumbido, tremores, convulsão).</div>':"")+
  (/Prilocaína/.test(a.n)?'<div class="note warn" style="margin-top:10px">Evitar em gestantes (felipressina) e em risco de meta-hemoglobinemia.</div>':"")+(/Articaína/.test(a.n)&&w<20?'<div class="note warn" style="margin-top:10px">Articaína: uso a partir de 4 anos.</div>':"")+(/Bupivacaína/.test(a.n)&&w<40?'<div class="note bad" style="margin-top:10px">Bupivacaína não é recomendada em crianças.</div>':"")+

   al2:[["Azitromicina","500 mg VO","15 mg/kg (máx. 500 mg)",15],["Claritromicina","500 mg VO","15 mg/kg (máx. 500 mg)",15],["Doxiciclina","100 mg VO","< 45 kg: 2,2 mg/kg (máx. 100 mg)",2.2]],

function vDiag(id){if(id==="assistente")return vWizard();const d=DIAGS.find(x=>x.id===id);if(!d)return'<div class="empty">Não encontrado.</div>';

  (far.length?'<div class="card"><h3>Fármacos relacionados</h3><div class="list" style="margin-top:8px">'+far.map(drugItem).join("")+'</div></div>':"")+'</div>'+disclaimer()}
function vWizard(){const w=S.wz||(S.wz={dor:"",frio:"",perc:"",edema:"",fist:"",rx:"",trat:""});
  const opt=(k,l,ops)=>'<div class="field"><label>'+l+'</label><div class="row wrapf" style="gap:6px">'+ops.map(([v,t])=>'<button class="chip '+(w[k]===v?"on":"")+'" onclick="S.wz.'+k+'=\''+v+'\';rerender()">'+t+'</button>').join("")+'</div></div>';
  let pulp="—",api="—",pid="",aid="";
  if(w.trat==="s"){pulp="Dente previamente tratado";pid="previamente-tratado"}
  else if(w.frio==="normal"){pulp="Polpa normal";pid="pulpa-normal"}
  else if(w.frio==="curta"){pulp=w.dor==="s"?"Pulpite irreversível sintomática (dor espontânea sugere irreversibilidade)":"Pulpite reversível";pid=w.dor==="s"?"pulpite-irrev-sint":"pulpite-reversivel"}
  else if(w.frio==="longa"){pulp="Pulpite irreversível sintomática";pid="pulpite-irrev-sint"}
  else if(w.frio==="ausente"){pulp="Necrose pulpar";pid="necrose"}
  if(w.edema==="s"){api="Abscesso apical agudo";aid="abscesso-agudo"}
  else if(w.fist==="s"){api="Abscesso apical crônico";aid="abscesso-cronico"}
  else if(w.perc==="s"){api="Periodontite apical sintomática";aid="periodontite-apical-sint"}
  else if(w.rx==="lesao"){api="Periodontite apical assintomática";aid="periodontite-apical-ass"}
  else if(w.rx==="opaco"){api="Osteíte condensante";aid="osteite-condensante"}
  else if(w.perc==="n"&&(w.rx==="normal"||w.rx==="lp")){api="Tecidos apicais normais"+(w.rx==="lp"?" (espessamento do LP — reavaliar)":"")}
  const ready=w.frio||w.trat;
  return '<div class="stack"><h1>Assistente de diagnóstico</h1><p class="muted sm" style="margin:0">Pulpar e periapical — terminologia da Associação Americana de Endodontistas (AAE). Ferramenta de apoio: correlacione sempre com o exame clínico completo.</p>'+
  '<div class="card stack">'+opt("trat","O dente já tem tratamento endodôntico?",[["n","Não"],["s","Sim"]])+
  (w.trat!=="s"?opt("dor","Dor espontânea?",[["n","Não"],["s","Sim"]])+opt("frio","Teste ao frio",[["normal","Resposta normal (passa em 1–2 s)"],["curta","Dor exagerada que passa em < 10 s"],["longa","Dor que persiste > 10 s"],["ausente","Sem resposta"]]):"")+
  opt("perc","Dor à percussão/mastigação?",[["n","Não"],["s","Sim"]])+opt("edema","Edema/flutuação ou sinais sistêmicos?",[["n","Não"],["s","Sim"]])+opt("fist","Fístula?",[["n","Não"],["s","Sim"]])+
  opt("rx","Radiografia periapical",[["normal","Normal"],["lp","Espessamento do ligamento"],["lesao","Radiolucidez apical"],["opaco","Radiopacidade difusa"]])+'</div>'+
  (ready?'<div class="out"><div class="lbl">Diagnóstico pulpar</div><div class="big" style="font-size:20px">'+esc(pulp)+'</div><div class="lbl" style="margin-top:10px">Diagnóstico periapical</div><div class="big" style="font-size:20px">'+esc(api)+'</div>'+
   '<div class="row wrapf" style="gap:6px;margin-top:10px">'+(pid?'<a class="btn sm" href="#/diagnosticos/'+pid+'">Ver '+esc(pulp.split(" (")[0])+'</a>':"")+(aid?'<a class="btn sm" href="#/diagnosticos/'+aid+'">Ver '+esc(api)+'</a>':"")+'</div></div>':'<div class="empty">Responda ao teste ao frio (ou se o dente já é tratado) para ver o resultado.</div>')+
  '<button class="btn" onclick="S.wz=null;rerender()">Limpar respostas</button></div>'}
