<style>
:root{
  --navy:#0f172a;--royal:#0369a1;--royal-2:#0ea5e9;--copper:#d97706;--copper-2:#0ea5e9;
  --bg:#f7f8fa;--surface:#ffffff;--surface-2:#f9fafb;--ink:#111827;--muted:#6b7280;--line:#eceef1;--line-2:#dfe3e8;
  --accent:#0369a1;--accent-soft:#e0f2fe;--ok:#047857;--ok-soft:#d1fae5;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;--info:#0369a1;--info-soft:#e0f2fe;
  --shadow:0 1px 2px rgba(17,24,39,.04);
  --radius:16px;--nav-h:66px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f14;--surface:#12171e;--surface-2:#171d25;--ink:#e6edf7;--muted:#93a3bc;--line:#222a35;--line-2:#2c3644;
  --accent:#38bdf8;--accent-soft:#0c2a3d;--ok:#34d399;--ok-soft:#0f2e26;--warn:#fbbf24;--warn-soft:#33270b;--bad:#f87171;--bad-soft:#3a1717;--info:#38bdf8;--info-soft:#0c2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0b0f14;--surface:#12171e;--surface-2:#171d25;--ink:#e6edf7;--muted:#93a3bc;--line:#222a35;--line-2:#2c3644;
  --accent:#38bdf8;--accent-soft:#0c2a3d;--ok:#34d399;--ok-soft:#0f2e26;--warn:#fbbf24;--warn-soft:#33270b;--bad:#f87171;--bad-soft:#3a1717;--info:#38bdf8;--info-soft:#0c2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- Topbar ---------- */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#0b1224 0%,#13265c 60%,#1e3a8a 100%);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(2,6,23,.35)}
.top .back{display:none}
.top.sub .back{display:flex}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:#fff}
.brand img{width:40px;height:40px;border-radius:12px;border:2px solid var(--copper-2);background:#fff;flex:none}
.brand b{display:block;font-size:17px;font-weight:850;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:#c7d2fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tbtn:active{transform:scale(.96)}
/* ---------- Layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.layout{display:block}
.side{display:none}
@media (min-width:980px){
  body{padding-bottom:24px}
  .layout{display:grid;grid-template-columns:220px 1fr;gap:20px;max-width:1300px;margin:0 auto;padding:0 16px}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px;height:calc(100vh - 90px);padding-top:16px}
  .side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:650}
  .side a:hover{background:var(--surface)}
  .side a.on{background:var(--accent-soft);color:var(--accent)}
  .dock{display:none!important}
  .wrap{padding:16px 0}
}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b));box-shadow:0 -4px 18px rgba(15,23,42,.06)}
.dock a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 2px;border-radius:12px;min-width:0}
.dock a.on{color:var(--accent)}
.dock a.on svg{stroke-width:2.4}
/* ---------- Generic ---------- */
h1,h2,h3{margin:0;letter-spacing:-.015em}
h1{font-size:22px;font-weight:850}
h2{font-size:18px;font-weight:800}
h3{font-size:15.5px;font-weight:800}
.muted{color:var(--muted)}
.sm{font-size:13px}.xs{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2m{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-title h2{font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px;min-height:42px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0b1120}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0b1120}}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:800;line-height:1.5;white-space:nowrap}
.t-a1{background:#fef9c3;color:#854d0e;border:1px solid #fde047}
.t-b1{background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd}
.t-c1,.t-ctl{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
.t-atb{background:#dcfce7;color:#166534;border:1px solid #86efac}
.t-cls{background:var(--accent-soft);color:var(--accent)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-info{background:var(--info-soft);color:var(--info)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:750;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;min-height:44px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:84px;resize:vertical}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:40px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:14px 0}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note b{font-weight:800}
/* ---------- Home ---------- */
.hero{background:radial-gradient(120% 140% at 0% 0%,#1d4ed8 0%,#13265c 45%,#0b1224 100%);color:#fff;border-radius:22px;padding:20px;display:flex;gap:16px;align-items:center;box-shadow:0 14px 30px rgba(2,6,23,.25);overflow:hidden;position:relative}
.hero img{width:92px;height:92px;border-radius:22px;border:3px solid var(--copper-2);background:#fff;flex:none}
.hero h1{font-size:22px;color:#fff}
.hero p{margin:6px 0 0;color:#c7d2fe;font-size:13.5px}
.hero .search{margin-top:12px}
.hero .inp{background:rgba(255,255,255,.96);color:#0f172a;border-color:transparent}
.hero .search svg{color:#475569}
@media (max-width:520px){.hero{flex-direction:column;align-items:flex-start;padding:18px}.hero img{width:64px;height:64px;border-radius:16px}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-height:96px}
.tile .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.tile b{font-size:14.5px}
.tile span{font-size:12px;color:var(--muted)}
.ic.c1{background:#dbeafe;color:#1d4ed8}.ic.c2{background:#fef3c7;color:#b45309}.ic.c3{background:#fee2e2;color:#b91c1c}.ic.c4{background:#d1fae5;color:#047857}.ic.c5{background:#ede9fe;color:#6d28d9}.ic.c6{background:#e0f2fe;color:#0369a1}.ic.c7{background:#fce7f3;color:#be185d}.ic.c8{background:#f1f5f9;color:#334155}
.sp-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:420px){.sp-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.sp-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:11.5px;font-weight:700;text-align:center}
.sp-btn em{font-style:normal;font-size:24px;line-height:1.1}
/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);cursor:pointer}
.item:active{background:var(--surface-2)}
.item .t{font-weight:800;font-size:15px}
.item .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.spi{font-size:15px;letter-spacing:1px}
.sev{width:10px;height:10px;border-radius:50%;flex:none}
.sev.Fatal{background:#dc2626}.sev.Grave{background:#ea580c}.sev.Moderada{background:#d97706}.sev.Leve{background:#65a30d}
/* ---------- Detail ---------- */
.dhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dhead h1{font-size:22px}
.kv{display:grid;gap:10px}
.kv .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.kv .v{margin-top:2px}
.dose-t{width:100%;border-collapse:separate;border-spacing:0}
.dose-row{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.dose-row:first-child{border-top:0}
.dose-row .e{font-size:24px;line-height:1}
.dose-row .d{font-weight:850;font-size:15.5px;font-variant-numeric:tabular-nums}
.dose-row .m{font-size:13px;color:var(--muted);margin-top:2px}
.dose-row .o{font-size:13px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- Calc ---------- */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.tools{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tool{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:750;font-size:13px}
.tool.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (max-width:639px){.tools{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.tools::-webkit-scrollbar{display:none}.tool{flex:none;white-space:nowrap}}
.out{border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1.5px solid var(--accent)}
.out .big{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.out .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.res-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.res b{display:block;font-size:19px;font-weight:850;font-variant-numeric:tabular-nums}
.res span{font-size:12px;color:var(--muted);font-weight:650}
.wstep{display:flex;gap:6px}
.wstep button{min-width:44px}
input[type=range]{width:100%;accent-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl td.n{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.scroll-x{overflow-x:auto}
/* ---------- Overlay / modal ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(2,6,23,.55);display:none;align-items:flex-start;justify-content:center;padding:calc(12px + var(--safe-t)) 12px 12px}
.ov.show{display:flex}
.ov .box{background:var(--surface);border-radius:20px;width:100%;max-width:720px;max-height:calc(100vh - 24px);overflow:auto;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.case-q{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px;font-weight:750}
.pts{margin:0;padding-left:20px}
.pts li{margin:6px 0}
.take{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px;font-weight:750}
.disc{font-size:12px;color:var(--muted);text-align:center;margin:28px 8px 8px}
.lg{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 120% at 0% 0%,#1d4ed8 0%,#13265c 45%,#0b1224 100%);display:none;align-items:center;justify-content:center;padding:20px}
.lg.show{display:flex}
.lg .box{background:var(--surface);border-radius:22px;padding:22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lg img{width:84px;height:84px;border-radius:20px;border:3px solid var(--copper-2);display:block;margin:0 auto 10px}

/* ===== Clean theme overrides ===== */
.top{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:none}
.brand{color:var(--ink)}.brand img{border:0;border-radius:10px;width:36px;height:36px;background:none}
.brand b{font-size:16.5px;font-weight:800}.brand b span{color:var(--accent)}.brand small{color:var(--muted)}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--ink)}
.hero{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.hero img{border:0;background:none;border-radius:20px}.hero h1{color:var(--ink)}.hero p{color:var(--muted)}
.hero .inp{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line-2)}.hero .search svg{color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.out{background:var(--accent-soft);border:1px solid var(--accent)}
.tile{box-shadow:none}.card{box-shadow:none}
.lg{background:var(--bg)}.lg .box{border:1px solid var(--line);box-shadow:0 10px 40px rgba(17,24,39,.08)}.lg img{border:0;border-radius:20px}
.dock{box-shadow:none}
/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  body{background:#fff;padding:0;color:#000}
  .top,.dock,.layout,.ov,.toast{display:none!important}
  #printArea{display:block}
  .rx-page{page-break-after:always;padding:18mm 16mm;font-family:Georgia,serif;color:#000;min-height:260mm;position:relative}
  .rx-page:last-child{page-break-after:auto}
  .rx-h{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
  .rx-h b{font-size:18px}
  .rx-item{margin:12px 0}
  .rx-foot{position:absolute;bottom:18mm;left:16mm;right:16mm;text-align:center;border-top:1px solid #000;padding-top:6px}
}
</style>

nas 24 h após o uso — adiar o atendimento."},{"a":"VASO_EPI","b":"Inibidores da Monoaminoxidase (IMAO)","sev":"Leve","ev":"H","mech":"Epinefrina é metabolizada principalmente pela COMT (interação clinicamente pequena).","eff":"Risco teórico de aumento pressórico.","cond":"Doses usuais com aspiração e monitoração de PA."},{"a":"AINE","b":"ANTICOAG","sev":"Grave","ev":"B","mech":"Inibição plaquetária + lesão de mucosa GI somadas à anticoagulação.","eff":"Sangramento pós-operatório e gastrintestinal.","cond":"Preferir paracetamol (≤ 2 g/dia com varfarina) e dipirona; se AINE indispensável, menor tempo + IBP e contato com o médico."},{"a":"AINE","b":"AINE","sev":"Grave","ev":"B","mech":"Inibição somada de COX sem ganho analgésico.","eff":"Úlcera, sangramento, lesão renal.","cond":"Nunca associar dois AINEs (inclusive associações como Torsilax)."},{"a":"AINE","b":"CORT","sev":"Moderada","ev":"B","mech":"Somatório de lesão de mucosa gástrica.","eff":"Úlcera/sangramento GI (risco maior em idosos e uso prolongado).","cond":"Dose única pré-operatória de corticoide + AINE por poucos dias é usual; em uso prolongado associar IBP."},{"a":"AINE","b":"Anti-hipertensivos (IECA, BRA, diuréticos)","sev":"Moderada","ev":"V","mech":"Retenção de sódio e redução da perfusão renal mediada por prostaglandinas.","eff":"Perda do controle pressórico; lesão renal em idosos/desidratados (tríade com diurético).","cond":"Uso curto (≤ 5 dias) com monitoração de PA; preferir paracetamol/dipirona em renais e idosos."},{"a":"AINE","b":"Lítio","sev":"Grave","ev":"B","mech":"Redução da excreção renal de lítio.","eff":"Intoxicação por lítio (tremor, confusão, arritmia).","cond":"Evitar AINEs; usar paracetamol."},{"a":"AINE","b":"Metotrexato","sev":"Grave","ev":"B","mech":"Redução da excreção renal de metotrexato.","eff":"Mielossupressão, mucosite.","cond":"Evitar (especialmente em doses oncológicas); contato com o médico."},{"a":"AINE","b":"IMUNOSSUP","sev":"Moderada","ev":"H","mech":"Nefrotoxicidade somada.","eff":"Lesão renal.","cond":"Preferir paracetamol."},{"a":"AINE","b":"Antidepressivos ISRS/IRSN (fluoxetina, sertralina, venlafaxina)","sev":"Moderada","ev":"V","mech":"ISRS reduzem serotonina plaquetária.","eff":"Aumento do risco de sangramento GI.","cond":"Uso curto; considerar IBP."},{"a":"Ibuprofeno","b":"Antiagregantes (AAS dose baixa, clopidogrel, ticagrelor, prasugrel)","sev":"Moderada","ev":"V","mech":"Ibuprofeno compete pelo sítio da COX-1 plaquetária e bloqueia o efeito irreversível do AAS.","eff":"Perda da cardioproteção do AAS + sangramento.","cond":"Tomar o AAS 2 h antes do ibuprofeno ou preferir paracetamol/dipirona."},{"a":"Miconazol Gel Oral 2%","b":"Varfarina","sev":"Grave","ev":"B","mech":"Inibição do CYP2C9 (o gel oral é absorvido sistemicamente).","eff":"Elevação acentuada do INR — hemorragias graves (relatos fatais).","cond":"CONTRAINDICADO: usar nistatina."},{"a":"Fluconazol","b":"Varfarina","sev":"Grave","ev":"B","mech":"Inibição do CYP2C9.","eff":"Elevação do INR.","cond":"Evitar ou monitorar INR com o médico; preferir nistatina."},{"a":"Metronidazol","b":"Varfarina","sev":"Grave","ev":"B","mech":"Inibição do metabolismo da S-varfarina.","eff":"Elevação do INR e sangramento.","cond":"Evitar; se indispensável, INR em 3–5 dias."},{"a":"MACRO","b":"Varfarina","sev":"Moderada","ev":"V","mech":"Inibição do CYP3A4/alteração da flora produtora de vitamina K.","eff":"Elevação do INR (claritromicina > azitromicina).","cond":"Monitorar INR."},{"a":"Amoxicilina","b":"Varfarina","sev":"Leve","ev":"V","mech":"Alteração da flora intestinal produtora de vitamina K.","eff":"Elevação discreta do INR.","cond":"Orientar sinais de sangramento; INR se uso > 5 dias."},{"a":"Amoxicilina + Clavulanato","b":"Varfarina","sev":"Leve","ev":"V","mech":"Alteração da flora intestinal.","eff":"Elevação discreta do INR.","cond":"Orientar e monitorar."},{"a":"Paracetamol (Acetaminofeno)","b":"Varfarina","sev":"Leve","ev":"V","mech":"Uso regular > 2 g/dia por vários dias aumenta o INR.","eff":"Elevação do INR.","cond":"Preferido mesmo assim; usar ≤ 2 g/dia e por poucos dias."},{"a":"Metronidazol","b":"Lítio","sev":"Moderada","ev":"V","mech":"Redução da excreção de lítio.","eff":"Toxicidade do lítio.","cond":"Evitar ou monitorar com o psiquiatra."},{"a":"Metronidazol","b":"Fenitoína","sev":"Moderada","ev":"V","mech":"Inibição do metabolismo da fenitoína.","eff":"Toxicidade (ataxia, nistagmo).","cond":"Monitorar."},{"a":"Fluconazol","b":"Fenitoína","sev":"Moderada","ev":"V","mech":"Inibição do CYP2C9.","eff":"Toxicidade da fenitoína.","cond":"Monitorar."},{"a":"CYP3A_INIB","b":"BZD","sev":"Grave","ev":"B","mech":"Inibição do CYP3A4 (midazolam, alprazolam, diazepam).","eff":"Sedação profunda e prolongada, depressão respiratória.","cond":"Contraindicado com midazolam oral; preferir azitromicina; reduzir/evitar BZD."},{"a":"CYP3A_INIB","b":"IMUNOSSUP","sev":"Grave","ev":"B","mech":"Inibição do CYP3A4.","eff":"Níveis tóxicos de ciclosporina/tacrolimo (nefrotoxicidade).","cond":"Preferir azitromicina; contato com a equipe de transplante."},{"a":"CYP3A_INIB","b":"Carbamazepina","sev":"Moderada","ev":"B","mech":"Inibição do metabolismo da carbamazepina.","eff":"Toxicidade (tontura, ataxia, diplopia).","cond":"Evitar claritromicina; monitorar."},{"a":"OPIOIDE","b":"BZD","sev":"Grave","ev":"B","mech":"Depressão somada do SNC e respiratória (alerta FDA).","eff":"Sedação profunda, depressão respiratória, morte.","cond":"Evitar associação em ambulatório; se usar, menores doses e monitoração."},{"a":"OPIOIDE","b":"SEDATIVO","sev":"Moderada","ev":"H","mech":"Depressão do SNC somada.","eff":"Sonolência, risco de quedas/acidentes.","cond":"Orientar a não dirigir."},{"a":"BZD","b":"SEDATIVO","sev":"Moderada","ev":"H","mech":"Depressão do SNC somada.","eff":"Sedação excessiva.","cond":"Reduzir doses."},{"a":"Tramadol","b":"SEROT","sev":"Grave","ev":"B","mech":"Excesso de serotonina + redução do limiar convulsivo.","eff":"Síndrome serotoninérgica (agitação, hipertermia, tremores) e convulsões.","cond":"Evitar tramadol em usuários de antidepressivos/IMAO/ciclobenzaprina; preferir dipirona/paracetamol ± AINE."},{"a":"Paracetamol + Codeína","b":"Antidepressivos ISRS/IRSN (fluoxetina, sertralina, venlafaxina)","sev":"Moderada","ev":"V","mech":"Fluoxetina e paroxetina inibem o CYP2D6 (ativação da codeína em morfina).","eff":"Perda do efeito analgésico da codeína.","cond":"Preferir outro analgésico."},{"a":"Ciclobenzaprina","b":"Inibidores da Monoaminoxidase (IMAO)","sev":"Grave","ev":"B","mech":"Estrutura tricíclica.","eff":"Crise hipertensiva, convulsões, síndrome serotoninérgica.","cond":"Contraindicado (intervalo de 14 dias)."},{"a":"QT","b":"QT","sev":"Moderada","ev":"H","mech":"Prolongamento somado do intervalo QT.","eff":"Arritmias ventriculares (torsades) em predispostos.","cond":"Evitar associações em cardiopatas/QT longo; preferir amoxicilina."},{"a":"METHB","b":"METHB","sev":"Moderada","ev":"H","mech":"Somatório de agentes oxidantes da hemoglobina.","eff":"Meta-hemoglobinemia.","cond":"Evitar benzocaína tópica extensa com prilocaína em doses altas, especialmente em crianças."},{"a":"Prilocaína 3% com Felipressina","b":"Dinitrato de Isossorbida (sublingual)","sev":"Leve","ev":"H","mech":"Nitratos também induzem meta-hemoglobina.","eff":"Meta-hemoglobinemia aditiva.","cond":"Atenção em doses altas."},{"a":"Doxiciclina","b":"Sulfato Ferroso","sev":"Moderada","ev":"B","mech":"Quelação pelo ferro.","eff":"Redução da absorção da doxiciclina.","cond":"Separar por 2–3 h."},{"a":"Doxiciclina","b":"Carbamazepina","sev":"Moderada","ev":"V","mech":"Indução enzimática.","eff":"Redução da meia-vida da doxiciclina.","cond":"Considerar outro antibiótico."},{"a":"Carbamazepina","b":"Contraceptivos Orais","sev":"Moderada","ev":"B","mech":"Indução enzimática.","eff":"Falha contraceptiva.","cond":"Método adicional."},{"a":"Carbamazepina","b":"Varfarina","sev":"Moderada","ev":"B","mech":"Indução do metabolismo da varfarina.","eff":"Redução do INR (risco trombótico).","cond":"Monitorar INR com o médico."},{"a":"CORT","b":"DIABET","sev":"Moderada","ev":"B","mech":"Resistência insulínica induzida por glicocorticoide.","eff":"Hiperglicemia (mesmo com dose única de dexametasona por 24–48 h).","cond":"Orientar monitoração glicêmica; preferir menor dose."},{"a":"Itraconazol","b":"Omeprazol","sev":"Moderada","ev":"V","mech":"Absorção da cápsula depende de pH ácido.","eff":"Falha antifúngica.","cond":"Evitar associação ou usar solução oral."},{"a":"Ondansetrona","b":"Tramadol","sev":"Moderada","ev":"H","mech":"Bloqueio 5-HT3 reduz analgesia do tramadol; somatório serotoninérgico.","eff":"Menor analgesia.","cond":"Preferir dimenidrinato."},{"a":"Bifosfonatos (alendronato, risedronato, ácido zoledrônico)","b":"CORT","sev":"Leve","ev":"V","mech":"Corticoterapia é fator de risco adicional para osteonecrose.","eff":"Maior risco de MRONJ.","cond":"Planejamento cirúrgico atraumático."},{"a":"Denosumabe","b":"Bifosfonatos (alendronato, risedronato, ácido zoledrônico)","sev":"Moderada","ev":"V","mech":"Antirreabsortivos sequenciais/combinados.","eff":"Risco aumentado de MRONJ.","cond":"Avaliação cuidadosa antes de procedimentos invasivos."}],"tox":[{"n":"Síncope Vasovagal (lipotimia)","t":"Cardiovascular","sp":"Jovens ansiosos, jejum, dor, visão de agulha/sangue","sev":"Moderada","dose":"Ansiedade, jejum, calor, posição sentada/de pé, dor durante anestesia.","mech":"Reflexo vagal: vasodilatação e bradicardia → hipoperfusão cerebral transitória.","sx":"Palidez, sudorese fria, náusea, tontura, bocejos, bradicardia → perda breve da consciência (< 1 min).","tx":"Interromper o procedimento; posição supina com pernas elevadas (Trendelenburg modificado); afrouxar roupas; O2; monitorar sinais vitais. Recuperação em 1–2 min. Se não recuperar em 1–2 min ou bradicardia persistente: atropina 0,5 mg IV/IM e acionar SAMU (192).","ant":"Posição + oxigênio (atropina se bradicardia persistente)."},{"n":"Hipotensão Ortostática","t":"Cardiovascular","sp":"Idosos, anti-hipertensivos, sedação","sev":"Leve","dose":"Levantar rapidamente da cadeira após longo período reclinado.","mech":"Falha do reflexo barorreceptor.","sx":"Tontura, escurecimento visual ao levantar, queda.","tx":"Deitar o paciente; elevar pernas; levantar em etapas (sentar 1–2 min antes de ficar de pé).","ant":"Posicionamento."},{"n":"Hiperventilação / Crise de Ansiedade","t":"Respiratória","sp":"Pacientes ansiosos (15–40 anos)","sev":"Leve","dose":"Medo odontológico.","mech":"Hiperventilação → alcalose respiratória (hipocapnia) → vasoconstrição cerebral e hipocalcemia ionizada.","sx":"Respiração rápida, parestesia perioral e de extremidades, espasmo carpopedal, tontura, sensação de morte.","tx":"Interromper; posição sentada; tranquilizar; respiração lenta e controlada (contar); NÃO administrar O2. Se persistir: benzodiazepínico (diazepam/midazolam).","ant":"Controle respiratório (sem oxigênio)."},{"n":"Hipoglicemia","t":"Metabólica","sp":"Diabéticos (insulina, sulfonilureias), jejum prolongado","sev":"Grave","dose":"Jejum para o procedimento sem ajustar a medicação; consulta longa.","mech":"Glicemia < 70 mg/dL → neuroglicopenia e resposta adrenérgica.","sx":"Sudorese, tremor, taquicardia, fome, confusão, alteração de comportamento → convulsão, coma.","tx":"Consciente: 15–20 g de açúcar VO (suco, açúcar, glicose gel); repetir em 15 min se glicemia < 70. Inconsciente: NADA VO — glicose 50% 25–50 mL IV ou glucagon 1 mg IM; lateralizar; SAMU.","ant":"Glicose / glucagon."},{"n":"Anafilaxia","t":"Alérgica","sp":"Alergia a látex, antibióticos (penicilinas), AINEs, clorexidina, sulfitos","sev":"Fatal","dose":"Exposição a alérgeno (minutos após).","mech":"Reação de hipersensibilidade sistêmica mediada por IgE (liberação maciça de histamina e mediadores).","sx":"Urticária/angioedema + dispneia, sibilos, estridor, hipotensão, taquicardia, vômitos, colapso.","tx":"ADRENALINA IM IMEDIATA (0,5 mg adulto; 0,01 mg/kg criança, máx. 0,3–0,5 mg) na coxa, repetir a cada 5–15 min; posição supina (sentado se dispneia); O2 alto fluxo; acionar SAMU; após adrenalina: anti-histamínico, corticoide, salbutamol se broncoespasmo. Iniciar RCP se parada.","ant":"ADRENALINA IM."},{"n":"Reação Alérgica Leve (urticária localizada)","t":"Alérgica","sp":"Qualquer paciente","sev":"Leve","dose":"Medicamentos, látex.","mech":"Hipersensibilidade local.","sx":"Prurido, placas urticariformes sem comprometimento respiratório ou hemodinâmico.","tx":"Suspender o agente; anti-histamínico (loratadina/cetirizina VO ou difenidramina/prometazina IM); observar 1 h — progressão = tratar como anafilaxia.","ant":"Anti-histamínico H1."},{"n":"Crise Asmática / Broncoespasmo","t":"Respiratória","sp":"Asmáticos; AINE-exacerbada; sulfitos","sev":"Grave","dose":"Ansiedade, AINEs, sulfitos, frio, esquecimento da bombinha.","mech":"Broncoconstrição, edema e hipersecreção.","sx":"Dispneia, sibilos, tosse, uso de musculatura acessória; grave: fala entrecortada, cianose, silêncio auscultatório.","tx":"Posição sentada; salbutamol 4–8 jatos com espaçador a cada 20 min (até 3x); O2. Grave/sem resposta: adrenalina 0,3–0,5 mg IM e SAMU.","ant":"Salbutamol inalatório."},{"n":"Angina Pectoris / Suspeita de Infarto","t":"Cardiovascular","sp":"Coronariopatas, idosos, diabéticos, tabagistas","sev":"Fatal","dose":"Estresse, dor, excesso de vasoconstritor.","mech":"Desequilíbrio oferta/demanda de O2 miocárdica.","sx":"Dor/opressão retroesternal irradiada para braço esquerdo, mandíbula ou dentes; sudorese, náusea, dispneia.","tx":"Interromper; posição confortável (semissentado); O2 se SpO2 < 94%; nitrato sublingual (isossorbida 5 mg) se PAS > 90 e sem uso de sildenafila; sem melhora em 5 min ou dor > 10 min: SAMU (192) + AAS 160–325 mg mastigado; preparar para RCP/DEA.","ant":"Nitrato SL + AAS mastigado."},{"n":"Crise Hipertensiva","t":"Cardiovascular","sp":"Hipertensos não controlados, ansiedade, vasoconstritor","sev":"Grave","dose":"PA ≥ 180/120.","mech":"Elevação abrupta da pressão com (emergência) ou sem (urgência) lesão de órgão-alvo.","sx":"Cefaleia, visão turva, dor torácica, déficit neurológico, dispneia (emergência). Muitas vezes assintomática.","tx":"Interromper/adiar o procedimento; repetir a medida após repouso de 5–10 min; com sintomas de lesão de órgão-alvo: SAMU. Assintomático: encaminhar ao médico. NÃO usar nifedipina SL (risco de AVC/IAM).","ant":"Encaminhamento (sem anti-hipertensivo SL)."},{"n":"Convulsão","t":"Neurológica","sp":"Epilépticos, hipoglicemia, toxicidade por anestésico local","sev":"Grave","dose":"Esquecimento de anticonvulsivante, privação de sono, luz do refletor, estresse.","mech":"Descarga neuronal sincronizada.","sx":"Perda de consciência, movimentos tônico-clônicos, liberação esfincteriana, período pós-ictal.","tx":"Proteger a cabeça, afastar objetos/instrumentos; NÃO colocar nada na boca; lateralizar após a crise; O2; glicemia capilar. Crise > 5 min: midazolam 10 mg IM ou IN (5 mg se 13–40 kg) e SAMU.","ant":"Midazolam IM/intranasal (> 5 min)."},{"n":"Toxicidade Sistêmica por Anestésico Local (LAST)","t":"Medicamentosa","sp":"Crianças, idosos, injeção intravascular, doses repetidas","sev":"Fatal","dose":"Dose acima do máximo por peso (ver calculadora) ou injeção intravascular sem aspiração.","mech":"Bloqueio de canais de sódio no SNC e no coração.","sx":"Gosto metálico, dormência perioral, zumbido, tontura, fala arrastada, agitação → tremores, convulsão → depressão respiratória, bradicardia, arritmia, parada.","tx":"Parar a injeção; O2; posição supina; controlar convulsão (midazolam); suporte ventilatório; SAMU. Em ambiente hospitalar: emulsão lipídica 20% 1,5 mL/kg.","ant":"Benzodiazepínico + suporte; emulsão lipídica (hospitalar)."},{"n":"Meta-hemoglobinemia (prilocaína/benzocaína)","t":"Medicamentosa","sp":"Doses altas de prilocaína, benzocaína em crianças","sev":"Grave","dose":"Prilocaína > 8 mg/kg; benzocaína em < 2 anos ou excesso.","mech":"Oxidação do ferro da hemoglobina (Fe3+) — perde capacidade de transportar O2.","sx":"Cianose cinza-azulada 1–3 h após, que não melhora com O2; SpO2 ~85%; cefaleia, dispneia, letargia.","tx":"O2; encaminhar a hospital: azul de metileno 1–2 mg/kg IV.","ant":"Azul de metileno."},{"n":"Obstrução de Via Aérea por Corpo Estranho","t":"Respiratória","sp":"Procedimentos em cadeira reclinada (coroas, limas, brocas, gaze)","sev":"Fatal","dose":"Ausência de isolamento absoluto/barreira de gaze.","mech":"Aspiração ou deglutição de instrumentos/materiais.","sx":"Engasgo, tosse; obstrução total: incapacidade de falar/tossir, cianose, mãos no pescoço.","tx":"Obstrução parcial: estimular a tosse. Total: manobra de Heimlich (adulto/criança > 1 ano) — lactente: 5 golpes nas costas + 5 compressões torácicas. Inconsciente: RCP. Sempre encaminhar para radiografia (tórax/abdome) se o objeto não for recuperado.","ant":"Manobra de Heimlich."},{"n":"Parada Cardiorrespiratória (PCR)","t":"Cardiovascular","sp":"Qualquer paciente","sev":"Fatal","dose":"IAM, anafilaxia, LAST, obstrução de via aérea.","mech":"Ausência de circulação efetiva.","sx":"Paciente não responde, sem respiração normal (ou gasping), sem pulso.","tx":"Chamar ajuda e SAMU (192); pegar o DEA; compressões torácicas de alta qualidade (100–120/min, 5–6 cm, retorno completo) — 30:2 com ventilação (AMBU); DEA assim que disponível; manter até chegada do SAMU.","ant":"RCP + DEA."},{"n":"Acidente Vascular Cerebral (AVC)","t":"Neurológica","sp":"Hipertensos, idosos, fibrilação atrial","sev":"Fatal","dose":"Fatores de risco cardiovascular.","mech":"Isquemia ou hemorragia cerebral.","sx":"Escala SAMU: Sorriso assimétrico, Abraço (fraqueza em um braço), Música (fala alterada), Urgente — ligar 192. Anotar o horário de início.","tx":"Acionar SAMU imediatamente; posição com cabeça elevada 30°; O2 se SpO2 < 94%; não dar nada VO nem AAS.","ant":"Tempo (janela de trombólise)."},{"n":"Acidente com Hipoclorito de Sódio","t":"Medicamentosa","sp":"Tratamento endodôntico (extravasamento periapical)","sev":"Grave","dose":"Agulha travada no canal, pressão excessiva, ápice aberto, perfuração.","mech":"Necrose tecidual química pelo hipoclorito nos tecidos periapicais/espaços faciais.","sx":"Dor intensa súbita, edema e equimose rápidos e extensos, sangramento pelo canal.","tx":"Interromper; irrigar o canal com soro; analgesia (anestesia local, AINE/opioide), compressas frias nas primeiras 24 h e mornas depois; corticoide; antibiótico se infecção secundária; acompanhamento diário; grave/edema de via aérea: hospital.","ant":"Suporte (sem antídoto)."},{"n":"Hemorragia Pós-Exodontia","t":"Hemorrágica","sp":"Anticoagulados, antiagregados, hepatopatas, hemofílicos","sev":"Moderada","dose":"Trauma cirúrgico, não cumprimento das orientações, coagulopatias.","mech":"Falha da hemostasia local/sistêmica.","sx":"Sangramento persistente pelo alvéolo.","tx":"Remover coágulo frouxo, comprimir com gaze por 30 min (mordendo); anestesia com vasoconstritor local; esponja hemostática + sutura; gaze embebida em ácido tranexâmico; investigar coagulopatia; persistente: encaminhar.","ant":"Hemostasia local + ácido tranexâmico."},{"n":"Insuficiência Adrenal Aguda","t":"Metabólica","sp":"Usuários crônicos de corticoide, doença de Addison","sev":"Grave","dose":"Estresse cirúrgico sem dose de estresse.","mech":"Deficiência de cortisol diante do estresse.","sx":"Fraqueza, confusão, náusea, dor abdominal, hipotensão refratária.","tx":"Posição supina; O2; SAMU; hidrocortisona 100 mg IV/IM.","ant":"Hidrocortisona."},{"n":"Enfisema Subcutâneo","t":"Iatrogênica","sp":"Uso de seringa tríplice ou caneta de alta rotação com ar em cirurgias/endodontia","sev":"Moderada","dose":"Ar sob pressão em tecidos abertos.","mech":"Ar dissecando planos fasciais.","sx":"Edema súbito com CREPITAÇÃO à palpação; pode estender-se a pescoço/mediastino.","tx":"Tranquilizar; observação; compressas; antibiótico profilático (amoxicilina) pela contaminação; extensão a pescoço/tórax ou dispneia: hospital.","ant":"Observação + antibiótico."}],"cases":[{"sp":"Adulto","spec":"Endodontia","title":"Pulpite irreversível sintomática em molar inferior — antibiótico?","ctx":"Homem, 32 anos, saudável, dor espontânea, intensa e pulsátil no 46 há 2 dias, que piora com calor e à noite. Teste térmico ao frio com dor prolongada. Sem edema, sem febre, sem alteração periapical radiográfica.","q":"Qual a conduta e há indicação de antibiótico?","pts":["Diagnóstico: pulpite irreversível sintomática.","Tratamento: pulpectomia (ou pulpotomia de urgência) — a remoção do tecido pulpar inflamado é o que resolve a dor.","Anestesia: bloqueio do alveolar inferior + bucal; complementar com infiltração vestibular de articaína 4% (aumenta o sucesso em molares com pulpite).","Analgesia pós-operatória: ibuprofeno 400–600 mg 6/6h + paracetamol 500–1.000 mg 6/6h por 2–3 dias (associação mais eficaz que opioides).","NÃO prescrever antibiótico: pulpite é inflamação, sem infecção disseminada (Diretriz ADA 2019) — antibiótico não reduz a dor e aumenta resistência."],"take":"Pulpite se trata com intervenção, não com antibiótico."},{"sp":"Adulto","spec":"Endodontia / Infecção","title":"Abscesso periapical agudo com celulite e febre","ctx":"Mulher, 45 anos, dor e edema em face do lado direito há 2 dias, 48 com necrose pulpar, febre 38,4 °C, linfadenopatia submandibular, trismo leve. Sem dispneia ou disfagia.","q":"Quando prescrever antibiótico e qual?","pts":["Infecção odontogênica com sinais sistêmicos (febre, linfadenopatia, celulite, trismo) = indicação de antibiótico SEMPRE associado à remoção da causa.","Drenagem (via canal e/ou incisão em ponto de flutuação) + acesso endodôntico ou exodontia.","Amoxicilina 500 mg 8/8h (ou 875 mg 12/12h) por 5–7 dias; sem resposta em 48–72 h: amoxicilina + clavulanato ou associar metronidazol 400 mg 8/8h.","Alérgica à penicilina: clindamicina 300 mg 8/8h ou azitromicina 500 mg/dia por 3 dias.","Sinais de alarme para encaminhar ao hospital: dispneia, disfagia, elevação do assoalho bucal, edema periorbital, febre alta, trismo grave (angina de Ludwig, celulite orbitária)."],"take":"Antibiótico é adjuvante; a drenagem resolve."},{"sp":"Adulto","spec":"Cirurgia","title":"Exodontia de terceiros molares inclusos — protocolo farmacológico","ctx":"Estudante, 22 anos, saudável, 60 kg, indicação de remoção dos 38 e 48 inclusos (classe II B de Pell & Gregory). Ansiedade moderada.","q":"Monte o protocolo farmacológico perioperatório.","pts":["Ansiedade: midazolam 7,5 mg VO 30 min antes (paciente acompanhado e sem dirigir) — exige receita B (azul).","Analgesia preventiva + controle de edema: dexametasona 8 mg VO 1 h antes (dose única) + ibuprofeno 400–600 mg 1 h antes.","Anestesia: lidocaína 2% c/ epinefrina 1:100.000 — dose máxima 7 mg/kg = 420 mg ≈ 11 tubetes; normalmente 3–5 tubetes bastam; bupivacaína 0,5% opcional para analgesia prolongada.","Pós-operatório: ibuprofeno 400 mg 6/6h por 3 dias + dipirona 1 g 6/6h se necessário; clorexidina 0,12% a partir de 24 h.","Antibiótico profilático não é rotina em pacientes saudáveis (considerar amoxicilina 2 g 1 h antes em casos de maior risco/osteotomia extensa — evidência moderada)."],"take":"Dexametasona pré-operatória + AINE preventivo reduzem dor, edema e trismo."},{"sp":"Adulto","spec":"Cirurgia","title":"Alveolite seca após exodontia","ctx":"Mulher, 28 anos, tabagista, usa contraceptivo oral, extração do 37 há 3 dias. Dor intensa irradiada para o ouvido, alvéolo vazio, odor fétido, osso exposto.","q":"Qual o diagnóstico e o tratamento?","pts":["Diagnóstico: alveolite seca (osteíte alveolar) — fatores de risco: tabagismo, contraceptivo, extrações traumáticas de molares inferiores.","Anestesia local; irrigação suave do alvéolo com soro fisiológico (sem curetagem agressiva do osso).","Curativo intra-alveolar com pasta (iodofórmio + eugenol + anestésico — ex.: Alveolex), trocado a cada 2–3 dias até alívio.","Analgesia: ibuprofeno + paracetamol/dipirona.","Antibiótico só se houver sinais de infecção disseminada. Orientar a cessação do tabagismo."],"take":"Alveolite é dor por exposição óssea — curativo local resolve."},{"sp":"Adulto","spec":"Pacientes especiais","title":"Exodontia em paciente em uso de varfarina","ctx":"Homem, 68 anos, fibrilação atrial, varfarina 5 mg/dia. Precisa extrair o 24 (resto radicular). INR de ontem: 2,6.","q":"Precisa suspender a varfarina?","pts":["NÃO suspender: risco de AVC supera o de sangramento. Exodontias simples são seguras com INR ≤ 3,5 medido até 24 h antes.","Técnica atraumática, anestesia com vasoconstritor, esponja hemostática + sutura, compressão com gaze embebida em ácido tranexâmico.","Bochecho com ácido tranexâmico 5% (10 mL, 4x/dia por 2–5 dias).","Analgesia: paracetamol ≤ 2 g/dia ou dipirona — evitar AINEs.","NÃO prescrever miconazol gel, metronidazol ou fluconazol (elevam o INR); amoxicilina com cautela."],"take":"Anticoagulante se mantém; a hemostasia é local."},{"sp":"Adulto","spec":"Pacientes especiais","title":"Hipertenso em uso de propranolol — escolha do anestésico","ctx":"Homem, 55 anos, hipertenso e com enxaqueca, usa propranolol 40 mg 12/12h. PA no consultório: 142/88. Necessita restauração e raspagem por quadrante.","q":"Qual anestésico e dose?","pts":["Propranolol é betabloqueador NÃO seletivo: epinefrina causa hipertensão por estímulo alfa sem oposição, com bradicardia reflexa.","Limitar epinefrina a 0,04 mg (≈ 2 tubetes de lidocaína 1:100.000) com aspiração e injeção lenta, aferindo PA antes e após.","Alternativas: prilocaína 3% com felipressina ou mepivacaína 3% sem vasoconstritor.","PA ≥ 180/110 no dia: adiar procedimento eletivo e encaminhar.","Consultas curtas, pela manhã, com controle de ansiedade."],"take":"Betabloqueador não seletivo + epinefrina = dose mínima e monitoração."},{"sp":"Gestante","spec":"Pacientes especiais","title":"Gestante de 24 semanas com dor de dente","ctx":"Gestante, 29 anos, 24 semanas, sem comorbidades, dor por cárie profunda no 36 com pulpite irreversível. Teme que o tratamento prejudique o bebê.","q":"Pode atender? Quais fármacos?","pts":["Sim: o 2º trimestre é o período ideal, e postergar uma infecção/dor traz mais risco que o tratamento.","Anestésico: lidocaína 2% com epinefrina 1:100.000 (escolha na gestação), com aspiração — até 2 tubetes resolvem a maioria dos procedimentos. Evitar prilocaína com felipressina.","Analgesia: paracetamol 500–750 mg 6/6h. EVITAR AINEs a partir de 20 semanas (oligoâmnio, fechamento do ducto arterial).","Se precisar de antibiótico: amoxicilina (ou cefalexina/azitromicina em alérgicas). Evitar tetraciclinas, metronidazol no 1º trimestre e fluoroquinolonas.","Posição semissentada / decúbito lateral esquerdo para evitar hipotensão supina (compressão da veia cava); radiografia com avental de chumbo quando necessária."],"take":"Gestante deve ser tratada — lidocaína com epinefrina, paracetamol e amoxicilina."},{"sp":"Criança","spec":"Odontopediatria","title":"Criança de 6 anos — dose máxima de anestésico","ctx":"Criança, 6 anos, 20 kg, precisa de pulpotomia no 75 e restauração no 84 na mesma sessão.","q":"Quantos tubetes podem ser usados com segurança?","pts":["Dose máxima de lidocaína 2% c/ epinefrina: 7 mg/kg → 140 mg ÷ 36 mg/tubete = 3,9 tubetes (limite absoluto; usar o mínimo necessário).","Mepivacaína 3% (54 mg/tubete; máx. 6,6 mg/kg = 132 mg) → 2,4 tubetes apenas — atenção, crianças intoxicam com poucos tubetes de mepivacaína 3%.","Articaína 4% permitida a partir de 4 anos: 7 mg/kg = 140 mg ÷ 72 mg = 1,9 tubete.","Evitar bupivacaína (lesão por mordedura de lábio/língua) e benzocaína em excesso (meta-hemoglobinemia).","Orientar os pais sobre não morder o lábio anestesiado; anotar a dose total no prontuário."],"take":"Em crianças, calcule sempre a dose máxima pelo peso — use a calculadora."},{"sp":"Criança","spec":"Odontopediatria / Estomatologia","title":"Gengivoestomatite herpética primária","ctx":"Criança, 3 anos, 14 kg, febre 38,5 °C há 2 dias, irritabilidade, recusa alimentar, gengiva edemaciada e sangrante, múltiplas vesículas/úlceras em lábios, língua e palato.","q":"Qual a conduta?","pts":["Diagnóstico clínico: primoinfecção pelo HSV-1.","Aciclovir 15 mg/kg 5x/dia por 7 dias se iniciado nas primeiras 72 h (reduz duração das lesões e da febre).","Hidratação (principal preocupação — risco de desidratação), dieta fria e pastosa.","Analgesia/antipirético: paracetamol 10–15 mg/kg 6/6h ou dipirona.","Evitar contato com recém-nascidos e lesões oculares (autoinoculação); sinais de desidratação: encaminhar."],"take":"Hidratação + aciclovir precoce + analgesia."},{"sp":"Adulto","spec":"Estomatologia","title":"Candidíase em usuário de prótese total","ctx":"Mulher, 72 anos, prótese total superior usada dia e noite, palato eritematoso com limites da prótese, ardência, diabetes tipo 2 e uso de varfarina.","q":"Qual antifúngico e quais cuidados?","pts":["Diagnóstico: estomatite protética (candidíase eritematosa).","Higiene e desinfecção da prótese (escovação + imersão em hipoclorito 0,5–1% por 10 min ou clorexidina), remover à noite, avaliar reembasamento.","Nistatina suspensão 100.000 UI/mL — 5 mL bochecho 4x/dia por 14 dias (aplicar também na base da prótese).","NÃO usar miconazol gel nem fluconazol: paciente em varfarina (elevação grave do INR).","Avaliar controle glicêmico (fator predisponente)."],"take":"Miconazol oral + varfarina = contraindicação absoluta."},{"sp":"Adulto","spec":"Periodontia","title":"Gengivite ulcerativa necrosante (GUN)","ctx":"Universitário, 21 anos, período de provas, tabagista, dor gengival intensa de início súbito, papilas interdentais 'em saca-bocado' com pseudomembrana, sangramento e halitose fétida.","q":"Tratamento local e sistêmico?","pts":["Debridamento ultrassônico suave sob anestesia tópica/local nas primeiras sessões.","Clorexidina 0,12% 12/12h; peróxido de hidrogênio 1,5% pode ajudar na fase aguda.","Metronidazol 400 mg 8/8h por 5–7 dias se houver sinais sistêmicos (febre, linfadenopatia) — proibir álcool.","Analgesia, orientação de higiene, cessação do tabagismo, manejo do estresse e nutrição.","Recorrente ou grave: investigar imunossupressão (HIV, leucemias)."],"take":"Debridamento + metronidazol (se sistêmico) + clorexidina."},{"sp":"Adulto","spec":"Urgência médica","title":"Síncope durante anestesia","ctx":"Jovem, 19 anos, em jejum, muito ansioso. Durante o bloqueio do alveolar inferior, fica pálido, sudoreico, refere náusea e perde a consciência por 20 segundos. Pulso 48 bpm.","q":"Qual a conduta imediata?","pts":["Diagnóstico mais provável: síncope vasovagal.","Interromper; posição supina com pernas elevadas; afrouxar roupas; O2 por máscara; monitorar pulso e PA.","Recuperação esperada em 1–2 min; oferecer açúcar após recuperação (jejum).","Se a bradicardia persistir ou não recuperar a consciência: atropina 0,5 mg IM/IV e SAMU (192).","Prevenção: alimentar-se antes, anestesiar com o paciente reclinado, controle de ansiedade."],"take":"Posição supina + pernas elevadas resolve a maioria das síncopes."},{"sp":"Adulto","spec":"Urgência médica","title":"Anafilaxia após primeira dose de amoxicilina no consultório","ctx":"Mulher, 34 anos, tomou amoxicilina 2 g (profilaxia) e 15 min depois apresenta urticária generalizada, rouquidão, sibilos e PA 80/50.","q":"Qual o primeiro fármaco e a sequência de atendimento?","pts":["Anafilaxia (envolvimento cutâneo + respiratório + hipotensão).","ADRENALINA 0,5 mg IM na face anterolateral da coxa IMEDIATAMENTE; repetir a cada 5–15 min se necessário.","Chamar SAMU (192); posição supina com pernas elevadas (sentada se predominar dispneia); O2 alto fluxo.","Após adrenalina: anti-histamínico (difenidramina/prometazina), hidrocortisona 100 mg, salbutamol se broncoespasmo.","Não atrasar a adrenalina para dar anti-histamínico ou corticoide (erro frequente). Registrar alergia e encaminhar para observação hospitalar (reação bifásica)."],"take":"Anafilaxia = adrenalina IM primeiro."},{"sp":"Adulto","spec":"Urgência médica","title":"Hipoglicemia em diabético insulinodependente","ctx":"Homem, 50 anos, diabetes tipo 1, aplicou insulina e não tomou café por causa do procedimento. Após 40 min fica sudoreico, trêmulo, confuso e irritado.","q":"Conduta?","pts":["Suspeita de hipoglicemia — confirmar com glicemia capilar (< 70 mg/dL), mas não atrasar o tratamento.","Consciente e cooperativo: 15–20 g de açúcar VO (1 colher de sopa de açúcar em água ou 150 mL de suco); repetir em 15 min se necessário; depois lanche.","Inconsciente: NADA por via oral; glucagon 1 mg IM ou glicose 50% IV; lateralizar; SAMU.","Prevenção: consultas pela manhã após café, perguntar sobre alimentação e insulina, ter glicosímetro e glicose no consultório."],"take":"Diabético estranho no consultório = glicemia e açúcar."},{"sp":"Adulto","spec":"Urgência médica","title":"Dor torácica durante cirurgia periodontal","ctx":"Homem, 63 anos, hipertenso, diabético, tabagista, durante raspagem a campo aberto refere aperto no peito irradiado para mandíbula e braço esquerdo, sudorese. PA 160/95.","q":"O que fazer?","pts":["Suspeita de síndrome coronariana aguda — interromper o procedimento imediatamente.","Posição semissentada; O2 se SpO2 < 94%; acionar SAMU (192).","AAS 160–325 mg mastigado (sem alergia ou sangramento ativo).","Isossorbida 5 mg SL se PAS > 90 mmHg e sem uso de sildenafila/tadalafila — pode repetir a cada 5 min (até 3).","Monitorar sinais vitais e estar pronto para RCP/DEA."],"take":"Dor torácica: parar, SAMU, AAS mastigado, nitrato se PA permitir."},{"sp":"Adulto","spec":"Pacientes especiais","title":"Paciente em uso de bifosfonato que precisa de exodontia","ctx":"Mulher, 70 anos, osteoporose, alendronato 70 mg semanal há 6 anos. Necessita extrair o 45 com fratura radicular.","q":"Quais cuidados para prevenir MRONJ?","pts":["Risco de osteonecrose existe mas é baixo com bifosfonato oral para osteoporose (aumenta com > 4 anos de uso e corticoide).","Considerar alternativas (endodontia + sepultamento radicular) quando possível.","Se extrair: técnica atraumática, regularização de bordas ósseas, fechamento primário, clorexidina 0,12% antes e depois.","'Drug holiday' é controverso — decidir com o médico; pode ser considerado em uso > 4 anos.","Acompanhar a cicatrização por 8 semanas (osso exposto > 8 semanas = MRONJ)."],"take":"Bifosfonato oral: extrair com técnica atraumática e acompanhar."},{"sp":"Adulto","spec":"Pacientes especiais","title":"Profilaxia antibiótica em paciente com prótese valvar","ctx":"Mulher, 58 anos, prótese valvar mecânica (também em varfarina), alérgica à penicilina (urticária no passado). Fará raspagem subgengival.","q":"Ela precisa de profilaxia? Qual?","pts":["Sim: prótese valvar é condição de alto risco para endocardite (AHA 2021) e raspagem manipula gengiva.","Alérgica à penicilina: azitromicina 500 mg ou claritromicina 500 mg (CUIDADO: claritromicina com varfarina eleva INR) ou doxiciclina 100 mg, 30–60 min antes.","Cefalexina 2 g só se a alergia NÃO foi anafilaxia, angioedema ou urticária — nesse caso (urticária) está contraindicada.","Clindamicina não é mais recomendada (AHA 2021).","Varfarina: INR ≤ 3,5 e hemostasia local."],"take":"Alto risco + alergia à penicilina = azitromicina 500 mg dose única."},{"sp":"Adulto","spec":"Dor orofacial / DTM","title":"DTM muscular com dor matinal","ctx":"Mulher, 35 anos, dor em masseteres e temporais ao acordar, cansaço mastigatório, bruxismo do sono relatado pelo parceiro, alto nível de estresse.","q":"Qual o manejo inicial?","pts":["Diagnóstico (DC/TMD): mialgia/dor miofascial.","Educação e autocuidado: dieta macia temporária, calor úmido, evitar parafunções diurnas, higiene do sono, manejo do estresse.","Placa oclusal estabilizadora de uso noturno (rígida, superior ou inferior).","Farmacológico de curto prazo: AINE (ibuprofeno/naproxeno) por 5–7 dias; ciclobenzaprina 5–10 mg à noite por até 2–3 semanas.","Cronicidade: amitriptilina 10–25 mg à noite, fisioterapia; encaminhar se fatores psicossociais importantes."],"take":"DTM muscular: conservador primeiro."},{"sp":"Adulto","spec":"Dor orofacial","title":"Neuralgia do trigêmeo","ctx":"Mulher, 62 anos, crises de dor em choque elétrico na face direita (ramo mandibular), duração de segundos, desencadeadas por escovar os dentes e falar. Já extraiu 2 dentes sem melhora.","q":"Diagnóstico e tratamento?","pts":["Neuralgia trigeminal clássica: dor paroxística, em choque, com zonas-gatilho e períodos sem dor.","Exodontias são iatrogenia comum — o dente não é a causa.","Carbamazepina 100–200 mg 12/12h, titulando até controle (1ª linha); alternativa: oxcarbazepina.","Monitorar hemograma, sódio e enzimas hepáticas; atenção às interações (indutor enzimático).","Encaminhar ao neurologista (ressonância para descartar compressão vascular/tumor/esclerose múltipla)."],"take":"Dor em choque com gatilho = carbamazepina, não exodontia."},{"sp":"Adulto","spec":"Estomatologia","title":"Úlcera aftosa recorrente","ctx":"Mulher, 25 anos, episódios mensais de úlceras dolorosas, rasas, arredondadas, com halo eritematoso em mucosa jugal e lábios, cicatrizam em 7–10 dias.","q":"Tratamento e investigação?","pts":["Estomatite aftosa recorrente (forma menor).","Tópico: triancinolona 0,1% em orabase 3x/dia; alívio: benzidamina ou lidocaína viscosa.","Investigar deficiência de ferro, B12, folato e doença celíaca/inflamatória intestinal se recorrência frequente.","Evitar traumas e dentifrícios com lauril sulfato de sódio.","Formas maiores/graves: prednisona sistêmica curta e encaminhar ao estomatologista (descartar Behçet)."],"take":"Corticoide tópico + investigação de deficiências."},{"sp":"Adulto","spec":"Estomatologia","title":"Herpes labial recorrente antes de clareamento","ctx":"Mulher, 30 anos, tem herpes labial 4x/ano, desencadeado por estresse e sol. Quer fazer clareamento e procedimento estético labial.","q":"Como prevenir e tratar?","pts":["Tratamento no pródromo (formigamento): valaciclovir 2 g 12/12h por 1 dia ou aciclovir 400 mg 5x/dia por 5 dias; penciclovir creme como alternativa tópica.","Profilaxia antes de procedimentos: valaciclovir 500 mg 12/12h iniciando no dia anterior por 3–5 dias.","Fotoproteção labial.","Não atender eletivamente com vesículas ativas (contágio e piora)."],"take":"Antiviral no pródromo; profilaxia antes de procedimentos."},{"sp":"Idoso","spec":"Estomatologia / Oncologia","title":"Úlcera indolor em borda de língua que não cicatriza","ctx":"Homem, 66 anos, tabagista e etilista, úlcera endurecida de 1,5 cm em borda lateral de língua há 5 semanas, indolor, sem trauma aparente, linfonodo cervical endurecido.","q":"Qual a conduta?","pts":["Úlcera > 2–3 semanas sem causa aparente, endurecida, em área de risco = suspeita de carcinoma espinocelular.","Remover fatores traumáticos e reavaliar em no máximo 2 semanas; se persistir ou houver sinais de malignidade (como aqui), BIÓPSIA sem demora (ou encaminhar com urgência ao estomatologista/cabeça e pescoço).","Não prescrever corticoide tópico 'para ver se melhora' (atrasa o diagnóstico).","Orientar cessação de tabaco e álcool."],"take":"Úlcera que não cicatriza em 2–3 semanas = biópsia."},{"sp":"Adulto","spec":"Pacientes especiais","title":"Paciente em uso de antidepressivo com dor pós-operatória","ctx":"Mulher, 40 anos, usa sertralina 100 mg/dia, após exodontia de 3 molares refere dor intensa. Pergunta se pode tomar tramadol que tem em casa.","q":"Qual analgesia é segura?","pts":["Tramadol + ISRS: risco de síndrome serotoninérgica e convulsões — evitar.","Preferir ibuprofeno 400–600 mg + paracetamol 1 g alternados/associados (máx. 3 dias) ou dipirona.","ISRS + AINE aumenta discretamente o risco de sangramento GI — curto prazo é aceitável (considerar omeprazol se risco).","Se opioide for indispensável: codeína perde efeito com fluoxetina/paroxetina (CYP2D6); avaliar com o médico."],"take":"Antidepressivo serotoninérgico: evitar tramadol."},{"sp":"Adulto","spec":"Endodontia","title":"Acidente com hipoclorito de sódio","ctx":"Durante irrigação do 23 com hipoclorito 2,5%, paciente refere dor súbita e intensa; em minutos surge edema em lábio e região infraorbitária com equimose.","q":"Conduta imediata e acompanhamento?","pts":["Interromper e irrigar o canal com soro fisiológico abundante; permitir sangramento pelo canal.","Anestesia local para dor; analgesia (AINE + paracetamol, opioide se necessário).","Compressas frias nas primeiras 24 h, depois mornas; corticoide (dexametasona) para edema.","Antibiótico se houver risco de infecção secundária (necrose extensa); acompanhamento diário; edema de via aérea: hospital.","Prevenção: agulha com saída lateral 2–3 mm aquém do comprimento de trabalho, sem travar, irrigação lenta."],"take":"Irrigar com soro, controlar dor e edema, acompanhar."},{"sp":"Criança","spec":"Odontopediatria","title":"Avulsão de incisivo permanente","ctx":"Menino, 9 anos, caiu de bicicleta há 30 min; o 11 foi avulsionado e está sendo trazido em leite. Saudável, vacinação em dia.","q":"Qual a conduta (IADT)?","pts":["Reimplantar o mais rápido possível: dente armazenado em leite < 60 min — lavar com soro, irrigar o alvéolo, reimplantar com pressão suave.","Contenção flexível por 2 semanas; radiografia.","Antibiótico sistêmico: amoxicilina (dose pediátrica por peso) por 7 dias; doxiciclina não em < 12 anos (manchamento).","Profilaxia antitetânica se necessário (avaliar vacinação).","Rizogênese incompleta: chance de revascularização — acompanhar; completa: endodontia em 7–10 dias."],"take":"Avulsão: reimplante imediato e meio de armazenamento é decisivo."},{"sp":"Adulto","spec":"Implantodontia","title":"Protocolo medicamentoso para implante unitário","ctx":"Homem, 48 anos, saudável, implante no 36 com osso adequado, sem enxerto.","q":"Antibiótico profilático é necessário?","pts":["Evidência (revisões Cochrane) mostra redução de falhas precoces com amoxicilina 2 g dose única pré-operatória (NNT alto, ~25).","Antibiótico pós-operatório prolongado não traz benefício adicional em casos simples.","Dexametasona 4–8 mg pré-operatória opcional; ibuprofeno pós-operatório por 2–3 dias.","Clorexidina 0,12% pré-operatória e 7–14 dias após.","Fumantes e diabéticos descompensados: maior risco de falha."],"take":"Amoxicilina 2 g dose única pré-operatória; nada de 7 dias de antibiótico de rotina."},{"sp":"Adulto","spec":"Periodontia","title":"Periodontite estágio III grau C em jovem","ctx":"Mulher, 26 anos, perda de inserção rápida em molares e incisivos, bolsas de 6–8 mm, saudável, não fumante.","q":"Antibiótico sistêmico tem papel?","pts":["Raspagem e alisamento radicular (de preferência full-mouth em 24 h) é o tratamento principal.","Adjuvante sistêmico em grau C/jovens: amoxicilina 500 mg + metronidazol 400 mg 8/8h por 7 dias, iniciado junto com a raspagem.","Proibir álcool (metronidazol).","Reavaliação em 6–8 semanas; terapia de suporte a cada 3 meses."],"take":"Amoxicilina + metronidazol como adjuvante na periodontite grau C."},{"sp":"Idoso","spec":"Pacientes especiais","title":"Idosa com polifarmácia e xerostomia","ctx":"Mulher, 78 anos, usa hidroclorotiazida, amitriptilina, omeprazol e alprazolam; queixa de boca seca, cáries radiculares múltiplas e prótese que machuca.","q":"Como manejar?","pts":["Xerostomia medicamentosa (diurético, tricíclico, benzodiazepínico) — discutir com o médico possibilidade de troca/redução.","Saliva artificial, hidratação, goma/xilitol; pilocarpina apenas se glândulas funcionais e sem contraindicações.","Prevenção de cárie: dentifrício 5.000 ppm F, verniz fluoretado trimestral, diamino fluoreto de prata em lesões radiculares.","Ajuste da prótese; atenção à candidíase.","Prescrever com cautela: evitar novos fármacos anticolinérgicos e sedativos (critérios de Beers)."],"take":"Boca seca no idoso é quase sempre medicamentosa — prevenção com flúor."},{"sp":"Adulto","spec":"Urgência médica","title":"Convulsão em paciente epiléptico na cadeira","ctx":"Homem, 30 anos, epilepsia, esqueceu a medicação hoje. Durante a restauração, perde a consciência e inicia movimentos tônico-clônicos.","q":"O que fazer?","pts":["Remover instrumentos, afastar equipamentos, reclinar a cadeira; proteger a cabeça; NÃO colocar nada na boca.","Cronometrar; após a crise: lateralizar, aspirar secreções, O2, glicemia capilar.","Crise > 5 min ou repetidas: midazolam 10 mg IM/IN e SAMU.","Pós-ictal: confusão é esperada — não liberar sozinho."],"take":"Proteger, cronometrar; midazolam se > 5 min."},{"sp":"Criança","spec":"Odontopediatria","title":"Ingestão de dentifrício fluoretado por criança","ctx":"Criança, 3 anos, 15 kg, comeu quase um tubo inteiro de dentifrício (90 g, 1.450 ppm F) há 20 min. Está assintomática.","q":"Há risco de toxicidade?","pts":["Fluoreto ingerido ≈ 90 g × 1,45 mg/g ≈ 130 mg F → 8,7 mg F/kg — ACIMA da dose provavelmente tóxica (5 mg F/kg).","Dar leite ou cálcio oral (liga o flúor) e encaminhar ao pronto-socorro para observação (náusea, vômito, dor abdominal, hipocalcemia).","Não induzir vômito.","Orientação: crianças < 3 anos devem usar quantidade de 'grão de arroz' e < 6 anos 'grão de ervilha', com supervisão; guardar fora do alcance."],"take":"> 5 mg F/kg = cálcio oral e pronto-socorro."},{"sp":"Adulto","spec":"Estomatologia","title":"Líquen plano oral erosivo","ctx":"Mulher, 52 anos, estrias brancas reticulares bilaterais em mucosa jugal com áreas erosivas dolorosas, ardência com alimentos condimentados. Biópsia confirmou líquen plano.","q":"Tratamento?","pts":["Corticoide tópico de alta potência: clobetasol 0,05% em orabase 2–3x/dia (ou triancinolona) nas fases sintomáticas.","Associar antifúngico (nistatina/miconazol se sem varfarina) para prevenir candidíase.","Casos refratários: corticoide sistêmico curto ou tacrolimo tópico (com estomatologista).","Acompanhamento periódico (desordem potencialmente maligna)."],"take":"Clobetasol tópico + acompanhamento."},{"sp":"Adulto","spec":"Pacientes especiais","title":"Paciente renal crônico em hemodiálise","ctx":"Homem, 60 anos, doença renal crônica dialítica (3x/semana), heparina na diálise, necessita exodontia e tratamento de abscesso.","q":"Ajustes de medicamentos e agendamento?","pts":["Agendar no dia seguinte à diálise (heparina já metabolizada, paciente com menos uremia).","Evitar AINEs; analgésico: paracetamol (dipirona com cautela).","Antibióticos: amoxicilina com intervalo ajustado (500 mg 12/12h a 24/24h conforme ClCr — dose após a diálise); evitar tetraciclinas (exceto doxiciclina) e aminoglicosídeos.","Hemostasia local reforçada; aferir PA no braço sem fístula arteriovenosa.","Avaliar necessidade de profilaxia conforme o nefrologista."],"take":"DRC: atender no dia pós-diálise, sem AINE, ajustar antibiótico."},{"sp":"Adulto","spec":"Urgência médica","title":"Toxicidade por anestésico local em idosa de baixo peso","ctx":"Mulher, 80 anos, 45 kg, recebeu 6 tubetes de articaína 4% para múltiplas extrações. Após 10 min refere gosto metálico, zumbido, fica agitada e tem tremores.","q":"O que aconteceu e como agir?","pts":["Dose máxima de articaína: 7 mg/kg × 45 = 315 mg ÷ 72 = 4,4 tubetes — 6 tubetes (432 mg) excederam o limite.","Quadro inicial de toxicidade sistêmica (LAST): parar, O2, posição supina, monitorar.","Convulsão: midazolam; suporte ventilatório; SAMU. Hospital: emulsão lipídica 20%.","Prevenção: calcular a dose por peso, aspirar, injetar lentamente, fracionar procedimentos em idosos de baixo peso."],"take":"Sempre calcule a dose máxima — idosos de baixo peso intoxicam."},{"sp":"Gestante","spec":"Urgência","title":"Gestante de 36 semanas que desmaia na cadeira","ctx":"Gestante de 36 semanas, deitada em posição supina há 15 min para tratamento endodôntico, refere tontura, náusea e fica pálida e hipotensa.","q":"Qual a causa e conduta?","pts":["Síndrome da hipotensão supina: o útero comprime a veia cava inferior, reduzindo o retorno venoso.","Virar a paciente para decúbito lateral esquerdo (ou deslocar o útero / coxim sob o quadril direito).","O2 e monitorar; geralmente recupera em minutos.","Prevenção: atender gestantes do 3º trimestre semissentadas e com coxim sob o quadril direito; consultas curtas."],"take":"Gestante no 3º trimestre: nunca totalmente deitada."},{"sp":"Adulto","spec":"Cirurgia / Pacientes especiais","title":"Exodontia em paciente com dupla antiagregação após stent","ctx":"Homem, 59 anos, angioplastia com stent farmacológico há 4 meses, em AAS 100 mg + clopidogrel 75 mg. Precisa extrair 2 molares com doença periodontal avançada.","q":"Suspender os antiagregantes?","pts":["NÃO suspender: suspensão nos primeiros 6–12 meses de stent tem alto risco de trombose (potencialmente fatal).","Discutir o caso com o cardiologista, mas o procedimento pode ser feito com antiagregação mantida.","Hemostasia local: sutura, esponja hemostática, ácido tranexâmico tópico, compressão.","Evitar AINEs; analgesia com paracetamol/dipirona.","Extrações em sessões separadas para limitar a área cirúrgica."],"take":"Stent recente: manter antiagregação e caprichar na hemostasia local."},{"sp":"Adulto","spec":"Endodontia","title":"Paciente alérgico a penicilina com abscesso e uso de sinvastatina","ctx":"Homem, 55 anos, abscesso com celulite no 35, alérgico à penicilina (anafilaxia), usa sinvastatina 40 mg e midazolam para dormir eventualmente.","q":"Qual antibiótico escolher?","pts":["Evitar betalactâmicos (anafilaxia) — inclusive cefalosporinas.","Claritromicina é inibidor potente do CYP3A4: com sinvastatina → rabdomiólise; com midazolam → sedação profunda. EVITAR.","Opções: clindamicina 300 mg 8/8h (atenção a C. difficile) ou azitromicina 500 mg/dia (menos interações).","Sempre drenagem e remoção da causa."],"take":"Alérgico à penicilina: escolha o antibiótico olhando as interações."},{"sp":"Adulto","spec":"Prótese / Estomatologia","title":"Queilite angular em usuário de prótese","ctx":"Homem, 68 anos, prótese total antiga com dimensão vertical reduzida, fissuras eritematosas nas comissuras labiais bilaterais.","q":"Tratamento?","pts":["Etiologia multifatorial: Candida + Staphylococcus aureus + umidade por perda de dimensão vertical; avaliar deficiências (B12, ferro).","Miconazol creme/gel (ativo contra Candida e Gram+) nas comissuras 2–3x/dia por 14 dias (sem uso de varfarina) ou clotrimazol creme.","Corrigir a dimensão vertical (nova prótese) e higiene da prótese.","Recorrência: investigar diabetes e deficiências nutricionais."],"take":"Queilite angular: antifúngico tópico + corrigir a causa protética."},{"sp":"Criança","spec":"Odontopediatria","title":"Sedação mínima em criança não cooperativa","ctx":"Criança, 5 anos, 18 kg, saudável (ASA I), ansiosa, precisa de 4 restaurações. Técnicas de manejo comportamental falharam.","q":"Como fazer sedação oral com segurança?","pts":["Opções: óxido nitroso/oxigênio (30–50%, com habilitação) ou midazolam oral 0,25–0,5 mg/kg (máx. 15 mg) 30–45 min antes.","Midazolam para 18 kg: 4,5–9 mg (solução oral); jejum adequado; receita B.","Monitoração com oxímetro, profissional habilitado, flumazenil e equipamento de ventilação disponíveis.","Liberação apenas quando acordada e com responsável; anotar em prontuário e TCLE."],"take":"Sedação pediátrica: dose por peso, monitoração e antídoto à mão."}],"reg":[]};

const IG=DATA.ig,INTER=DATA.inter;
const GLBL={VASO_EPI:"Anestésicos com epinefrina",AINE:"AINEs",CORT:"Corticoides",ANTICOAG:"Anticoagulantes/antiagregantes",BZD:"Benzodiazepínicos",OPIOIDE:"Opioides",SEROT:"Serotoninérgicos",TRICICL:"Tricíclicos",CYP3A_INIB:"Inibidores do CYP3A4",AZOL_SIST:"Azóis",MACRO:"Macrolídeos",QT:"Prolongadores de QT",METHB:"Indutores de meta-hemoglobina",SEDATIVO:"Sedativos",IMUNOSSUP:"Imunossupressores",DIABET:"Antidiabéticos"};
const EVL={B:"Bula/diretriz",V:"Estudos clínicos",H:"Farmacologia/relatos"};
function inSide(side,name){return side===name||(IG[side]&&IG[side].includes(name))}
function sideLbl(side){return IG[side]?(GLBL[side]||side):side}
function interPairs(names){const out=[],seen=new Set();
  for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){const x=names[i],y=names[j];if(x===y)continue;
    INTER.forEach((r,k)=>{const hit=(inSide(r.a,x)&&inSide(r.b,y))||(inSide(r.a,y)&&inSide(r.b,x));const key=k+"|"+[x,y].sort().join("|");if(hit&&!seen.has(key)){seen.add(key);out.push({r,x,y})}})}
  const o={Grave:0,Moderada:1,Leve:2};return out.sort((p,q)=>o[p.r.sev]-o[q.r.sev])}
function interFor(name){return INTER.filter(r=>inSide(r.a,name)||inSide(r.b,name)).map(r=>({r,other:inSide(r.a,name)?r.b:r.a}))}
function sevTag(s){return '<span class="tag '+(s==="Grave"?"t-bad":s==="Moderada"?"t-warn":"t-info")+'">'+s+'</span>'}
function interCard(p){const r=p.r;return '<div class="card" style="border-left:4px solid '+(r.sev==="Grave"?"var(--bad)":r.sev==="Moderada"?"var(--warn)":"var(--info)")+'"><div class="row wrapf" style="gap:6px">'+sevTag(r.sev)+'<span class="tag t-cls">'+EVL[r.ev]+'</span></div><h3 style="margin-top:8px">'+esc(p.x?p.x+" + "+p.y:sideLbl(p.other))+'</h3>'+(p.other&&IG[p.other]?'<div class="xs muted" style="margin-top:2px">'+esc(IG[p.other].join(", "))+'</div>':"")+'<div class="kv" style="margin-top:10px">'+kv("Efeito",r.eff)+kv("Mecanismo",r.mech)+kv("Conduta",r.cond)+'</div></div>'}

async function verifyAuth(){const a=store.get("auth",null);if(!a)return;
 try{const r=await fetch("https://securetoken.googleapis.com/v1/token?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(a.rt)});const j=await r.json();
  if(r.ok){a.rt=j.refresh_token||a.rt;if(!a.sid){store.set("auth",null);showLogin("Atualização de segurança: entre novamente (agora só é permitido um aparelho por vez).",true);return}try{const ss=await getSession(j.id_token);if(!ss)await setSession(j.id_token,a.sid);else if(ss.sid!==a.sid){kicked(ss.dev);return}}catch(e){if(/USER_DISABLED|USER_NOT_FOUND|INVALID_ID_TOKEN|TOKEN_EXPIRED/.test(e.message)){store.set("auth",null);showLogin(authMsg(e.message),true);return}}a.ok=Date.now();store.set("auth",a)}else{store.set("auth",null);showLogin(authMsg(j.error&&j.error.message),true)}}
 catch(e){if(Date.now()-a.ok>GRACE_DAYS*864e5)showLogin("Conecte-se à internet para validar seu acesso (verificação a cada "+GRACE_DAYS+" dias).",true)}}
function logout(){store.set("auth",null);location.hash="#/";showLogin("Você saiu da conta.")}
function authGate(){if(!AUTH_ON)return;const a=store.get("auth",null);
 if(!a)showLogin();else if(Date.now()-a.ok>GRACE_DAYS*864e5){showLogin("Validando acesso...");verifyAuth().then(()=>{const b=store.get("auth",null);if(b&&Date.now()-b.ok<6e4)document.getElementById("login").classList.remove("show")})}else verifyAuth();
 document.addEventListener("visibilitychange",()=>{if(!document.hidden&&store.get("auth",null))verifyAuth()});setInterval(()=>{if(!document.hidden&&store.get("auth",null))verifyAuth()},60*1000)}

/* ================= Init ================= */
const LOGO = document.querySelector(".brand img").getAttribute("src");
applyTheme();
authGate();
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
route();
</script>
