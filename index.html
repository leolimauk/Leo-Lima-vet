 tumores mamários e diabetes."],"take":"Piometra fechada = estabilizar e operar."},{"sp":"Gato (Felino)","spec":"Hematologia / Infecciosas","title":"Micoplasmose hemotrópica felina (Mycoplasma haemofelis)","ctx":"Gato macho não castrado, 3 anos, 5 kg, acesso à rua, FeLV positivo. Letargia, mucosas pálidas, febre 39,8 °C. Ht 12%, anemia regenerativa, autoaglutinação negativa, estruturas epicelulares em esfregaço e PCR positivo para M. haemofelis.","q":"Tratamento e prognóstico?","pts":["DOXICICLINA 10 mg/kg VO q24h (ou 5 mg/kg q12h) por 2–4 semanas — sempre seguida de 5–6 mL de água (risco de estenose esofágica). Alternativa: pradofloxacino 5–10 mg/kg q24h ou marbofloxacino 2 mg/kg q24h.","Prednisolona 1–2 mg/kg q12h nos casos com hemólise imunomediada importante (reduzir gradualmente).","Transfusão (tipagem sanguínea obrigatória em gatos — A/B/AB) se Ht < 12–15% com sinais clínicos.","Gatos FeLV+ têm pior prognóstico e podem permanecer portadores. Controle de pulgas e de brigas (transmissão)."],"take":"Doxiciclina com água + tipagem antes de transfundir."},{"sp":"Gato (Felino)","spec":"Gastroenterologia / Nutrição","title":"Lipidose hepática felina após anorexia prolongada","ctx":"Gata castrada, 7 anos, obesa (7,5 kg, ECC 8/9), anorexia há 10 dias após mudança de casa. Icterícia, vômito, ptialismo. ALT 380 U/L, FA 650 U/L (GGT normal), bilirrubina 6 mg/dL, K 2,9 mEq/L. Fígado hiperecogênico e aumentado.","q":"Qual a peça-chave do tratamento?","pts":["NUTRIÇÃO ENTERAL é o tratamento: sonda esofágica (após estabilização) ou nasoesofágica. Iniciar com 25–33% do RER no dia 1, chegando a 100% em 3–4 dias (prevenir síndrome de realimentação — monitorar fósforo e potássio).","RER = 70 x (peso atual)^0,75 kcal/dia; usar dieta hiperproteica (exceto se encefalopatia hepática).","Corrigir hipocalemia (KCl), hipofosfatemia, suplementar tiamina (B1) e cobalamina (B12).","Antieméticos (maropitant, ondansetrona) e mirtazapina; evitar diazepam VO (hepatotóxico em gatos). Avaliar coagulação antes da sonda (vitamina K1 se necessário).","Recuperação em 3–6 semanas; prognóstico bom (> 80%) quando a alimentação é instituída precocemente."],"take":"Gato obeso sem comer > 3 dias = risco de lipidose. Sonda e alimentar."},{"sp":"Gato (Felino)","spec":"Pneumologia / Emergência","title":"Crise asmática felina (asma / bronquite alérgica)","ctx":"Gata siamesa, 4 anos, 3,8 kg, chega com respiração de boca aberta, esforço expiratório, sibilos à auscultação e tosse crônica há meses. Radiografia (após estabilização): padrão bronquial com hiperinsuflação.","q":"Como estabilizar e manter?","pts":["Oxigenioterapia em caixa/fluxo livre e manipulação mínima (estresse pode ser fatal).","Broncodilatador: TERBUTALINA 0,01 mg/kg SC/IM (efeito em 15–30 min) ou salbutamol inalatório com espaçador felino (AeroKat).","Corticoide: DEXAMETASONA 0,2–1 mg/kg IV/IM na crise.","Manutenção: prednisolona 1–2 mg/kg/dia VO com redução gradual + FLUTICASONA inalatória 110–250 mcg q12h com espaçador (efeito pleno em 1–2 semanas).","Afastar alérgenos: areia com poeira/perfume, fumaça de cigarro, aerossóis. Descartar dirofilariose/aelurostrongilose (fembendazol)."],"take":"O2 + terbutalina + dexametasona na crise; fluticasona inalatória na manutenção."},{"sp":"Cão (Canino)","spec":"Toxicologia (Emergência)","title":"Acidente botrópico em cão de sítio","ctx":"Labrador, 4 anos, 32 kg, mordido no focinho por jararaca há 2 horas. Edema facial progressivo, equimoses, sangramento gengival, dor intensa. Tempo de coagulação (tubo seco) > 20 minutos.","q":"Qual a conduta e o que não fazer?","pts":["Diagnóstico clínico + tempo de coagulação alterado = acidente botrópico moderado a grave.","SORO ANTIBOTRÓPICO (ou antibotrópico-crotálico) IV diluído, o mais rápido possível; a dose NÃO é calculada pelo peso (neutraliza a quantidade de veneno inoculada): acidentes moderados 4–8 ampolas; graves ~12 (referência humana). Pré-medicar com anti-histamínico e ter adrenalina disponível.","Fluidoterapia (prevenção de lesão renal), analgesia com opioide (metadona/morfina) e dipirona. EVITAR AINE (coagulopatia e risco renal).","Antibiótico se necrose/abscesso (amoxicilina-clavulanato ± metronidazol). Avaliar via aérea pelo edema facial.","NÃO fazer torniquete, incisão, sucção ou aplicar substâncias no local. Repetir coagulograma 12–24 h após o soro."],"take":"Soro antibotrópico precoce; dose independe do peso; nunca torniquete."},{"sp":"Cão (Canino)","spec":"Toxicologia (Emergência)","title":"Intoxicação por carbamato (chumbinho)","ctx":"Cão SRD, 2 anos, 18 kg, encontrado após ingerir carne com grânulos escuros jogada no quintal. Sialorreia profusa, miose, diarreia, tremores, broncorreia, bradicardia (FC 50) e dispneia.","q":"Como tratar e qual o parâmetro de atropinização?","pts":["Síndrome colinérgica muscarínica + nicotínica = inibidor de colinesterase (aldicarbe — 'chumbinho').","ATROPINA 0,2–0,5 mg/kg: ¼ IV e o restante IM/SC; repetir até CESSAR A BRONCORREIA E SIALORREIA (a FC não é o parâmetro — taquicardia ocorre antes).","Oxigênio, aspiração de vias aéreas, intubação/ventilação se fraqueza respiratória; diazepam/midazolam para convulsões.","Descontaminação após estabilização: lavagem gástrica sob intubação/carvão ativado; banho se exposição cutânea (com luvas).","Pralidoxima (2-PAM) tem pouco benefício em carbamatos; indicada para organofosforados. Envenenamento intencional é crime (Lei 9.605/98, art. 32)."],"take":"Atropinizar até secar as vias aéreas."},{"sp":"Cão (Canino)","spec":"Endocrinologia / Emergência","title":"Crise addisoniana (hipoadrenocorticismo primário)","ctx":"Cadela Poodle Standard, 4 anos, 20 kg, histórico de vômitos e diarreia intermitentes ('wax and wane'). Chega em choque, bradicardia (FC 55), Na 124 e K 8,1 mEq/L (Na:K 15), azotemia, hipoglicemia leve e ausência de leucograma de estresse (linfocitose).","q":"Quais as prioridades?","pts":["Tratar a HIPERCALEMIA cardiotóxica: gluconato de cálcio 10% 0,5–1,5 mL/kg IV em 10 min (cardioproteção), insulina regular 0,25–0,5 UI/kg IV + glicose (2 g por UI), ou bicarbonato.","Fluidoterapia com NaCl 0,9% (choque) — corrigir sódio no máximo 10–12 mEq/L/24 h (mielinólise pontina).","Coletar cortisol basal/teste de estimulação com ACTH ANTES do glicocorticoide; usar DEXAMETASONA 0,1–0,2 mg/kg IV (não interfere no ensaio) ou hidrocortisona 0,5 mg/kg/h após o teste.","Cortisol pós-ACTH < 2 µg/dL confirma. Manutenção: DOCP 1,5–2,2 mg/kg a cada 25 dias ou FLUDROCORTISONA 0,01–0,02 mg/kg/dia + prednisolona 0,1–0,2 mg/kg/dia."],"take":"Cálcio protege o coração, fluido e corticoide salvam a vida."},{"sp":"Gato (Felino)","spec":"Endocrinologia","title":"Hipertireoidismo felino com DRC mascarada","ctx":"Gata SRD, 13 anos, 3,1 kg, perda de peso com polifagia, hiperatividade, vômitos, taquicardia (FC 240) e nódulo tireoidiano palpável. T4 total 9,8 µg/dL, creatinina 1,3 mg/dL, USG 1,025, PAS 170 mmHg.","q":"Como tratar com segurança renal?","pts":["METIMAZOL 1,25–2,5 mg/gato VO ou transdérmico q12h. Reavaliar T4, hemograma e creatinina após 2–3 semanas.","O hipertireoidismo aumenta a TFG e MASCARA a DRC: após eutireoidismo, a creatinina pode subir — por isso o tratamento clínico reversível antes de definitivos (iodo radioativo I-131/tireoidectomia).","Atenolol 6,25 mg/gato q12–24h se taquicardia persistente; anlodipino 0,625 mg/gato se PAS > 160 persistente.","Efeitos adversos do metimazol: vômito, prurido facial, hepatopatia, discrasias (hemograma nos 3 primeiros meses).","Alvo: T4 na metade inferior da referência. Dieta com restrição de iodo é alternativa."],"take":"Iniciar com tratamento reversível e reavaliar a função renal no eutireoidismo."},{"sp":"Gato (Felino)","spec":"Endocrinologia","title":"Diabetes mellitus felino com chance de remissão","ctx":"Gato macho castrado, 10 anos, 6,5 kg (obeso), PU/PD, polifagia e postura plantígrada. Glicemia 420 mg/dL, frutosamina 580 µmol/L, glicosúria sem cetonúria. Histórico de acetato de metilprednisolona para dermatite.","q":"Qual o protocolo com maior chance de remissão?","pts":["INSULINA GLARGINA 0,5 UI/kg (peso ideal) q12h se glicemia > 360 mg/dL (caso típico: 1–2 UI/gato) + DIETA hiperproteica e pobre em carboidratos (< 12% EM).","Remover fatores de resistência insulínica: suspender corticoides/progestágenos, tratar obesidade, infecções e doença dentária.","Monitoramento domiciliar (glicosímetro veterinário ou sensor contínuo tipo FreeStyle Libre); ajustes a cada 5–7 dias.","Remissão em até 80–90% dos gatos com controle glicêmico estrito nos primeiros 6 meses.","Inibidores de SGLT2 (bexagliflozina/velagliflozina) são opção em gatos selecionados, recém-diagnosticados e não cetóticos (risco de cetoacidose euglicêmica) — verificar disponibilidade no Brasil."],"take":"Glargina + dieta low-carb precoces = remissão."},{"sp":"Cão (Canino)","spec":"Endocrinologia","title":"Hiperadrenocorticismo hipófise-dependente","ctx":"Dachshund fêmea castrada, 10 anos, 9 kg, PU/PD, polifagia, abdome pendular, alopecia simétrica, pele fina e ofegação. FA 980 U/L, colesterol 380 mg/dL, USG 1,008. Teste de supressão com dexametasona dose baixa: cortisol 8 h = 3,2 µg/dL com escape. Adrenais simétricas aumentadas.","q":"Como tratar e monitorar?","pts":["TRILOSTANO 0,5–1 mg/kg VO q12h com alimento (protocolos atuais de dose baixa reduzem risco de hipocortisolismo).","Reavaliar em 10–14 dias, 4 semanas e a cada 3 meses: sinais clínicos + cortisol pré-trilostano ou teste de estimulação com ACTH 4–6 h pós-dose.","Orientar o tutor: suspender e procurar atendimento se apatia, vômito, diarreia ou anorexia (hipoadrenocorticismo iatrogênico).","Monitorar PA e proteinúria (hipertensão é comum) e risco de tromboembolismo e pancreatite."],"take":"Trilostano em dose baixa com alimento e monitoração regular."},{"sp":"Cão (Canino)","spec":"Cirurgia / Emergência","title":"Dilatação-vólvulo gástrico (DVG) em cão de raça gigante","ctx":"Dogue Alemão, 5 anos, 58 kg, comeu uma grande refeição e brincou. Ânsia improdutiva, sialorreia, distensão abdominal timpânica, taquicardia (FC 160), pulso fraco. Radiografia lateral direita: sinal de 'braço de Popeye' (compartimentalização).","q":"Sequência de atendimento?","pts":["Dois cateteres calibrosos em veias cefálicas (não usar membros pélvicos): cristaloide em bolus 10–20 mL/kg repetido ou salina hipertônica 7,5% 4 mL/kg.","Descompressão gástrica: trocarterização (cateter 14–16G no ponto de maior timpanismo do flanco direito) e/ou sondagem orogástrica.","Analgesia (metadona/fentanil), lidocaína 2 mg/kg IV + IC 50 mcg/kg/min (reduz lesão de reperfusão e arritmias ventriculares).","Cirurgia de emergência após estabilização: reposicionamento, avaliação do estômago/baço e GASTROPEXIA INCISIONAL direita (recidiva > 70% sem gastropexia).","Lactato > 6 mmol/L que não cai > 50% com fluidos indica pior prognóstico. Monitorar ECG por 72 h."],"take":"Fluido, descompressão, lidocaína e gastropexia."},{"sp":"Cão (Canino)","spec":"Emergência","title":"Insolação (hipertermia por calor) em cão braquicefálico","ctx":"Bulldog Francês, 3 anos, 12 kg, passeio ao meio-dia no verão. Colapso, temperatura retal 42,3 °C, mucosas vermelho-tijolo, estridor, diarreia hemorrágica.","q":"Como resfriar e quais complicações esperar?","pts":["Resfriamento ATIVO imediato com água em temperatura ambiente/fria (não gelada — causa vasoconstrição) + ventilação; PARAR em 39,5 °C para evitar hipotermia rebote.","Oxigênio e controle da via aérea (sedação leve com acepromazina/butorfanol, intubação se obstrução laríngea).","Fluidoterapia IV, glicose se hipoglicemia, monitorar coagulação (CID), função renal, hepática e enzimas musculares por 24–72 h.","Gastroprotetores e antibiótico se translocação bacteriana (diarreia hemorrágica).","Prevenção: evitar exercício em horas quentes; cirurgia da síndrome braquicefálica."],"take":"Resfriar rápido até 39,5 °C e antecipar CID e lesão renal."},{"sp":"Cão (Canino)","spec":"Dermatologia","title":"Dermatite atópica canina com piodermite secundária","ctx":"West Highland White Terrier, 3 anos, 8 kg, prurido não sazonal intenso em face, patas, axilas e região inguinal desde 1 ano de idade. Eritema, liquenificação, otite ceruminosa e pústulas/colaretes no abdome. Citologia: cocos e leveduras.","q":"Plano terapêutico multimodal?","pts":["Tratar infecções secundárias primeiro: banhos com CLOREXIDINA 2–4% (10 min de contato, 2–3x/semana); cefalexina 22–30 mg/kg q12h por 3 semanas se pioderma extensa.","Controle de pulgas rigoroso (isoxazolina) e dieta de eliminação (proteína hidrolisada ou nova por 8 semanas) para excluir alergia alimentar.","Controle do prurido: OCLACITINIBE 0,4–0,6 mg/kg q12h por 14 dias, depois q24h; ou LOKIVETMAB 1–2 mg/kg SC mensal; ou ciclosporina 5 mg/kg q24h; prednisolona em curto prazo.","Longo prazo: imunoterapia alérgeno-específica (após teste intradérmico/sorológico), reparo da barreira cutânea (ácidos graxos, ceramidas).","Otite: limpeza + otológico combinado conforme citologia."],"take":"Atopia é crônica: tratar infecções, controlar prurido e investigar alergia alimentar/pulgas."},{"sp":"Cão (Canino)","spec":"Dermatologia","title":"Demodicose generalizada juvenil","ctx":"Pit Bull, 9 meses, 18 kg, alopecia multifocal, comedões, eritema, furunculose podal e linfadenomegalia. Raspados cutâneos profundos com inúmeros Demodex canis adultos, ninfas e ovos.","q":"Qual o tratamento de escolha atualmente?","pts":["ISOXAZOLINAS são a 1ª escolha: fluralaner 25–56 mg/kg VO dose única (repetir em 12 semanas se necessário), afoxolaner, sarolaner ou lotilaner mensais.","Tratar pioderma secundária: cefalexina/antibiótico por cultura (furunculose) + banhos com clorexidina/peróxido de benzoíla.","Raspados mensais; manter tratamento até 2 raspados negativos consecutivos com 1 mês de intervalo.","Evitar corticoides. Alternativas antigas: amitraz banhos 0,025–0,05% ou ivermectina diária (somente após teste MDR1 — risco de neurotoxicidade).","Castração recomendada (componente hereditário; estro e gestação causam recidiva)."],"take":"Isoxazolina + tratamento da pioderma; raspados até cura parasitológica."},{"sp":"Gato (Felino)","spec":"Dermatologia / Zoonoses","title":"Dermatofitose felina (Microsporum canis) em gatil","ctx":"Gatil com 6 gatos Persas; filhote de 4 meses com lesões circulares alopécicas e descamativas na cabeça e orelhas; tutora com lesões anelares no antebraço. Lâmpada de Wood: fluorescência verde-maçã nos pelos; cultura positiva para M. canis.","q":"Como tratar animais e ambiente?","pts":["Terapia sistêmica: ITRACONAZOL 5 mg/kg VO q24h em pulsos (semana sim, semana não) ou TERBINAFINA 30–40 mg/kg q24h.","Terapia tópica obrigatória para todos os gatos do ambiente: banhos/imersão com cal sulfurada 2% (lime sulfur) ou xampu de miconazol + clorexidina 2x/semana.","Descontaminação ambiental: aspiração, lavagem e hipoclorito 1:10–1:100 em superfícies; isolar animais infectados.","Cura = 2 culturas fúngicas negativas consecutivas (a cada 2–4 semanas).","ZOONOSE: orientar a tutora a procurar dermatologista."],"take":"Sistêmico + tópico + ambiente; cura micológica, não clínica."},{"sp":"Cão (Canino)","spec":"Neurologia","title":"Doença do disco intervertebral toracolombar (Hansen tipo I)","ctx":"Dachshund, 5 anos, 7 kg, paraparesia aguda após pular do sofá. Dor à palpação em T13-L1, reflexos patelares normais/aumentados, propriocepção ausente nos pélvicos, dor profunda presente.","q":"Grau neurológico e conduta?","pts":["Grau 3–4 (paraparesia não ambulatória/paraplegia com dor profunda presente). Lesão de neurônio motor superior (T3-L3).","Encaminhar para TC/RM e DESCOMPRESSÃO CIRÚRGICA (hemilaminectomia): recuperação de ~90% com dor profunda presente.","Analgesia multimodal: opioide (metadona), gabapentina 10 mg/kg q8h, AINE (meloxicam) — NÃO associar corticoide (sem benefício e aumenta complicações).","Tratamento conservador (casos graus 1–2 ou sem cirurgia): repouso estrito em gaiola por 4–6 semanas.","Esvaziamento vesical manual/sondagem e fisioterapia. Ausência de dor profunda > 48 h reduz prognóstico (~50%); risco de mielomalácia progressiva."],"take":"Avaliar dor profunda; corticoide não é indicado; descompressão precoce."},{"sp":"Gato (Felino)","spec":"Doenças Infecciosas","title":"Peritonite infecciosa felina (PIF) forma efusiva","ctx":"Gato Ragdoll, 11 meses, 3,5 kg, oriundo de gatil, febre recorrente não responsiva a antibióticos, distensão abdominal, perda de peso. Efusão abdominal amarela, viscosa, proteína 6,2 g/dL, relação albumina:globulina 0,3, teste de Rivalta positivo, RT-PCR do líquido positivo para coronavírus felino.","q":"Qual a abordagem terapêutica atual?","pts":["Antivirais análogos de nucleosídeo transformaram o prognóstico: GS-441524 VO (10–15 mg/kg/dia; formas neurológicas/oculares até 15–20) ou remdesivir injetável por 84 dias (protocolos de 42 dias em estudo) — sobrevida > 80%.","Status regulatório: não são registrados no MAPA para uso veterinário; o uso exige avaliação legal/ética e termo de consentimento do tutor.","Suporte: drenagem da efusão se dispneia, nutrição, antieméticos.","Monitorar resposta pela relação A:G, globulinas, Ht, bilirrubina e desaparecimento da efusão.","Manejo de gatil: reduzir densidade e caixas de areia compartilhadas (transmissão fecal-oral do coronavírus entérico)."],"take":"PIF deixou de ser sentença de morte com antivirais — atenção ao status legal."},{"sp":"Bovino (Vaca)","spec":"Clínica de Ruminantes / Mastite","title":"Mastite clínica aguda grave por coliforme","ctx":"Vaca Holandesa, 3ª lactação, 25 dias pós-parto. Quarto mamário edemaciado, leite aquoso amarelado com grumos, febre 41 °C, anorexia, desidratação 8%, ruminação ausente. CMT +++ no quarto acometido.","q":"Qual o tratamento sistêmico e de suporte?","pts":["Mastite grave (escore 3) por Gram− é emergência: fluidoterapia (salina hipertônica 7,5% 4–5 mL/kg IV + 20–40 L de água VO por sonda) e cálcio se hipocalcemia.","AINE: FLUNIXINA MEGLUMINA 2,2 mg/kg IV q24h ou meloxicam 0,5 mg/kg IV/SC (melhora bem-estar e sobrevida).","Antimicrobiano sistêmico em casos graves (bacteremia): ceftiofur 2,2 mg/kg IM q24h por 5 dias (ou cefquinoma 1 mg/kg) + intramamário conforme cultura.","Ordenhas frequentes do quarto (com ocitocina 20 UI IM) para retirar toxinas.","Respeitar o PERÍODO DE CARÊNCIA do leite e da carne de cada produto; registrar tratamentos (rastreabilidade)."],"take":"Fluido + AINE são tão importantes quanto o antibiótico na mastite por coliforme."},{"sp":"Bovino (Bezerro/Garrote)","spec":"Clínica de Ruminantes / Respiratório","title":"Doença respiratória bovina (DRB) em garrotes de confinamento","ctx":"Lote de 120 garrotes Nelore recém-chegados ao confinamento (transporte longo). 15 animais com febre > 40,5 °C, secreção nasal mucopurulenta, tosse, depressão e redução de ingestão. Necropsia de 1 animal: broncopneumonia fibrinosa cranioventral (Mannheimia haemolytica).","q":"Tratamento dos doentes e manejo do lote?","pts":["Animais clínicos: TULATROMICINA 2,5 mg/kg SC dose única, ou FLORFENICOL 40 mg/kg SC dose única, ou ceftiofur cristalino 6,6 mg/kg (base da orelha).","AINE: flunixina 2,2 mg/kg IV ou meloxicam 0,5 mg/kg SC (reduz febre e lesão pulmonar).","Metafilaxia do lote de alto risco na chegada (tulatromicina/florfenicol) pode ser considerada — uso racional e orientado.","Prevenção: vacinação contra BoHV-1, BVDV, BRSV, PI3 e Mannheimia antes do transporte, redução do estresse, adaptação à dieta.","Reavaliar em 72 h (critério de falha terapêutica) e respeitar carências."],"take":"Diagnóstico precoce pela febre + macrolídeo/fenicol de longa ação + AINE."},{"sp":"Bovino (Vaca)","spec":"Reprodução","title":"Protocolo de IATF em vacas de corte pós-parto","ctx":"Rebanho de 200 vacas Nelore com bezerro ao pé, 45–60 dias pós-parto, escore de condição corporal 2,75–3 (1–5). Produtor quer concentrar a estação de monta e emprenhar o máximo no início.","q":"Monte um protocolo de IATF à base de progesterona e estradiol.","pts":["D0: dispositivo intravaginal de PROGESTERONA (0,5–1 g) + BENZOATO DE ESTRADIOL 2 mg IM.","D8: retirada do dispositivo + CLOPROSTENOL 500 mcg IM + CIPIONATO DE ESTRADIOL 0,5–1 mg IM + eCG 300–400 UI IM (melhora prenhez em vacas paridas/anestro).","D10: inseminação em tempo fixo 48–52 h após a retirada do dispositivo.","Taxa de prenhez esperada 45–60%; ressincronização no D22–30 com diagnóstico precoce por ultrassom.","Nutrição adequada (ECC ≥ 2,75), controle sanitário reprodutivo (IBR, BVD, leptospirose) e bem-estar."],"take":"P4 + BE (D0) → PGF + ECP + eCG (D8) → IATF (D10)."},{"sp":"Bovino (Garrote)","spec":"Toxicologia","title":"Intoxicação por ureia em bovinos","ctx":"Lote de bovinos recebeu suplemento proteico-energético com ureia mal misturado após chuva (ureia diluída na água do cocho). Em 30–60 min: tremores musculares, salivação, timpanismo, incoordenação, decúbito; 3 mortes.","q":"Como tratar os animais intoxicados?","pts":["Sinais agudos de hiperamonemia em < 1–4 h após ingestão confirmam suspeita.","ÁCIDO ACÉTICO 5% (vinagre) 2–6 L VO para bovinos adultos (0,5–1 L ovinos) + ÁGUA FRIA 20–40 L VO — reduz pH ruminal e hidrólise da ureia.","Ruminotomia e esvaziamento ruminal nos casos graves. Trocarterização se timpanismo grave.","Prevenção: adaptação gradual (2–3 semanas), mistura homogênea, cochos cobertos e com drenagem, não oferecer a animais em jejum."],"take":"Vinagre + água fria por via oral o quanto antes."},{"sp":"Ovino / Caprino","spec":"Parasitologia","title":"Hemoncose ovina com resistência anti-helmíntica","ctx":"Rebanho de 300 ovelhas Santa Inês no período chuvoso. Mortes por anemia intensa, edema submandibular (papeira), apatia. FAMACHA 4–5 em 30% do rebanho. OPG médio 4.500 com predomínio de Haemonchus contortus na coprocultura. Ivermectina usada mensalmente há anos.","q":"Como controlar sem agravar a resistência?","pts":["Tratamento SELETIVO pelo método FAMACHA (tratar apenas graus 3–5) — mantém população refugia de parasitas sensíveis.","Escolha baseada em teste de redução de OPG (TRCOF): na resistência a lactonas macrocíclicas, opções incluem CLOSANTEL 10 mg/kg VO, LEVAMISOL 7,5 mg/kg, monepantel ou associações; pesar animais (sobredose de closantel cega).","Animais grau 5: suporte (ferro, proteína, transfusão em reprodutores valiosos).","Manejo integrado: rotação de pastagens, pastejo com bovinos/equinos, seleção genética de animais resistentes, suplementação proteica, descarte de animais com tratamentos repetidos.","Evitar tratamentos supressivos mensais e subdosagem."],"take":"FAMACHA + TRCOF + manejo integrado; ivermectina mensal criou o problema."},{"sp":"Equino (Cavalo)","spec":"Doenças Infecciosas","title":"Adenite equina (garrotilho — Streptococcus equi equi)","ctx":"Potro de 14 meses, haras com novos animais, febre 40,5 °C, secreção nasal mucopurulenta bilateral, linfonodos submandibulares aumentados e quentes, um com ponto de flutuação; disfagia leve.","q":"Antibiótico sim ou não?","pts":["Fase com abscesso já formado: NÃO usar antibiótico de rotina (atrasa maturação e aumenta risco de garrotilho bastardo); compressas quentes, drenagem e lavagem com iodopovidona diluída.","Fase inicial (febre sem abscesso) ou complicações (dispneia, bastardo, púrpura hemorrágica): PENICILINA G PROCAÍNA 22.000 UI/kg IM q12h (ou penicilina potássica IV) por 7–10 dias.","Dispneia por compressão faríngea: traqueostomia de urgência.","AINE (flunixina 1,1 mg/kg) para febre e dor; ração úmida/macia.","Biossegurança: isolamento por 4–6 semanas, endoscopia das bolsas guturais e PCR para identificar portadores (condroides)."],"take":"Abscesso formado = drenar; antibiótico apenas em fases precoces ou complicações."},{"sp":"Ave (Calopsita)","spec":"Aves / Exóticos","title":"Distocia (retenção de ovo) em calopsita","ctx":"Calopsita fêmea, 2 anos, 90 g, postura crônica (vários ovos sem macho), dieta à base de sementes. Apatia, penas eriçadas, esforço abdominal, cauda balançando, cloaca protrusa; ovo palpável na região caudal do celoma.","q":"Sequência de tratamento?","pts":["Estabilização: ambiente aquecido (29–32 °C) e úmido, oxigênio se dispneia, fluidos SC aquecidos (50 mL/kg/dia).","GLUCONATO DE CÁLCIO 50–100 mg/kg IM/SC (hipocalcemia é a causa mais comum).","Após cálcio e se a junção útero-vaginal estiver relaxada: ocitocina 3–5 UI/kg IM ou prostaglandina E2 tópica na junção útero-vaginal.","Se falhar: ovocentese com aspiração do conteúdo e colapso do ovo; cirurgia (salpingo-histerectomia) nos casos recorrentes.","Correção de manejo: dieta peletizada, cálcio, luz UVB, reduzir fotoperíodo, remover estímulos de nidificação; implante de deslorelina para postura crônica."],"take":"Calor + cálcio antes de ocitocina; corrigir a dieta de sementes."},{"sp":"Réptil (Iguana)","spec":"Répteis / Exóticos","title":"Doença óssea metabólica nutricional em iguana-verde","ctx":"Iguana-verde, 1 ano, 350 g, mantida sem luz UVB e alimentada com alface e frutas. Mandíbula amolecida ('mandíbula de borracha'), membros edemaciados, fraturas patológicas, tremores e fasciculações.","q":"Quais os pilares terapêuticos?","pts":["Hipocalcemia com tremores: GLUCONATO DE CÁLCIO 10% 50–100 mg/kg IM/SC diluído, depois cálcio VO (glubionato/carbonato) por semanas.","Fornecer LUZ UVB de qualidade (10–12 h/dia, substituir lâmpada a cada 6–12 meses) e gradiente térmico adequado (zona quente 35–38 °C).","Correção dietética: folhas verde-escuras ricas em cálcio (couve, rúcula, folha de mostarda, chicória), relação Ca:P ≥ 2:1, suplementação de cálcio em pó.","Calcitonina somente após normocalcemia (hipocalcemia é fatal); evitar excesso de vitamina D3 injetável.","Manipulação cuidadosa (fraturas) e analgesia (meloxicam 0,2 mg/kg)."],"take":"A doença é de manejo: UVB + dieta + cálcio."},{"sp":"Cão (Canino)","spec":"Toxicologia (Emergência)","title":"Intoxicação por sapo-cururu (Rhinella) em cão","ctx":"Jack Russell, 2 anos, 7 kg, mordeu um sapo no quintal à noite. Hipersalivação espumosa intensa, mucosas muito avermelhadas, ataxia, vômito e FC irregular de 200 bpm.","q":"Primeiros passos?","pts":["Descontaminação IMEDIATA: lavar boca e gengivas com água corrente por 10–15 min com a cabeça voltada para baixo (evitar aspiração).","ECG contínuo: taquiarritmias ventriculares — LIDOCAÍNA 2 mg/kg IV (cães); taquicardia supraventricular — esmolol/propranolol; bradicardia/bloqueio AV — atropina 0,02–0,04 mg/kg.","Convulsões: diazepam/midazolam; hipertermia: resfriamento ativo.","Fluidoterapia e monitoramento por 12–24 h. Na maioria dos casos o prognóstico é bom com tratamento precoce.","Antídoto (Fab antidigoxina) é caro e raramente disponível."],"take":"Lavar a boca e monitorar o ECG."},{"sp":"Cão (Canino)","spec":"Toxicologia (Emergência)","title":"Ingestão de rodenticida anticoagulante (brodifacoum) por cão","ctx":"Beagle, 1 ano, 13 kg, ingeriu um pacote de raticida em blocos (brodifacoum 0,005%) há 1 hora. Assintomático, mucosas normais.","q":"Qual a conduta?","pts":["Ingestão recente (< 2–4 h) e assintomático: induzir êmese (apomorfina 0,03 mg/kg IV/IM ou peróxido de hidrogênio 3% 1–2 mL/kg VO; máx. 45 mL) + carvão ativado 1–2 g/kg.","Opção A: iniciar VITAMINA K1 2,5–5 mg/kg/dia VO (com alimento gorduroso) por 4–6 semanas, dosando TP 48–72 h após a última dose.","Opção B: não tratar e dosar TP em 48 e 72 h após a ingestão; se prolongado, iniciar vitamina K1.","Se sangramento (dias 3–7): plasma fresco congelado 10–20 mL/kg ou sangue total, oxigênio, toracocentese se hemotórax volumoso.","Nunca usar vitamina K3 (menadiona) — ineficaz e tóxica."],"take":"Êmese + vitamina K1 por 4–6 semanas para 2ª geração."},{"sp":"Gato (Felino)","spec":"Cardiologia / Emergência","title":"Edema pulmonar cardiogênico em gato com cardiomiopatia","ctx":"Gato Maine Coon, 6 anos, 6,8 kg, dispneia restritiva súbita, taquipneia (FR 80), crepitações, ritmo de galope, hipotermia 36,9 °C. POCUS: átrio esquerdo aumentado (AE:Ao 2,3), linhas B difusas, sem efusão pleural significativa.","q":"Estabilização imediata?","pts":["Oxigênio em caixa e mínimo   '<div class="res-grid" style="margin-top:12px"><div class="res"><b>'+fmt(4*w,0)+"–"+fmt(6*w,0)+' J</b><span>desfibrilação monofásica externa (4–6 J/kg)</span></div><div class="res"><b>'+fmt(2*w,0)+"–"+fmt(4*w,0)+' J</b><span>desfibrilação bifásica externa (2–4 J/kg)</span></div><div class="res"><b>'+fmt(10*w,0)+' mL</b><span>volume corrente (10 mL/kg)</span></div><div class="res"><b>'+(sp==="cat"?"2,5–4,5":w<5?"3–5":w<15?"5–7":w<30?"7–9":"9–11")+'</b><span>sonda endotraqueal sugerida (mm DI)</span></div></div>'+

function calcTransf(){const k=num(document.getElementById("tSp").value),w=gv("tW"),p=gv("tP"),a=gv("tA"),dn=gv("tD");const o=document.getElementById("tOut");
  const v=dn>0?w*k*(a-p)/dn:NaN;
  o.innerHTML='<div class="lbl">Volume de sangue total</div><div class="big">'+fmt(Math.max(0,v),0)+' mL</div><div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(Math.max(0,v)/4,0)+' mL/h</b><span>se infundido em 4 h (máx.)</span></div><div class="res"><b>'+fmt(w*0.25,1)+' mL/h</b><span>taxa inicial (0,25 mL/kg/h) nos primeiros 15–30 min</span></div></div>'+
  '<div class="sm" style="margin-top:10px">Regra prática: 2 mL/kg de sangue total (ou 1 mL/kg de concentrado de hemácias) elevam o Ht em ~1%. Usar filtro de 170–260 µm, monitorar temperatura, FC, FR e sinais de reação.</div>';}
function eFactors(){const sp=document.getElementById("eSp").value;const F=sp==="dog"?[["1","Internado / RER"],["1.6","Adulto castrado"],["1.8","Adulto inteiro"],["1.0","Perda de peso"],["1.2","Obeso propenso / sedentário"],["3.0","Filhote < 4 meses"],["2.0","Filhote 4 meses–adulto"],["2.0","Trabalho leve"],["4.0","Lactação (média)"]]:[["1","Internado / RER"],["1.2","Adulto castrado"],["1.4","Adulto inteiro"],["0.8","Perda de peso"],["1.0","Propenso a obesidade"],["2.5","Filhote"],["2.0","Lactação (início)"]];
  document.getElementById("eF").innerHTML=F.map(([v,l])=>'<option value="'+v+'">'+l+" (×"+String(v).replace(".",",")+')</option>').join("")}
function calcRER(){const w=gv("eW"),fc=num(document.getElementById("eF").value),kc=gv("eK");const o=document.getElementById("eOut");if(!o)return;
  const rer=70*Math.pow(w,0.75),mer=rer*fc;const g=kc>0?mer/kc*1000:NaN;
  o.innerHTML='<div class="lbl">Energia diária</div><div class="big">'+fmt(mer,0)+' kcal/dia</div><div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(rer,0)+' kcal</b><span>RER (repouso)</span></div><div class="res"><b>'+fmt(g,0)+' g/dia</b><span>de alimento ('+fmt(kc,0)+' kcal/kg)</span></div><div class="res"><b>'+fmt(rer/3,0)+' kcal</b><span>1º dia em anoréxico (33% RER)</span></div><div class="res"><b>'+fmt(w*(w<5?6:5),0)+'–'+fmt(w*8,0)+' g</b><span>proteína mínima aprox.</span></div></div>';}
function calcKCl(){const [meq,mlkgh]=document.getElementById("kK").value.split("|").map(Number);const w=gv("kW"),V=gv("kV"),s=num(document.getElementById("kS").value),R=gv("kR");const o=document.getElementById("kOut");
  const add=meq*V/1000,ml=add/s,maxRateScott=mlkgh*w,maxRateSafe=0.5*w/(meq/1000),rateK=R*meq/1000/w;
  o.innerHTML='<div class="lbl">Adicionar à bolsa</div><div class="big">'+fmt(ml,1)+' mL de KCl</div><div class="sm muted">'+fmt(add,1)+' mEq em '+fmt(V)+' mL → '+meq+' mEq/L</div><div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(Math.min(maxRateScott,maxRateSafe),0)+' mL/h</b><span>taxa máxima (escala / 0,5 mEq/kg/h)</span></div><div class="res"><b style="color:'+(rateK>0.5?"var(--bad)":"inherit")+'">'+fmt(rateK,3)+' mEq/kg/h</b><span>na taxa planejada de '+fmt(R)+' mL/h</span></div></div>'+(rateK>0.5?'<div class="note bad" style="margin-top:10px"><b>Atenção:</b> taxa planejada excede 0,5 mEq/kg/h — risco de arritmia/parada cardíaca.</div>':"");}
function calcBic(){const fc=num(document.getElementById("bF").value),w=gv("bW"),b=Math.abs(gv("bB"));const o=document.getElementById("bOut");const t=fc*w*b;
  o.innerHTML='<div class="lbl">Déficit total</div><div class="big">'+fmt(t,1)+' mEq</div><div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(t/3,1)+"–"+fmt(t/2,1)+' mL</b><span>bicarbonato 8,4% (1/3–1/2 da dose)</span></div><div class="res"><b>'+fmt(t,1)+' mL</b><span>8,4% para dose total</span></div></div><div class="sm" style="margin-top:10px">Administrar lento (20–30 min), não misturar com cálcio, reavaliar gasometria e K (risco de hipocalemia).</div>';}
function calcBSA(){const sp=document.getElementById("sSp").value,w=gv("sW"),dm=gv("sD");const o=document.getElementById("sOut");const m=bsa(sp,w);
  o.innerHTML='<div class="lbl">Superfície corporal</div><div class="big">'+fmt(m,3)+' m²</div>'+(dm>0?'<div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(dm*m)+' mg</b><span>dose total ('+fmt(dm)+' mg/m²)</span></div></div>':"");}
function calcConv(){const p=gv("vP");document.getElementById("vOut1").innerHTML='<div class="lbl">Equivale a</div><div class="big">'+fmt(p*10)+' mg/mL</div><div class="sm muted">'+fmt(p*10000)+' mcg/mL · '+fmt(p)+' g/100 mL</div>';
  const c1=gv("vC1"),c2=gv("vC2"),v2=gv("vV2");const v1=c1>0?c2*v2/c1:NaN;document.getElementById("vOut2").innerHTML='<div class="lbl">Aspirar do frasco</div><div class="big">'+fmt(v1)+' mL</div><div class="sm muted">+ '+fmt(v2-v1)+' mL de diluente = '+fmt(v2)+' mL a '+fmt(c2)+' mg/mL</div>';}

function saveRx(){store.set("rx",S.rx)}
function addRxDrug(id,txt,pres){const d=DM[id];S.rx.items.push({n:d.n,pres:pres||d.p.split(";")[0],qty:"",pos:txt||"",ctl:d.ctl||""});saveRx();toast("Adicionado ao receituário");location.hash="#/receita"}
function addRxFromCalc(){if(!lastCalc)return;addRxDrug(lastCalc.d.id,lastCalc.txt+" Por ___ dias.",lastCalc.pres)}
function rxType(){const c=S.rx.items.map(i=>i.ctl);
  if(c.includes("A1"))return["bad","Contém substância da lista A1: exige Notificação de Receita A (amarela) do talonário oficial — esta folha serve apenas como rascunho/orientação ao tutor."];
  if(c.includes("B1"))return["bad","Contém substância da lista B1: exige Notificação de Receita B (azul) do talonário próprio — esta folha serve como rascunho/orientação."];
  if(c.includes("C1")||c.includes("CTL"))return["warn","Receita de Controle Especial em 2 vias (1ª via retida na farmácia). Inclua endereço completo do tutor."];
  if(c.includes("ATB"))return["warn","Antimicrobiano: emita 2 vias quando a dispensação for em farmácia humana (RDC 471/2021 — validade 10 dias)."];
  return["ok","Receita simples."];}

  '<tr><td>'+ctlTag("C1")+'</td><td>Gabapentina, pregabalina, trazodona, fluoxetina, cetamina, propofol, levetiracetam</td><td>Receita de Controle Especial em 2 vias; validade 30 dias.</td></tr>'+

  '<tr><td><span class="tag t-ok">Simples</span></td><td>Produtos de uso veterinário sem controle</td><td>Receita simples com identificação do MV, CRMV, paciente e tutor (Resolução CFMV 1.321/2020).</td></tr></tbody></table>'+
  '<div class="note warn" style="margin-top:10px">Listas e prazos mudam por atualizações das RDCs da ANVISA e normas do MAPA. Confirme sempre a versão vigente da Portaria SVS/MS 344/98 e do sistema SIPEAGRO (produtos veterinários controlados).</div></div>'+

  (AUTH_ON&&store.get("auth",null)?'<div class="card"><h3>Conta</h3><p class="sm" style="margin:6px 0 10px">Conectado como <b>'+esc(store.get("auth",{}).email)+'</b></p><button class="btn" onclick="logout()">Sair da conta</button></div>':"")+

/* ================= Login (Firebase Auth via REST) ================= */
const FB={apiKey:""};const AUTH_ON=!!FB.apiKey&&!FB.apiKey.startsWith("__");const GRACE_DAYS=7;
const AUTH_ERR={EMAIL_NOT_FOUND:"E-mail ou senha incorretos.",INVALID_PASSWORD:"E-mail ou senha incorretos.",INVALID_LOGIN_CREDENTIALS:"E-mail ou senha incorretos.",INVALID_EMAIL:"E-mail inválido.",
 USER_DISABLED:"Seu acesso foi desativado. Fale com o administrador.",USER_NOT_FOUND:"Seu acesso foi removido. Fale com o administrador.",TOKEN_EXPIRED:"Sua senha foi alterada. Entre novamente.",INVALID_REFRESH_TOKEN:"Sessão expirada. Entre novamente.",
 TOO_MANY_ATTEMPTS_TRY_LATER:"Muitas tentativas. Aguarde alguns minutos.",MISSING_PASSWORD:"Informe a senha."};
function authMsg(code){code=String(code||"").split(" ")[0].split(":")[0];return AUTH_ERR[code]||"Não foi possível entrar ("+code+")."}
function showLogin(msg,isErr){const l=document.getElementById("login");l.classList.add("show");const e=document.getElementById("lgErr");if(msg&&isErr){e.textContent=msg;e.style.display="block"}else{e.style.display="none";if(msg)document.getElementById("lgMsg").textContent=msg}}
async function doLogin(){const b=document.getElementById("lgBtn"),em=document.getElementById("lgE").value.trim(),pw=document.getElementById("lgP").value;b.disabled=true;b.textContent="Entrando...";
 try{const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw,returnSecureToken:true})});const j=await r.json();
  if(!r.ok)throw new Error(j.error&&j.error.message);store.set("auth",{email:j.email,rt:j.refreshToken,ok:Date.now()});document.getElementById("login").classList.remove("show");document.getElementById("lgP").value="";route();toast("Bem-vindo(a), "+j.email)}
 catch(e){showLogin(e instanceof TypeError?"Sem conexão com a internet. O primeiro acesso precisa de internet.":authMsg(e.message),true)}finally{b.disabled=false;b.textContent="Entrar"}}
async function verifyAuth(){const a=store.get("auth",null);if(!a)return;
 try{const r=await fetch("https://securetoken.googleapis.com/v1/token?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(a.rt)});const j=await r.json();
  if(r.ok){a.rt=j.refresh_token||a.rt;a.ok=Date.now();store.set("auth",a)}else{store.set("auth",null);showLogin(authMsg(j.error&&j.error.message),true)}}
 catch(e){if(Date.now()-a.ok>GRACE_DAYS*864e5)showLogin("Conecte-se à internet para validar seu acesso (verificação a cada "+GRACE_DAYS+" dias).",true)}}
function logout(){store.set("auth",null);location.hash="#/";showLogin("Você saiu da conta.")}
function authGate(){if(!AUTH_ON)return;const a=store.get("auth",null);
 if(!a)showLogin();else if(Date.now()-a.ok>GRACE_DAYS*864e5){showLogin("Validando acesso...");verifyAuth().then(()=>{const b=store.get("auth",null);if(b&&Date.now()-b.ok<6e4)document.getElementById("login").classList.remove("show")})}else verifyAuth();
 document.addEventListener("visibilitychange",()=>{if(!document.hidden&&store.get("auth",null))verifyAuth()})}

/* ================= Init ================= */
const LOGO = document.querySelector(".brand img").getAttribute("src");
applyTheme();
authGate();
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
route();
</script>
