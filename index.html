<style>
:root{
  --navy:#0f172a;--royal:#1e3a8a;--royal-2:#2563eb;--copper:#d97706;--copper-2:#f59e0b;
  --bg:#f1f5f9;--surface:#ffffff;--surface-2:#f8fafc;--ink:#0f172a;--muted:#5b6b82;--line:#e2e8f0;--line-2:#cbd5e1;
  --accent:#1d4ed8;--accent-soft:#e0e7ff;--ok:#047857;--ok-soft:#d1fae5;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;--info:#0369a1;--info-soft:#e0f2fe;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
  --radius:16px;--nav-h:66px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1120;--surface:#111a2e;--surface-2:#16213a;--ink:#e6edf7;--muted:#93a3bc;--line:#22304b;--line-2:#2e3e5e;
  --accent:#7aa2ff;--accent-soft:#1c2a4f;--ok:#34d399;--ok-soft:#0f2e26;--warn:#fbbf24;--warn-soft:#33270b;--bad:#f87171;--bad-soft:#3a1717;--info:#38bdf8;--info-soft:#0c2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0b1120;--surface:#111a2e;--surface-2:#16213a;--ink:#e6edf7;--muted:#93a3bc;--line:#22304b;--line-2:#2e3e5e;
  --accent:#7aa2ff;--accent-soft:#1c2a4f;--ok:#34d399;--ok-soft:#0f2e26;--warn:#fbbf24;--warn-soft:#33270b;--bad:#f87171;--bad-soft:#3a1717;--info:#38bdf8;--info-soft:#0c2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- Topbar ---------- */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#0b1224 0%,#13265c 60%,#1e3a8a 100%);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(2,6,23,.35)}
.top .back{display:none}
.top.sub .back{display:flex}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:#fff}
.brand img{width:40px;height:40px;border-radius:12px;border:2px solid var(--copper-2);background:#fff;flex:none}
.brand b{display:block;font-size:17px;font-weight:850;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:#c7d2fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tbtn:active{transform:scale(.96)}
/* ---------- Layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.layout{display:block}
.side{display:none}
@media (min-width:980px){
  body{padding-bottom:24px}
  .layout{display:grid;grid-template-columns:220px 1fr;gap:20px;max-width:1300px;margin:0 auto;padding:0 16px}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px;height:calc(100vh - 90px);padding-top:16px}
  .side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:650}
  .side a:hover{background:var(--surface)}
  .side a.on{background:var(--accent-soft);color:var(--accent)}
  .dock{display:none!important}
  .wrap{padding:16px 0}
}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b));box-shadow:0 -4px 18px rgba(15,23,42,.06)}
.dock a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 2px;border-radius:12px;min-width:0}
.dock a.on{color:var(--accent)}
.dock a.on svg{stroke-width:2.4}
/* ---------- Generic ---------- */
h1,h2,h3{margin:0;letter-spacing:-.015em}
h1{font-size:22px;font-weight:850}
h2{font-size:18px;font-weight:800}
h3{font-size:15.5px;font-weight:800}
.muted{color:var(--muted)}
.sm{font-size:13px}.xs{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2m{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-title h2{font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px;min-height:42px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0b1120}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0b1120}}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:800;line-height:1.5;white-space:nowrap}
.t-a1{background:#fef9c3;color:#854d0e;border:1px solid #fde047}
.t-b1{background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd}
.t-c1,.t-ctl{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
.t-atb{background:#dcfce7;color:#166534;border:1px solid #86efac}
.t-cls{background:var(--accent-soft);color:var(--accent)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-info{background:var(--info-soft);color:var(--info)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:750;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;min-height:44px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:84px;resize:vertical}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:40px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:14px 0}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note b{font-weight:800}
/* ---------- Home ---------- */
.hero{background:radial-gradient(120% 140% at 0% 0%,#1d4ed8 0%,#13265c 45%,#0b1224 100%);color:#fff;border-radius:22px;padding:20px;display:flex;gap:16px;align-items:center;box-shadow:0 14px 30px rgba(2,6,23,.25);overflow:hidden;position:relative}
.hero img{width:92px;height:92px;border-radius:22px;border:3px solid var(--copper-2);background:#fff;flex:none}
.hero h1{font-size:22px;color:#fff}
.hero p{margin:6px 0 0;color:#c7d2fe;font-size:13.5px}
.hero .search{margin-top:12px}
.hero .inp{background:rgba(255,255,255,.96);color:#0f172a;border-color:transparent}
.hero .search svg{color:#475569}
@media (max-width:520px){.hero{flex-direction:column;align-items:flex-start;padding:18px}.hero img{width:64px;height:64px;border-radius:16px}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-height:96px}
.tile .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.tile b{font-size:14.5px}
.tile span{font-size:12px;color:var(--muted)}
.ic.c1{background:#dbeafe;color:#1d4ed8}.ic.c2{background:#fef3c7;color:#b45309}.ic.c3{background:#fee2e2;color:#b91c1c}.ic.c4{background:#d1fae5;color:#047857}.ic.c5{background:#ede9fe;color:#6d28d9}.ic.c6{background:#e0f2fe;color:#0369a1}.ic.c7{background:#fce7f3;color:#be185d}.ic.c8{background:#f1f5f9;color:#334155}
.sp-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:420px){.sp-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.sp-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:11.5px;font-weight:700;text-align:center}
.sp-btn em{font-style:normal;font-size:24px;line-height:1.1}
/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);cursor:pointer}
.item:active{background:var(--surface-2)}
.item .t{font-weight:800;font-size:15px}
.item .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.spi{font-size:15px;letter-spacing:1px}
.sev{width:10px;height:10px;border-radius:50%;flex:none}
.sev.Fatal{background:#dc2626}.sev.Grave{background:#ea580c}.sev.Moderada{background:#d97706}.sev.Leve{background:#65a30d}
/* ---------- Detail ---------- */
.dhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dhead h1{font-size:22px}
.kv{display:grid;gap:10px}
.kv .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.kv .v{margin-top:2px}
.dose-t{width:100%;border-collapse:separate;border-spacing:0}
.dose-row{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.dose-row:first-child{border-top:0}
.dose-row .e{font-size:24px;line-height:1}
.dose-row .d{font-weight:850;font-size:15.5px;font-variant-numeric:tabular-nums}
.dose-row .m{font-size:13px;color:var(--muted);margin-top:2px}
.dose-row .o{font-size:13px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- Calc ---------- */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.tools{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tool{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:750;font-size:13px}
.tool.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (max-width:639px){.tools{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.tools::-webkit-scrollbar{display:none}.tool{flex:none;white-space:nowrap}}
.out{border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1.5px solid var(--accent)}
.out .big{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.out .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.res-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.res b{display:block;font-size:19px;font-weight:850;font-variant-numeric:tabular-nums}
.res span{font-size:12px;color:var(--muted);font-weight:650}
.wstep{display:flex;gap:6px}
.wstep button{min-width:44px}
input[type=range]{width:100%;accent-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl td.n{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.scroll-x{overflow-x:auto}
/* ---------- Overlay / modal ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(2,6,23,.55);display:none;align-items:flex-start;justify-content:center;padding:calc(12px + var(--safe-t)) 12px 12px}
.ov.show{display:flex}
.ov .box{background:var(--surface);border-radius:20px;width:100%;max-width:720px;max-height:calc(100vh - 24px);overflow:auto;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.case-q{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px;font-weight:750}
.pts{margin:0;padding-left:20px}
.pts li{margin:6px 0}
.take{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px;font-weight:750}
.disc{font-size:12px;color:var(--muted);text-align:center;margin:28px 8px 8px}
.lg{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 120% at 0% 0%,#1d4ed8 0%,#13265c 45%,#0b1224 100%);display:none;align-items:center;justify-content:center;padding:20px}
.lg.show{display:flex}
.lg .box{background:var(--surface);border-radius:22px;padding:22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lg img{width:84px;height:84px;border-radius:20px;border:3px solid var(--copper-2);display:block;margin:0 auto 10px}
/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  body{background:#fff;padding:0;color:#000}
  .top,.dock,.layout,.ov,.toast{display:none!important}
  #printArea{display:block}
  .rx-page{page-break-after:always;padding:18mm 16mm;font-family:Georgia,serif;color:#000;min-height:260mm;position:relative}
  .rx-page:last-child{page-break-after:auto}
  .rx-h{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
  .rx-h b{font-size:18px}
  .rx-item{margin:12px 0}
  .rx-foot{position:absolute;bottom:18mm;left:16mm;right:16mm;text-align:center;border-top:1px solid #000;padding-top:6px}
}
</style>
</head>

 em leitões (dias 1–3 de vida), anemia ferropriva por perda crônica de sangue.","ci":"Deficiência de vitamina E/selênio (toxicidade), infecção.","ae":"Reação anafilactoide, manchas musculares.","u":"","conc":0,"tab":0,"d":{"pig":[null,null,"IM (pescoço)","dose única","100–200 mg/leitão no 1º–3º dia."],"dog":[10,20,"IM","dose única, repetir em 3–4 semanas",""]},"lab":["pig"]},{"n":"Propilenoglicol","b":"Propilenoglicol, Glicol Vet","c":"vit","ctl":"","p":"Líquido oral","m":"Precursor gliconeogênico (propionato).","i":"Cetose bovina, toxemia da prenhez em ovelhas e cabras.","ci":"Gatos/equinos (tóxico: Heinz).","ae":"Diarreia, depressão em sobredose.","u":"","conc":0,"tab":0,"d":{"cattle":[null,null,"VO","q12–24h por 3–5 dias","250–400 mL/vaca."],"sr":[null,null,"VO","q12h","60 mL/animal."]},"lab":["cattle","sr"]},{"n":"Cálcio + Vitamina D3 (suporte em répteis/aves)","b":"Calcitrat, Repti Calcium","c":"vit","ctl":"","p":"Suplementos orais; gluconato de cálcio 10% injetável","m":"Reposição de cálcio na doença osteometabólica nutricional.","i":"Doença óssea metabólica (iguanas, jabutis, calopsitas), hipocalcemia de postura.","ci":"Hipercalcemia; vitamina D3 injetável em excesso causa calcificação metastática.","ae":"Hipercalcemia.","u":"mg","conc":100,"tab":0,"d":{"reptile":[50,100,"IM/SC (gluconato diluído)","q12–24h até melhora","Associar luz UVB (essencial) e correção dietética Ca:P 2:1."],"bird":[50,100,"IM/SC","q12–24h","Retenção de ovo/hipocalcemia."]},"lab":[]}],"tox":[{"n":"Lírios (Lilium spp., Hemerocallis spp.)","t":"Planta","sp":"Gatos","sev":"Fatal","dose":"Qualquer quantidade — inclusive pólen ou água do vaso.","mech":"Toxina hidrossolúvel não identificada que causa necrose do epitélio tubular renal.","sx":"Vômito, sialorreia e anorexia em 0–12 h; poliúria (12–24 h) evoluindo para oligúria/anúria e lesão renal aguda em 24–72 h.","tx":"Descontaminação (êmese se < 2 h, carvão ativado), fluidoterapia IV agressiva (2–3x manutenção) por 48–72 h iniciada nas primeiras 18 h, monitorar débito urinário e creatinina; diálise se anúria.","ant":"Não há antídoto."},{"n":"Paracetamol (Acetaminofeno)","t":"Fármaco","sp":"Gatos (cães em sobredose)","sev":"Fatal","dose":"Gatos: > 10 mg/kg (um comprimido de 500 mg pode matar). Cães: > 100–200 mg/kg (hepatotoxicidade); > 200 mg/kg (meta-hemoglobinemia).","mech":"Deficiência de glicuronidação felina → NAPQI oxida hemoglobina e glutationa.","sx":"Mucosas cianóticas/achocolatadas (meta-hemoglobina), edema de face e patas, taquipneia, anemia por corpúsculos de Heinz, icterícia e necrose hepática (cães).","tx":"Oxigênio, êmese/carvão ativado se recente, N-ACETILCISTEÍNA 140 mg/kg IV/VO, depois 70 mg/kg q6h (7–17 doses), vitamina C 30 mg/kg q6h, SAMe, transfusão se anemia grave.","ant":"N-acetilcisteína."},{"n":"Permetrina e piretroides concentrados","t":"Pesticida","sp":"Gatos","sev":"Fatal","dose":"Pipetas caninas 45–65% aplicadas no gato ou contato íntimo com cão recém-tratado.","mech":"Prolonga a abertura dos canais de sódio neuronais; gatos têm glicuronidação deficiente.","sx":"Hipersalivação, tremores e fasciculações generalizadas, hiperestesia, hipertermia, convulsões.","tx":"Banho com detergente neutro (água morna — evitar hipotermia), METOCARBAMOL 55–220 mg/kg IV, emulsão lipídica 20%, diazepam/midazolam/propofol para convulsões, controle de temperatura.","ant":"Sem antídoto específico (metocarbamol + emulsão lipídica)."},{"n":"Uvas, passas e tamarindo","t":"Alimento","sp":"Cães","sev":"Grave","dose":"Idiossincrática — casos com poucas uvas. O ácido tartárico (também no tamarindo e no creme de tártaro) é o agente provável.","mech":"Ácido tartárico → necrose tubular renal proximal.","sx":"Vômito em 6–24 h, letargia, dor abdominal, oligúria/anúria e LRA em 24–72 h.","tx":"Êmese mesmo tardia (até 4–6 h), carvão ativado, fluidoterapia IV por 48–72 h, monitorar creatinina por 72 h.","ant":"Não há."},{"n":"Xilitol (adoçante, chicletes, pasta de dente, gabapentina líquida humana)","t":"Alimento","sp":"Cães","sev":"Grave","dose":"> 0,1 g/kg: hipoglicemia. > 0,5 g/kg: insuficiência hepática aguda.","mech":"Estimula liberação maciça de insulina em cães; hepatotoxicidade por mecanismo não esclarecido.","sx":"Vômito, fraqueza, ataxia, convulsão por hipoglicemia em 30–60 min; petéquias, icterícia e CID em 24–72 h.","tx":"Êmese se assintomático, glicose IV em bolus e IC de glicose 2,5–5%, hepatoprotetores (SAMe, NAC, silimarina), plasma se coagulopatia. Carvão ativado NÃO adsorve xilitol.","ant":"Não há."},{"n":"Chocolate (teobromina e cafeína)","t":"Alimento","sp":"Cães (gatos raramente)","sev":"Grave","dose":"Metilxantinas: 20 mg/kg sinais leves; 40–50 mg/kg cardiotoxicidade; > 60 mg/kg convulsões. Chocolate amargo/cacau em pó: ~15–20 mg/g; ao leite ~2 mg/g.","mech":"Antagonismo de receptores de adenosina e inibição de fosfodiesterase.","sx":"Vômito, PU/PD, agitação, taquicardia, arritmias ventriculares, hipertermia, tremores, convulsões.","tx":"Êmese, carvão ativado em DOSES REPETIDAS (ciclo êntero-hepático), fluidoterapia, sondagem vesical (reabsorção vesical), betabloqueador (esmolol/propranolol) para taquicardia, lidocaína para arritmia ventricular, diazepam para convulsões.","ant":"Não há."},{"n":"Cebola, alho, cebolinha e alho-poró (Allium spp.)","t":"Alimento","sp":"Gatos > Cães, bovinos","sev":"Moderada","dose":"Cães: ≥ 15–30 g/kg de cebola; gatos: ≥ 5 g/kg. Pós desidratados e alho são mais potentes. Efeito cumulativo.","mech":"Dissulfetos oxidam hemoglobina → corpúsculos de Heinz e eccentrócitos.","sx":"Anemia hemolítica 1–5 dias após ingestão, hemoglobinúria, letargia, taquipneia, mucosas pálidas/ictéricas.","tx":"Descontaminação, oxigênio, transfusão se Ht muito baixo, antioxidantes (NAC, vitamina E).","ant":"Não há."},{"n":"Etilenoglicol (anticongelante, aditivo de radiador)","t":"Doméstico","sp":"Cães e gatos","sev":"Fatal","dose":"Cães: 4,4–6,6 mL/kg; gatos: 1,4 mL/kg (solução 95%).","mech":"Metabolizado pela álcool desidrogenase em ácido glicólico e oxalato → acidose metabólica grave e cristais de oxalato de cálcio nos rins.","sx":"Fase 1 (30 min–12 h): ataxia, aparência de embriaguez, PU/PD. Fase 2: aparente melhora. Fase 3 (24–72 h cães; 12–24 h gatos): LRA anúrica, cristalúria de oxalato monoidratado.","tx":"ETANOL 20% IV (fomepizol não disponível no Brasil) iniciado < 8 h em cães e < 3 h em gatos, fluidoterapia, bicarbonato para acidose, diálise.","ant":"Etanol (ou fomepizol, quando importado)."},{"n":"Rodenticidas anticoagulantes (brodifacoum, bromadiolona, difacinona)","t":"Pesticida","sp":"Todas as espécies","sev":"Grave","dose":"Brodifacoum: cães DL50 0,25–3,6 mg/kg (iscas 0,005%).","mech":"Inibem a vitamina K epóxido-redutase → depleção de fatores II, VII, IX e X (sinais após 3–5 dias).","sx":"Hemorragias cavitárias (hemotórax, hemoabdômen), dispneia, hematomas, epistaxe, melena, TP prolongado (primeiro a alterar).","tx":"Êmese se < 2–4 h; VITAMINA K1 2,5–5 mg/kg VO com alimento gorduroso por 4–6 semanas (2ª geração); plasma fresco congelado ou sangue total se hemorragia; dosar TP 48–72 h após última dose.","ant":"Vitamina K1 (fitomenadiona) — nunca K3."},{"n":"Chumbinho (aldicarbe e outros carbamatos/organofosforados ilegais)","t":"Pesticida","sp":"Cães, gatos (envenenamento intencional comum no Brasil)","sev":"Fatal","dose":"Aldicarbe é extremamente tóxico (DL50 < 1 mg/kg).","mech":"Inibição da acetilcolinesterase → excesso de acetilcolina (muscarínico, nicotínico e central).","sx":"SLUDGE-BBB: sialorreia, lacrimejamento, micção, diarreia, vômito, broncorreia, broncoespasmo, bradicardia, miose; fasciculações, fraqueza, convulsões, insuficiência respiratória.","tx":"ATROPINA 0,2–0,5 mg/kg (¼ IV e restante IM/SC) repetida até cessar a broncorreia (não pela FC), oxigênio, ventilação, descontaminação (banho, carvão ativado), diazepam para convulsões. Pralidoxima apenas para organofosforados (não carbamatos). Notificar: crime ambiental (Lei 9.605/98).","ant":"Atropina (+ pralidoxima para organofosforados)."},{"n":"Ivermectina e lactonas macrocíclicas em cães MDR1","t":"Fármaco","sp":"Collie, Pastor-australiano, Pastor-de-Shetland, Border Collie, Old English Sheepdog, Whippet, mestiços","sev":"Grave","dose":"Sensíveis: sinais com ≥ 0,1 mg/kg. Normais: > 2 mg/kg. Comum: ingestão de pasta equina.","mech":"Deficiência de glicoproteína-P (gene ABCB1) permite acúmulo no SNC (agonismo GABA).","sx":"Midríase, cegueira, ataxia, tremores, sialorreia, bradicardia, coma, depressão respiratória.","tx":"Descontaminação, EMULSÃO LIPÍDICA 20%, suporte ventilatório, nutrição, fisioterapia, lubrificação ocular — recuperação pode levar semanas. Testar MDR1 antes de doses altas.","ant":"Não há (emulsão lipídica)."},{"n":"Ivermectina em quelônios e répteis","t":"Fármaco","sp":"Jabutis, tartarugas, cágados, lagartos (skinks), serpente índigo","sev":"Fatal","dose":"Doses terapêuticas de mamíferos (0,2 mg/kg).","mech":"Barreira hematoencefálica permeável em quelônios.","sx":"Paralisia flácida, coma, óbito.","tx":"Suporte prolongado (fluidos, ventilação). Prevenção: usar outro antiparasitário (fembendazol, praziquantel).","ant":"Não há."},{"n":"AINEs humanos (ibuprofeno, naproxeno, diclofenaco, nimesulida)","t":"Fármaco","sp":"Cães e gatos (gatos mais sensíveis)","sev":"Grave","dose":"Ibuprofeno cães: > 25 mg/kg GI; > 175 mg/kg LRA; > 400 mg/kg convulsões. Gatos: metade. Naproxeno: meia-vida de 74 h em cães (≥ 5 mg/kg).","mech":"Inibição de COX-1 → perda de prostaglandinas protetoras da mucosa e da perfusão renal.","sx":"Vômito, hematêmese, melena, dor abdominal, perfuração, LRA, convulsões/coma em doses altas.","tx":"Êmese, carvão ativado (repetir se naproxeno), omeprazol/pantoprazol, sucralfato, misoprostol, fluidoterapia IV por 48–72 h, monitorar creatinina; emulsão lipídica em casos graves.","ant":"Não há."},{"n":"Maconha (THC) e produtos comestíveis","t":"Doméstico","sp":"Cães","sev":"Moderada","dose":"Dose mínima letal estimada > 3 g/kg de THC (raro óbito, exceto com chocolate/xilitol nos comestíveis).","mech":"Agonismo CB1 no SNC.","sx":"Ataxia, hiperestesia, incontinência urinária, midríase, bradicardia, sonolência alternada com agitação.","tx":"Êmese se < 30 min e consciente (antiemético efeito do THC), carvão ativado repetido, suporte térmico, emulsão lipídica em casos graves. Verificar presença de chocolate/xilitol.","ant":"Não há."},{"n":"Envenenamento botrópico (jararaca, jararacuçu, urutu — Bothrops spp.)","t":"Animal peçonhento","sp":"Cães, equinos, bovinos","sev":"Grave","dose":"Responsável por ~85% dos acidentes ofídicos no Brasil.","mech":"Veneno proteolítico, coagulante (consumo de fibrinogênio) e hemorrágico (metaloproteases).","sx":"Dor e edema local intenso e progressivo, equimose, sangramento no local e gengival, coagulopatia (tempo de coagulação prolongado), choque, LRA, necrose.","tx":"SORO ANTIBOTRÓPICO (ou antibotrópico-crotálico) IV o mais rápido possível — dose não depende do peso (mesma quantidade de veneno a neutralizar): leve 2–4, moderado 4–8, grave ~12 ampolas. Fluidoterapia, analgesia (opioide), antibiótico se necrose. NÃO fazer torniquete, incisão ou sucção. Evitar AINE.","ant":"Soro antibotrópico (SAB)."},{"n":"Envenenamento crotálico (cascavel — Crotalus durissus)","t":"Animal peçonhento","sp":"Cães, equinos, bovinos","sev":"Fatal","dose":"Pouca reação local é característica.","mech":"Crotoxina neurotóxica (bloqueio pré-sináptico), miotóxica (rabdomiólise) e coagulante.","sx":"Pouca dor/edema local, ptose palpebral (fácies miastênica), midríase, fraqueza, mialgia, urina escura (mioglobinúria), LRA, insuficiência respiratória.","tx":"SORO ANTICROTÁLICO IV (leve 5, moderado 10, grave 20 ampolas — referência humana), fluidoterapia vigorosa para mioglobinúria (alcalinização), suporte ventilatório.","ant":"Soro anticrotálico (SAC)."},{"n":"Coral verdadeira (Micrurus spp.)","t":"Animal peçonhento","sp":"Cães","sev":"Fatal","dose":"Acidentes raros, mas graves.","mech":"Neurotoxinas pós-sinápticas (curare-like).","sx":"Pouca reação local, paralisia flácida descendente, ptose, disfagia, insuficiência respiratória em poucas horas.","tx":"SORO ANTIELAPÍDICO, ventilação mecânica, neostigmina + atropina pode ajudar (bloqueio pós-sináptico).","ant":"Soro antielapídico."},{"n":"Escorpião amarelo (Tityus serrulatus)","t":"Animal peçonhento","sp":"Cães e gatos (filhotes e pequenos)","sev":"Grave","dose":"Principal escorpião de importância médica no Brasil (áreas urbanas).","mech":"Neurotoxina que abre canais de sódio → descarga autonômica maciça (catecolaminas e acetilcolina).","sx":"Dor local intensa, sialorreia, vômito, tremores, taquicardia ou bradicardia, arritmias, edema pulmonar, choque.","tx":"Analgesia (lidocaína local sem vasoconstritor, opioide, dipirona), suporte cardiovascular, oxigênio; SORO ANTIESCORPIÔNICO em casos moderados/graves.","ant":"Soro antiescorpiônico."},{"n":"Aranha-marrom (Loxosceles spp.)","t":"Animal peçonhento","sp":"Cães, gatos","sev":"Moderada","dose":"Comum na região Sul.","mech":"Esfingomielinase D → necrose dermonecrótica e hemólise intravascular.","sx":"Lesão inicialmente pouco dolorosa que evolui com placa marmórea e necrose em 24–72 h; forma cutâneo-visceral com hemólise e LRA.","tx":"Analgesia, compressas frias, corticoide (prednisolona) nas primeiras 48 h, antibiótico se infecção, desbridamento tardio; soro antiaracnídico/antiloxoscélico nas formas graves.","ant":"Soro antiloxoscélico / antiaracnídico."},{"n":"Sapo-cururu (Rhinella spp. — bufotoxinas)","t":"Animal peçonhento","sp":"Cães","sev":"Grave","dose":"Morder ou lamber o sapo (secreção das glândulas paratoides).","mech":"Bufadienolídeos (efeito digitálico — inibe Na/K-ATPase) e bufotenina.","sx":"Hipersalivação intensa imediata, mucosas hiperêmicas, vômito, ataxia, arritmias (bradi ou taquiarritmias), convulsões, hipertermia.","tx":"LAVAR A BOCA com água corrente (cabeça para baixo) por 10–15 min, monitorar ECG, atropina para bradicardia, lidocaína/esmolol para taquiarritmias, controle de convulsões, resfriamento.","ant":"Anticorpos antidigoxina (Fab) — raramente disponíveis."},{"n":"Taturana / Lagarta Lonomia (Lonomia obliqua)","t":"Animal peçonhento","sp":"Cães, equinos","sev":"Grave","dose":"Contato com cerdas.","mech":"Pró-coagulante → consumo de fatores (síndrome hemorrágica).","sx":"Dor/queimação local, hematomas, sangramentos, hematúria, LRA.","tx":"Compressas frias, analgesia, avaliar coagulação; SORO ANTILONÔMICO se distúrbio de coagulação.","ant":"Soro antilonômico (Instituto Butantan)."},{"n":"Abelhas e vespas (acidente maciço)","t":"Animal peçonhento","sp":"Cães, equinos","sev":"Grave","dose":"Múltiplas picadas (> 20 picadas/kg em humanos é potencialmente letal).","mech":"Melitina e fosfolipase A2: hemólise, rabdomiólise, anafilaxia.","sx":"Edema facial, urticária, anafilaxia (choque, vômito, diarreia), hemoglobinúria/mioglobinúria, LRA.","tx":"Remover ferrões raspando (não apertar), adrenalina 0,01 mg/kg IM na anafilaxia, difenidramina, corticoide, fluidoterapia vigorosa, monitorar hemólise e função renal por 72 h.","ant":"Não há soro antiapílico de uso veterinário amplo."},{"n":"Ionóforos (monensina, lasalocida, salinomicina)","t":"Fármaco","sp":"EQUINOS, cães, (bovinos em sobredose)","sev":"Fatal","dose":"Equinos: DL50 da monensina 2–3 mg/kg (100x mais sensíveis que bovinos). Ração bovina/de aves contaminada ou consumida por cavalos.","mech":"Transporte de íons através das membranas → sobrecarga de cálcio e necrose de cardiomiócitos e músculo esquelético.","sx":"Anorexia, sudorese, cólica, fraqueza, mioglobinúria, arritmias, insuficiência cardíaca, morte súbita (inclusive semanas depois).","tx":"Carvão ativado/óleo mineral, suporte, vitamina E/selênio, repouso absoluto; prognóstico reservado. Interação: tiamulina + ionóforos em aves e suínos causa intoxicação.","ant":"Não há."},{"n":"Erva-de-rato (Palicourea marcgravii)","t":"Planta","sp":"Bovinos","sev":"Fatal","dose":"Planta mais importante como causa de morte de bovinos no Brasil. 0,6 g/kg de folhas frescas pode ser letal.","mech":"Monofluoroacetato de sódio (bloqueia ciclo de Krebs).","sx":"MORTE SÚBITA associada ao exercício (movimentação do rebanho): tremores, queda, pedalagem, óbito em minutos.","tx":"Sem tratamento eficaz; manter o rebanho em repouso; retirar da pastagem; carvão ativado/acetamida experimental.","ant":"Não há."},{"n":"Samambaia (Pteridium esculentum/arachnoideum)","t":"Planta","sp":"Bovinos, equinos","sev":"Grave","dose":"Ingestão crônica (agudo: > 10 g/kg/dia por semanas; crônico: hematúria enzoótica).","mech":"Ptaquilosídeo (carcinogênico e mielotóxico); tiaminase em equinos.","sx":"Bovinos: diátese hemorrágica aguda (mielossupressão), hematúria enzoótica (tumores vesicais), carcinomas do TGI superior. Equinos: deficiência de tiamina (ataxia).","tx":"Retirar da pastagem; transfusão sanguínea; tiamina em equinos. Prognóstico ruim na forma aguda grave.","ant":"Tiamina (equinos)."},{"n":"Brachiaria spp. (fotossensibilização hepatógena)","t":"Planta","sp":"Ovinos, bovinos jovens, caprinos, equinos","sev":"Moderada","dose":"Pastagens de B. decumbens/brizantha em brotação.","mech":"Saponinas litogênicas → cristais nos ductos biliares → retenção de filoeritrina (fotodinâmica).","sx":"Icterícia, dermatite nas áreas despigmentadas (orelhas, focinho), edema facial, prurido, apatia.","tx":"Retirar da pastagem e manter na sombra, tratamento das feridas, hepatoprotetores.","ant":"Não há."},{"n":"Nitrato / Nitrito","t":"Ambiental","sp":"Bovinos, ovinos","sev":"Fatal","dose":"Forrageiras adubadas/estressadas (aveia, milheto, sorgo) e água contaminada.","mech":"Nitrato → nitrito no rúmen → meta-hemoglobinemia.","sx":"Dispneia, mucosas e sangue cor de chocolate, tremores, aborto, morte rápida.","tx":"AZUL DE METILENO 4–20 mg/kg IV lento (solução 1–4%), retirar fonte.","ant":"Azul de metileno."},{"n":"Ácido cianídrico (mandioca-brava, sorgo, Manihot spp.)","t":"Planta","sp":"Bovinos, ovinos, caprinos","sev":"Fatal","dose":"Glicosídeos cianogênicos em plantas jovens/murchas/rebrotadas.","mech":"Cianeto inibe citocromo oxidase (hipóxia celular).","sx":"Dispneia, sangue vermelho-vivo, tremores, convulsões, morte em minutos a poucas horas.","tx":"TIOSSULFATO DE SÓDIO 20% (500 mg/kg IV) ± nitrito de sódio 20 mg/kg IV.","ant":"Tiossulfato de sódio."},{"n":"Ureia / Amônia","t":"Ambiental","sp":"Bovinos, ovinos","sev":"Fatal","dose":"> 0,3–0,5 g/kg de ureia em animais não adaptados ou erro de mistura.","mech":"Hidrólise ruminal rápida → alcalose ruminal e hiperamonemia.","sx":"Tremores, salivação, timpanismo, incoordenação, dor abdominal, decúbito, morte em 1–4 h.","tx":"ÁCIDO ACÉTICO 5% (vinagre) 2–6 L VO para bovino adulto (0,5–1 L ovinos) + água gelada, ruminotomia nos casos graves.","ant":"Ácido acético (vinagre)."},{"n":"Cobre em ovinos","t":"Ambiental","sp":"Ovinos","sev":"Fatal","dose":"Sal mineral/ração de bovinos ou suínos e pastagens com excesso de Cu (ovinos têm baixa excreção biliar).","mech":"Acúmulo hepático crônico com liberação súbita após estresse → crise hemolítica.","sx":"Hemoglobinúria, icterícia intensa, anemia, morte súbita; rins cor de chumbo.","tx":"Molibdato de amônio 50–500 mg/dia VO + sulfato de sódio, tetratiomolibdato; prognóstico ruim na crise hemolítica.","ant":"Molibdato/tetratiomolibdato de amônio."},{"n":"Teflon superaquecido (PTFE) e vapores de cozinha","t":"Doméstico","sp":"Aves","sev":"Fatal","dose":"Panelas antiaderentes superaquecidas, aquecedores, ferros de passar.","mech":"Partículas e gases tóxicos causam edema e hemorragia pulmonar aguda.","sx":"Dispneia súbita, ataxia, morte em minutos.","tx":"Remoção do ambiente, oxigênio, corticoide e diurético — prognóstico ruim.","ant":"Não há."},{"n":"Abacate (persina)","t":"Alimento","sp":"Aves (psitacídeos), coelhos, equinos, caprinos","sev":"Grave","dose":"Folhas, casca, caroço e polpa.","mech":"Persina — necrose miocárdica e da glândula mamária.","sx":"Aves: dispneia, regurgitação, morte súbita em 12–48 h. Ruminantes: mastite não infecciosa.","tx":"Suporte, furosemida e oxigênio para ICC.","ant":"Não há."},{"n":"Chumbo","t":"Ambiental","sp":"Cães, aves, bovinos","sev":"Grave","dose":"Tintas antigas, baterias, chumbinhos de pesca/caça (aves), óleo de motor (bovinos).","mech":"Inibe enzimas sulfidrílicas (síntese do heme) e lesiona o SNC.","sx":"Vômito, dor abdominal, convulsões, cegueira, alterações comportamentais; hemácias com pontilhado basofílico e eritrócitos nucleados; aves: regurgitação, fezes verdes, fraqueza.","tx":"Remover fonte (endoscopia/cirurgia), EDTA cálcico dissódico 25 mg/kg SC q6h por 5 dias (diluído), ou succímero (DMSA) 10 mg/kg VO q8h.","ant":"EDTA cálcico / succímero."},{"n":"Zinco (moedas, pomadas de óxido de zinco, porcas)","t":"Doméstico","sp":"Cães, aves","sev":"Grave","dose":"Moedas metálicas ingeridas; pomadas de óxido de zinco.","mech":"Hemólise oxidativa, lesão pancreática, renal e hepática.","sx":"Anemia hemolítica, hemoglobinúria, vômito, icterícia.","tx":"Remoção endoscópica/cirúrgica do corpo estranho (mais importante), transfusão, fluidoterapia. Quelantes raramente necessários.","ant":"Remoção da fonte."},{"n":"Acetato de medroxiprogesterona ('injeção anticoncepcional')","t":"Fármaco","sp":"Cadelas e gatas","sev":"Grave","dose":"Uso indiscriminado em pequenos animais (comum no Brasil).","mech":"Progestágeno de depósito → hiperplasia endometrial cística, GH mamário, resistência insulínica.","sx":"Piometra, hiperplasia mamária felina, neoplasias mamárias, diabetes mellitus, acromegalia, retenção fetal/morte fetal.","tx":"Ovário-histerectomia (piometra), aglepristone (hiperplasia mamária felina e piometra), insulina se diabetes. Orientar tutores: castração cirúrgica é o método indicado.","ant":"Aglepristone (antagonista da progesterona)."},{"n":"AINE + Corticoide (ou dois AINEs)","t":"Interação","sp":"Todas (principalmente cães)","sev":"Grave","dose":"Uso concomitante ou sem período de washout.","mech":"Somatório de inibição de prostaglandinas protetoras e redução da renovação epitelial gástrica.","sx":"Ulceração/perfuração gastroduodenal, melena, hematêmese, peritonite séptica.","tx":"Evitar. Washout de 5–7 dias entre AINEs (ou após corticoide). Se exposição: IBP + sucralfato + misoprostol.","ant":"—"},{"n":"AINE + IECA + Diurético (triple whammy)","t":"Interação","sp":"Cães e gatos com cardiopatia ou DRC","sev":"Grave","dose":"Pacientes cardiopatas/idosos com dor articular.","mech":"Bloqueio simultâneo da autorregulação renal (vasodilatação aferente por prostaglandinas e vasoconstrição eferente por angiotensina II) + hipovolemia.","sx":"Lesão renal aguda, hipercalemia.","tx":"Preferir analgesia sem AINE (gabapentina, amantadina, anti-NGF) ou monitorar creatinina e K com frequência.","ant":"—"},{"n":"Fluoroquinolonas + Teofilina/Aminofilina","t":"Interação","sp":"Cães, gatos, equinos","sev":"Moderada","dose":"Enrofloxacino/ciprofloxacino em pacientes com teofilina.","mech":"Inibição do CYP1A2 → acúmulo de teofilina.","sx":"Taquicardia, agitação, vômito, convulsões.","tx":"Reduzir teofilina em 30% ou usar marbofloxacino/outro antimicrobiano.","ant":"—"},{"n":"Síndrome serotoninérgica (tramadol, trazodona, ISRS, tricíclicos, selegilina, amitraz, mirtazapina, meperidina)","t":"Interação","sp":"Cães e gatos","sev":"Grave","dose":"Associação de dois ou mais fármacos serotoninérgicos ou sobredose.","mech":"Excesso de serotonina no SNC e periferia.","sx":"Agitação, hipertermia, tremores, mioclonias, midríase, taquicardia, vômito, diarreia, convulsões.","tx":"Suspender fármacos, CIPROEPTADINA 1,1 mg/kg VO/retal q4–6h (cães) ou 2–4 mg/gato, acepromazina/clorpromazina, resfriamento, benzodiazepínicos.","ant":"Ciproeptadina."},{"n":"Aminoglicosídeo + Furosemida (ou outros nefrotóxicos)","t":"Interação","sp":"Todas","sev":"Grave","dose":"Gentamicina/amicacina com diurético de alça, AINE, anfotericina B, desidratação.","mech":"Depleção de volume e somatório de lesão tubular/ototoxicidade.","sx":"Lesão renal aguda (cilindros granulosos na urina são o primeiro sinal), surdez, ataxia vestibular.","tx":"Hidratar antes, dose única diária, monitorar urinálise a cada 2–3 dias, evitar associação.","ant":"—"},{"n":"Ivermectina (dose alta) + Espinosade","t":"Interação","sp":"Cães","sev":"Grave","dose":"Demodicose tratada com ivermectina diária em cão que recebeu Comfortis/Trifexis.","mech":"Espinosade inibe glicoproteína-P → acúmulo de ivermectina no SNC (efeito semelhante ao MDR1).","sx":"Neurotoxicidade (ataxia, tremores, cegueira).","tx":"Evitar associação; preferir isoxazolinas para demodicose.","ant":"—"},{"n":"Antibióticos de espectro Gram+ em coelhos e roedores (clindamicina, lincomicina, ampicilina, amoxicilina VO, eritromicina)","t":"Interação","sp":"Coelhos, cobaias, hamsters, chinchilas","sev":"Fatal","dose":"Qualquer dose oral (e algumas parenterais).","mech":"Destruição da microbiota Gram+ → proliferação de Clostridium spiroforme/difficile (enterotoxemia).","sx":"Diarreia, anorexia, timpanismo, hipotermia, morte em 1–5 dias.","tx":"Suspender, fluidos, alimentação assistida (Critical Care), probióticos, metronidazol, colestiramina. Preferir enrofloxacino, SMZ-TMP, doxiciclina, azitromicina (com cautela), penicilina G parenteral.","ant":"—"},{"n":"Fenobarbital — indução enzimática","t":"Interação","sp":"Cães","sev":"Moderada","dose":"Uso crônico de fenobarbital.","mech":"Indução de CYP450 hepático.","sx":"Redução de eficácia de levetiracetam, zonisamida, ciclosporina, corticoides, doxiciclina, digoxina, cetamina; T4 total diminuído (falso hipotireoidismo); aumento de fosfatase alcalina.","tx":"Ajustar doses dos fármacos associados; interpretar T4 e enzimas com cautela.","ant":"—"},{"n":"Cetoconazol / Itraconazol + Ciclosporina (interação útil) ou + Cisaprida (perigosa)","t":"Interação","sp":"Cães e gatos","sev":"Moderada","dose":"Uso concomitante.","mech":"Inibição de CYP3A e glicoproteína-P.","sx":"Ciclosporina: níveis 2x maiores (permite reduzir dose em 50% e custo). Cisaprida: prolongamento QT e arritmias.","tx":"Monitorar níveis/sinais; evitar azóis com cisaprida.","ant":"—"},{"n":"Brometo de potássio + fluidos/dieta ricos em cloreto","t":"Interação","sp":"Cães","sev":"Moderada","dose":"Internação com NaCl 0,9% ou mudança de dieta.","mech":"Cloreto compete com brometo na reabsorção tubular → aumenta excreção do brometo.","sx":"Queda do nível sérico e crises convulsivas de escape.","tx":"Preferir fluidos com menos cloreto, manter dieta constante, dosar brometo.","ant":"—"},{"n":"Digoxina + Hipocalemia / Diuréticos","t":"Interação","sp":"Cães","sev":"Grave","dose":"Pacientes com ICC em furosemida.","mech":"Hipocalemia aumenta a ligação da digoxina à Na/K-ATPase.","sx":"Anorexia, vômito, arritmias (bloqueio AV, extrassístoles ventriculares).","tx":"Monitorar K e nível sérico (alvo 0,5–1 ng/mL), corrigir K, suspender digoxina.","ant":"Anticorpos Fab antidigoxina."},{"n":"Tetraciclinas / Fluoroquinolonas + Cálcio, Antiácidos, Sucralfato, Ferro","t":"Interação","sp":"Todas","sev":"Leve","dose":"Administração simultânea.","mech":"Quelação por cátions di/trivalentes reduz absorção.","sx":"Falha terapêutica.","tx":"Separar a administração em pelo menos 2 h.","ant":"—"},{"n":"Xilazina e alfa-2 em ruminantes gestantes","t":"Interação","sp":"Bovinos, ovinos, caprinos","sev":"Moderada","dose":"Terço final da gestação.","mech":"Efeito ocitócico (aumento do tônus uterino) e redução da perfusão placentária.","sx":"Aborto, parto prematuro.","tx":"Usar doses mínimas ou alternativas (anestesia local).","ant":"Atipamezol/ioimbina."},{"n":"Macrolídeos e lincosamidas em equinos adultos","t":"Interação","sp":"Equinos","sev":"Fatal","dose":"Eritromicina, azitromicina, tilosina, lincomicina, clindamicina em adultos (inclusive éguas cujos potros recebem macrolídeos — ingestão de fezes).","mech":"Disbiose do cólon (Clostridium difficile, Salmonella).","sx":"Colite aguda com diarreia profusa, endotoxemia, laminite.","tx":"Fluidoterapia intensa, plasma, polimixina B, flunixina dose antiendotóxica, di-tri-octaedral smectite.","ant":"—"},{"n":"Acepromazina em cães MDR1","t":"Interação","sp":"Collies e raças pastoras","sev":"Moderada","dose":"Doses usuais.","mech":"Deficiência de glicoproteína-P → maior acúmulo no SNC.","sx":"Sedação profunda e prolongada.","tx":"Reduzir dose em 25% (heterozigotos) a 30–50% (homozigotos). Também reduzir butorfanol, loperamida (evitar), vincristina, doxorrubicina.","ant":"—"}],"cases":[{"sp":"Cão (Canino)","spec":"Dermatologia & Infectologia","title":"Piodermite superficial canina por Staphylococcus pseudintermedius e escolha de 1ª linha","ctx":"Cão SRD, macho castrado, 4 anos, 18 kg, com prurido moderado, pápulas, pústulas foliculares e colaretes epidérmicos ventrais, sem sinais sistêmicos.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Terapia empírica de 1ª linha: Cefalexina 22–30 mg/kg VO a cada 12h por 21 dias (manter 7 dias após resolução completa das lesões).","Associar terapia tópica antisséptica (banhos com clorexidina 2% a 4%, tempo de contato de 10 minutos, 2x/semana) acelera a cura e reduz exposição sistêmica.","Se não houver melhora em 14 dias ou houver histórico prévio de antibióticos, realizar cultura bacteriana e antibiograma para descartar MRSP (Staphylococcus pseudintermedius resistente à meticilina)."],"take":""},{"sp":"Gato (Felino)","spec":"Toxicologia Clínica (Emergência)","title":"Intoxicação aguda por Paracetamol (Acetaminofeno) em felino doméstico","ctx":"Gato SRD, 2 anos, 4,0 kg, recebeu 1 comprimido humano de paracetamol 500 mg (125 mg/kg) administrado pelo tutor para febre. Chega após 3 horas com mucosas cianóticas/achocolatadas, edema facial e taquipneia.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Fisiopatologia: gatos possuem deficiência severa da enzima UDP-glicuronosiltransferase; a via oxidativa CYP450 gera NAPQI, causando oxidação da hemoglobina (meta-hemoglobinemia), corpúsculos de Heinz e necrose hepática centrolobular.","Antídoto específico: N-acetilcisteína (NAC) — dose de ataque 140 mg/kg IV (diluída a 5% em filtro de 0,22 μm) ou VO, seguida de 70 mg/kg a cada 6h por 7 doses.","Adjuvantes essenciais: Ácido ascórbico (Vitamina C) 30 mg/kg IV/VO a cada 6–12h (redutor de meta-hemoglobina), S-adenosilmetionina (SAMe) 20 mg/kg/dia VO e oxigenoterapia sem estresse."],"take":""},{"sp":"Gato (Felino)","spec":"Toxicologia Nefrológica","title":"Nefrotoxicidade aguda fatal por ingestão de Lírio (Lilium spp. / Hemerocallis spp.) em gato","ctx":"Gata Persa, 3 anos, 3,8 kg, flagrada mastigando folhas e pólen de lírio ornamental há 2 horas; apresenta êmese e sialorreia.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Todas as partes da planta (pétalas, folhas, caule, pólen e até a água do vaso) contêm toxinas hidrossolúveis que causam necrose tubular renal aguda irreversível em felinos.","Conduta imediata (< 2–4h): descontaminação gastrintestinal (indução de êmese se assintomática + carvão ativado 1–2 g/kg VO) e fluidoterapia intravenosa agressiva com Ringer com Lactato por 48–72 horas para manter diurese (2–4 mL/kg/h).","Monitorar creatinina, SDMA, fósforo, potássio e débito urinário a cada 12h; caso evolua para anúria, a hemodiálise precoce é a única terapia capaz de salvar o paciente."],"take":""},{"sp":"Cão (Canino)","spec":"Farmacogenética (Mutação ABCB1 / MDR1)","title":"Neurotoxicidade por Ivermectina em cão Pastor de Shetland homozigoto MDR1 (-/-)","ctx":"Cão Pastor de Shetland, 1,5 ano, 11 kg, recebeu ivermectina injetável extra-label (300 mcg/kg) para sarna sarcóptica e desenvolveu midríase, ataxia grave, tremores e estupor.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Mecanismo: cães das raças Collie, Pastor de Shetland, Australian Shepherd e Border Collie apresentam deleção no gene ABCB1 (MDR1), perdendo a glicoproteína-P funcional na barreira hematoencefálica.","Sem efluxo ativo pela glicoproteína-P, a ivermectina acumula-se no SNC e potencializa receptores GABA-A e canais de cloreto regulados por glutamato.","Tratamento: suporte intensivo (não há antídoto específico; flumazenil não reverte). Emulsão lipídica intravenosa (Intralipid 20% — bolus 1,5 mL/kg IV seguido de 0,25 mL/kg/min por 30–60 min) atua como 'lipid sink' sequestrando o fármaco lipofílico."],"take":""},{"sp":"Cão (Canino)","spec":"Cardiologia Veterinária (Consenso ACVIM)","title":"Doença Mixomatosa da Valva Mitral (DMVM) Estágio C — Edema Pulmonar Agudo","ctx":"Cão Poodle, 11 anos, 7,5 kg, sopro sistólico apical esquerdo grau V/VI, chega em dispneia expiratória, taquipneia (68 irpm), crepitações pulmonares difusas e tosse produtiva rosada.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Estabilização de emergência: oxigenoterapia em câmara/máscara (mínimo estresse), Furosemida 2–4 mg/kg IV/IM repetida a cada 1–2h até redução da frequência respiratória (< 35 irpm) e Butorfanol 0,2 mg/kg IM para ansiólise.","Inodilatador obrigatório: Pimobendan 0,25–0,3 mg/kg VO a cada 12h (1 hora antes da alimentação) — melhora contratilidade (sensibilizador de cálcio) e promove vasodilatação balanceada (inibidor PDE-3).","Terapia crônica quádrupla (Consenso ACVIM): Furosemida (menor dose eficaz) + Pimobendan + IECA (Benazepril ou Enalapril 0,5 mg/kg 12/12h) + Espironolactona (2 mg/kg VO 24/24h)."],"take":""},{"sp":"Gato (Felino)","spec":"Cardiologia & Emergência Vascular","title":"Cardiomiopatia Hipertrófica Felina (CMH) complicada com Tromboembolismo Aórtico (TEA)","ctx":"Gato Maine Coon, 5 anos, 6,8 kg, vocalização aguda intensa, paresia bilateral dos membros pélvicos, coxins pálidos/cianóticos, hipotermia dos membros posteriores e ausência de pulso femoral.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Analgesia imediata é prioridade ética e hemodinâmica: Metadona 0,2–0,3 mg/kg IV/IM a cada 4–6h ou Fentanil CRI 3–5 mcg/kg/h.","Anticoagulação e antiagregação: Enoxaparina 0,75–1 mg/kg SC a cada 6–12h (ou Heparina não fracionada) associada a Clopidogrel 18,75 mg/gato (1/4 de comprimido de 75 mg) VO a cada 24h.","Avaliar edema pulmonar concomitante por POCUS torácico (linhas B) antes de administrar fluidoterapia; evitar estresse e hiper-hidratação."],"take":""},{"sp":"Cão (Canino)","spec":"Doenças Infecciosas & Hemoparasitoses","title":"Erliquiose Monocítica Canina Aguda (Ehrlichia canis) com Trombocitopenia Severa","ctx":"Cão Labrador, 3 anos, 28 kg, febre (40,3°C), petéquias gengivais, epistaxe discreta, linfadenomegalia generalizada e plaquetas em 28.000/μL.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Tratamento etiológico de escolha: Doxiciclina 5 mg/kg VO a cada 12h (ou 10 mg/kg VO a cada 24h) por 28 dias consecutivos.","Administrar sempre junto com alimento e água para prevenir esofagite e vômitos; evitar antiácidos ou sucralfato nas 2 horas próximas à dose (quelação reduz absorção).","Investigar coinfecção por Babesia vogeli (esfregaço sanguíneo/PCR); se positiva, associar Dipropionato de Imidocarb 5–6,6 mg/kg IM/SC (repetir em 14 dias) com pré-medicação de atropina 0,02–0,04 mg/kg SC."],"take":""},{"sp":"Gato (Felino)","spec":"Zoonoses & Micologia Clínica","title":"Esporotricose Felina Cutâneo-Mucosa por Sporothrix brasiliensis","ctx":"Gato macho inteiro com acesso à rua, 3 anos, 4,5 kg, lesões ulceradas exsudativas no plano nasal, pavilhões auriculares e dígitos, com espirros frequentes.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Protocolo antifúngico de 1ª escolha: Itraconazol 50 a 100 mg/gato (10 mg/kg) VO a cada 24h administrado obrigatoriamente junto com alimento úmido (melhora biodisponibilidade).","Em casos refratários ou com acometimento nasal profundo, associar Iodeto de Potássio manipulado (2,5 a 5 mg/kg VO a cada 24h) monitorando sinais de iodismo (lacrimejamento, anorexia, vômitos).","Manter tratamento por no mínimo 30 dias após a cicatrização completa de todas as lesões e resolução dos sinais respiratórios; monitorar ALT e enzimas hepáticas mensalmente e orientar uso de luvas pelo tutor (zoonose)."],"take":""},{"sp":"Cão (Canino)","spec":"Neurologia & Emergência","title":"Status Epilepticus Canino — Escalonamento Terapêutico Baseado em Evidência (ACVIM)","ctx":"Cão Beagle, 4 anos, 14 kg, em atividade convulsiva tônico-clônica generalizada contínua há 12 minutos.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["1ª linha (0–5 min): Diazepam 0,5–1 mg/kg IV (ou intrarretal) ou Midazolam 0,2–0,5 mg/kg IV/intranasal (pode repetir até 3 doses).","2ª linha (manutenção de longa ação): Fenobarbital 4–6 mg/kg IV lento a cada 20–30 min até dose cumulativa máxima de 16–20 mg/kg/24h (ou Levetiracetam 30–60 mg/kg IV bolus).","3ª linha (status refratário): Propofol bolus 2–4 mg/kg IV seguido de CRI 0,1–0,4 mg/kg/min ou Midazolam CRI 0,2–0,5 mg/kg/h, controlando glicemia, temperatura corporal e edema cerebral (Manitol 0,5–1 g/kg IV em 20 min)."],"take":""},{"sp":"Cão (Canino)","spec":"Endocrinologia & Terapia Intensiva","title":"Cetoacidose Diabética (CAD) Canina com Hipocalemia Grave","ctx":"Cadela Schnauzer, 9 anos, 9,2 kg, poliúria/polidipsia prévia, chega prostrada, desidratada (8%), vômitos, hálito cetônico, glicemia 485 mg/dL, pH venoso 7,14 e potássio sérico 2,7 mEq/L.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Regra de ouro: corrigir primeiramente a volemia e o potássio ANTES de iniciar insulina regular, pois a insulina desloca K+ para o meio intracelular podendo causar parada cardíaca por hipocalemia.","Fluidoterapia inicial com NaCl 0,9% (reposição de déficit em 12–24h + manutenção) suplementada com KCl 19,1% na concentração de 30–40 mEq/L (respeitando teto de 0,5 mEq/kg/h).","Após 2–4h de fluidoterapia e K+ > 3,0 mEq/L: iniciar Insulina Regular em infusão contínua (CRI 0,05–0,1 UI/kg/h) ou protocolo IM horário (0,1–0,2 UI/kg), visando queda gradual da glicemia de 50–75 mg/dL/hora."],"take":""},{"sp":"Gato (Felino)","spec":"Emergência Urológica Felina","title":"Obstrução Uretral Felina (DTUIF) com Hipercalemia Cardiotóxica","ctx":"Gato macho castrado, 4 anos, 5,1 kg, anúria há 36h, bexiga repleta e firme, bradicardia (95 bpm), ondas T apiculadas e ausência de onda P no ECG, potássio sérico em 7,8 mEq/L.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Cardioproteção imediata (antagonismo de membrana): Gluconato de Cálcio 10% 0,5–1,5 mL/kg IV lento em 10–15 min sob monitorização eletrocardiográfica contínua.","Redistribuição intracelular rápida de potássio: Insulina Regular 0,25–0,5 UI/kg IV seguida de bolus de Glicose 50% (0,5 g/kg diluída 1:4) + fluidoterapia IV livre de potássio (NaCl 0,9%).","Analgesia e relaxamento uretral pós-desobstrução: Metadona 0,2 mg/kg IV/IM + Prazosina 0,25–0,5 mg/gato VO a cada 12h (bloqueador alfa-1 uretral)."],"take":""},{"sp":"Cão (Canino)","spec":"Toxicologia Alimentar","title":"Intoxicação por Xilitol (Goma de Mascar / Adoçante) em Cão","ctx":"Cão Golden Retriever, 2 anos, 26 kg, ingeriu 1 pacote de goma de mascar sem açúcar contendo 8 g de xilitol (~307 mg/kg) há 45 minutos.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Em cães, o xilitol provoca liberação maciça e dose-dependente de insulina pancreática (doses > 75–100 mg/kg causam hipoglicemia severa; doses > 500 mg/kg causam necrose hepática fulminante).","Conduta: se assintomático e ingestão < 60 min, induzir êmese (apomorfina 0,03 mg/kg IV ou peróxido de hidrogênio 3% 1–2 mL/kg VO); nota: carvão ativado liga-se fracamente ao xilitol.","Infusão contínua de glicose (dextrose 2,5% a 5% IV) monitorando glicemia a cada 2h por 24h, associada a hepatoprotetores (N-acetilcisteína, SAMe e silimarina) e perfil hepático (ALT, AST, bilirrubinas, TP/TTPa) por 72h."],"take":""},{"sp":"Gato (Felino)","spec":"Toxicologia Dermatológica","title":"Intoxicação por Permetrina (Pipeta Antipulgas de Uso Exclusivo Canino) em Gato","ctx":"Gato SRD, 3 anos, 4,2 kg, recebeu pipeta spot-on de permetrina 65% indicada para cães; apresenta fasciculações musculares generalizadas, hiperestesia, tremores intensos e hipertermia (40,8°C).","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Gatos possuem deficiência na glicuronidação hepática de piretroides tipo I (permetrina), resultando em abertura prolongada dos canais de sódio neuronais e hiperexcitabilidade.","Controle imediato dos tremores: Metocarbamol 55–220 mg/kg IV (máx. 330 mg/kg/dia) ou Diazepam/Midazolam 0,5 mg/kg IV (se refratário, Propofol CRI 0,1–0,3 mg/kg/min).","Descontaminação cutânea rigorosa assim que estabilizado: banho com água morna e detergente neutro (lava-louças suave) para remover o veículo oleoso; associar Emulsão Lipídica IV 20%."],"take":""},{"sp":"Cão (Canino)","spec":"Toxicologia Doméstica","title":"Intoxicação por Teobromina e Cafeína (Chocolate Amargo) em Cão","ctx":"Cão Dachshund, 6 anos, 8,0 kg, ingeriu 150 g de chocolate 70% cacau (~1.200 mg de teobromina = 150 mg/kg) há 1,5 hora; apresenta taquicardia sinusal (195 bpm), agitação e vômitos.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Metilxantinas antagonizam receptores de adenosina e inibem fosfodiesterase (doses > 20 mg/kg causam sinais GI; > 40–50 mg/kg cardiotoxicidade; > 60 mg/kg convulsões).","Descontaminação: êmese (se sem risco de aspiração) seguida de doses múltiplas de Carvão Ativado (1–2 g/kg VO a cada 6–8h por 24h) devido à recirculação êntero-hepática da teobromina.","Suporte cardiovascular: fluidoterapia IV para acelerar excreção urinária (manter bexiga esvaziada para evitar reabsorção vesical) e betabloqueador (Propranolol 0,02–0,06 mg/kg IV lento ou Esmolol) para taquiarritmias."],"take":""},{"sp":"Cão (Canino)","spec":"Gastroenterologia & Terapia Intensiva","title":"Pancreatite Aguda Grave Canina — Manejo Analgésico e Nutricional Atualizado","ctx":"Cadela Yorkshire, 8 anos, 4,5 kg, vômitos incoercíveis, dor abdominal cranial intensa (posição de prece), diarreia e cPL (lipase pancreática específica) fortemente positiva.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Analgesia multimodal potente (prioridade): Fentanil CRI (3–5 mcg/kg/h) ou Metadona 0,2–0,3 mg/kg IV/SC a cada 6h associada a Lidocaína CRI (25–50 mcg/kg/min IV — somente em cães).","Controle antiemético duplo: Maropitant (Cerenia) 1 mg/kg IV/SC a cada 24h + Ondansetrona 0,5 mg/kg IV a cada 8h (bloqueio central e periférico).","Nutrição enteral precoce: abolido o jejum prolongado histórico! Iniciar dieta hiperdigestível com baixo teor de gordura (< 15% na matéria seca) assim que o vômito estiver controlado."],"take":""},{"sp":"Equino (Cavalo)","spec":"Medicina Equina & Gastroenterologia","title":"Síndrome Cólica Equina por Compactação de Cólon Maior e Controle da Endotoxemia","ctx":"Equino Quarto de Milha, 7 anos, 480 kg, desconforto abdominal moderado, redução de motilidade cecal/cólica, TPC 2,5 s, FC 52 bpm, massa firme palpável na flexura pélvica.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Analgesia visceral sem mascarar quadros cirúrgicos: Flunixin Meglumine 1,1 mg/kg IV (ou dose antiendotóxica 0,25 mg/kg IV a cada 8h) associado a Butorfanol 0,02–0,05 mg/kg IV + Detomidina 10–20 mcg/kg IV.","Hidratação enteral e parenteral: fluidoterapia poliônica IV (Ringer com Lactato) + hidratação enteral via sonda nasogástrica com solução eletrolítica isotônica (6–8 L a cada 2h) e sulfato de magnésio (0,5–1 g/kg diluído).","Prevenção de laminite secundária à endotoxemia: crioterapia digital contínua nos cascos (botas de gelo abaixo do carpo/tarso) e Polimixina B (6.000 UI/kg IV a cada 8–12h)."],"take":""},{"sp":"Equino (Cavalo)","spec":"Ortopedia & Podologia Equina","title":"Laminite Aguda Equina Secundária a Sobrecarga de Carboidratos","ctx":"Égua Mangalarga Marchador, 6 anos, 420 kg, invadiu depósito de ração concentrada há 18 horas; apresenta claudicação grau 4 de Obel, postura de apoio nos talões, pulso digital forte e aumento de temperatura nos cascos torácicos.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Crioterapia imediata dos cascos (imersão em gelo e água < 5°C por 48–72h) reduz atividade das metaloproteinases de matriz (MMP-2 e MMP-9) e protege as lâminas dérmicas.","Controle anti-inflamatório e analgésico: Fenilbutazona 4,4 mg/kg IV no 1º dia, seguida de 2,2 mg/kg IV/VO a cada 12h, associada a Acepromazina 0,02–0,04 mg/kg IM a cada 8h (vasodilatação periférica e tranquilização).","Suporte mecânico imediato da falange distal (palmilhas de EVA/espuma de alta densidade moldadas à ranilha) e confinamento absoluto em baia com cama macia profunda."],"take":""},{"sp":"Bovino (Vaca)","spec":"Buiatria & Clínica Metabólica","title":"Hipocalcemia Puerperal Bovina (Febre do Leite) em Vaca Holandesa de Alta Produção","ctx":"Vaca Holandesa, 5 anos, 580 kg, 24 horas pós-parto, em decúbito esternal com autoauscultação (pescoço em 'S'), extremidades frias, midríase, atonia ruminal e FC 110 bpm com bulhas hipofonéticas.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Terapia específica de emergência: Borogluconato de Cálcio 20% a 25% — administrar 1 g de cálcio ionizável por 45 kg de peso vivo (400–500 mL de solução a 23% para vaca de 580 kg) por via IV LENTA em 15–20 minutos.","Ausculta cardíaca contínua obrigatória durante a infusão: se ocorrer bradicardia severa, arritmia ou bloqueio AV, interromper imediatamente a infusão IV e administrar o restante por via SC.","Prevenção de recidiva: fornecer gel ou bolus oral de propionato/cloreto de cálcio 12h após a recuperação e adotar dieta aniônica (DCAD negativo) no pré-parto."],"take":""},{"sp":"Bovino (Vaca)","spec":"Buiatria & Doenças Hemoparasitárias","title":"Tristeza Parasitária Bovina (Babesiose / Anaplasmose) em Novilha","ctx":"Novilha Girolando, 14 meses, 260 kg, febre (41,2°C), mucosas pálidas e ictéricas, hemoglobinúria ('urina cor de café'), apatia e infestação por Rhipicephalus microplus.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Tratamento etiológico duplo (quando PCR/esfregaço não diferencia imediatamente Babesia spp. de Anaplasma marginale): Dipropionato de Imidocarb 3 mg/kg SC/IM (atua contra ambos) associado a Oxitetraciclina LA 20 mg/kg IM profunda (repetir em 72h).","Em surtos confirmados de Babesia bovis (babesiose cerebral), o Aceturato de Diminazeno 3,5 mg/kg IM profunda apresenta resposta rápida.","Suporte hematopoiético e transfusão de sangue total (10–15 mL/kg IV) se hematócrito < 12% com dispneia; respeitar carência oficial MAPA para abate/leite."],"take":""},{"sp":"Ovino / Caprino","spec":"Clínica de Pequenos Ruminantes","title":"Toxemia da Prenhez em Ovelha Gestante de Gêmeos","ctx":"Ovelha Santa Inês, 4 anos, 55 kg, terço final de gestação gemelar, anorexia há 48h, cegueira central aparente, tremores auriculares, cetonúria intensa e hipoglicemia (24 mg/dL).","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Reposição energética imediata: Glicose 50% (60–100 mL IV lento) seguida de Propilenoglicol 60 mL VO a cada 12h como precursor gliconeogênico.","Correção da acidose metabólica e suporte: fluidoterapia IV com Ringer com Lactato, Vitaminas do Complexo B (especialmente tiamina/B1 10 mg/kg IM) e Cálcio SC.","Avaliar indução do parto/cesariana se não houver resposta clínica em 24h (Dexametasona 16–20 mg IM induz parto em ovinos em 36–48h)."],"take":""},{"sp":"Coelho (Lagomorfo)","spec":"Medicina de Animais Silvestres & Exóticos","title":"Síndrome da Estase Gastrintestinal em Coelho Doméstico e Disbiose por Antibióticos","ctx":"Coelho Mini Lop, 2 anos, 2,1 kg, anorexia há 20h, ausência de cíbalos fecais, distensão gástrica gasosa discreta e dor abdominal.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["NUNCA prescrever penicilinas orais (amoxicilina), cefalosporinas orais, clindamicina ou lincomicina em coelhos/cobaias — provocam enterotoxemia fatal por Clostridium spiroforme!","Analgesia visceral (essencial para restaurar motilidade): Buprenorfina 0,03 mg/kg SC a cada 8h + Meloxicam 0,5 mg/kg VO/SC a cada 24h (após hidratação).","Reidratação agressiva (80–100 mL/kg/dia SC/IV), pró-cinéticos (Metoclopramida 0,5 mg/kg SC/VO a cada 8h após descartar obstrução mecânica por radiografia) e alimentação assistida por seringa rica em fibras."],"take":""},{"sp":"Ave (Psitacídeo)","spec":"Medicina Aviária","title":"Clamidiose Aviária (Chlamydia psittaci) em Calopsita — Protocolo Terapêutico e Zoonótico","ctx":"Calopsita (Nymphicus hollandicus), 92 g, conjuntivite bilateral, secreção nasal seromucosa, penas eriçadas e fezes com uratos esverdeados (biliverdinúria).","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Tratamento de eleição (potencial zoonótico — psitacose): Doxiciclina 25 a 50 mg/kg VO a cada 24h (ou 12/12h) por 45 dias consecutivos.","Remover fontes suplementares de cálcio (osso de siba, blocos minerais) durante o tratamento oral com doxiciclina para evitar quelação e falha terapêutica.","Notificar/orientar o tutor sobre precauções de biossegurança (aerossóis de fezes secas) e realizar limpeza úmida diária do recinto."],"take":""},{"sp":"Cão (Canino)","spec":"Psiquiatria & Comportamento Veterinário (Off-Label)","title":"Fobia Sonora Severa (Fogos de Artifício / Tempestades) — Protocolo Ansiolítico Combinado","ctx":"Cão SRD, 5 anos, 16 kg, pânico extremo durante tempestades e fogos (destruição de portas, sialorreia intensa, taquipneia, tentativas de fuga).","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Uso OFF-LABEL respaldado: Trazodona 5 mg/kg VO (80 mg) administrada 90–120 minutos antes do evento previsto, isolada ou associada a Alprazolam 0,03–0,05 mg/kg VO (0,5–0,75 mg) 45–60 min antes.","Alternativa com benzodiazepínico de alta potência: Clonazepam 0,1–0,25 mg/kg VO 60–90 min antes (lembrar que estudos de longo prazo são limitados e o uso contínuo gera tolerância).","NUNCA utilizar acepromazina isolada para fobias sonoras: promove contenção motora sem ansiólise real, agravando o trauma fóbico do cão."],"take":""},{"sp":"Gato (Felino)","spec":"Medicina Felina & Manejo Cat-Friendly","title":"Ansiólise Pré-Consulta e Transporte em Felino Altamente Reativo","ctx":"Gato SRD, 4 anos, 4,8 kg, agressividade extrema por medo na caixa de transporte e clínica veterinária, impossibilitando exame físico e coleta de sangue.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Protocolo de eleição: Gabapentina 100 mg/gato (~20 mg/kg) VO administrada 90 a 120 minutos antes de colocar o gato na caixa de transporte (ou Pregabalina veterinária 5 mg/kg VO 90 min antes).","Alternativa off-label: Trazodona 50 mg/gato VO 90 min antes da consulta.","Reduz drasticamente cortisol, taquicardia e reatividade defensiva, permitindo exame físico seguro sem necessidade de contenção física traumática."],"take":""},{"sp":"Cão (Canino)","spec":"Anestesiologia & Analgesia Multimodal","title":"Infusão Contínua Analgésica (CRI — MLK) em Cirurgia Ortopédica Canina","ctx":"Cão Pastor Alemão, 6 anos, 34 kg, submetido a osteossíntese de fêmur com dor somática e neuropática intensa.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Associação sinérgica MLK (Morfina + Lidocaína + Cetamina): reduz a Concentração Alveolar Mínima (CAM) do isoflurano em até 45%, minimizando hipotensão anestésica.","Taxas padrão CRI em cães: Morfina 0,1–0,2 mg/kg/h + Lidocaína 25–50 mcg/kg/min (1,5–3 mg/kg/h) + Cetamina 2–10 mcg/kg/min (0,12–0,6 mg/kg/h), precedidas de bolus de carga.","Importante: em gatos, substituir a lidocaína sistêmica IV (risco de toxicidade cardiovascular felina) pela associação Fentanil + Cetamina (FLK sem lidocaína)."],"take":""},{"sp":"Cão (Canino)","spec":"Nefrologia & Urologia (Consenso IRIS)","title":"Doença Renal Crônica (DRC) Canina Estágio III com Proteinúria e Hipertensão","ctx":"Cadela Cocker Spaniel, 12 anos, 13 kg, creatinina 3,1 mg/dL, SDMA 32 μg/dL, Relação Proteína/Creatinina Urinária (RPCU) = 1,8 e Pressão Arterial Sistólica (PAS) = 185 mmHg.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Controle antiproteinúrico: IECA (Benazepril ou Enalapril 0,5 mg/kg VO a cada 12–24h) ou Telmisartana 1 mg/kg VO a cada 24h, monitorando creatinina e potássio 7–14 dias após início.","Controle anti-hipertensivo adicional (PAS > 160 mmHg persistente): associar bloqueador de canal de cálcio Anlodipino 0,1–0,25 mg/kg VO a cada 24h.","Dieta renal terapêutica restrita em fósforo (< 0,5% MS), quelante de fósforo entérico (Hidróxido de Alumínio 30–90 mg/kg/dia com refeições) e hidratação contínua."],"take":""},{"sp":"Cão (Canino)","spec":"Hepatologia Veterinária","title":"Hepatopatia Vacuolar Induzida por Corticoide vs. Hepatite Crônica Canina","ctx":"Cão Shih-tzu, 9 anos, 6,2 kg, em uso prolongado de prednisona para alergia; apresenta fosfatase alcalina (FA) = 1.450 U/L, ALT = 190 U/L, poliúria/polidipsia e hepatomegalia.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Cães possuem isoenzima específica da FA induzida por glicocorticoides (C-ALP), elevando acentuadamente a FA sem necessariamente indicar necrose hepatocelular grave.","Conduta: realizar desmame gradual da prednisolona (nunca suspender abruptamente pelo risco de insuficiência adrenal iatrogênica) e migrar controle alérgico para Oclacitinib (Apoquel) ou Lokivetmab (Cytopoint).","Suporte hepatoprotetor: S-adenosilmetionina (SAMe) 20 mg/kg VO em jejum + Silimarina 10–15 mg/kg VO 12/12h."],"take":""},{"sp":"Cão (Canino)","spec":"Oftalmologia Veterinária","title":"Úlcera de Córnea Profunda (Estromal) — Contraindicação Absoluta de Corticoides Tópicos","ctx":"Cão Pug, 3 anos, 8,5 kg, blefarospasmo intenso, epífora, miose reflexa (uveíte anterior secundária) e teste de fluoresceína positivo com defeito estromal central.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["PROIBIÇÃO ABSOLUTA: colírios contendo corticosteroides (dexametasona, prednisolona) potencializam colagenases corneanas, causando ceratomalácia ('melting') e perfuração ocular!","Protocolo tópico: colírio antibiótico de amplo espectro (Tobramicina 0,3% ou Moxifloxacino 0,5% — 1 gota a cada 4–6h) + colírio anticolagenase (soro autólogo refrigerado a cada 2–4h) + Atropina 1% colírio (1 gota 12/12h para cicloplegia e dor ciliar).","Analgesia sistêmica com Meloxicam 0,1 mg/kg VO 24/24h e colar elisabetano obrigatório 24h/dia."],"take":""},{"sp":"Cão (Canino)","spec":"Oncologia Veterinária (Cálculo BSA)","title":"Linfoma Multicêntrico Canino — Protocolo CHOP e Dosagem por Superfície Corporal (m²)","ctx":"Cão Boxer, 7 anos, 30 kg (BSA = 0,97 m²), linfadenomegalia periférica generalizada confirmada por citologia e imunofenotipagem como linfoma de células B de alto grau.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Quimioterápicos de janela terapêutica estreita são dosados pela Área de Superfície Corporal (BSA em m²) — exceto em cães < 10–15 kg para doxorrubicina (1 mg/kg IV) para evitar mielossupressão.","Protocolo CHOP semanal: Vincristina 0,5–0,7 mg/m² IV (semanas 1 e 3), Ciclofosfamida 250 mg/m² VO/IV (semana 2, associada a furosemida para prevenir cistite hemorrágica estéril), Doxorrubicina 30 mg/m² IV lento (semana 4) + Prednisolona em desmame.","Realizar hemograma completo antes de cada sessão (adiar se neutrófilos segmentados < 1.500–2.000/μL) e ecocardiograma basal antes da doxorrubicina (cardiotoxicidade cumulativa)."],"take":""},{"sp":"Réptil (Quelônio)","spec":"Medicina de Répteis & Exóticos","title":"Toxicidade Fatal por Ivermectina em Quelônios (Jabuti / Tartaruga)","ctx":"Jabuti-piranga (Chelonoidis carbonaria), 2,4 kg, apresenta paresia flácida, retração ausente de cabeça e membros e depressão respiratória após aplicação de ivermectina para parasitas.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["CONTRAINDICAÇÃO ABSOLUTA: a ivermectina atravessa facilmente a barreira hematoencefálica de quelônios (jabutis, cágados e tartarugas), causando paralisia flácida prolongada e óbito por falência respiratória.","Para endoparasitoses em quelônios, utilizar Fembendazol (25–50 mg/kg VO a cada 24h por 3–5 dias) ou Praziquantel (5–8 mg/kg VO/IM).","Tratamento de suporte na intoxicação: manutenção na zona de temperatura ótima preferida (ZTOP 28–30°C), fluidoterapia intracelomática/epicelômica e suporte ventilatório."],"take":""},{"sp":"Cão (Canino)","spec":"Oncologia","title":"Tumor Venéreo Transmissível (TVT) genital em cadela errante","ctx":"Cadela SRD, 3 anos, 14 kg, resgatada, com massa friável, sanguinolenta e em couve-flor na vulva, secreção serossanguinolenta e odor fétido. Citologia por imprint: células redondas com citoplasma vacuolizado (vacúolos em colar de contas).","q":"Qual o protocolo de escolha e o que monitorar?","pts":["Diagnóstico citológico é suficiente na maioria dos casos (células redondas com vacúolos citoplasmáticos característicos).","Quimioterapia de escolha: SULFATO DE VINCRISTINA 0,025 mg/kg (ou 0,5–0,75 mg/m²) IV estrita, semanal, por 4–8 semanas, mantendo 2 aplicações após remissão completa.","Hemograma antes de cada sessão (suspender se neutrófilos < 2.000/µL). Atenção ao extravasamento (vesicante): cateter limpo em primeira tentativa.","Casos resistentes: doxorrubicina 30 mg/m² a cada 3 semanas. Cirurgia isolada tem alta recidiva.","Castração após o tratamento e controle populacional reduzem transmissão."],"take":"Vincristina semanal cura > 90% dos TVTs — monitorar hemograma e neuropatia/constipação."},{"sp":"Cão (Canino)","spec":"Doenças Infecciosas / Zoonoses","title":"Leishmaniose visceral canina em área endêmica","ctx":"Cão macho, 5 anos, 22 kg, Fortaleza-CE. Emagrecimento, onicogrifose, descamação furfurácea periocular, linfadenomegalia generalizada e epistaxe. Hiperglobulinemia, anemia normocítica e UPC 1,8; creatinina 1,6 mg/dL. Sorologia (ELISA + TR DPP) reagente e PCR de medula positivo.","q":"Como estadiar, tratar e quais as obrigações legais?","pts":["Estadiamento LeishVet: estágio III (doença grave — proteinúria, IRIS 1–2). Medir PA e UPC.","Tratamento autorizado no Brasil: MILTEFOSINA (Milteforan) 2 mg/kg VO q24h por 28 dias + ALOPURINOL 10 mg/kg VO q12h por no mínimo 6–12 meses (dieta com baixo teor de purinas para evitar urólitos de xantina).","Proteinúria: benazepril 0,5 mg/kg q24h ou telmisartana 1 mg/kg q24h; dieta renal; tratar hipertensão.","Coleira de DELTAMETRINA 4% ou repelente de permetrina (cães) em TODOS os cães da casa — reduz transmissão pelo flebotomíneo (Lutzomyia longipalpis).","É doença de NOTIFICAÇÃO COMPULSÓRIA; tratamento não elimina o parasita — o tutor deve assinar termo de responsabilidade (Portaria Interministerial 1.426/2008 e Nota Técnica MAPA 11/2016)."],"take":"Miltefosina + alopurinol + coleira repelente; reavaliar sorologia, proteinúria e clínica a cada 3–6 meses."},{"sp":"Cão (Canino)","spec":"Gastroenterologia / Infecciosas","title":"Parvovirose canina em filhote não vacinado","ctx":"Filhote Rottweiler, 10 semanas, 6 kg, vômitos incoercíveis, diarreia hemorrágica fétida, desidratação de 8%, leucopenia (1.800/µL) e teste rápido de antígeno fecal positivo.","q":"Quais pilares do tratamento intensivo?","pts":["Fluidoterapia IV com cristaloide isotônico (déficit + manutenção + perdas) e reposição de K (KCl conforme escala) e glicose 2,5–5% se hipoglicêmico.","Antieméticos: MAROPITANT 1 mg/kg IV/SC q24h ± ondansetrona 0,5 mg/kg IV q8–12h.","Antibioticoterapia de amplo espectro pela translocação bacteriana e neutropenia: ampicilina 22 mg/kg IV q8h (ou amoxicilina-clavulanato) ± enrofloxacino (cautela em filhote) ou cefoxitina.","NUTRIÇÃO ENTERAL PRECOCE (sonda nasoesofágica em 12–24 h) reduz tempo de internação. Analgesia (metadona/buprenorfina, lidocaína IC).","Isolamento; desinfecção com hipoclorito de sódio 1:30 (o vírus resiste a quaternários de amônio comuns)."],"take":"Sobrevida > 85–90% com fluido, antiemético, antibiótico e alimentação enteral precoce."},{"sp":"Cão (Canino)","spec":"Doenças Infecciosas / Hematologia","title":"Babesiose canina (Babesia vogeli) com anemia hemolítica","ctx":"Cão Pinscher, 2 anos, 4 kg, com infestação por carrapatos, febre (40,2 °C), mucosas pálidas e ictéricas, esplenomegalia. Ht 18%, trombocitopenia 45.000/µL, merozoítos piriformes em esfregaço de sangue periférico.","q":"Qual a terapia específica e cuidados adicionais?","pts":["DIPROPIONATO DE IMIDOCARB 5–6,6 mg/kg SC/IM, 2 doses com intervalo de 14 dias, com pré-medicação de ATROPINA 0,02–0,04 mg/kg SC 15 min antes (efeitos colinérgicos).","Alternativa: aceturato de diminazeno 3,5 mg/kg IM dose única (não repetir — neurotoxicidade).","Investigar coinfecção com Ehrlichia canis (doxiciclina 10 mg/kg q24h por 28 dias) e Anaplasma.","Transfusão de sangue/concentrado de hemácias se Ht < 15% ou sinais de hipóxia. Prednisolona apenas se componente imunomediado importante.","Controle de carrapatos com isoxazolina (fluralaner, afoxolaner, sarolaner, lotilaner) no paciente e no ambiente."],"take":"Imidocarb com atropina prévia + pesquisa de hemoparasitas concomitantes."},{"sp":"Cão (Canino)","spec":"Reprodução / Emergência","title":"Piometra fechada em cadela de meia-idade","ctx":"Cadela Poodle, 8 anos, 7 kg, não castrada, último cio há 6 semanas, recebeu 'injeção anticoncepcional' no passado. Apatia, PU/PD, vômitos, distensão abdominal. Leucocitose 38.000/µL com desvio à esquerda; ultrassom com útero distendido por conteúdo anecoico com pontos ecogênicos.","q":"Qual a conduta preferencial e alternativas?","pts":["Estabilização: fluidoterapia IV, correção eletrolítica, antibiótico (ampicilina + enrofloxacino ou amoxicilina-clavulanato IV) e analgesia (metadona). Evitar AINE em sepse/azotemia.","OVÁRIO-HISTERECTOMIA de emergência após estabilização é o tratamento de escolha (piometra fechada — risco de ruptura e peritonite).","Tratamento clínico apenas para reprodutoras jovens e estáveis (piometra aberta): AGLEPRISTONE 10 mg/kg SC nos dias 1, 2, 8 e 14 ± cloprostenol 1 mcg/kg SC q48h + antibiótico; alta recidiva.","Orientar sobre os riscos dos progestágenos ('anticoncepcionais') em cadelas e gatas: piometra,
