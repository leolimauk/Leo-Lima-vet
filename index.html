<!DOCTYPE html>
<html lang="pt-BR">

<title>Clínica Vet Pro</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22116%22%20fill%3D%22%230f172a%22%2F%3E%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%22178%22%20fill%3D%22none%22%20stroke%3D%22%232dd4bf%22%20stroke-width%3D%2214%22%2F%3E%3Cpath%20d%3D%22M162%20176%20L256%20362%20L350%20176%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2230%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cline%20x1%3D%22256%22%20y1%3D%22140%22%20x2%3D%22256%22%20y2%3D%22388%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%22256%22%20cy%3D%22136%22%20r%3D%2213%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M286%20190%20C%20226%20202%2C%20224%20238%2C%20256%20252%20C%20288%20266%2C%20288%20302%2C%20228%20320%22%20fill%3D%22none%22%20stroke%3D%22%232dd4bf%22%20stroke-width%3D%2213%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%22288%22%20cy%3D%22188%22%20r%3D%2212%22%20fill%3D%22%232dd4bf%22%2F%3E%3C%2Fsvg%3E%0A" />
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22116%22%20fill%3D%22%230f172a%22%2F%3E%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%22178%22%20fill%3D%22none%22%20stroke%3D%22%232dd4bf%22%20stroke-width%3D%2214%22%2F%3E%3Cpath%20d%3D%22M162%20176%20L256%20362%20L350%20176%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2230%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cline%20x1%3D%22256%22%20y1%3D%22140%22%20x2%3D%22256%22%20y2%3D%22388%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%22256%22%20cy%3D%22136%22%20r%3D%2213%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M286%20190%20C%20226%20202%2C%20224%20238%2C%20256%20252%20C%20288%20266%2C%20288%20302%2C%20228%20320%22%20fill%3D%22none%22%20stroke%3D%22%232dd4bf%22%20stroke-width%3D%2213%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%22288%22%20cy%3D%22188%22%20r%3D%2212%22%20fill%3D%22%232dd4bf%22%2F%3E%3C%2Fsvg%3E%0A" />
<style>
:root{
  --navy:#0f172a;--royal:#0f766e;--royal-2:#14b8a6;--copper:#d97706;--copper-2:#14b8a6;
  --bg:#f7f8fa;--surface:#ffffff;--surface-2:#f9fafb;--ink:#111827;--muted:#6b7280;--line:#eceef1;--line-2:#dfe3e8;
  --accent:#0f766e;--accent-soft:#e6f6f4;--ok:#047857;--ok-soft:#d1fae5;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;--info:#0369a1;--info-soft:#e0f2fe;
  --shadow:0 1px 2px rgba(17,24,39,.04);
  --radius:16px;--nav-h:66px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f14;--surface:#12171e;--surface-2:#171d25;--ink:#e6edf7;--muted:#93a3bc;--line:#222a35;--line-2:#2c3644;
  --accent:#2dd4bf;--accent-soft:#11302d;--ok:#34d399;--ok-soft:#0f2e26;--warn:#fbbf24;--warn-soft:#33270b;--bad:#f87171;--bad-soft:#3a1717;--info:#38bdf8;--info-soft:#0c2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0b0f14;--surface:#12171e;--surface-2:#171d25;--ink:#e6edf7;--muted:#93a3bc;--line:#222a35;--line-2:#2c3644;
  --accent:#2dd4bf;--accent-soft:#11302d;--ok:#34d399;--ok-soft:#0f2e26;--warn:#fbbf24;--warn-soft:#33270b;--bad:#f87171;--bad-soft:#3a1717;--info:#38bdf8;--info-soft:#0c2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- Topbar ---------- */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#0b1224 0%,#13265c 60%,#1e3a8a 100%);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(2,6,23,.35)}
.top .back{display:none}
.top.sub .back{display:flex}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:#fff}
.brand img{width:40px;height:40px;border-radius:12px;border:2px solid var(--copper-2);background:#fff;flex:none}
.brand b{display:block;font-size:17px;font-weight:850;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:#c7d2fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tbtn:active{transform:scale(.96)}
/* ---------- Layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.layout{display:block}
.side{display:none}
@media (min-width:980px){
  body{padding-bottom:24px}
  .layout{display:grid;grid-template-columns:220px 1fr;gap:20px;max-width:1300px;margin:0 auto;padding:0 16px}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:76px;height:calc(100vh - 90px);padding-top:16px}
  .side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:650}
  .side a:hover{background:var(--surface)}
  .side a.on{background:var(--accent-soft);color:var(--accent)}
  .dock{display:none!important}
  .wrap{padding:16px 0}
}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b));box-shadow:0 -4px 18px rgba(15,23,42,.06)}
.dock a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 2px;border-radius:12px;min-width:0}
.dock a.on{color:var(--accent)}
.dock a.on svg{stroke-width:2.4}
/* ---------- Generic ---------- */
h1,h2,h3{margin:0;letter-spacing:-.015em}
h1{font-size:22px;font-weight:850}
h2{font-size:18px;font-weight:800}
h3{font-size:15.5px;font-weight:800}
.muted{color:var(--muted)}
.sm{font-size:13px}.xs{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2m{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-title h2{font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px;min-height:42px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0b1120}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0b1120}}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:800;line-height:1.5;white-space:nowrap}
.t-a1{background:#fef9c3;color:#854d0e;border:1px solid #fde047}
.t-b1{background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd}
.t-c1,.t-ctl{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
.t-atb{background:#dcfce7;color:#166534;border:1px solid #86efac}
.t-cls{background:var(--accent-soft);color:var(--accent)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-info{background:var(--info-soft);color:var(--info)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:750;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;min-height:44px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:84px;resize:vertical}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:40px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:14px 0}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note b{font-weight:800}
/* ---------- Home ---------- */
.hero{background:radial-gradient(120% 140% at 0% 0%,#1d4ed8 0%,#13265c 45%,#0b1224 100%);color:#fff;border-radius:22px;padding:20px;display:flex;gap:16px;align-items:center;box-shadow:0 14px 30px rgba(2,6,23,.25);overflow:hidden;position:relative}
.hero img{width:92px;height:92px;border-radius:22px;border:3px solid var(--copper-2);background:#fff;flex:none}
.hero h1{font-size:22px;color:#fff}
.hero p{margin:6px 0 0;color:#c7d2fe;font-size:13.5px}
.hero .search{margin-top:12px}
.hero .inp{background:rgba(255,255,255,.96);color:#0f172a;border-color:transparent}
.hero .search svg{color:#475569}
@media (max-width:520px){.hero{flex-direction:column;align-items:flex-start;padding:18px}.hero img{width:64px;height:64px;border-radius:16px}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-height:96px}
.tile .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.tile b{font-size:14.5px}
.tile span{font-size:12px;color:var(--muted)}
.ic.c1{background:#dbeafe;color:#1d4ed8}.ic.c2{background:#fef3c7;color:#b45309}.ic.c3{background:#fee2e2;color:#b91c1c}.ic.c4{background:#d1fae5;color:#047857}.ic.c5{background:#ede9fe;color:#6d28d9}.ic.c6{background:#e0f2fe;color:#0369a1}.ic.c7{background:#fce7f3;color:#be185d}.ic.c8{background:#f1f5f9;color:#334155}
.sp-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:420px){.sp-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.sp-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:11.5px;font-weight:700;text-align:center}
.sp-btn em{font-style:normal;font-size:24px;line-height:1.1}
/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);cursor:pointer}
.item:active{background:var(--surface-2)}
.item .t{font-weight:800;font-size:15px}
.item .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.spi{font-size:15px;letter-spacing:1px}
.sev{width:10px;height:10px;border-radius:50%;flex:none}
.sev.Fatal{background:#dc2626}.sev.Grave{background:#ea580c}.sev.Moderada{background:#d97706}.sev.Leve{background:#65a30d}
/* ---------- Detail ---------- */
.dhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dhead h1{font-size:22px}
.kv{display:grid;gap:10px}
.kv .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.kv .v{margin-top:2px}
.dose-t{width:100%;border-collapse:separate;border-spacing:0}
.dose-row{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.dose-row:first-child{border-top:0}
.dose-row .e{font-size:24px;line-height:1}
.dose-row .d{font-weight:850;font-size:15.5px;font-variant-numeric:tabular-nums}
.dose-row .m{font-size:13px;color:var(--muted);margin-top:2px}
.dose-row .o{font-size:13px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- Calc ---------- */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.tools{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tool{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:750;font-size:13px}
.tool.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (max-width:639px){.tools{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.tools::-webkit-scrollbar{display:none}.tool{flex:none;white-space:nowrap}}
.out{border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1.5px solid var(--accent)}
.out .big{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.out .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.res-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.res b{display:block;font-size:19px;font-weight:850;font-variant-numeric:tabular-nums}
.res span{font-size:12px;color:var(--muted);font-weight:650}
.wstep{display:flex;gap:6px}
.wstep button{min-width:44px}
input[type=range]{width:100%;accent-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl td.n{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.scroll-x{overflow-x:auto}
/* ---------- Overlay / modal ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(2,6,23,.55);display:none;align-items:flex-start;justify-content:center;padding:calc(12px + var(--safe-t)) 12px 12px}
.ov.show{display:flex}
.ov .box{background:var(--surface);border-radius:20px;width:100%;max-width:720px;max-height:calc(100vh - 24px);overflow:auto;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.case-q{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px;font-weight:750}
.pts{margin:0;padding-left:20px}
.pts li{margin:6px 0}
.take{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px;font-weight:750}
.disc{font-size:12px;color:var(--muted);text-align:center;margin:28px 8px 8px}
.lg{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 120% at 0% 0%,#1d4ed8 0%,#13265c 45%,#0b1224 100%);display:none;align-items:center;justify-content:center;padding:20px}
.lg.show{display:flex}
.lg .box{background:var(--surface);border-radius:22px;padding:22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lg img{width:84px;height:84px;border-radius:20px;border:3px solid var(--copper-2);display:block;margin:0 auto 10px}

/* ===== Clean theme overrides ===== */
.top{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:none}
.brand{color:var(--ink)}.brand img{border:0;border-radius:10px;width:36px;height:36px;background:none}
.brand b{font-size:16.5px;font-weight:800}.brand b span{color:var(--accent)}.brand small{color:var(--muted)}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--ink)}
.hero{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.hero img{border:0;background:none;border-radius:20px}.hero h1{color:var(--ink)}.hero p{color:var(--muted)}
.hero .inp{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line-2)}.hero .search svg{color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.out{background:var(--accent-soft);border:1px solid var(--accent)}
.tile{box-shadow:none}.card{box-shadow:none}
.lg{background:var(--bg)}.lg .box{border:1px solid var(--line);box-shadow:0 10px 40px rgba(17,24,39,.08)}.lg img{border:0;border-radius:20px}
.dock{box-shadow:none}
.fig{width:100%;height:auto;display:block}
.figbox{max-width:280px;margin:10px auto 0;background:var(--surface-2);border-radius:14px;padding:8px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:700px){.dgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dcard{display:flex;flex-direction:column;gap:8px}
.dthumb{background:var(--surface-2);border-radius:10px;padding:4px;display:flex;align-items:center;justify-content:center}
.dthumb svg{height:100%;width:auto}
.tb{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 2px;font-size:11px;font-weight:800;color:var(--ink);cursor:pointer}
.tb.ok{background:var(--ok-soft);border-color:var(--ok)}.tb.bad{background:var(--warn-soft);border-color:var(--warn)}.tb.aus{opacity:.35;text-decoration:line-through}
.tb.on{outline:2px solid var(--accent);outline-offset:1px}
/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  body{background:#fff;padding:0;color:#000}
  .top,.dock,.layout,.ov,.toast{display:none!important}
  #printArea{display:block}
  .rx-page{page-break-after:always;padding:18mm 16mm;font-family:Georgia,serif;color:#000;min-height:260mm;position:relative}
  .rx-page:last-child{page-break-after:auto}
  .rx-h{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
  .rx-h b{font-size:18px}
  .rx-item{margin:12px 0}
  .rx-foot{position:absolute;bottom:18mm;left:16mm;right:16mm;text-align:center;border-top:1px solid #000;padding-top:6px}
}
</style>

<script>
"use strict";
const DATA = (function(){const emb={"v":1795639717929,"qx":[{"id":"vomito","n":"Vômito","org":"gi","def":"Expulsão ativa do conteúdo gástrico com esforço abdominal (diferenciar de regurgitação — passiva, sem pródromos, alimento não digerido, típica de megaesôfago).","perg":"Agudo ou crônico (> 2–3 semanas)? Relação com alimentação? Presença de sangue (hematêmese) ou 'borra de café'? Acesso a lixo, corpos estranhos, plantas, medicamentos (AINE)? Vacinação (parvovirose)? PU/PD? Diarreia associada?","ddx":[["Gastrintestinais","Indiscrição alimentar, gastroenterite, corpo estranho/obstrução, intussuscepção, parvovirose, enteropatia crônica, úlcera (AINE/corticoide), neoplasia, DVG (ânsia improdutiva)"],["Extra-gastrintestinais","Pancreatite, doença renal (uremia), hepatopatia, hipoadrenocorticismo (Addison), cetoacidose diabética, piometra, peritonite, hipertireoidismo (gatos), intoxicações, doença vestibular"]],"ex":"1) Exame físico + desidratação. 2) Hemograma, bioquímica (ureia, creatinina, ALT, FA, glicose, albumina), eletrólitos (Na:K — Addison), urinálise. 3) Radiografias abdominais (corpo estranho/obstrução) e ultrassom. 4) Lipase pancreática específica (Spec cPL/fPL). 5) Teste rápido de parvovirose em filhotes. 6) Cortisol basal (excluir Addison). 7) Endoscopia/biópsias se crônico.","alarme":"Vômito com sangue, abdome distendido/doloroso, ânsia improdutiva (DVG — emergência), desidratação > 7%, filhote não vacinado, vômito persistente > 24–48 h, suspeita de corpo estranho linear (gatos — olhar sob a língua).","far":["Citrato de Maropitant","Ondansetrona","Omeprazol","Pantoprazol"]},{"id":"diarreia","n":"Diarreia","org":"gi","def":"Aumento de frequência, fluidez ou volume das fezes. Classificar em intestino delgado × grosso (ver assistente).","perg":"Aguda ou crônica? Volume e frequência? Tenesmo, muco, sangue vivo (hematoquezia) ou melena? Perda de peso? Mudança de dieta? Vermifugação? Outros animais afetados?","ddx":[["Agudas","Indiscrição/mudança alimentar, parasitas (Giardia, ancilostomídeos, coccídeos), parvovirose, gastroenterite hemorrágica, intoxicações, bactérias (Clostridium perfringens, Campylobacter)"],["Crônicas — intestino delgado","Enteropatias crônicas (responsiva à dieta/antibiótico/imunossupressor), linfangiectasia, insuficiência pancreática exócrina, linfoma, hipocobalaminemia"],["Crônicas — intestino grosso","Colite (responsiva à fibra/dieta), Tritrichomonas (gatos), parasitas (Trichuris), pólipos/neoplasia"]],"ex":"1) Coproparasitológico seriado + SNAP Giardia. 2) Agudo sem sinais sistêmicos: tratamento sintomático e dieta. 3) Crônico: hemograma, bioquímica, albumina, cobalamina/folato, TLI (IPE), ultrassom, testes terapêuticos (dieta hidrolisada por 2–3 semanas), biópsias.","alarme":"Diarreia hemorrágica com prostração, hipoglicemia, desidratação, febre, filhotes não vacinados, hipoalbuminemia.","far":["Metronidazol","Fembendazol","Tilosina","Cianocobalamina (Vitamina B12)"]},{"id":"pupd","n":"Poliúria e polidipsia (PU/PD)","org":"rim","def":"Ingestão de água > 100 mL/kg/dia (cães) ou > 50 mL/kg/dia (gatos) com diurese aumentada.","perg":"Quantificar a ingestão em casa por 2–3 dias. Medicamentos (corticoides, diuréticos, fenobarbital)? Cio recente (piometra)? Apetite (polifagia)? Perda de peso?","ddx":[["Frequentes","Doença renal crônica, diabetes mellitus, hiperadrenocorticismo, piometra, hipertireoidismo (gatos), hipercalcemia, hepatopatia, uso de corticoide/diurético"],["Menos frequentes","Hipoadrenocorticismo, diabetes insípido central/nefrogênico, polidipsia psicogênica, pielonefrite, acromegalia (gatos)"]],"ex":"1) Urinálise com densidade (USG < 1,030 cães / < 1,035 gatos sugere PU) + urocultura. 2) Hemograma, bioquímica, glicose, cálcio, SDMA. 3) Conforme achados: frutosamina, teste de supressão com dexametasona, T4 total (gatos), ultrassom (útero, adrenais, rins).","alarme":"Cadela inteira com PU/PD após cio (piometra), cetonúria/glicosúria com prostração (cetoacidose), hipercalcemia (neoplasia).","far":["Benazepril","Insulina NPH (Humana)","Trilostano","Metimazol (Tiamazol)"]},{"id":"dispneia","n":"Dispneia / angústia respiratória","org":"pulmao","def":"Dificuldade respiratória; o padrão orienta a localização: inspiratória (vias aéreas superiores), expiratória (vias inferiores), restritiva rápida e superficial (espaço pleural), mista (parênquima).","perg":"Início agudo? Tosse? Sopro cardíaco conhecido? Trauma? Raça braquicefálica? Acesso a rodenticidas?","ddx":[["Vias aéreas superiores","Síndrome braquicefálica, paralisia de laringe, colapso traqueal, corpo estranho, massa"],["Vias inferiores","Asma felina, bronquite crônica"],["Parênquima","Edema pulmonar cardiogênico, pneumonia, contusão, hemorragia (rodenticida), neoplasia"],["Espaço pleural","Efusão pleural (ICC felina, quilotórax, piotórax, neoplasia), pneumotórax, hérnia diafragmática"]],"ex":"ESTABILIZAR PRIMEIRO: oxigênio, mínimo estresse, sedação leve (butorfanol). POCUS (linhas B, efusão) e toracocentese terapêutica/diagnóstica antes de radiografar. Depois: radiografias torácicas, ecocardiograma, NT-proBNP, hemograma, coagulograma.","alarme":"Mucosas cianóticas, respiração de boca aberta em gatos, ortopneia, FR > 60 em repouso.","far":["Furosemida","Butorfanol","Terbutalina","Dexametasona"]},{"id":"tosse","n":"Tosse","org":"pulmao","def":"Reflexo de proteção das vias aéreas; produtiva ou seca ('grasnado de ganso' no colapso traqueal).","perg":"Contato com outros cães (traqueobronquite infecciosa)? Sopro? Raça (colapso de traqueia em toy)? Tosse noturna/ao exercício? Expectoração/engasgo?","ddx":[["Cães","Traqueobronquite infecciosa ('tosse dos canis'), colapso de traqueia, bronquite crônica, compressão do brônquio por átrio esquerdo aumentado (DMVM), pneumonia, dirofilariose, neoplasia"],["Gatos","Asma felina (tosse confundida com 'bola de pelo'), parasitas pulmonares (Aelurostrongylus), dirofilariose (HARD)"]],"ex":"Radiografias torácicas, hemograma, teste de dirofilariose, coproparasitológico (Baermann em gatos), ecocardiograma se sopro, broncoscopia/lavado broncoalveolar em crônicos.","alarme":"Tosse com dispneia, febre e prostração (pneumonia), hemoptise.","far":["Doxiciclina","Butorfanol","Aminofilina / Teofilina","Fluticasona (inalatória)"]},{"id":"convulsao","n":"Convulsões","org":"cerebro","def":"Atividade elétrica cerebral anormal; diferenciar de síncope, narcolepsia e distúrbios vestibulares.","perg":"Idade de início (1–5 anos sugere epilepsia idiopática)? Frequência e duração? Período pós-ictal? Acesso a tóxicos (chumbinho, chocolate, metaldeído, permetrina em gatos)? Traumas? Sinais interictais?","ddx":[["Extracraniais","Hipoglicemia (filhotes, insulinoma, xilitol), hipocalcemia (eclâmpsia), encefalopatia hepática (shunt), uremia, intoxicações"],["Intracranianas","Epilepsia idiopática, neoplasia (> 6 anos), encefalites (cinomose, MUO, toxoplasmose/PIF em gatos), hidrocefalia, trauma"]],"ex":"Glicemia e cálcio IMEDIATOS. Hemograma, bioquímica, ácidos biliares (shunt), urinálise. Exame neurológico interictal. RM e líquor se início < 6 meses ou > 6 anos, déficits interictais ou refratariedade.","alarme":"Status epilepticus (> 5 min) ou crises em salva — diazepam/midazolam e fenobarbital IV (ver bulário/RCP).","far":["Diazepam","Midazolam","Fenobarbital","Levetiracetam"]},{"id":"anemia","n":"Anemia / mucosas pálidas","org":"sangue","def":"Redução de hematócrito/hemoglobina; classificar em regenerativa (perda ou hemólise) × não regenerativa (ver assistente).","perg":"Sangramentos (melena, hematúria, epistaxe)? Carrapatos/pulgas? Acesso a cebola, rodenticidas, zinco (moedas)? Vacinação recente? Doença renal?","ddx":[["Regenerativa — perda","Hemorragia aguda (trauma, neoplasia esplênica), rodenticidas, parasitas (ancilostomídeos, pulgas em filhotes), úlcera GI"],["Regenerativa — hemólise","AHIM, hemoparasitas (Babesia, Mycoplasma haemofelis), corpúsculos de Heinz (cebola, paracetamol, zinco), isoeritrólise neonatal"],["Não regenerativa","DRC, inflamação crônica, erliquiose, FeLV/FIV, mielodisplasia/leucemia, deficiência de ferro crônica, hipotireoidismo, pré-regenerativa (< 3–5 dias)"]],"ex":"Hemograma com reticulócitos e esfregaço (esferócitos, autoaglutinação, parasitas, Heinz), proteínas totais, bioquímica, urinálise, testes para hemoparasitas (PCR), coagulograma, ultrassom abdominal, mielograma se não regenerativa.","alarme":"Ht < 15% (cães) / < 12% (gatos) com taquicardia/taquipneia — transfundir (tipagem em gatos!).","far":["Doxiciclina","Imidocarb (Dipropionato)","Prednisolona / Prednisona","Vitamina K1 (Fitomenadiona)"]},{"id":"ictericia","n":"Icterícia","org":"figado","def":"Hiperbilirrubinemia com pigmentação amarela de mucosas/pele: pré-hepática (hemólise), hepática ou pós-hepática (obstrução biliar).","perg":"Medicamentos/toxinas (paracetamol, cetoconazol, xilitol, cogumelos)? Leptospirose (vacinação, contato com ratos/enchentes)? Anorexia prolongada em gato obeso (lipidose)?","ddx":[["Pré-hepática","AHIM, babesiose, Mycoplasma haemofelis, Heinz"],["Hepática","Hepatite (crônica, infecciosa, tóxica), leptospirose, lipidose hepática felina, colangite felina, neoplasia, PIF"],["Pós-hepática","Pancreatite, colelitíase/mucocele biliar, neoplasia de vias biliares/duodeno"]],"ex":"Hematócrito (anemia grave = pré-hepática), bioquímica (ALT, FA, GGT, bilirrubinas, albumina, colesterol), ultrassom abdominal (vias biliares, pâncreas), sorologia/PCR de leptospirose, coagulograma antes de biópsia.","alarme":"Leptospirose (zoonose — usar EPI), insuficiência hepática aguda com coagulopatia/encefalopatia.","far":["Ácido Ursodesoxicólico","S-Adenosilmetionina (SAMe)","Doxiciclina","Ampicilina"]},{"id":"claudicacao","n":"Claudicação","org":"membro","def":"Alteração da marcha por dor, disfunção mecânica ou neurológica.","perg":"Idade e raça? Aguda (trauma) ou crônica? Membro torácico ou pélvico? Piora após repouso (artrose) ou com exercício? Febre e múltiplos membros (poliartrite)?","ddx":[["Jovens","Displasia de quadril/cotovelo, osteocondrose, panosteíte, Legg-Calvé-Perthes (raças toy), luxação de patela"],["Adultos/idosos","Ruptura de ligamento cruzado cranial, osteoartrite, osteossarcoma (raças grandes — metáfises 'longe do cotovelo, perto do joelho'), doença do disco intervertebral (neurológica)"],["Sistêmicas","Poliartrite imunomediada, erliquiose/anaplasmose, leishmaniose"]],"ex":"Exame ortopédico (gaveta, compressão tibial, Ortolani), radiografias, artrocentese (poliartrite), exame neurológico.","alarme":"Dor intensa em cão de raça grande > 6 anos com aumento de volume ósseo (osteossarcoma); paresia/déficits proprioceptivos (neurológico).","far":["Meloxicam","Carprofeno","Gabapentina","Bedinvetmab"]},{"id":"disuria","n":"Disúria, hematúria e estrangúria","org":"bexiga","def":"Dificuldade ou dor para urinar, sangue na urina, esforço com pouco volume. EM GATO MACHO, descartar OBSTRUÇÃO URETRAL (emergência).","perg":"Consegue urinar (bexiga cheia e dura = obstrução)? Polaciúria? Lambedura de genitais? Estresse ambiental (gatos)? Dieta?","ddx":[["Gatos","Cistite idiopática felina (mais comum), urolitíase (estruvita, oxalato), tampão uretral, ITU (idosos/DRC/diabéticos)"],["Cães","Infecção do trato urinário, urolitíase, neoplasia vesical (carcinoma de células de transição — trígono), prostatopatias"]],"ex":"Palpação vesical, urinálise e urocultura (cistocentese), radiografia (urólitos radiopacos) e ultrassom, potássio sérico em obstruídos.","alarme":"Gato macho que não urina — hipercalemia (bradicardia, arritmias) — ver caso de obstrução uretral.","far":["Prazosina","Amitriptilina","Buprenorfina","Gluconato de Cálcio 10%"]},{"id":"perdapeso","n":"Perda de peso","org":"abdome","def":"Perda > 10% do peso habitual não intencional.","perg":"Apetite preservado, aumentado ou diminuído? Vômito/diarreia? PU/PD? Ambiente (competição por alimento)? Doença dentária?","ddx":[["Apetite normal/aumentado","Hipertireoidismo (gatos), diabetes mellitus, insuficiência pancreática exócrina, má absorção, parasitismo"],["Apetite reduzido","DRC, neoplasias, doenças inflamatórias crônicas, doença dentária, cardiopatias (caquexia), hepatopatias, PIF"]],"ex":"Hemograma, bioquímica, urinálise, T4 (gatos > 7 anos), glicose/frutosamina, TLI/cobalamina/folato, FIV/FeLV, imagem.","alarme":"Perda rápida com anorexia em gatos (lipidose hepática).","far":["Mirtazapina","Metimazol (Tiamazol)"]},{"id":"febre","n":"Febre de origem indeterminada","org":"sangue","def":"Temperatura > 39,5 °C (cães) / > 39,4 °C (gatos) persistente, sem causa aparente após avaliação inicial.","perg":"Carrapatos (erliquiose, babesiose)? Viagens/região? Vacinação? Feridas por briga (gatos — abscessos)? Medicamentos recentes?","ddx":[["Infecciosas","Hemoparasitoses, leishmaniose, abscessos, discoespondilite, endocardite, pielonefrite, piotórax, PIF, micoses"],["Imunomediadas","Poliartrite, AHIM, lúpus, meningite-arterite responsiva a esteroides"],["Neoplasias","Linfoma, leucemias, tumores necróticos"]],"ex":"Hemograma com esfregaço, bioquímica, urinálise e urocultura, PCR para hemoparasitas, sorologia de leishmaniose, radiografias e ultrassom, artrocentese, hemoculturas, ecocardiograma.","alarme":"Temperatura > 41 °C (risco de lesão orgânica), sepse.","far":["Doxiciclina","Dipirona (Metamizol)"]},{"id":"efusao","n":"Distensão abdominal / ascite","org":"abdome","def":"Aumento de volume abdominal por líquido, órgão, gás ou massa.","perg":"Início súbito (hemoabdome, DVG) ou progressivo? Tosse/sopro (ICC direita)? Hipoalbuminemia (enteropatia, nefropatia)? Gato jovem com febre (PIF)?","ddx":[["Transudato puro (proteína baixa)","Hipoalbuminemia (enteropatia/nefropatia perdedora de proteína, insuficiência hepática)"],["Transudato modificado","ICC direita, hipertensão portal, neoplasias"],["Exsudato","Peritonite séptica, PIF (efusão amarela viscosa, proteína alta, Rivalta +)"],["Hemorrágica","Hemangiossarcoma esplênico, trauma, coagulopatia"],["Outros","Uroabdome, quiloabdome, DVG (gás), organomegalia, gestação, Cushing (abdome pendular)"]],"ex":"Ultrassom/FAST, abdominocentese com análise do líquido (proteína, densidade, células, citologia, creatinina/potássio vs. sangue no uroabdome, lactato/glicose na peritonite séptica), albumina, ecocardiograma.","alarme":"Abdome distendido timpânico em raça grande (DVG), hemoabdome com choque, peritonite séptica (glicose do líquido < sangue em > 20 mg/dL).","far":["Furosemida","Espironolactona"]},{"id":"colapso","n":"Síncope / colapso","org":"coracao","def":"Perda transitória de consciência e tônus por hipoperfusão cerebral (diferenciar de convulsão: síncope é curta, flácida, sem pós-ictal).","perg":"Relação com exercício/excitação? Tosse antes (DMVM)? Raça (Boxer, Dobermann — arritmias)? Sopro?","ddx":[["Cardíacas","Bradiarritmias (bloqueio AV, doença do nó sinusal), taquiarritmias (cardiomiopatia arritmogênica do Boxer, CMD), estenose aórtica/pulmonar, hipertensão pulmonar"],["Não cardíacas","Síncope vasovagal/tussígena, hipoglicemia, anemia grave, colapso induzido por exercício (Labrador), miastenia gravis, hipoadrenocorticismo"]],"ex":"ECG e Holter, ecocardiograma, pressão arterial, glicemia, hemograma, eletrólitos.","alarme":"Síncopes repetidas em Boxer/Dobermann (risco de morte súbita).","far":["Pimobendan","Sotalol","Atropina"]}],"derm":[{"id":"atopia","n":"Dermatite atópica","sp":"both","pru":2,"zoo":0,"les":"eritema","reg":["face","orelhas","axilas","abdome","patas"],"cli":"Prurido crônico, eritema, liquenificação e hiperpigmentação secundárias; otites recorrentes; início entre 6 meses e 3 anos; frequentemente sazonal no início.","ex":"Diagnóstico de EXCLUSÃO: controlar pulgas e sarnas, tratar infecções secundárias, dieta de eliminação (8 semanas). Critérios de Favrot. Testes alérgicos apenas para imunoterapia.","cd":"Controle do prurido (oclacitinibe, lokivetmab, ciclosporina, prednisolona em curto prazo), banhos (clorexidina), restauração de barreira, imunoterapia alérgeno-específica.","far":["Oclacitinibe","Lokivetmab","Ciclosporina","Prednisolona / Prednisona"]},{"id":"dapp","n":"Dermatite alérgica à picada de pulgas (DAPP)","sp":"both","pru":2,"zoo":0,"les":"papula","reg":["lombossacral","cauda","abdome"],"cli":"Prurido intenso, pápulas crostosas, alopecia na região LOMBOSSACRAL, base da cauda e caudomedial de coxas; gatos: dermatite miliar.","ex":"Pulgas ou fezes de pulga (papel branco umedecido fica avermelhado); resposta ao controle rigoroso.","cd":"Isoxazolina em TODOS os animais da casa + controle ambiental; corticoide curto para o prurido; tratar pioderma secundária.","far":["Fluralaner","Sarolaner","Nitenpiram","Prednisolona / Prednisona"]},{"id":"alergia-alimentar","n":"Alergia/hipersensibilidade alimentar","sp":"both","pru":2,"zoo":0,"les":"eritema","reg":["face","orelhas","perianal","patas","axilas"],"cli":"Prurido não sazonal, face, orelhas, região perianal; pode haver sinais GI (fezes amolecidas, aumento de frequência).","ex":"Dieta de eliminação com proteína hidrolisada ou nova por 8 semanas + desafio (piora em 1–14 dias confirma).","cd":"Dieta de manutenção sem o alérgeno.","far":[]},{"id":"sarna-sarcoptica","n":"Sarna sarcóptica (escabiose)","sp":"dog","pru":2,"zoo":1,"les":"crosta","reg":["orelhas","cotovelos","abdome","jarretes"],"cli":"Prurido INTENSO de início rápido, crostas nas BORDAS DAS ORELHAS, cotovelos e jarretes; reflexo otopodal positivo. ZOONOSE (pápulas pruriginosas no tutor).","ex":"Raspado cutâneo superficial (sensibilidade baixa ~50%) — tratamento terapêutico de prova é válido.","cd":"Isoxazolinas (fluralaner, sarolaner etc.) ou selamectina; tratar contactantes.","far":["Fluralaner","Sarolaner","Selamectina","Ivermectina"]},{"id":"sarna-notoedrica","n":"Sarna notoédrica (gatos)","sp":"cat","pru":2,"zoo":1,"les":"crosta","reg":["orelhas","face","pescoco"],"cli":"Crostas espessas acinzentadas nas bordas das orelhas, face e pescoço, prurido intenso.","ex":"Raspado (ácaros abundantes).","cd":"Selamectina, isoxazolinas; tratar contactantes.","far":["Selamectina"]},{"id":"demodicose-loc","n":"Demodicose localizada","sp":"dog","pru":0,"zoo":0,"les":"alopecia","reg":["face","periocular"],"cli":"Áreas de alopecia pequenas (< 4–5), eritema e descamação, principalmente periocular e face de filhotes; pouco prurido.","ex":"Raspado profundo (espremer a pele) ou tricograma: Demodex canis.","cd":"Muitas regridem espontaneamente; isoxazolina se progressão.","far":["Fluralaner"]},{"id":"demodicose-gen","n":"Demodicose generalizada","sp":"dog","pru":1,"zoo":0,"les":"pustula","reg":["generalizada","patas","face"],"cli":"Alopecia extensa, comedões, eritema, pioderma secundária/furunculose, pododemodicose; adultos: investigar doença de base (Cushing, hipotireoidismo, neoplasia, imunossupressores).","ex":"Raspados profundos múltiplos; citologia para pioderma.","cd":"Isoxazolina até 2 raspados negativos com 1 mês de intervalo; antibiótico para furunculose; castração.","far":["Fluralaner","Afoxolaner","Cefalexina"]},{"id":"dermatofitose","n":"Dermatofitose","sp":"both","pru":0,"zoo":1,"les":"alopecia","reg":["face","orelhas","patas"],"cli":"Alopecia circular com descamação e bordas eritematosas ('em anel'), pelos quebradiços; prurido variável; ZOONOSE. Gatos Persas podem ser portadores assintomáticos.","ex":"Lâmpada de Wood (M. canis — verde-maçã em ~50%), tricograma, CULTURA FÚNGICA (padrão) ou PCR.","cd":"Itraconazol/terbinafina sistêmicos + tópico (cal sulfurada, miconazol + clorexidina) + descontaminação ambiental; cura = 2 culturas negativas.","far":["Itraconazol","Terbinafina","Cal Sulfurada 2% (Lime Sulfur)","Enilconazol"]},{"id":"pioderma-sup","n":"Pioderma superficial (foliculite bacteriana)","sp":"dog","pru":1,"zoo":0,"les":"colarete","reg":["abdome","axilas","dorso"],"cli":"Pápulas, pústulas foliculares e COLARETES EPIDÉRMICOS; alopecia 'roída de traça' em raças de pelo curto. Quase sempre secundária (atopia, endocrinopatias).","ex":"Citologia (cocos + neutrófilos); cultura e antibiograma se recorrente ou sem resposta (MRSP).","cd":"Terapia tópica (clorexidina 2–4%) — muitas vezes suficiente; cefalexina 22–30 mg/kg q12h por ≥ 21 dias se extensa; tratar a causa primária.","far":["Clorexidina (antisséptico/xampu)","Cefalexina","Amoxicilina + Clavulanato"]},{"id":"pioderma-prof","n":"Pioderma profunda / furunculose","sp":"dog","pru":1,"zoo":0,"les":"nodulo","reg":["patas","focinho","generalizada"],"cli":"Furúnculos, fístulas, crostas hemorrágicas, dor; pododermatite; Pastor-alemão predisposto.","ex":"Citologia, cultura e antibiograma (obrigatório), raspado (descartar Demodex).","cd":"Antibiótico guiado por cultura por 4–6 semanas (2 semanas após cura clínica) + banhos.","far":["Cefalexina","Enrofloxacino","Clindamicina"]},{"id":"malassezia","n":"Dermatite por Malassezia","sp":"both","pru":2,"zoo":0,"les":"liquen","reg":["axilas","pescoco","patas","orelhas"],"cli":"Eritema, oleosidade, odor rançoso, liquenificação e hiperpigmentação; interdígitos marrons; secundária a atopia/endocrinopatias. Basset, West Highland.","ex":"Citologia por fita de acetato (leveduras em 'pegada' ou 'amendoim').","cd":"Xampu de miconazol + clorexidina 2–3x/semana; itraconazol/cetoconazol em casos extensos.","far":["Clotrimazol / Miconazol (tópicos)","Itraconazol","Cetoconazol"]},{"id":"otite","n":"Otite externa","sp":"both","pru":2,"zoo":0,"les":"eritema","reg":["orelhas"],"cli":"Prurido auricular, meneios de cabeça, secreção ceruminosa (Malassezia) ou purulenta (Pseudomonas), odor. Causas primárias: atopia, alergia alimentar, Otodectes (gatos/filhotes), corpos estranhos.","ex":"Otoscopia (integridade da membrana timpânica), citologia de AMBOS os ouvidos, cultura se bastonetes/recorrente.","cd":"Limpeza + otológico conforme citologia; tratar a causa primária; otite média — sistêmico e imagem.","far":["Otológicos Combinados","Selamectina","Prednisolona / Prednisona"]},{"id":"hipotireoidismo","n":"Hipotireoidismo","sp":"dog","pru":0,"zoo":0,"les":"alopecia","reg":["cauda","flancos","pescoco"],"cli":"Alopecia bilateral simétrica NÃO pruriginosa, 'cauda de rato', pelame seco, hiperpigmentação, letargia, ganho de peso, bradicardia, 'face trágica'.","ex":"T4 total + T4 livre por diálise + TSH (eutireóideo doente e fármacos interferem).","cd":"Levotiroxina 0,02 mg/kg q12h; reavaliar T4 pós-dose em 4–6 semanas.","far":["Levotiroxina Sódica"]},{"id":"cushing","n":"Hiperadrenocorticismo (pele)","sp":"dog","pru":0,"zoo":0,"les":"alopecia","reg":["flancos","abdome"],"cli":"Alopecia simétrica de tronco, pele fina, comedões, calcinose cutânea, abdome pendular, PU/PD/polifagia.","ex":"Teste de supressão com dexametasona em dose baixa, relação cortisol:creatinina urinária, ultrassom adrenal.","cd":"Trilostano.","far":["Trilostano"]},{"id":"penfigo-foliaceo","n":"Pênfigo foliáceo","sp":"both","pru":1,"zoo":0,"les":"crosta","reg":["face","plano-nasal","orelhas","patas"],"cli":"Pústulas grandes efêmeras e CROSTAS simétricas em ponte nasal, pavilhão auricular e coxins (gatos: leito ungueal e mamilos). Doença autoimune pustular mais comum.","ex":"Citologia de pústula intacta (acantócitos + neutrófilos não degenerados), biópsia.","cd":"Prednisolona imunossupressora ± azatioprina (cães)/clorambucil (gatos).","far":["Prednisolona / Prednisona","Azatioprina"]},{"id":"lupus-discoide","n":"Lúpus eritematoso cutâneo (discoide)","sp":"dog","pru":0,"zoo":0,"les":"erosao","reg":["plano-nasal"],"cli":"Despigmentação, perda da arquitetura em 'calçamento' do plano nasal, eritema, erosões e crostas; piora com o sol.","ex":"Biópsia.","cd":"Fotoproteção, tacrolimo tópico, tetraciclina + niacinamida, corticoide.","far":["Tetraciclina","Tacrolimo 0,03–0,1% (colírio/pomada)"]},{"id":"esporotricose","n":"Esporotricose (gatos)","sp":"cat","pru":0,"zoo":1,"les":"ulcera","reg":["face","plano-nasal","patas"],"cli":"Nódulos e úlceras com secreção na face (plano nasal 'nariz de palhaço'), orelhas e membros; sinais respiratórios. ZOONOSE GRAVE no Brasil (Sporothrix brasiliensis — arranhaduras/mordeduras).","ex" xato.","eff":"Mielossupressão e mucosite graves.","cond":"Evitar; monitorar hemograma."},{"a":"AINE","b":"Ciclosporina","sev":"Moderada","ev":"H","mech":"Vasoconstrição renal somada.","eff":"Nefrotoxicidade.","cond":"Monitorar creatinina."},{"a":"AINE","b":"AMINO","sev":"Grave","ev":"V","mech":"Redução da perfusão renal + toxicidade tubular.","eff":"Lesão renal aguda.","cond":"Evitar associação, especialmente em desidratados."},{"a":"IECA_BRA","b":"K_UP","sev":"Moderada","ev":"V","mech":"Redução da aldosterona + retenção/aporte de potássio.","eff":"Hipercalemia.","cond":"Dosar potássio após 1–2 semanas; associação espironolactona + IECA é usada na ICC com monitoração."},{"a":"IECA_BRA","b":"IECA_BRA","sev":"Moderada","ev":"V","mech":"Duplo bloqueio do SRAA (IECA + BRA).","eff":"Hipotensão, azotemia, hipercalemia.","cond":"Usar apenas em proteinúria refratária com monitoração estrita."},{"a":"DIUR_ALCA","b":"AMINO","sev":"Grave","ev":"V","mech":"Depleção de volume + somatório de oto e nefrotoxicidade.","eff":"Lesão renal aguda e surdez.","cond":"Evitar; hidratar e monitorar urinálise (cilindros)."},{"a":"DIUR_ALCA","b":"Digoxina","sev":"Grave","ev":"B","mech":"Hipocalemia e hipomagnesemia aumentam ligação da digoxina à Na/K-ATPase.","eff":"Intoxicação digitálica (arritmias, vômito).","cond":"Monitorar K e Mg, nível sérico de digoxina (alvo 0,5–1 ng/mL)."},{"a":"DIUR_ALCA","b":"CORT","sev":"Leve","ev":"H","mech":"Somatório de perda renal de potássio.","eff":"Hipocalemia.","cond":"Monitorar potássio."},{"a":"DIUR_ALCA","b":"Anfotericina B","sev":"Grave","ev":"V","mech":"Depleção de volume potencializa nefrotoxicidade.","eff":"Lesão renal aguda.","cond":"Diurese salina prévia, evitar diuréticos."},{"a":"FQ","b":"Aminofilina / Teofilina","sev":"Moderada","ev":"V","mech":"Inibição do CYP1A2 (enrofloxacino/ciprofloxacino).","eff":"Toxicidade da teofilina (taquicardia, vômito, convulsões).","cond":"Reduzir teofilina em ~30% ou usar marbofloxacino/pradofloxacino."},{"a":"FQ","b":"CATION","sev":"Moderada","ev":"B","mech":"Quelação por cátions di/trivalentes.","eff":"Redução importante da absorção oral → falha terapêutica.","cond":"Administrar a FQ 2 h antes ou 4–6 h depois."},{"a":"TETRA","b":"CATION","sev":"Moderada","ev":"B","mech":"Quelação por Ca, Al, Mg, Fe, Zn, Bi.","eff":"Falha terapêutica.","cond":"Separar em 2–3 h; doxiciclina pode ser dada com alimento (menos afetada)."},{"a":"TETRA","b":"BACTERICIDA_BL","sev":"Leve","ev":"H","mech":"Bacteriostático reduz atividade de betalactâmicos (dependentes de crescimento).","eff":"Possível antagonismo (relevância clínica baixa).","cond":"Evitar em infecções graves/meningite."},{"a":"Doxiciclina","b":"INDUTOR","sev":"Moderada","ev":"H","mech":"Indução enzimática hepática.","eff":"Meia-vida da doxiciclina reduzida.","cond":"Considerar dose maior/intervalo menor."},{"a":"SEROT","b":"SEROT","sev":"Grave","ev":"V","mech":"Excesso de serotonina (recaptação + liberação + agonismo).","eff":"Síndrome serotoninérgica: agitação, hipertermia, tremores, midríase, taquicardia, convulsões.","cond":"Evitar associações em dose plena; se necessário (ex.: trazodona + fluoxetina), doses baixas e monitorar. Antídoto: ciproeptadina."},{"a":"SEROT","b":"IMAO","sev":"Grave","ev":"B","mech":"Inibição da MAO + aumento de serotonina.","eff":"Síndrome serotoninérgica grave/fatal.","cond":"CONTRAINDICADO. Washout de 2 semanas (5 semanas após fluoxetina)."},{"a":"Selegilina","b":"SIMPATO","sev":"Grave","ev":"H","mech":"Inibição da MAO potencializa aminas simpatomiméticas.","eff":"Crise hipertensiva, taquiarritmias.","cond":"Evitar fenilpropanolamina/efedrina; dopamina com doses reduzidas."},{"a":"Tramadol","b":"Ondansetrona","sev":"Moderada","ev":"H","mech":"Ondansetrona bloqueia receptores 5-HT3 da analgesia do tramadol.","eff":"Redução da analgesia + risco serotoninérgico.","cond":"Preferir maropitant como antiemético."},{"a":"Ondansetrona","b":"Apomorfina","sev":"Grave","ev":"H","mech":"Interação descrita em humanos (mecanismo incerto).","eff":"Hipotensão profunda e perda de consciência.","cond":"Contraindicado em humanos; evitar associação."},{"a":"AZOL","b":"Ciclosporina","sev":"Moderada","ev":"V","mech":"Inibição do CYP3A e glicoproteína-P.","eff":"Níveis de ciclosporina 2–3x maiores (efeito poupador intencional com cetoconazol).","cond":"Se intencional: reduzir ciclosporina em ~50% e monitorar nível/efeitos."},{"a":"AZOL","b":"Cisaprida","sev":"Grave","ev":"H","mech":"Inibição do CYP3A eleva cisaprida.","eff":"Prolongamento QT, arritmias ventriculares.","cond":"Contraindicado."},{"a":"AZOL","b":"BZD","sev":"Moderada","ev":"H","mech":"Inibição do CYP3A (midazolam, diazepam, alprazolam).","eff":"Sedação prolongada.","cond":"Reduzir dose do benzodiazepínico."},{"a":"AZOL","b":"Sulfato de Vincristina","sev":"Grave","ev":"H","mech":"Inibição do CYP3A e P-gp.","eff":"Neurotoxicidade grave da vincristina (íleo, neuropatia).","cond":"Evitar azóis durante o protocolo."},{"a":"Itraconazol","b":"IBP","sev":"Moderada","ev":"V","mech":"Itraconazol em cápsula precisa de pH ácido para absorção.","eff":"Redução da absorção e falha terapêutica (esporotricose, dermatofitose).","cond":"Evitar IBP/H2; dar itraconazol com alimento gorduroso; solução oral é menos afetada."},{"a":"Cetoconazol","b":"IBP","sev":"Moderada","ev":"H","mech":"Absorção dependente de pH ácido.","eff":"Redução da absorção.","cond":"Separar/evitar."},{"a":"PGP_INIB","b":"PGP_SUB","sev":"Grave","ev":"V","mech":"Inibição da glicoproteína-P (ABCB1) na barreira hematoencefálica — efeito semelhante à mutação MDR1.","eff":"Neurotoxicidade de lactonas macrocíclicas/loperamida; toxicidade de digoxina, vincristina, doxorrubicina.","cond":"Evitar associação (ex.: ivermectina em dose de demodicose + espinosade/cetoconazol); reduzir doses e monitorar."},{"a":"INDUTOR","b":"Ciclosporina","sev":"Moderada","ev":"V","mech":"Indução do CYP3A.","eff":"Níveis de ciclosporina reduzidos (falha terapêutica).","cond":"Monitorar nível sérico."},{"a":"INDUTOR","b":"AZOL","sev":"Moderada","ev":"H","mech":"Indução enzimática acelera metabolismo dos azóis (e rifampicina é inibida por eles).","eff":"Falha antifúngica.","cond":"Evitar ou monitorar resposta."},{"a":"INDUTOR","b":"CORT","sev":"Leve","ev":"H","mech":"Indução do metabolismo de glicocorticoides.","eff":"Menor efeito do corticoide.","cond":"Ajustar dose."},{"a":"Fenobarbital","b":"Levotiroxina Sódica","sev":"Leve","ev":"V","mech":"Aumento do clearance do T4.","eff":"T4 total baixo (falso hipotireoidismo) e necessidade maior de levotiroxina.","cond":"Interpretar T4 com cautela (preferir T4 livre + TSH)."},{"a":"Fenobarbital","b":"Cloranfenicol","sev":"Grave","ev":"V","mech":"Cloranfenicol inibe o metabolismo hepático do fenobarbital.","eff":"Sedação excessiva/toxicidade do fenobarbital.","cond":"Evitar ou monitorar nível sérico."},{"a":"Fenobarbital","b":"Griseofulvina","sev":"Leve","ev":"H","mech":"Indução enzimática + menor absorção.","eff":"Redução do efeito antifúngico.","cond":"Preferir outro antifúngico."},{"a":"Fenobarbital","b":"Canabidiol (CBD) — óleo full spectrum/isolado","sev":"Moderada","ev":"V","mech":"CBD inibe CYP450; fenobarbital induz metabolismo do CBD.","eff":"Alterações de níveis de ambos; aumento de enzimas hepáticas.","cond":"Monitorar nível de fenobarbital e enzimas hepáticas."},{"a":"Cloranfenicol","b":"Propofol","sev":"Moderada","ev":"V","mech":"Inibição do metabolismo hepático.","eff":"Anestesia/recuperação prolongada.","cond":"Reduzir doses anestésicas."},{"a":"Cloranfenicol","b":"MACRO_LINC","sev":"Moderada","ev":"H","mech":"Competição pelo mesmo sítio ribossomal 50S.","eff":"Antagonismo antimicrobiano.","cond":"Não associar."},{"a":"Brometo de Potássio","b":"DIUR_ALCA","sev":"Moderada","ev":"V","mech":"Diuréticos de alça aumentam excreção de brometo.","eff":"Queda do nível sérico e crises convulsivas.","cond":"Monitorar nível de brometo."},{"a":"Brometo de Potássio","b":"Cloreto de Sódio 0,9%","sev":"Moderada","ev":"V","mech":"Cloreto compete na reabsorção tubular com brometo.","eff":"Queda do nível de brometo durante fluidoterapia.","cond":"Monitorar; manter dieta com teor de sal constante."},{"a":"Digoxina","b":"Amiodarona","sev":"Grave","ev":"H","mech":"Inibição de P-gp e redução do clearance renal da digoxina.","eff":"Níveis de digoxina ~2x maiores.","cond":"Reduzir digoxina em 50% e dosar."},{"a":"Digoxina","b":"Quinidina (Sulfato/Gluconato)","sev":"Grave","ev":"V","mech":"Redução do clearance e deslocamento tecidual.","eff":"Intoxicação digitálica (equinos).","cond":"Reduzir digoxina e monitorar."},{"a":"Digoxina","b":"Diltiazem","sev":"Moderada","ev":"V","mech":"Somatório de bloqueio nodal AV + aumento leve dos níveis.","eff":"Bradicardia/bloqueio AV (associação usada na fibrilação atrial com monitoração).","cond":"Monitorar FC/ECG e nível de digoxina."},{"a":"Digoxina","b":"Espironolactona","sev":"Leve","ev":"H","mech":"Redução do clearance e interferência em imunoensaios.","eff":"Níveis aparentes maiores.","cond":"Monitorar."},{"a":"BETA","b":"Diltiazem","sev":"Grave","ev":"V","mech":"Depressão somada do nó AV e da contratilidade.","eff":"Bradicardia grave, bloqueio AV, hipotensão, ICC.","cond":"Evitar ou usar doses baixas com ECG."},{"a":"BETA","b":"Pimobendan","sev":"Leve","ev":"B","mech":"Antagonismo do efeito inotrópico.","eff":"Menor resposta ao pimobendan.","cond":"Considerar ao titular."},{"a":"BETA","b":"BETA2","sev":"Moderada","ev":"H","mech":"Antagonismo farmacológico (especialmente betabloqueadores não seletivos).","eff":"Broncoespasmo/falha do broncodilatador.","cond":"Evitar propranolol/carvedilol/sotalol em asmáticos."},{"a":"BETA","b":"INSULINA","sev":"Moderada","ev":"H","mech":"Bloqueio da resposta adrenérgica à hipoglicemia.","eff":"Hipoglicemia mascarada/prolongada.","cond":"Monitorar glicemia."},{"a":"Anlodipino","b":"BETA","sev":"Leve","ev":"H","mech":"Somatório de efeitos hipotensores.","eff":"Hipotensão.","cond":"Monitorar pressão arterial."},{"a":"QT","b":"QT","sev":"Grave","ev":"H","mech":"Prolongamento somado da repolarização ventricular.","eff":"Torsades de pointes, arritmias ventriculares.","cond":"Evitar associação; ECG se inevitável; corrigir K e Mg."},{"a":"BRADI","b":"BRADI","sev":"Moderada","ev":"V","mech":"Efeitos cronotrópicos/dromotrópicos negativos somados.","eff":"Bradicardia, bloqueio AV.","cond":"Monitorar FC e ECG; reduzir doses."},{"a":"OPIOIDE","b":"BZD","sev":"Moderada","ev":"B","mech":"Depressão somada do SNC e respiratória (sinergismo — usado intencionalmente na anestesia).","eff":"Hipoventilação, apneia em pacientes debilitados.","cond":"Titular doses e monitorar ventilação; ter naloxona/flumazenil."},{"a":"OPIOIDE","b":"ALFA2","sev":"Leve","ev":"B","mech":"Sinergismo sedativo-analgésico (associação padrão de MPA).","eff":"Sedação profunda, bradicardia.","cond":"Reduzir doses de ambos."},{"a":"OPIOIDE","b":"Propofol","sev":"Moderada","ev":"B","mech":"Depressão respiratória somada.","eff":"Apneia pós-indução.","cond":"Indução lenta, oxigenação e via aérea pronta."},{"a":"OPIOIDE","b":"MU_PARCIAL","sev":"Moderada","ev":"V","mech":"Butorfanol/buprenorfina/nalbufina ocupam ou antagonizam receptores mu.","eff":"Redução da analgesia do agonista mu puro (buprenorfina: difícil reverter).","cond":"Evitar sequência buprenorfina → agonista mu em dor intensa; aguardar 4–6 h ou usar doses maiores."},{"a":"AMINO","b":"BNM","sev":"Grave","ev":"V","mech":"Aminoglicosídeos reduzem liberação pré-sináptica de acetilcolina.","eff":"Bloqueio neuromuscular prolongado, apneia.","cond":"Monitorar TOF e ventilar; reversão com neostigmina + atropina."},{"a":"Clindamicina","b":"BNM","sev":"Moderada","ev":"H","mech":"Ação bloqueadora neuromuscular própria.","eff":"Potencialização do bloqueio.","cond":"Monitorar."},{"a":"Sulfato de Magnésio 50%","b":"BNM","sev":"Moderada","ev":"H","mech":"Magnésio reduz liberação de acetilcolina.","eff":"Bloqueio prolongado.","cond":"Monitorar."},{"a":"AMINO","b":"NEFRO","sev":"Grave","ev":"V","mech":"Nefrotoxicidade somada.","eff":"Lesão renal aguda.","cond":"Evitar."},{"a":"AMINO","b":"Cefazolina","sev":"Leve","ev":"H","mech":"Possível somatório de toxicidade tubular (cefalosporinas de 1ª geração).","eff":"Nefrotoxicidade leve.","cond":"Hidratar e monitorar urinálise."},{"a":"Cetamina","b":"Aminofilina / Teofilina","sev":"Moderada","ev":"H","mech":"Redução do limiar convulsivo.","eff":"Convulsões.","cond":"Evitar associação."},{"a":"D2ANT","b":"D2ANT","sev":"Moderada","ev":"H","mech":"Bloqueio dopaminérgico somado.","eff":"Sinais extrapiramidais (tremores, rigidez, inquietação).","cond":"Evitar associação (ex.: metoclopramida + acepromazina)."},{"a":"Metoclopramida","b":"Atropina","sev":"Leve","ev":"H","mech":"Anticolinérgico antagoniza o efeito procinético colinérgico.","eff":"Perda do efeito procinético.","cond":"Evitar associação quando o objetivo é motilidade."},{"a":"CORT","b":"INSULINA","sev":"Moderada","ev":"B","mech":"Glicocorticoides causam resistência insulínica.","eff":"Descontrole glicêmico/necessidade maior de insulina; diabetes em gatos.","cond":"Evitar corticoide em diabéticos; se necessário, monitorar glicemia."},{"a":"Metilprednisolona","b":"INSULINA","sev":"Grave","ev":"V","mech":"Corticoide de depósito com efeito de semanas.","eff":"Cetoacidose/descontrole prolongado (gatos).","cond":"Contraindicado em diabéticos."},{"a":"Levotiroxina Sódica","b":"CATION","sev":"Leve","ev":"H","mech":"Ligação no TGI.","eff":"Menor absorção de T4.","cond":"Separar por 2–4 h."},{"a":"Mitotano (o,p'-DDD)","b":"Espironolactona","sev":"Moderada","ev":"B","mech":"Espironolactona bloqueia o efeito adrenocorticolítico.","eff":"Falha do mitotano.","cond":"Evitar associação."},{"a":"Trilostano","b":"IECA_BRA","sev":"Moderada","ev":"B","mech":"Redução de aldosterona somada.","eff":"Hipercalemia, hipotensão.","cond":"Monitorar eletrólitos."},{"a":"ANTICOAG","b":"ANTICOAG","sev":"Grave","ev":"V","mech":"Somatório de efeitos antitrombóticos.","eff":"Hemorragia.","cond":"Associação (ex.: clopidogrel + rivaroxabana) só em tromboembolismo de alto risco com monitoração."},{"a":"Clopidogrel","b":"IBP","sev":"Leve","ev":"H","mech":"Inibição do CYP2C19 (ativação do clopidogrel) — dado humano, relevância veterinária incerta.","eff":"Possível redução do efeito antiplaquetário.","cond":"Preferir pantoprazol/famotidina se necessário."},{"a":"Heparina Sódica","b":"Sulfato de Protamina","sev":"Leve","ev":"B","mech":"Neutralização (uso intencional como antídoto).","eff":"Reversão da heparina.","cond":"Uso terapêutico."},{"a":"Ivermectina","b":"Espinosade","sev":"Grave","ev":"B","mech":"Espinosade inibe P-gp.","eff":"Neurotoxicidade da ivermectina em doses extra-label.","cond":"Não associar ivermectina em dose alta a espinosade."},{"a":"Loperamida","b":"AZOL","sev":"Grave","ev":"H","mech":"Inibição de P-gp/CYP3A permite entrada no SNC.","eff":"Depressão do SNC/coma.","cond":"Evitar."},{"a":"Ciclosporina","b":"Doxorrubicina","sev":"Grave","ev":"H","mech":"Inibição de P-gp.","eff":"Toxicidade aumentada da doxorrubicina.","cond":"Evitar."},{"a":"MIELO","b":"MIELO","sev":"Grave","ev":"V","mech":"Mielossupressão somada.","eff":"Neutropenia/trombocitopenia graves, sepse.","cond":"Hemograma antes de cada dose; protocolos padronizados apenas."},{"a":"HEPATO","b":"HEPATO","sev":"Moderada","ev":"H","mech":"Hepatotoxicidade somada.","eff":"Lesão hepática.","cond":"Monitorar ALT/FA; associar SAMe/silimarina se lomustina."},{"a":"IONOF","b":"Tiamulina","sev":"Grave","ev":"B","mech":"Tiamulina inibe o metabolismo de ionóforos (monensina, salinomicina, narasina — aditivos de ração).","eff":"Intoxicação por ionóforo (miopatia, morte) em suínos e aves.","cond":"Não usar tiamulina em animais recebendo ração com ionóforos (exceto lasalocida conforme bula)."},{"a":"MACRO_LINC","b":"Tilosina","sev":"Leve","ev":"H","mech":"Mesmo sítio de ação (50S).","eff":"Antagonismo/sem benefício.","cond":"Não associar macrolídeos/lincosamidas entre si."},{"a":"Detomidina","b":"Sulfametoxazol/Sulfadiazina + Trimetoprima","sev":"Grave","ev":"B","mech":"Associação de alfa-2 com sulfonamidas potenciadas IV.","eff":"Arritmias e morte súbita em equinos.","cond":"Não administrar sulfa-trimetoprima IV em equinos sedados com alfa-2."},{"a":"Gabapentina","b":"Hidróxido de Alumínio","sev":"Leve","ev":"H","mech":"Antiácidos reduzem absorção (~20%).","eff":"Menor efeito.","cond":"Separar por 2 h."},{"a":"Sucralfato","b":"Digoxina","sev":"Leve","ev":"H","mech":"Ligação no TGI.","eff":"Menor absorção.","cond":"Separar por 2 h."},{"a":"Alopurinol","b":"Azatioprina","sev":"Grave","ev":"H","mech":"Alopurinol inibe a xantina oxidase que metaboliza a azatioprina.","eff":"Mielossupressão grave.","cond":"Evitar; se inevitável reduzir azatioprina em 75%."},{"a":"Alopurinol","b":"Amoxicilina","sev":"Leve","ev":"H","mech":"Mecanismo incerto (dado humano).","eff":"Maior incidência de reações cutâneas.","cond":"Observar."},{"a":"Canabidiol (CBD) — óleo full spectrum/isolado","b":"BZD","sev":"Moderada","ev":"H","mech":"Inibição de CYP + depressão do SNC somada.","eff":"Sedação aumentada.","cond":"Reduzir doses e monitorar."},{"a":"Canabidiol (CBD) — óleo full spectrum/isolado","b":"Ciclosporina","sev":"Moderada","ev":"H","mech":"Inibição do CYP3A.","eff":"Aumento dos níveis de ciclosporina.","cond":"Monitorar."},{"a":"Pregabalina","b":"OPIOIDE","sev":"Leve","ev":"H","mech":"Depressão do SNC somada.","eff":"Sedação.","cond":"Titular."},{"a":"Gabapentina","b":"OPIOIDE","sev":"Leve","ev":"H","mech":"Depressão do SNC somada (efeito poupador de opioide desejável).","eff":"Sedação.","cond":"Titular."},{"a":"Insulina Regular","b":"Cloreto de Potássio 19,1%","sev":"Leve","ev":"B","mech":"Insulina desloca potássio para o intracelular.","eff":"Hipocalemia na CAD.","cond":"Iniciar insulina só com K > 3,5 mEq/L e suplementar KCl."},{"a":"Bicarbonato de Sódio 8,4%","b":"Gluconato de Cálcio 10%","sev":"Moderada","ev":"B","mech":"Precipitação de carbonato de cálcio na mesma via; alcalose reduz cálcio ionizado.","eff":"Precipitação/hipocalcemia ionizada.","cond":"Nunca misturar na mesma via."},{"a":"Ceftriaxona","b":"Ringer com Lactato","sev":"Moderada","ev":"B","mech":"Precipitação ceftriaxona-cálcio.","eff":"Precipitados (fatal em neonatos humanos).","cond":"Não infundir na mesma via/simultaneamente."}],"tox":[{"n":"Lírios (Lilium spp., Hemerocallis spp.)","t":"Planta","sp":"Gatos","sev":"Fatal","dose":"Qualquer quantidade — inclusive pólen ou água do vaso.","mech":"Toxina hidrossolúvel não identificada que causa necrose do epitélio tubular renal.","sx":"Vômito, sialorreia e anorexia em 0–12 h; poliúria (12–24 h) evoluindo para oligúria/anúria e lesão renal aguda em 24–72 h.","tx":"Descontaminação (êmese se < 2 h, carvão ativado), fluidoterapia IV agressiva (2–3x manutenção) por 48–72 h iniciada nas primeiras 18 h, monitorar débito urinário e creatinina; diálise se anúria.","ant":"Não há antídoto."},{"n":"Paracetamol (Acetaminofeno)","t":"Fármaco","sp":"Gatos (cães em sobredose)","sev":"Fatal","dose":"Gatos: > 10 mg/kg (um comprimido de 500 mg pode matar). Cães: > 100–200 mg/kg (hepatotoxicidade); > 200 mg/kg (meta-hemoglobinemia).","mech":"Deficiência de glicuronidação felina → NAPQI oxida hemoglobina e glutationa.","sx":"Mucosas cianóticas/achocolatadas (meta-hemoglobina), edema de face e patas, taquipneia, anemia por corpúsculos de Heinz, icterícia e necrose hepática (cães).","tx":"Oxigênio, êmese/carvão ativado se recente, N-ACETILCISTEÍNA 140 mg/kg IV/VO, depois 70 mg/kg q6h (7–17 doses), vitamina C 30 mg/kg q6h, SAMe, transfusão se anemia grave.","ant":"N-acetilcisteína."},{"n":"Permetrina e piretroides concentrados","t":"Pesticida","sp":"Gatos","sev":"Fatal","dose":"Pipetas caninas 45–65% aplicadas no gato ou contato íntimo com cão recém-tratado.","mech":"Prolonga a abertura dos canais de sódio neuronais; gatos têm glicuronidação deficiente.","sx":"Hipersalivação, tremores e fasciculações generalizadas, hiperestesia, hipertermia, convulsões.","tx":"Banho com detergente neutro (água morna — evitar hipotermia), METOCARBAMOL 55–220 mg/kg IV, emulsão lipídica 20%, diazepam/midazolam/propofol para convulsões, controle de temperatura.","ant":"Sem antídoto específico (metocarbamol + emulsão lipídica)."},{"n":"Uvas, passas e tamarindo","t":"Alimento","sp":"Cães","sev":"Grave","dose":"Idiossincrática — casos com poucas uvas. O ácido tartárico (também no tamarindo e no creme de tártaro) é o agente provável.","mech":"Ácido tartárico → necrose tubular renal proximal.","sx":"Vômito em 6–24 h, letargia, dor abdominal, oligúria/anúria e LRA em 24–72 h.","tx":"Êmese mesmo tardia (até 4–6 h), carvão ativado, fluidoterapia IV por 48–72 h, monitorar creatinina por 72 h.","ant":"Não há."},{"n":"Xilitol (adoçante, chicletes, pasta de dente, gabapentina líquida humana)","t":"Alimento","sp":"Cães","sev":"Grave","dose":"> 0,1 g/kg: hipoglicemia. > 0,5 g/kg: insuficiência hepática aguda.","mech":"Estimula liberação maciça de insulina em cães; hepatotoxicidade por mecanismo não esclarecido.","sx":"Vômito, fraqueza, ataxia, convulsão por hipoglicemia em 30–60 min; petéquias, icterícia e CID em 24–72 h.","tx":"Êmese se assintomático, glicose IV em bolus e IC de glicose 2,5–5%, hepatoprotetores (SAMe, NAC, silimarina), plasma se coagulopatia. Carvão ativado NÃO adsorve xilitol.","ant":"Não há."},{"n":"Chocolate (teobromina e cafeína)","t":"Alimento","sp":"Cães (gatos raramente)","sev":"Grave","dose":"Metilxantinas: 20 mg/kg sinais leves; 40–50 mg/kg cardiotoxicidade; > 60 mg/kg convulsões. Chocolate amargo/cacau em pó: ~15–20 mg/g; ao leite ~2 mg/g.","mech":"Antagonismo de receptores de adenosina e inibição de fosfodiesterase.","sx":"Vômito, PU/PD, agitação, taquicardia, arritmias ventriculares, hipertermia, tremores, convulsões.","tx":"Êmese, carvão ativado em DOSES REPETIDAS (ciclo êntero-hepático), fluidoterapia, sondagem vesical (reabsorção vesical), betabloqueador (esmolol/propranolol) para taquicardia, lidocaína para arritmia ventricular, diazepam para convulsões.","ant":"Não há."},{"n":"Cebola, alho, cebolinha e alho-poró (Allium spp.)","t":"Alimento","sp":"Gatos > Cães, bovinos","sev":"Moderada","dose":"Cães: ≥ 15–30 g/kg de cebola; gatos: ≥ 5 g/kg. Pós desidratados e alho são mais potentes. Efeito cumulativo.","mech":"Dissulfetos oxidam hemoglobina → corpúsculos de Heinz e eccentrócitos.","sx":"Anemia hemolítica 1–5 dias após ingestão, hemoglobinúria, letargia, taquipneia, mucosas pálidas/ictéricas.","tx":"Descontaminação, oxigênio, transfusão se Ht muito baixo, antioxidantes (NAC, vitamina E).","ant":"Não há."},{"n":"Etilenoglicol (anticongelante, aditivo de radiador)","t":"Doméstico","sp":"Cães e gatos","sev":"Fatal","dose":"Cães: 4,4–6,6 mL/kg; gatos: 1,4 mL/kg (solução 95%).","mech":"Metabolizado pela álcool desidrogenase em ácido glicólico e oxalato → acidose metabólica grave e cristais de oxalato de cálcio nos rins.","sx":"Fase 1 (30 min–12 h): ataxia, aparência de embriaguez, PU/PD. Fase 2: aparente melhora. Fase 3 (24–72 h cães; 12–24 h gatos): LRA anúrica, cristalúria de oxalato monoidratado.","tx":"ETANOL 20% IV (fomepizol não disponível no Brasil) iniciado < 8 h em cães e < 3 h em gatos, fluidoterapia, bicarbonato para acidose, diálise.","ant":"Etanol (ou fomepizol, quando importado)."},{"n":"Rodenticidas anticoagulantes (brodifacoum, bromadiolona, difacinona)","t":"Pesticida","sp":"Todas as espécies","sev":"Grave","dose":"Brodifacoum: cães DL50 0,25–3,6 mg/kg (iscas 0,005%).","mech":"Inibem a vitamina K epóxido-redutase → depleção de fatores II, VII, IX e X (sinais após 3–5 dias).","sx":"Hemorragias cavitárias (hemotórax, hemoabdômen), dispneia, hematomas, epistaxe, melena, TP prolongado (primeiro a alterar).","tx":"Êmese se < 2–4 h; VITAMINA K1 2,5–5 mg/kg VO com alimento gorduroso por 4–6 semanas (2ª geração); plasma fresco congelado ou sangue total se hemorragia; dosar TP 48–72 h após última dose.","ant":"Vitamina K1 (fitomenadiona) — nunca K3."},{"n":"Chumbinho (aldicarbe e outros carbamatos/organofosforados ilegais)","t":"Pesticida","sp":"Cães, gatos (envenenamento intencional comum no Brasil)","sev":"Fatal","dose":"Aldicarbe é extremamente tóxico (DL50 < 1 mg/kg).","mech":"Inibição da acetilcolinesterase → excesso de acetilcolina (muscarínico, nicotínico e central).","sx":"SLUDGE-BBB: sialorreia, lacrimejamento, micção, diarreia, vômito, broncorreia, broncoespasmo, bradicardia, miose; fasciculações, fraqueza, convulsões, insuficiência respiratória.","tx":"ATROPINA 0,2–0,5 mg/kg (¼ IV e restante IM/SC) repetida até cessar a broncorreia (não pela FC), oxigênio, ventilação, descontaminação (banho, carvão ativado), diazepam para convulsões. Pralidoxima apenas para organofosforados (não carbamatos). Notificar: crime ambiental (Lei 9.605/98).","ant":"Atropina (+ pralidoxima para organofosforados)."},{"n":"Ivermectina e lactonas macrocíclicas em cães MDR1","t":"Fármaco","sp":"Collie, Pastor-australiano, Pastor-de-Shetland, Border Collie, Old English Sheepdog, Whippet, mestiços","sev":"Grave","dose":"Sensíveis: sinais com ≥ 0,1 mg/kg. Normais: > 2 mg/kg. Comum: ingestão de pasta equina.","mech":"Deficiência de glicoproteína-P (gene ABCB1) permite acúmulo no SNC (agonismo GABA).","sx":"Midríase, cegueira, ataxia, tremores, sialorreia, bradicardia, coma, depressão respiratória.","tx":"Descontaminação, EMULSÃO LIPÍDICA 20%, suporte ventilatório, nutrição, fisioterapia, lubrificação ocular — recuperação pode levar semanas. Testar MDR1 antes de doses altas.","ant":"Não há (emulsão lipídica)."},{"n":"Ivermectina em quelônios e répteis","t":"Fármaco","sp":"Jabutis, tartarugas, cágados, lagartos (skinks), serpente índigo","sev":"Fatal","dose":"Doses terapêuticas de mamíferos (0,2 mg/kg).","mech":"Barreira hematoencefálica permeável em quelônios.","sx":"Paralisia flácida, coma, óbito.","tx":"Suporte prolongado (fluidos, ventilação). Prevenção: usar outro antiparasitário (fembendazol, praziquantel).","ant":"Não há."},{"n":"AINEs humanos (ibuprofeno, naproxeno, diclofenaco, nimesulida)","t":"Fármaco","sp":"Cães e gatos (gatos mais sensíveis)","sev":"Grave","dose":"Ibuprofeno cães: > 25 mg/kg GI; > 175 mg/kg LRA; > 400 mg/kg convulsões. Gatos: metade. Naproxeno: meia-vida de 74 h em cães (≥ 5 mg/kg).","mech":"Inibição de COX-1 → perda de prostaglandinas protetoras da mucosa e da perfusão renal.","sx":"Vômito, hematêmese, melena, dor abdominal, perfuração, LRA, convulsões/coma em doses altas.","tx":"Êmese, carvão ativado (repetir se naproxeno), omeprazol/pantoprazol, sucralfato, misoprostol, fluidoterapia IV por 48–72 h, monitorar creatinina; emulsão lipídica em casos graves.","ant":"Não há."},{"n":"Maconha (THC) e produtos comestíveis","t":"Doméstico","sp":"Cães","sev":"Moderada","dose":"Dose mínima letal estimada > 3 g/kg de THC (raro óbito, exceto com chocolate/xilitol nos comestíveis).","mech":"Agonismo CB1 no SNC.","sx":"Ataxia, hiperestesia, incontinência urinária, midríase, bradicardia, sonolência alternada com agitação.","tx":"Êmese se < 30 min e consciente (antiemético efeito do THC), carvão ativado repetido, suporte térmico, emulsão lipídica em casos graves. Verificar presença de chocolate/xilitol.","ant":"Não há."},{"n":"Envenenamento botrópico (jararaca, jararacuçu, urutu — Bothrops spp.)","t":"Animal peçonhento","sp":"Cães, equinos, bovinos","sev":"Grave","dose":"Responsável por ~85% dos acidentes ofídicos no Brasil.","mech":"Veneno proteolítico, coagulante (consumo de fibrinogênio) e hemorrágico (metaloproteases).","sx":"Dor e edema local intenso e progressivo, equimose, sangramento no local e gengival, coagulopatia (tempo de coagulação prolongado), choque, LRA, necrose.","tx":"SORO ANTIBOTRÓPICO (ou antibotrópico-crotálico) IV o mais rápido possível — dose não depende do peso (mesma quantidade de veneno a neutralizar): leve 2–4, moderado 4–8, grave ~12 ampolas. Fluidoterapia, analgesia (opioide), antibiótico se necrose. NÃO fazer torniquete, incisão ou sucção. Evitar AINE.","ant":"Soro antibotrópico (SAB)."},{"n":"Envenenamento crotálico (cascavel — Crotalus durissus)","t":"Animal peçonhento","sp":"Cães, equinos, bovinos","sev":"Fatal","dose":"Pouca reação local é característica.","mech":"Crotoxina neurotóxica (bloqueio pré-sináptico), miotóxica (rabdomiólise) e coagulante.","sx":"Pouca dor/edema local, ptose palpebral (fácies miastênica), midríase, fraqueza, mialgia, urina escura (mioglobinúria), LRA, insuficiência respiratória.","tx":"SORO ANTICROTÁLICO IV (leve 5, moderado 10, grave 20 ampolas — referência humana), fluidoterapia vigorosa para mioglobinúria (alcalinização), suporte ventilatório.","ant":"Soro anticrotálico (SAC)."},{"n":"Coral verdadeira (Micrurus spp.)","t":"Animal peçonhento","sp":"Cães","sev":"Fatal","dose":"Acidentes raros, mas graves.","mech":"Neurotoxinas pós-sinápticas (curare-like).","sx":"Pouca reação local, paralisia flácida descendente, ptose, disfagia, insuficiência respiratória em poucas horas.","tx":"SORO ANTIELAPÍDICO, ventilação mecânica, neostigmina + atropina pode ajudar (bloqueio pós-sináptico).","ant":"Soro antielapídico."},{"n":"Escorpião amarelo (Tityus serrulatus)","t":"Animal peçonhento","sp":"Cães e gatos (filhotes e pequenos)","sev":"Grave","dose":"Principal escorpião de importância médica no Brasil (áreas urbanas).","mech":"Neurotoxina que abre canais de sódio → descarga autonômica maciça (catecolaminas e acetilcolina).","sx":"Dor local intensa, sialorreia, vômito, tremores, taquicardia ou bradicardia, arritmias, edema pulmonar, choque.","tx":"Analgesia (lidocaína local sem vasoconstritor, opioide, dipirona), suporte cardiovascular, oxigênio; SORO ANTIESCORPIÔNICO em casos moderados/graves.","ant":"Soro antiescorpiônico."},{"n":"Aranha-marrom (Loxosceles spp.)","t":"Animal peçonhento","sp":"Cães, gatos","sev":"Moderada","dose":"Comum na região Sul.","mech":"Esfingomielinase D → necrose dermonecrótica e hemólise intravascular.","sx":"Lesão inicialmente pouco dolorosa que evolui com placa marmórea e necrose em 24–72 h; forma cutâneo-visceral com hemólise e LRA.","tx":"Analgesia, compressas frias, corticoide (prednisolona) nas primeiras 48 h, antibiótico se infecção, desbridamento tardio; soro antiaracnídico/antiloxoscélico nas formas graves.","ant":"Soro antiloxoscélico / antiaracnídico."},{"n":"Sapo-cururu (Rhinella spp. — bufotoxinas)","t":"Animal peçonhento","sp":"Cães","sev":"Grave","dose":"Morder ou lamber o sapo (secreção das glândulas paratoides).","mech":"Bufadienolídeos (efeito digitálico — inibe Na/K-ATPase) e bufotenina.","sx":"Hipersalivação intensa imediata, mucosas hiperêmicas, vômito, ataxia, arritmias (bradi ou taquiarritmias), convulsões, hipertermia.","tx":"LAVAR A BOCA com água corrente (cabeça para baixo) por 10–15 min, monitorar ECG, atropina para bradicardia, lidocaína/esmolol para taquiarritmias, controle de convulsões, resfriamento.","ant":"Anticorpos antidigoxina (Fab) — raramente disponíveis."},{"n":"Taturana / Lagarta Lonomia (Lonomia obliqua)","t":"Animal peçonhento","sp":"Cães, equinos","sev":"Grave","dose":"Contato com cerdas.","mech":"Pró-coagulante → consumo de fatores (síndrome hemorrágica).","sx":"Dor/queimação local, hematomas, sangramentos, hematúria, LRA.","tx":"Compressas frias, analgesia, avaliar coagulação; SORO ANTILONÔMICO se distúrbio de coagulação.","ant":"Soro antilonômico (Instituto Butantan)."},{"n":"Abelhas e vespas (acidente maciço)","t":"Animal peçonhento","sp":"Cães, equinos","sev":"Grave","dose":"Múltiplas picadas (> 20 picadas/kg em humanos é potencialmente letal).","mech":"Melitina e fosfolipase A2: hemólise, rabdomiólise, anafilaxia.","sx":"Edema facial, urticária, anafilaxia (choque, vômito, diarreia), hemoglobinúria/mioglobinúria, LRA.","tx":"Remover ferrões raspando (não apertar), adrenalina 0,01 mg/kg IM na anafilaxia, difenidramina, corticoide, fluidoterapia vigorosa, monitorar hemólise e função renal por 72 h.","ant":"Não há soro antiapílico de uso veterinário amplo."},{"n":"Ionóforos (monensina, lasalocida, salinomicina)","t":"Fármaco","sp":"EQUINOS, cães, (bovinos em sobredose)","sev":"Fatal","dose":"Equinos: DL50 da monensina 2–3 mg/kg (100x mais sensíveis que bovinos). Ração bovina/de aves contaminada ou consumida por cavalos.","mech":"Transporte de íons através das membranas → sobrecarga de cálcio e necrose de cardiomiócitos e músculo esquelético.","sx":"Anorexia, sudorese, cólica, fraqueza, mioglobinúria, arritmias, insuficiência cardíaca, morte súbita (inclusive semanas depois).","tx":"Carvão ativado/óleo mineral, suporte, vitamina E/selênio, repouso absoluto; prognóstico reservado. Interação: tiamulina + ionóforos em aves e suínos causa intoxicação.","ant":"Não há."},{"n":"Erva-de-rato (Palicourea marcgravii)","t":"Planta","sp":"Bovinos","sev":"Fatal","dose":"Planta mais importante como causa de morte de bovinos no Brasil. 0,6 g/kg de folhas frescas pode ser letal.","mech":"Monofluoroacetato de sódio (bloqueia ciclo de Krebs).","sx":"MORTE SÚBITA associada ao exercício (movimentação do rebanho): tremores, queda, pedalagem, óbito em minutos.","tx":"Sem tratamento eficaz; manter o rebanho em repouso; retirar da pastagem; carvão ativado/acetamida experimental.","ant":"Não há."},{"n":"Samambaia (Pteridium esculentum/arachnoideum)","t":"Planta","sp":"Bovinos, equinos","sev":"Grave","dose":"Ingestão crônica (agudo: > 10 g/kg/dia por semanas; crônico: hematúria enzoótica).","mech":"Ptaquilosídeo (carcinogênico e mielotóxico); tiaminase em equinos.","sx":"Bovinos: diátese hemorrágica aguda (mielossupressão), hematúria enzoótica (tumores vesicais), carcinomas do TGI superior. Equinos: deficiência de tiamina (ataxia).","tx":"Retirar da pastagem; transfusão sanguínea; tiamina em equinos. Prognóstico ruim na forma aguda grave.","ant":"Tiamina (equinos)."},{"n":"Brachiaria spp. (fotossensibilização hepatógena)","t":"Planta","sp":"Ovinos, bovinos jovens, caprinos, equinos","sev":"Moderada","dose":"Pastagens de B. decumbens/brizantha em brotação.","mech":"Sa
