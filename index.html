stocitoma.","Estresse/corticoide."],["plq","Plaquetas","×10³/µL",[200,500],[300,800],"Hemograma","Reativa (inflamação, deficiência de ferro), esplenectomia, neoplasias.","Erliquiose/anaplasmose, PTI, CID, consumo/sequestro, medular. GATOS: PSEUDOTROMBOCITOPENIA por agregados (conferir esfregaço)."],["pt","Proteínas totais","g/dL",[6,8],[6,8],"Hemograma","Desidratação, hiperglobulinemia (inflamação crônica, erliquiose, leishmaniose, PIF, mieloma).","Perda (hemorragia, enteropatia/nefropatia perdedora de proteína), insuficiência hepática, desnutrição."],["ureia","Ureia","mg/dL",[21,60],[42,64],"Bioquímica","Azotemia pré-renal (desidratação, choque), renal, pós-renal (obstrução); hemorragia GI, dieta hiperproteica, corticoides.","Insuficiência hepática/shunt, dieta pobre em proteína, PU/PD intensa."],["crea","Creatinina","mg/dL",[0.5,1.5],[0.8,1.8],"Bioquímica","Azotemia: classificar com a densidade urinária (pré-renal se USG > 1,030 cão / > 1,035 gato). Ver estadiamento IRIS.","Baixa massa muscular, hiperfiltração (hipertireoidismo felino mascara DRC)."],["sdma","SDMA","µg/dL",[0,14],[0,14],"Bioquímica","Redução precoce da TFG (DRC inicial, mesmo com creatinina normal), desidratação.","—"],["alt","ALT","U/L",[10,100],[10,80],"Bioquímica","Lesão hepatocelular: hepatites, toxinas (paracetamol, xilitol, cogumelos), lipidose, hipóxia, corticoides/fenobarbital (cães, leve), trauma muscular grave.","Sem significado (deficiência de piridoxina)."],["fa","Fosfatase alcalina (FA)","U/L",[20,156],[10,80],"Bioquímica","Colestase, indução por corticoides/fenobarbital (cães — isoenzima), hiperadrenocorticismo, crescimento ósseo (filhotes), osteossarcoma, hipertireoidismo felino. EM GATOS qualquer aumento é significativo (meia-vida curta).","—"],["ggt","GGT","U/L",[1,7],[0,5],"Bioquímica","Colestase, indução por corticoides (cães), colangite.","—"],["bil","Bilirrubina total","mg/dL",[0.1,0.5],[0.1,0.5],"Bioquímica","Pré-hepática (hemólise), hepática, pós-hepática (obstrução biliar) — ver queixa Icterícia.","—"],["alb","Albumina","g/dL",[2.6,3.3],[2.1,3.3],"Bioquímica","Desidratação.","Enteropatia/nefropatia perdedora de proteína (UPC!), insuficiência hepática, inflamação (proteína de fase aguda negativa), hemorragia."],["glob","Globulinas","g/dL",[2.7,4.4],[2.6,5.1],"Bioquímica","Inflamação crônica, erliquiose, leishmaniose, PIF (relação A:G < 0,4 favorece PIF), mieloma/linfoma (gamopatia monoclonal).","Perda (hemorragia, enteropatia), imunodeficiência."],["glic","Glicose","mg/dL",[65,118],[70,150],"Bioquímica","Diabetes mellitus, estresse (gatos — até 300 mg/dL), corticoides, pós-prandial, hiperadrenocorticismo, acromegalia.","Insulinoma, sepse, sobredose de insulina, xilitol (cães), filhotes de raças toy, hipoadrenocorticismo, insuficiência hepática, ARTEFATO (amostra não centrifugada)."],["col","Colesterol","mg/dL",[135,270],[90,205],"Bioquímica","Hipotireoidismo, hiperadrenocorticismo, diabetes, colestase, síndrome nefrótica, pós-prandial, hiperlipidemia do Schnauzer.","Insuficiência hepática/shunt, enteropatia perdedora de proteína, hipoadrenocorticismo."],["trig","Triglicerídeos","mg/dL",[20,112],[17,104],"Bioquímica","Pós-prandial (jejum de 12 h!), diabetes, hipotireoidismo, pancreatite, hiperlipidemia primária (Schnauzer).","—"],["ca","Cálcio total","mg/dL",[9,11.3],[8.2,10.8],"Bioquímica","Hipercalcemia: LINFOMA (hipercalcemia humoral da malignidade), adenocarcinoma de saco anal, hipoadrenocorticismo, DRC, hiperparatireoidismo primário, intoxicação por vitamina D/colecalciferol (rodenticidas), idiopática felina.","Eclâmpsia (tetania puerperal), hipoparatireoidismo (pós-tireoidectomia), pancreatite, intoxicação por etilenoglicol, hipoalbuminemia (corrigir pelo cálcio ionizado)."],["p","Fósforo","mg/dL",[2.6,6.2],[3,7],"Bioquímica","DRC (TFG reduzida), filhotes (crescimento), hemólise, hipoparatireoidismo, obstrução uretral.","Síndrome de realimentação, cetoacidose diabética após insulina, hiperparatireoidismo primário."],["na","Sódio","mEq/L",[141,152],[147,156],"Eletrólitos","Perda de água livre (desidratação, diabetes insípido, falta de acesso à água), sal (salina hipertônica, intoxicação por sal).","Hipoadrenocorticismo (Na:K < 27), vômito/diarreia, ICC, diuréticos, tricuríase, hiperglicemia (pseudo-hiponatremia)."],["k","Potássio","mEq/L",[3.7,5.8],[3.5,5.5],"Eletrólitos","OBSTRUÇÃO URETRAL/uroabdome, hipoadrenocorticismo, LRA oligúrica/anúrica, acidose, IECA/espironolactona, hemólise (Akita).","Anorexia, vômito, diurese, DRC felina, cetoacidose diabética (após insulina), furosemida, fluidoterapia sem K."],["cl","Cloreto","mEq/L",[105,115],[117,123],"Eletrólitos","Acidose hiperclorêmica (salina 0,9% em excesso, diarreia), uso de brometo (falso aumento!).","Vômito de conteúdo gástrico (obstrução pilórica — alcalose hipoclorêmica), diuréticos."],["usg","Densidade urinária (USG)","",[1.015,1.045],[1.035,1.06],"Urinálise","Desidratação (urina concentrada), azotemia pré-renal.","Isostenúria (1,008–1,012) com azotemia = doença renal; hipostenúria (< 1,008) = diabetes insípido, polidipsia psicogênica, hiperadrenocorticismo, piometra."],["upc","Relação proteína:creatinina urinária (UPC)","",[0,0.5],[0,0.4],"Urinálise","Proteinúria renal (glomerulopatia — leishmaniose, erliquiose), hipertensão, hiperadrenocorticismo; descartar ITU/hematúria (sedimento inativo) antes de interpretar.","—"],["ph_u","pH urinário","",[5.5,7.5],[5.5,7.5],"Urinálise","ITU por bactérias produtoras de urease (estruvita), dieta vegetal, acidose tubular renal distal.","Dieta rica em carne, acidose metabólica, cetoacidose."]],"vac":{"dog":{"n":"Cão","core":[["Polivalente (V8/V10: cinomose, parvovírus, adenovírus, parainfluenza ± leptospirose e coronavírus)","Iniciar com 6–8 semanas; repetir a cada 2–4 semanas até ≥ 16 semanas de idade (última dose obrigatoriamente ≥ 16 sem — anticorpos maternos).","Reforço aos 6 meses (WSAVA) ou 1 ano; depois as vacinas core de vírus vivo podem ser a cada 3 anos (WSAVA) — a bula de muitos produtos no Brasil indica anual."],["Antirrábica","A partir de 12 semanas (dose única inicial).","Reforço anual (exigência legal em grande parte do país e para viagens)."]],"noncore":[["Leptospirose (bacterina)","2 doses com 2–4 semanas de intervalo a partir de 8–12 semanas.","Anual (imunidade curta). Recomendada para a maioria dos cães no Brasil (alto risco ambiental)."],["Traqueobronquite infecciosa (Bordetella + parainfluenza — intranasal/oral)","Dose única intranasal/oral (início de imunidade rápido).","Anual; cães em hotéis, creches, canis, exposições."],["Leishmaniose (Leish-Tec)","Cães ≥ 4 meses, SOROLOGIA NEGATIVA prévia: 3 doses com 21 dias de intervalo.","Anual. Associar coleira repelente. Não substitui o controle do vetor."],["Giardíase / coronavírus entérico","—","NÃO recomendadas rotineiramente (WSAVA)."]],"verm":"Filhotes: a cada 2 semanas de 2 a 8 semanas, depois mensal até 6 meses. Adultos: a cada 3 meses (ou mensal em alto risco/contato com crianças) — ESCCAP. Ectoparasitas: controle contínuo (isoxazolinas/coleiras), sobretudo carrapatos (hemoparasitoses)."},"cat":{"n":"Gato","core":[["Polivalente (tríplice/quádrupla: panleucopenia, herpesvírus, calicivírus ± clamídia)","Iniciar com 6–8 semanas; repetir a cada 2–4 semanas até ≥ 16 semanas.","Reforço aos 6 meses ou 1 ano; panleucopenia a cada 3 anos; herpes/calici anual para gatos de risco (acesso à rua, gatis, hotéis) ou a cada 3 anos para gatos de baixo risco."],["Antirrábica","A partir de 12 semanas.","Reforço anual (exigência legal frequente). Aplicar em local recomendado (membro distal) pelo risco de sarcoma no local de injeção."]],"noncore":[["FeLV (leucemia felina)","TESTAR antes. 2 doses com 3–4 semanas a partir de 8 semanas.","Reforço com 1 ano; depois a cada 2–3 anos se o risco persistir. Gatos com acesso à rua ou contato com positivos."],["FIV","—","Não disponível/recomendada no Brasil."]],"verm":"Filhotes: a partir de 3 semanas, a cada 2 semanas até 8 semanas, depois mensal até 6 meses. Adultos:   d._s = norm([d.n,d.b,d.i,d.p,CLS[d.c]&&CLS[d.c].n].join(" "));
  return d;
}).sort((a,b)=>a.n.localeCompare(b.n,"pt-BR"));
const DM = Object.fromEntries(DRUGS.map(d=>[d.id,d]));

function spGroup(s){s=norm(s);
  if(/cao|canin/.test(s))return"dog";if(/gat|felin/.test(s))return"cat";if(/equin|caval|potro/.test(s))return"horse";
  if(/bovin|vaca|bezerr|garrote/.test(s))return"cattle";if(/ovin|caprin|ovelha|cabra/.test(s))return"sr";if(/coelh/.test(s))return"rabbit";
  if(/ave|calopsita|psitac/.test(s))return"bird";if(/reptil|quelon|iguana|jabuti/.test(s))return"reptile";if(/suin/.test(s))return"pig";return"other";}

const IG=DATA.ig,INTER=DATA.inter;
const GLBL={AINE:"AINEs",CORT:"Corticoides",IECA_BRA:"IECA/BRA",DIUR_ALCA:"Diuréticos de alça/tiazídicos",K_UP:"Fármacos que elevam K",FQ:"Fluoroquinolonas",TETRA:"Tetraciclinas",CATION:"Antiácidos/cátions (Ca, Al, Fe, Zn, Bi, sucralfato)",AMINO:"Aminoglicosídeos",NEFRO:"Nefrotóxicos",SEROT:"Serotoninérgicos",IMAO:"Inibidores da MAO (selegilina, amitraz)",AZOL:"Antifúngicos azóis",CYP_INIB:"Inibidores de CYP",INDUTOR:"Indutores enzimáticos",QT:"Prolongadores de QT",BRADI:"Bradicardizantes",BETA:"Betabloqueadores",PGP_INIB:"Inibidores da glicoproteína-P",PGP_SUB:"Substratos da P-gp (lactonas, loperamida, vincristina...)",ANTICOAG:"Antitrombóticos",OPIOIDE:"Opioides agonistas",MU_PARCIAL:"Opioides parciais/kappa",BZD:"Benzodiazepínicos",ALFA2:"Alfa-2 agonistas",BNM:"Bloqueadores neuromusculares",INSULINA:"Insulinas/hipoglicemiantes",D2ANT:"Antagonistas D2",IONOF:"Ionóforos (via ração)",MACRO_LINC:"Macrolídeos/lincosamidas",BACTERICIDA_BL:"Betalactâmicos",SIMPATO:"Simpatomiméticos",BETA2:"Beta-2 agonistas",IBP:"Antissecretores (IBP/H2)",MIELO:"Mielossupressores",HEPATO:"Hepatotóxicos"};
const EVL={B:"Bula/consenso veterinário",V:"Estudos/relatos veterinários",H:"Extrapolado de dados humanos"};
function inSide(side,name){return side===name||(IG[side]&&IG[side].includes(name))}
function sideLbl(side){return IG[side]?(GLBL[side]||side):side}
function interPairs(names){const out=[],seen=new Set();
  for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){const x=names[i],y=names[j];if(x===y)continue;
    INTER.forEach((r,k)=>{const hit=(inSide(r.a,x)&&inSide(r.b,y))||(inSide(r.a,y)&&inSide(r.b,x));const key=k+"|"+[x,y].sort().join("|");if(hit&&!seen.has(key)){seen.add(key);out.push({r,x,y})}})}
  const o={Grave:0,Moderada:1,Leve:2};return out.sort((p,q)=>o[p.r.sev]-o[q.r.sev])}
function interFor(name){return INTER.filter(r=>inSide(r.a,name)||inSide(r.b,name)).map(r=>({r,other:inSide(r.a,name)?r.b:r.a}))}
function sevTag(s){return '<span class="tag '+(s==="Grave"?"t-bad":s==="Moderada"?"t-warn":"t-info")+'">'+s+'</span>'}
function interCard(p){const r=p.r;return '<div class="card" style="border-left:4px solid '+(r.sev==="Grave"?"var(--bad)":r.sev==="Moderada"?"var(--warn)":"var(--info)")+'"><div class="row wrapf" style="gap:6px">'+sevTag(r.sev)+'<span class="tag t-cls">'+EVL[r.ev]+'</span></div><h3 style="margin-top:8px">'+esc(p.x?p.x+" + "+p.y:sideLbl(p.other))+'</h3>'+(p.other&&IG[p.other]?'<div class="xs muted" style="margin-top:2px">'+esc(IG[p.other].join(", "))+'</div>':"")+'<div class="kv" style="margin-top:10px">'+kv("Efeito",r.eff)+kv("Mecanismo",r.mech)+kv("Conduta",r.cond)+'</div></div>'}

function frac(n){const q=Math.round(n*4)/4;const w=Math.floor(q),r=q-w;const m={0:"",0.25:"¼",0.5:"½",0.75:"¾"}[r];return (w?w+(m?" "+m:""):(m||"0"))}
let lastCalc=null;
function calcDose(){
  const d=DM[S.calcDrug];const out=document.getElementById("cOut");if(!d||!out)return;
  const sp=S.calcSp,e=d.d[sp],u=UNIT[d.u||"mg"];const w=gv("cW"),dose=gv("cDose"),conc=gv("cConc"),tab=gv("cTab");
  if(w<=0){out.innerHTML='<div class="muted">Informe o peso.</div>';return}
  let total,html="",base=d.u==="m2"?bsa(sp,w):w;total=dose*base;
  const warn=(dose<e[0]*0.999||dose>e[1]*1.001)?'<div class="note bad" style="margin-top:10px">Dose fora da faixa de referência ('+fmt(e[0])+"–"+fmt(e[1])+" "+u.k+').</div>':"";
  if(d.u==="mcgmin"){
    const mcgmin=total,mgh=mcgmin*60/1000;const bag=gv("cBag"),rate=gv("cRate");
    const mlh=conc>0?mcgmin*60/conc:NaN;const addMl=(conc>0&&rate>0)?(mcgmin*60/rate)*bag/conc:NaN;
    html='<div class="lbl">Taxa de fármaco</div><div class="big">'+fmt(mcgmin)+' mcg/min</div><div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(mgh)+' mg/h</b><span>quantidade por hora</span></div><div class="res"><b>'+fmt(mlh)+' mL/h</b><span>fármaco puro ('+fmt(conc)+' mcg/mL)</span></div></div>'+
    (isFinite(addMl)?'<div class="note ok" style="margin-top:10px"><b>Preparo:</b> adicionar <b>'+fmt(addMl)+' mL</b> do fármaco em '+fmt(bag)+' mL de diluente e infundir a <b>'+fmt(rate)+' mL/h</b>.'+(addMl>bag*0.2?" <b>Volume de fármaco alto — aumente a taxa ou reduza o volume da bolsa.</b>":"")+'</div>':"");
    lastCalc={d,txt:"Infusão contínua a "+fmt(dose)+" mcg/kg/min: adicionar "+fmt(addMl)+" mL em "+fmt(bag)+" mL e infundir a "+fmt(rate)+" mL/h."};
  }else{
    const vol=conc>0&&u.c?total/conc:NaN;const tabs=tab>0?total/tab:NaN;const gtm=gv("cGt")||20;const gts=vol*gtm;
    html='<div class="lbl">Dose total por administração</div><div class="big">'+fmt(total)+" "+u.t+'</div>'+
    (d.u==="m2"?'<div class="sm muted">Superfície corporal: '+fmt(base,3)+' m²</div>':"")+
    '<div class="res-grid" style="margin-top:10px">'+(u.c?'<div class="res"><b>'+(isFinite(vol)?fmt(vol)+" mL":"—")+'</b><span>volume ('+(conc?fmt(conc)+" "+u.c:"informe a concentração")+')</span></div>':'')+
    (isFinite(gts)?'<div class="res"><b>≈ '+(gts<1?fmt(gts,1):Math.round(gts))+' gota'+(gts>=1.5?'s':'')+'</b><span>líquido oral/gotas ('+fmt(gtm)+' gotas/mL)'+(gts<1?' — volume pequeno: prefira seringa':'')+'</span></div>':"")+(isFinite(tabs)?'<div class="res"><b>'+fmt(tabs,2)+' comp.</b><span>≈ '+frac(tabs)+' de '+fmt(tab)+" "+u.t+'</span></div>':"")+
    '<div class="res"><b>'+esc(e[2]||"—")+'</b><span>via</span></div><div class="res"><b style="font-size:15px">'+esc(e[3]||"—")+'</b><span>frequência</span></div></div>';
    const via=(e[2]||"").split(/[\/ ]/)[0];
    lastCalc={d,txt:(isFinite(vol)?"Administrar "+fmt(vol)+" mL"+(/VO|oral/i.test(e[2]||"")&&gts>=1?" (≈ "+Math.round(gts)+" gotas)":"")+" ("+fmt(total)+" "+u.t+")":isFinite(tabs)?"Administrar "+frac(tabs)+" comprimido(s) de "+fmt(tab)+" "+u.t+" ("+fmt(total)+" "+u.t+")":"Administrar "+fmt(total)+" "+u.t)+(via?" por via "+via:"")+", "+(e[3]||"")+".",pres:(isFinite(vol)&&conc?fmt(conc)+" "+u.c:isFinite(tabs)?fmt(tab)+" "+u.t:"")};
  }
  out.innerHTML=html+'<div style="margin-top:10px">'+labInfo(d,sp).tag+'</div>'+warn+(e[4]?'<div class="sm" style="margin-top:10px"><b>Obs.:</b> '+esc(e[4])+'</div>':"");
}

 fen:[["mcgkgh",5,50],"Fentanil 2–10 mcg/kg/h (50 mcg/mL)."],lid:[["mcgkgmin",50,20000],"Lidocaína 25–80 mcg/kg/min (2% = 20 mg/mL)."],ket:[["mcgkgmin",10,100000],"Cetamina 2–10 mcg/kg/min (100 mg/mL)."],
 dob:[["mcgkgmin",5,12500],"Dobutamina 2,5–15 mcg/kg/min (12,5 mg/mL)."],nor:[["mcgkgmin",0.1,1000],"Noradrenalina 0,05–2 mcg/kg/min (1 mg/mL)."],fur:[["mgkgh",0.66,10],"Furosemida 0,66–1 mg/kg/h (10 mg/mL)."],dex:[["mcgkgh",1,500],"Dexmedetomidina 0,5–3 mcg/kg/h (0,5 mg/mL)."]};

function calcCRI(){const w=gv("iW"),U=document.getElementById("iU").value,d=gv("iD"),c=gv("iC"),V=gv("iV"),R=gv("iR");const o=document.getElementById("iOut");if(!o)return;
  let perH; // em mg/h (ou UI/h)
  if(U==="mcgkgmin")perH=d*w*60/1000;else if(U==="mcgkgh")perH=d*w/1000;else if(U==="mgkgh"||U==="uikgh")perH=d*w;else perH=d*w/24;
  const mlDrugH=c>0?perH/c:NaN;const hours=R>0?V/R:NaN;const amt=perH*hours;const addMl=c>0?amt/c:NaN;const un=U==="uikgh"?"UI":"mg";
  o.innerHTML='<div class="lbl">Quantidade por hora</div><div class="big">'+fmt(perH)+" "+un+'/h</div><div class="res-grid" style="margin-top:10px"><div class="res"><b>'+fmt(mlDrugH)+' mL/h</b><span>se fármaco puro (bomba de seringa)</span></div><div class="res"><b>'+fmt(hours)+' h</b><span>duração da bolsa</span></div></div>'+
  '<div class="note ok" style="margin-top:10px"><b>Preparo:</b> adicionar <b>'+fmt(addMl)+' mL</b> ('+fmt(amt)+" "+un+') do fármaco a '+fmt(V)+' mL e infundir a <b>'+fmt(R)+' mL/h</b>. Considere retirar da bolsa o mesmo volume adicionado.</div>';}
function calcFluid(){const sp=document.getElementById("fSp").value,w=gv("fW"),D=num(document.getElementById("fD").value),T=gv("fT")||24,L=gv("fL"),E=num(document.getElementById("fE").value);const o=document.getElementById("fOut");
  const s=SPM[sp];const maint=s.mlExp===0.75?s.ml*Math.pow(w,0.75):s.ml*w;const def=w*D*10;const first=(def/T)+(maint+L)/24;const after=(maint+L)/24;const tot24=def+maint+L;

   ["Lidocaína (FV refratária — cães)",2,20,"mg","IV/IO lento"],["Amiodarona (FV refratária)",5,50,"mg","IV/IO lento"],["Naloxona (reversão opioide)",0.04,0.4,"mg","IV/IO"],["Flumazenil (reversão BZD)",0.01,0.1,"mg","IV/IO"],["Atipamezol (reversão alfa-2)",0.1,5,"mg","IM/IV"],
   ["Gluconato de cálcio 10%",50,100,"mg","IV lento — hipocalcemia/hipercalemia"],["Bicarbonato 8,4% (RCP > 10 min)",1,1,"mEq","IV lento"],["Glicose 50% (diluir)",0.5,500,"g","= 1 mL/kg diluído 1:2"],["Diazepam (convulsão)",0.5,5,"mg","IV ou 1 mg/kg retal"],["Midazolam (convulsão)",0.2,5,"mg","IV/IM/intranasal"],["Emulsão lipídica 20% (intoxicação lipofílica)",1.5,1,"mL","bolus, depois 0,25 mL/kg/min"],["Furosemida (edema pulmonar)",2,10,"mg","IV/IM, repetir a cada 1 h se necessário"]];

  '<div class="note warn" style="margin-top:10px">Concentrações: adrenalina 1 mg/mL, vasopressina 20 UI/mL, atropina 0,5 mg/mL, lidocaína 2%, amiodarona 50 mg/mL, naloxona 0,4 mg/mL, flumazenil 0,1 mg/mL, atipamezol 5 mg/mL, Ca 10% (100 mg/mL), bicarbonato 1 mEq/mL. Confira as ampolas disponíveis.</div>';}

 if(hi("ht")&&hi("pt"))P.push(["info","Ht e proteínas totais elevados: DESIDRATAÇÃO (hemoconcentração)."]);
 if(hi("ht")&&V.pt!=null&&!hi("pt"))P.push(["info","Ht elevado com proteínas normais: contração esplênica (excitação) ou policitemia verdadeira/secundária (gastroenterite hemorrágica pode cursar com Ht alto e PT normal/baixa)."]);
 if(lo("ht")&&lo("pt"))P.push(["warn","Anemia com hipoproteinemia: sugere PERDA DE SANGUE (externa ou gastrointestinal)."]);
 if(lo("plq"))P.push([V.plq<50?"bad":"warn","Trombocitopenia"+(V.plq<50?" GRAVE (< 50.000/µL — risco de sangramento espontâneo; < 30.000 sugere PTI ou erliquiose)":"")+". "+(sp==="cat"?"Em gatos conferir agregados plaquetários no esfregaço (pseudotrombocitopenia).":"Investigar hemoparasitoses (Ehrlichia, Anaplasma — PCR/sorologia), CID, imunomediada.")]);
 // fígado

 else if(hi("fa")&&!hi("alt"))P.push(["info",sp==="cat"?"FA elevada em gato (isoladamente é SIGNIFICATIVA): lipidose hepática, colangite, hipertireoidismo (dosar T4 total em gatos > 7 anos), diabetes.":"FA elevada isolada em cão: indução por corticoides/fenobarbital, hiperadrenocorticismo, colestase, crescimento ósseo (filhote), osteossarcoma, hiperplasia nodular (idosos)."]);
 if(hi("bil")&&V.ht!=null)P.push([lo("ht")?"warn":"info",lo("ht")?"Hiperbilirrubinemia + anemia: considerar ICTERÍCIA PRÉ-HEPÁTICA (hemólise — anemia hemolítica imunomediada, Mycoplasma, Babesia, toxinas: cebola, zinco, paracetamol em gatos).":"Hiperbilirrubinemia com Ht normal: causa HEPÁTICA ou PÓS-HEPÁTICA (obstrução biliar, mucocele, pancreatite) — ultrassom abdominal."]);
 // proteínas
 if(V.alb!=null&&V.glob!=null){const ag=V.alb/V.glob;P.push([sp==="cat"&&ag<0.4?"warn":"info","Relação albumina:globulina = "+fmt(ag,2)+(sp==="cat"?(ag<0.4?" (< 0,4): aumenta a probabilidade de PIF em gato com sinais compatíveis (não é diagnóstica isoladamente).":ag>0.8?" (> 0,8): torna a PIF improvável.":" (0,4–0,8): inconclusiva para PIF."):(ag<0.6?" — baixa: hiperglobulinemia (inflamação crônica, erliquiose, leishmaniose) e/ou hipoalbuminemia.":""))])}

 if(lo("glic")&&V.glic<60)P.push(["bad","HIPOGLICEMIA (< 60 mg/dL): dextrose 0,5–1 mL/kg de glicose 50% diluída 1:2–1:4 IV. Investigar sepse, insulinoma, xilitol, filhote toy, hipoadrenocorticismo, insuficiência hepática; excluir ARTEFATO (sangue não centrifugado)."]);
 // cálcio/fósforo
 if(hi("ca"))P.push(["warn","Hipercalcemia: mnemônico GOSH DARN IT — granulomatosa, osteolítica, espúria, hiperparatireoidismo, D (vitamina D/rodenticida colecalciferol), Addison, renal, neoplasia (LINFOMA, adenocarcinoma de saco anal), idiopática (gatos), temperatura. Confirmar com cálcio IONIZADO; examinar linfonodos e saco anal."]);
 if(lo("ca")&&V.ca<7)P.push(["bad","Hipocalcemia (< 7 mg/dL): em cadela lactante = ECLÂMPSIA (tetania). Gluconato de cálcio 10% 0,5–1,5 mL/kg IV lento com ECG. Corrigir pelo cálcio ionizado se hipoalbuminemia."]);
 if(V.ca!=null&&V.p!=null&&V.ca*V.p>70)P.push(["warn","Produto Ca × P = "+fmt(V.ca*V.p,0)+" (> 70): risco de mineralização de tecidos moles (DRC) — dieta renal/quelante de fósforo."]);
 if(hi("col")&&hi("fa")&&sp==="dog")P.push(["info","Hipercolesterolemia + FA alta em cão: considerar hiperadrenocorticismo, hipotireoidismo, diabetes ou colestase."]);
 // urina
 if(V.usg!=null&&V.usg<1.008)P.push(["warn","HIPOSTENÚRIA (USG < 1,008): rins diluindo ativamente — diabetes insípido, polidipsia psicogênica, hiperadrenocorticismo, piometra, hipercalcemia, insuficiência hepática."]);

function labRun(){const o=document.getElementById("labOut");if(!o)return;const {flags,P}=labEval();
 if(!flags.length&&!P.length){o.innerHTML='<div class="sm muted">Digite os resultados para ver alterações, causas prováveis e padrões.</div>';return}
 o.innerHTML=(P.length?'<div class="lbl">Interpretação / padrões</div><div class="stack" style="margin:6px 0 12px">'+P.map(([c,t])=>'<div class="note '+c+'">'+esc(t)+'</div>').join("")+'</div>':"")+
 (flags.length?'<div class="lbl">Alterações ('+flags.length+')</div><div class="stack" style="margin-top:6px">'+flags.map(f=>'<div class="sm"><b>'+f.d+' '+esc(f.x[1])+': '+f.val+' '+esc(f.x[2])+'</b><br/><span class="muted">'+esc(f.c)+'</span></div>').join("")+'</div>':'<div class="note ok">Todos os valores informados dentro da faixa de referência.</div>')}
function labText(){const {flags,P}=labEval();return "INTERPRETAÇÃO LABORATORIAL ("+(S.lab.sp==="cat"?"Gato":"Cão")+")\n\nAlterações:\n"+(flags.map(f=>"- "+f.d+" "+f.x[1]+": "+f.val+" "+f.x[2]).join("\n")||"- nenhuma")+"\n\nPadrões:\n"+(P.map(p=>"- "+p[1]).join("\n")||"- nenhum")}
function gasEval(G){const sp=G.sp||"dog",N=sp==="cat"?{pco2:31,hco3:18,na:156,cl:120,ag:[13,27]}:{pco2:37,hco3:22,na:146,cl:110,ag:[12,24]};
 const v=k=>G[k]===""||G[k]==null?null:num(G[k]);const ph=v("ph"),pc=v("pco2"),hc=v("hco3");const R=[];let prim="";
 if(ph==null||pc==null||hc==null)return{R:[["info","Informe pH, pCO₂ e HCO₃⁻ para a análise ácido-base."]],prim:""};
 if(ph<7.35){if(hc<N.hco3-2&&(pc<=N.pco2+3||hc/N.hco3<pc/N.pco2))prim="Acidose metabólica";else if(pc>N.pco2+3)prim="Acidose respiratória";else prim="Acidose metabólica"}
 else if(ph>7.45){if(hc>N.hco3+2&&!(pc<N.pco2-3&&pc/N.pco2<hc/N.hco3))prim="Alcalose metabólica";else if(pc<N.pco2-3)prim="Alcalose respiratória";else prim="Alcalose metabólica"}
 else{if(Math.abs(hc-N.hco3)>3||Math.abs(pc-N.pco2)>4)prim="pH normal com HCO₃⁻/pCO₂ alterados — distúrbio MISTO compensado ou duplo";else prim="Equilíbrio ácido-base normal"}
 const dH=hc-N.hco3,dP=pc-N.pco2;let exp=null,lab="";
 if(prim==="Acidose metabólica"){exp=N.pco2+0.7*dH;lab="pCO₂ esperada"}
 else if(prim==="Alcalose metabólica"){exp=N.pco2+0.7*dH;lab="pCO₂ esperada"}
 else if(prim==="Acidose respiratória"){exp=N.hco3+(G.cr==="c"?0.35:0.15)*dP;lab="HCO₃⁻ esperado ("+(G.cr==="c"?"crônica":"aguda")+")"}
 else if(prim==="Alcalose respiratória"){exp=N.hco3+(G.cr==="c"?0.55:0.25)*dP;lab="HCO₃⁻ esperado ("+(G.cr==="c"?"crônica":"aguda")+")"}
 R.push([/normal$/.test(prim)?"ok":"warn","Distúrbio primário: "+prim.toUpperCase()+" (pH "+ph+")."]);
 if(exp!=null){const resp=/metab/.test(prim);const obs=resp?pc:hc;const ok=Math.abs(obs-exp)<=(resp?3:2);
  R.push([ok?"ok":"bad",lab+": "+fmt(exp,1)+" ± "+(resp?3:2)+" — medida "+obs+". "+(ok?"Compensação ADEQUADA (distúrbio simples).":resp?(obs>exp?"pCO₂ acima do esperado → ACIDOSE RESPIRATÓRIA concomitante (hipoventilação).":"pCO₂ abaixo do esperado → ALCALOSE RESPIRATÓRIA concomitante (hiperventilação, dor, sepse)."):(obs>exp?"HCO₃⁻ acima do esperado → ALCALOSE METABÓLICA concomitante.":"HCO₃⁻ abaixo do esperado → ACIDOSE METABÓLICA concomitante."))+(sp==="cat"&&resp?" (Gatos: compensação respiratória menos previsível.)":"")])}
 const na=v("na"),k=v("k"),cl=v("cl"),alb=v("alb"),lac=v("lac");
 if(na!=null&&cl!=null){const ag=na+(k||0)-(cl+hc);const agc=alb!=null?ag+4.2*(3.7-alb):null;const hiag=(agc!=null?agc:ag)>N.ag[1];
  R.push([hiag?"bad":"info","Ânion gap = (Na + K) − (Cl + HCO₃) = "+fmt(ag,1)+" mEq/L (ref. "+N.ag.join("–")+")"+(agc!=null?" · corrigido pela albumina ≈ "+fmt(agc,1)+" (fórmula canina de Constable)":"")+". "+(prim==="Acidose metabólica"||dH<-3?(hiag?"Acidose metabólica com ÂNION GAP ALTO (normoclorêmica): lactato (hipoperfusão), cetoácidos (cetoacidose diabética), uremia, toxinas (ETILENOGLICOL, salicilatos, metaldeído).":"Acidose metabólica com ânion gap NORMAL (hiperclorêmica): diarreia (perda de HCO₃⁻), acidose tubular renal, salina 0,9% em excesso, hipoadrenocorticismo."):(hiag?"Ânion gap alto sem acidemia evidente: considerar distúrbio MISTO (acidose com AG alto + alcalose metabólica, ex.: vômito + uremia/cetoacidose).":"Dentro da referência. Lembre: hipoalbuminemia reduz o AG e pode mascarar ânions não medidos."))]);
  const clc=cl*N.na/na;R.push([Math.abs(clc-N.cl)>4?"warn":"ok","Cloreto corrigido pelo sódio = "+fmt(clc,1)+" mEq/L (normal ~"+N.cl+"). "+(clc<N.cl-4?"HIPOCLOREMIA corrigida → alcalose hipoclorêmica (vômito de conteúdo gástrico, obstrução pilórica, furosemida): repor com NaCl 0,9% + KCl.":clc>N.cl+4?"HIPERCLOREMIA corrigida → acidose hiperclorêmica (diarreia, salina em excesso, ATR).":"Normal.")])}
 if(lac!=null)R.push([lac>4?"bad":lac>2.5?"warn":"ok","Lactato "+lac+" mmol/L: "+(lac>4?"HIPERLACTATEMIA importante — hipoperfusão/sepse/DVG (lactato > 6 em DVG associado a necrose gástrica); reavaliar após fluidoterapia (queda > 50% em 12 h = bom prognóstico).":lac>2.5?"hiperlactatemia leve — avaliar perfusão.":"normal (< 2,5).")]);
 return{R,prim}}
function gasRun(){const o=document.getElementById("gasOut");if(!o)return;const {R}=gasEval(S.gaso);o.innerHTML='<div class="stack">'+R.map(([c,t])=>'<div class="note '+c+'">'+esc(t)+'</div>').join("")+'</div>'}

 if(arg==="monit")body='<div class="card scroll-x"><table class="tbl"><thead><tr><th>Parâmetro</th><th>Meta trans-anestésica</th></tr></thead><tbody>'+M.map(([a,b])=>'<tr><td>'+esc(a)+'</td><td><b>'+esc(b)+'</b></td></tr>').join("")+'</tbody></table></div>'+
  '<div class="card"><h3>Hipotensão (PAS < 90 / PAM < 60 mmHg)</h3><p class="sm" style="margin:6px 0 0">1) Reduzir o anestésico inalatório (analgesia adequada permite menor CAM). 2) Bolus de cristaloide 3–10 mL/kg em 15 min (ou coloide 2–5 mL/kg). 3) Bradicardia associada: atropina 0,02–0,04 mg/kg ou glicopirrolato 0,005–0,01 mg/kg IV. 4) Persistente: dopamina 5–10 mcg/kg/min, dobutamina 2–10 mcg/kg/min, efedrina 0,03–0,1 mg/kg IV ou noradrenalina 0,05–0,5 mcg/kg/min.</p></div>'+

/* ---------- 6. Emergência e triagem ---------- */
const CRASH=[["C","Cardiovascular","FC, pulso (qualidade, déficit), mucosas, TPC, extremidades frias, PA. Choque: taquicardia (cães) ou BRADICARDIA + hipotermia (gatos), mucosas pálidas, TPC > 2 s."],["R","Respiratório","FR, padrão (obstrutivo inspiratório × restritivo expiratório), sons pulmonares, cianose. Oxigênio ANTES de manipular; TFAST."],["A","Abdome","Distensão, dor, ferimentos, fluido livre (AFAST), DVG (abdome timpânico em raça grande)."],["S","Coluna (spine)","Dor, déficits, Schiff-Sherrington, imobilizar em prancha se trauma."],["H","Cabeça (head)","Consciência, pupilas, reflexos, TCE (escala de coma), epistaxe, olhos."],["P","Pelve","Fraturas, períneo, reto, uretra."],["L","Membros (limbs)","Fraturas, luxações, ferimentos; imobilizar."],["A","Artérias","Pulsos periféricos, hemorragias — compressão direta."],["N","Nervos","Exame neurológico periférico, reflexos."]];
function vEmerg(arg){arg=arg||"triagem";let body="";
 if(arg==="triagem")body='<div class="note bad"><b>Prioridade imediata</b> (ABC): obstrução de via aérea, apneia, cianose, parada (RCP), hemorragia ativa, convulsão em curso, choque, DVG, obstrução uretral, trauma grave, intoxicação aguda.</div><div class="card"><h3>A CRASH PLAN — exame do politraumatizado</h3><div class="list" style="margin-top:8px">'+CRASH.map(([l,n,t])=>'<div class="item"><div class="row" style="gap:10px;align-items:flex-start"><b style="font-size:20px;min-width:22px">'+l+'</b><div><div class="t">'+n+'</div><div class="s">'+esc(t)+'</div></div></div></div>').join("")+'</div></div>'+
  '<div class="card"><h3>Base mínima de emergência</h3><p class="sm" style="margin:6px 0 0">Ht/PT, glicemia, lactato, eletrólitos (Na, K, Cl, Ca ionizado), ureia/creatinina, gasometria, densidade urinária, esfregaço sanguíneo, PA, ECG, SpO₂, AFAST/TFAST.</p></div><div class="actions"><a class="btn" href="#/calc/rcp">RCP & doses</a><a class="btn" href="#/escalas/coma">Escala de coma</a><a class="btn" href="#/lab/gaso">Gasometria</a></div>';
 if(arg==="choque"){const E=loadMod("sh",{sp:"dog",fc:"",pas:""});const fc=num(E.fc),pas=num(E.pas);let out="";
  if(fc&&pas){const si=fc/pas;out='<div class="lbl">Índice de choque (FC / PAS)</div><div class="big">'+fmt(si,2)+'</div><div class="note '+(si>=1?"bad":si>=0.9?"warn":"ok")+'" style="margin-top:8px">'+(si>=1?"≥ 1,0: compatível com CHOQUE/hipovolemia — reposição volêmica (bolus de cristaloide 10–20 mL/kg em cães em 15 min, reavaliar), controlar hemorragias, lactato seriado.":si>=0.9?"0,9–1,0: limítrofe — reavaliar perfusão e lactato.":"< 0,9: improvável choque hipovolêmico grave (cães).")+(E.sp==="cat"?" GATOS: o índice é pouco validado — gatos em choque costumam estar BRADICÁRDICOS e hipotérmicos (tríade); bolus menores (5–10 mL/kg) e aquecer.":"")+'</div>'}
  body='<p class="muted sm" style="margin:0">Índice de choque em cães: referência ~0,9 (Porter et al., 2013); valores ≥ 1 sugerem choque.</p><div class="card grid g2m">'+selF("shSp","Espécie",[["dog","Cão"],["cat","Gato"]],E.sp,"S.sh.sp=this.value;saveMod('sh');rerender()")+'<div class="field"><label>FC (bpm)</label><input class="inp" type="number" value="'+esc(E.fc)+'" onchange="S.sh.fc=this.value;saveMod(\'sh\');rerender()" /></div><div class="field"><label>PAS (mmHg)</label><input class="inp" type="number" value="'+esc(E.pas)+'" onchange="S.sh.pas=this.value;saveMod(\'sh\');rerender()" /></div></div>'+(out?'<div class="out">'+out+'</div>':"")+
  '<div class="card scroll-x"><h3>Tipos de choque</h3><table class="tbl" style="margin-top:8px"><tbody><tr><td><b>Hipovolêmico</b></td><td>Hemorragia, desidratação grave → cristaloides, hemoderivados.</td></tr><tr><td><b>Distributivo</b></td><td>Sepse, anafilaxia → fluidos + vasopressor (noradrenalina); anafilaxia: ADRENALINA 0,01 mg/kg IM/IV.</td></tr><tr><td><b>Cardiogênico</b></td><td>ICC, arritmias → NÃO dar bolus de fluido; oxigênio, furosemida, pimobendan/dobutamina.</td></tr><tr><td><b>Obstrutivo</b></td><td>DVG, tamponamento cardíaco, pneumotórax hipertensivo → descompressão (trocarização, pericardiocentese, toracocentese).</td></tr></tbody></table></div>'}
 if(arg==="fast")body='<div class="card"><h3>AFAST — 4 janelas abdominais</h3><p class="sm" style="margin:6px 0 0">1) Diafragmático-hepática (DH) · 2) Esplenorrenal (SR) · 3) Cistocólica (CC) · 4) Hepatorrenal (HR). Decúbito lateral direito ou esternal.</p><table class="tbl" style="margin-top:8px"><thead><tr><th>Escore de fluido abdominal (AFS)</th><th>Significado</th></tr></thead><tbody><tr><td>0</td><td>Sem fluido livre.</td></tr><tr><td>1–2</td><td>Hemorragia pequena — geralmente tratamento conservador; repetir em 4 h.</td></tr><tr><td>3–4</td><td>Hemorragia significativa — anemia provável, considerar transfusão e laparotomia se instabilidade persistente.</td></tr></tbody></table><p class="xs muted" style="margin-top:6px">Fluido livre: abdominocentese guiada — comparar Ht do líquido × sangue (hemoabdome), creatinina/K do líquido × soro (uroabdome: relação > 2:1 creatinina / > 1,4:1 K), lactato/glicose (peritonite séptica: glicose do líquido 20 mg/dL menor que sangue), bilirrubina (biliar).</p></div>'+
  '<div class="card"><h3>TFAST / Vet BLUE — tórax</h3><p class="sm" style="margin:6px 0 0">• <b>Pneumotórax:</b> ausência do sinal de deslizamento pleural (“glide sign”) e de linhas B; “ponto pulmonar” confirma. Toracocentese diagnóstica-terapêutica.<br/>• <b>Efusão pleural/pericárdica:</b> anecoica entre pulmão e parede / ao redor do coração; tamponamento: colapso de átrio direito → pericardiocentese.<br/>• <b>Linhas B (“rockets”):</b> > 3 por janela = síndrome alvéolo-intersticial (edema cardiogênico, pneumonia, contusão).<br/>• Átrio esquerdo:aorta > 1,5 (vista transversal) sugere ICC esquerda.</p></div>';
 if(arg==="transf")body='<div class="card"><h3>Cães — sistema DEA</h3><p class="sm" style="margin:6px 0 0">• Não possuem aloanticorpos naturais clinicamente relevantes: a PRIMEIRA transfusão raramente causa reação aguda grave, mas TIPAR para DEA 1 (doador ideal DEA 1-negativo) é recomendado.<br/>• Após uma transfusão, o receptor pode formar anticorpos em 4–14 dias → PROVA CRUZADA obrigatória em transfusões subsequentes (> 4 dias da primeira).<br/>• Cadelas que já pariram: fazer prova cruzada.</p></div>'+
  '<div class="card"><h3>Gatos — sistema AB (TIPAGEM SEMPRE)</h3><p class="sm" style="margin:6px 0 0">• Possuem aloanticorpos NATURAIS: gato tipo B tem anti-A forte → transfusão de sangue A em gato B = reação hemolítica fatal com poucos mL.<br/>• NÃO existe doador universal. Tipar receptor e doador SEMPRE e fazer prova cruzada (maior e menor), inclusive na primeira transfusão.<br/>• Antígeno Mik: pode haver incompatibilidade mesmo com tipo compatível — prova cruzada.<br/>• Raças com maior frequência de tipo B: British Shorthair, Devon Rex, Cornish Rex, Ragdoll; isoeritrólise neonatal em filhotes A de mãe B.</p></div>'+
  '<div class="card"><h3>Prova cruzada (técnica em tubo — resumo)</h3><p class="sm" style="margin:6px 0 0">Maior: hemácias do DOADOR lavadas (suspensão 3–5%) + plasma do RECEPTOR. Menor: hemácias do receptor + plasma do doador. Controle: hemácias + plasma do mesmo animal. Incubar 15–30 min, centrifugar e avaliar aglutinação/hemólise macro e microscopicamente. Qualquer aglutinação verdadeira = incompatível.</p></div>'+
  '<div class="card"><h3>Durante a transfusão</h3><p class="sm" style="margin:6px 0 0">Filtro de 170–260 µm. Velocidade 0,25–1 mL/kg/h nos primeiros 15–30 min (observar), depois completar em até 4 h. Monitorar T, FC, FR, PA a cada 15–30 min. Reações: febre, urticária, vômito, hemólise (hemoglobinúria), dispneia (TACO/TRALI) → INTERROMPER, avaliar e tratar.</p></div><a class="btn" href="#/calc/transf">Calcular volume a transfundir</a>';

 if(arg==="carencia"){const C=loadMod("car",{dt:"",carne:"",leite:""});const d=parseDate(C.dt);const ins=(k,l,t)=>'<div class="field"><label>'+l+'</label><input class="inp" type="'+(t||"number")+'" value="'+esc(C[k])+'" onchange="S.car.'+k+'=this.value;saveMod(\'car\');rerender()" /></div>';

function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function qOpts(right,pool){const o=[right];for(const x of shuf(pool)){if(o.length>=4)break;if(x&&!o.includes(x))o.push(x)}return o.length>=2?shuf(o):null}
const QUIZ_T={
 farm:["Farmacologia (classe)",()=>{const cn=x=>CLS[x.c]&&CLS[x.c].n;const d=pick(DRUGS.filter(cn));const o=qOpts(cn(d),DRUGS.map(cn));return o&&{q:"A qual classe pertence "+d.n+"?",o,a:cn(d),ex:d.m||""}}],
 ctl:["Controlados (Portaria 344/98)",()=>{const L={A1:"Lista A1 — Notificação A (amarela)",B1:"Lista B1 — Notificação B (azul)",C1:"Lista C1 — Receita de Controle Especial (2 vias)",C5:"Lista C5 — anabolizantes",ATB:"Antimicrobiano — receita em 2 vias com retenção",CANN:"Cannabis — receita especial"};const ds=DRUGS.filter(x=>L[x.ctl]);const d=pick(ds);return {q:"Que tipo de receita exige "+d.n+"?",o:shuf([L[d.ctl]].concat(shuf(Object.values(L).filter(x=>x!==L[d.ctl])).slice(0,3))),a:L[d.ctl],ex:""}}],
 tox:["Toxicologia (antídotos)",()=>{const ts=TOX.filter(t=>t.ant&&!/^não há/i.test(t.ant));const t=pick(ts);const o=qOpts(t.ant,ts.map(x=>x.ant));return o&&{q:"Qual o antídoto/tratamento específico para intoxicação por "+t.n+"?",o,a:t.ant,ex:t.tx||""}}],

 derm:["Dermatologia",()=>{const ds=(DATA.derm||[]).filter(x=>x.cli);const d=pick(ds);return {q:"Quadro: “"+d.cli.slice(0,220)+(d.cli.length>220?"…":"")+"” — qual a dermatopatia mais provável?",o:qOpts(d.n,ds.map(x=>x.n)),a:d.n,ex:d.ex||""}}],

};
function newQuiz(t){const g=QUIZ_T[t]||QUIZ_T.farm;const Q=[];let tries=0;while(Q.length<10&&tries++<200){const q=g[1]();if(q&&q.o&&q.o.includes(q.a)&&!Q.some(z=>z.q===q.q))Q.push(q)}S.qz={t,Q,i:0,ok:0,ans:null}}

 if(!arg||!QUIZ_T[arg]){S.qz=null;return '<div class="stack"><h1>Quiz & trilhas de estudo</h1><p class="muted sm" style="margin:0">Perguntas geradas a partir do banco de dados do app (10 por rodada). Seu melhor resultado fica salvo neste aparelho.</p><div class="list">'+Object.entries(QUIZ_T).map(([k,[n]])=>'<a class="item" href="#/quiz/'+k+'"><div class="row between"><div class="t">'+n+'</div><span class="xs muted">'+(H[k]?"melhor: "+H[k].best+"/10 · "+H[k].n+" rodada(s)":"novo")+'</span></div></a>').join("")+'</div></div>'}
 if(!S.qz||S.qz.t!==arg)newQuiz(arg);const Z=S.qz,nome=QUIZ_T[arg][0];
 if(Z.i>=Z.Q.length){const h=H[arg]||{best:0,n:0};h.n++;if(Z.ok>h.best)h.best=Z.ok;if(!Z.saved){H[arg]=h;store.set("quiz",H);Z.saved=1}

 (Z.ans!=null?'<div class="note '+(q.o[Z.ans]===q.a?"ok":"bad")+'" style="margin-top:12px"><b>'+(q.o[Z.ans]===q.a?"Correto!":"Resposta: "+esc(q.a))+'</b>'+(q.ex?'<br/><span class="sm">'+esc(String(q.ex).slice(0,400))+'</span>':"")+'</div><button class="btn pri block" style="margin-top:10px" onclick="S.qz.i++;S.qz.ans=null;rerender()">'+(Z.i+1<Z.Q.length?"Próxima":"Ver resultado")+'</button>':"")+'</div><a class="btn sm ghost" href="#/quiz">Sair</a></div>'}
function qAns(j){const Z=S.qz;if(Z.ans!=null)return;Z.ans=j;if(Z.Q[Z.i].o[j]===Z.Q[Z.i].a)Z.ok++;rerender()}

 USER_DISABLED:"Seu acesso foi desativado. Fale com o administrador.",USER_NOT_FOUND:"Seu acesso foi removido. Fale com o administrador.",TOKEN_EXPIRED:"Sua senha foi alterada. Entre novamente.",INVALID_REFRESH_TOKEN:"Sessão expirada. Entre novamente.",

function jwt(t){try{return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))}catch(e){return{}}}
function devName(){const u=navigator.userAgent;const m=u.match(/Android[^;)]*;\s*([^;)]+)/);return m?m[1].trim():/iPhone|iPad/.test(u)?"iPhone/iPad":/Windows/.test(u)?"Windows":/Mac/.test(u)?"Mac":"Navegador"}
const IDT="https://identitytoolkit.googleapis.com/v1/accounts:";
async function idt(op,body){const r=await fetch(IDT+op+"?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));return j}
async function setSession(idToken,sid){await idt("update",{idToken,displayName:"sessao:"+sid+"|"+devName(),returnSecureToken:false})}
async function getSession(idToken){const j=await idt("lookup",{idToken});const dn=(j.users&&j.users[0]&&j.users[0].displayName)||"";const m=dn.match(/^sessao:([^|]+)\|?(.*)$/);return m?{sid:m[1],dev:m[2]}:null}
function kicked(dev){store.set("auth",null);showLogin("Sua conta foi acessada em outro aparelho"+(dev?" ("+dev+")":"")+". Só é permitido um aparelho por vez — entre novamente para usar aqui.",true)}
function authMsg(code){code=String(code||"").split(" ")[0].split(":")[0];return AUTH_ERR[code]||"Não foi possível entrar ("+code+")."}
function showLogin(msg,isErr){const l=document.getElementById("login");l.classList.add("show");const e=document.getElementById("lgErr");if(msg&&isErr){e.textContent=msg;e.style.display="block"}else{e.style.display="none";if(msg)document.getElementById("lgMsg").textContent=msg}}
async function doLogin(){const b=document.getElementById("lgBtn"),em=document.getElementById("lgE").value.trim(),pw=document.getElementById("lgP").value;b.disabled=true;b.textContent="Entrando...";
 try{const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw,returnSecureToken:true})});const j=await r.json();
  if(!r.ok)throw new Error(j.error&&j.error.message);const sid=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());try{await setSession(j.idToken,sid)}catch(e){console.warn("sessão",e)}store.set("auth",{email:j.email,rt:j.refreshToken,ok:Date.now(),sid});document.getElementById("login").classList.remove("show");document.getElementById("lgP").value="";route();toast("Bem-vindo(a), "+j.email)}
 catch(e){showLogin(e instanceof TypeError?"Sem conexão com a internet. O primeiro acesso precisa de internet.":authMsg(e.message),true)}finally{b.disabled=false;b.textContent="Entrar"}}
async function verifyAuth(){const a=store.get("auth",null);if(!a)return;
 try{const r=await fetch("https://securetoken.googleapis.com/v1/token?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(a.rt)});const j=await r.json();
  if(r.ok){a.rt=j.refresh_token||a.rt;if(!a.sid){store.set("auth",null);showLogin("Atualização de segurança: entre novamente (agora só é permitido um aparelho por vez).",true);return}try{const ss=await getSession(j.id_token);if(!ss)await setSession(j.id_token,a.sid);else if(ss.sid!==a.sid){kicked(ss.dev);return}}catch(e){if(/USER_DISABLED|USER_NOT_FOUND|INVALID_ID_TOKEN|TOKEN_EXPIRED/.test(e.message)){store.set("auth",null);showLogin(authMsg(e.message),true);return}}a.ok=Date.now();store.set("auth",a)}else{store.set("auth",null);showLogin(authMsg(j.error&&j.error.message),true)}}
 catch(e){if(Date.now()-a.ok>GRACE_DAYS*864e5)showLogin("Conecte-se à internet para validar seu acesso (verificação a cada "+GRACE_DAYS+" dias).",true)}}
function logout(){store.set("auth",null);location.hash="#/";showLogin("Você saiu da conta.")}
function authGate(){if(!AUTH_ON)return;const a=store.get("auth",null);
 if(!a)showLogin();else if(Date.now()-a.ok>GRACE_DAYS*864e5){showLogin("Validando acesso...");verifyAuth().then(()=>{const b=store.get("auth",null);if(b&&Date.now()-b.ok<6e4)document.getElementById("login").classList.remove("show")})}else verifyAuth();
 document.addEventListener("visibilitychange",()=>{if(!document.hidden&&store.get("auth",null))verifyAuth()});setInterval(()=>{if(!document.hidden&&store.get("auth",null))verifyAuth()},60*1000)}
