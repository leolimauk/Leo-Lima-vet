poninas litogênicas → cristais nos ductos biliares → retenção de filoeritrina (fotodinâmica).","sx":"Icterícia, dermatite nas áreas despigmentadas (orelhas, focinho), edema facial, prurido, apatia.","tx":"Retirar da pastagem e manter na sombra, tratamento das feridas, hepatoprotetores.","ant":"Não há."},{"n":"Nitrato / Nitrito","t":"Ambiental","sp":"Bovinos, ovinos","sev":"Fatal","dose":"Forrageiras adubadas/estressadas (aveia, milheto, sorgo) e água contaminada.","mech":"Nitrato → nitrito no rúmen → meta-hemoglobinemia.","sx":"Dispneia, mucosas e sangue cor de chocolate, tremores, aborto, morte rápida.","tx":"AZUL DE METILENO 4–20 mg/kg IV lento (solução 1–4%), retirar fonte.","ant":"Azul de metileno."},{"n":"Ácido cianídrico (mandioca-brava, sorgo, Manihot spp.)","t":"Planta","sp":"Bovinos, ovinos, caprinos","sev":"Fatal","dose":"Glicosídeos cianogênicos em plantas jovens/murchas/rebrotadas.","mech":"Cianeto inibe citocromo oxidase (hipóxia celular).","sx":"Dispneia, sangue vermelho-vivo, tremores, convulsões, morte em minutos a poucas horas.","tx":"TIOSSULFATO DE SÓDIO 20% (500 mg/kg IV) ± nitrito de sódio 20 mg/kg IV.","ant":"Tiossulfato de sódio."},{"n":"Ureia / Amônia","t":"Ambiental","sp":"Bovinos, ovinos","sev":"Fatal","dose":"> 0,3–0,5 g/kg de ureia em animais não adaptados ou erro de mistura.","mech":"Hidrólise ruminal rápida → alcalose ruminal e hiperamonemia.","sx":"Tremores, salivação, timpanismo, incoordenação, dor abdominal, decúbito, morte em 1–4 h.","tx":"ÁCIDO ACÉTICO 5% (vinagre) 2–6 L VO para bovino adulto (0,5–1 L ovinos) + água gelada, ruminotomia nos casos graves.","ant":"Ácido acético (vinagre)."},{"n":"Cobre em ovinos","t":"Ambiental","sp":"Ovinos","sev":"Fatal","dose":"Sal mineral/ração de bovinos ou suínos e pastagens com excesso de Cu (ovinos têm baixa excreção biliar).","mech":"Acúmulo hepático crônico com liberação súbita após estresse → crise hemolítica.","sx":"Hemoglobinúria, icterícia intensa, anemia, morte súbita; rins cor de chumbo.","tx":"Molibdato de amônio 50–500 mg/dia VO + sulfato de sódio, tetratiomolibdato; prognóstico ruim na crise hemolítica.","ant":"Molibdato/tetratiomolibdato de amônio."},{"n":"Teflon superaquecido (PTFE) e vapores de cozinha","t":"Doméstico","sp":"Aves","sev":"Fatal","dose":"Panelas antiaderentes superaquecidas, aquecedores, ferros de passar.","mech":"Partículas e gases tóxicos causam edema e hemorragia pulmonar aguda.","sx":"Dispneia súbita, ataxia, morte em minutos.","tx":"Remoção do ambiente, oxigênio, corticoide e diurético — prognóstico ruim.","ant":"Não há."},{"n":"Abacate (persina)","t":"Alimento","sp":"Aves (psitacídeos), coelhos, equinos, caprinos","sev":"Grave","dose":"Folhas, casca, caroço e polpa.","mech":"Persina — necrose miocárdica e da glândula mamária.","sx":"Aves: dispneia, regurgitação, morte súbita em 12–48 h. Ruminantes: mastite não infecciosa.","tx":"Suporte, furosemida e oxigênio para ICC.","ant":"Não há."},{"n":"Chumbo","t":"Ambiental","sp":"Cães, aves, bovinos","sev":"Grave","dose":"Tintas antigas, baterias, chumbinhos de pesca/caça (aves), óleo de motor (bovinos).","mech":"Inibe enzimas sulfidrílicas (síntese do heme) e lesiona o SNC.","sx":"Vômito, dor abdominal, convulsões, cegueira, alterações comportamentais; hemácias com pontilhado basofílico e eritrócitos nucleados; aves: regurgitação, fezes verdes, fraqueza.","tx":"Remover fonte (endoscopia/cirurgia), EDTA cálcico dissódico 25 mg/kg SC q6h por 5 dias (diluído), ou succímero (DMSA) 10 mg/kg VO q8h.","ant":"EDTA cálcico / succímero."},{"n":"Zinco (moedas, pomadas de óxido de zinco, porcas)","t":"Doméstico","sp":"Cães, aves","sev":"Grave","dose":"Moedas metálicas ingeridas; pomadas de óxido de zinco.","mech":"Hemólise oxidativa, lesão pancreática, renal e hepática.","sx":"Anemia hemolítica, hemoglobinúria, vômito, icterícia.","tx":"Remoção endoscópica/cirúrgica do corpo estranho (mais importante), transfusão, fluidoterapia. Quelantes raramente necessários.","ant":"Remoção da fonte."},{"n":"Acetato de medroxiprogesterona ('injeção anticoncepcional')","t":"Fármaco","sp":"Cadelas e gatas","sev":"Grave","dose":"Uso indiscriminado em pequenos animais (comum no Brasil).","mech":"Progestágeno de depósito → hiperplasia endometrial cística, GH mamário, resistência insulínica.","sx":"Piometra, hiperplasia mamária felina, neoplasias mamárias, diabetes mellitus, acromegalia, retenção fetal/morte fetal.","tx":"Ovário-histerectomia (piometra), aglepristone (hiperplasia mamária felina e piometra), insulina se diabetes. Orientar tutores: castração cirúrgica é o método indicado.","ant":"Aglepristone (antagonista da progesterona)."},{"n":"AINE + Corticoide (ou dois AINEs)","t":"Interação","sp":"Todas (principalmente cães)","sev":"Grave","dose":"Uso concomitante ou sem período de washout.","mech":"Somatório de inibição de prostaglandinas protetoras e redução da renovação epitelial gástrica.","sx":"Ulceração/perfuração gastroduodenal, melena, hematêmese, peritonite séptica.","tx":"Evitar. Washout de 5–7 dias entre AINEs (ou após corticoide). Se exposição: IBP + sucralfato + misoprostol.","ant":"—"},{"n":"AINE + IECA + Diurético (triple whammy)","t":"Interação","sp":"Cães e gatos com cardiopatia ou DRC","sev":"Grave","dose":"Pacientes cardiopatas/idosos com dor articular.","mech":"Bloqueio simultâneo da autorregulação renal (vasodilatação aferente por prostaglandinas e vasoconstrição eferente por angiotensina II) + hipovolemia.","sx":"Lesão renal aguda, hipercalemia.","tx":"Preferir analgesia sem AINE (gabapentina, amantadina, anti-NGF) ou monitorar creatinina e K com frequência.","ant":"—"},{"n":"Fluoroquinolonas + Teofilina/Aminofilina","t":"Interação","sp":"Cães, gatos, equinos","sev":"Moderada","dose":"Enrofloxacino/ciprofloxacino em pacientes com teofilina.","mech":"Inibição do CYP1A2 → acúmulo de teofilina.","sx":"Taquicardia, agitação, vômito, convulsões.","tx":"Reduzir teofilina em 30% ou usar marbofloxacino/outro antimicrobiano.","ant":"—"},{"n":"Síndrome serotoninérgica (tramadol, trazodona, ISRS, tricíclicos, selegilina, amitraz, mirtazapina, meperidina)","t":"Interação","sp":"Cães e gatos","sev":"Grave","dose":"Associação de dois ou mais fármacos serotoninérgicos ou sobredose.","mech":"Excesso de serotonina no SNC e periferia.","sx":"Agitação, hipertermia, tremores, mioclonias, midríase, taquicardia, vômito, diarreia, convulsões.","tx":"Suspender fármacos, CIPROEPTADINA 1,1 mg/kg VO/retal q4–6h (cães) ou 2–4 mg/gato, acepromazina/clorpromazina, resfriamento, benzodiazepínicos.","ant":"Ciproeptadina."},{"n":"Aminoglicosídeo + Furosemida (ou outros nefrotóxicos)","t":"Interação","sp":"Todas","sev":"Grave","dose":"Gentamicina/amicacina com diurético de alça, AINE, anfotericina B, desidratação.","mech":"Depleção de volume e somatório de lesão tubular/ototoxicidade.","sx":"Lesão renal aguda (cilindros granulosos na urina são o primeiro sinal), surdez, ataxia vestibular.","tx":"Hidratar antes, dose única diária, monitorar urinálise a cada 2–3 dias, evitar associação.","ant":"—"},{"n":"Ivermectina (dose alta) + Espinosade","t":"Interação","sp":"Cães","sev":"Grave","dose":"Demodicose tratada com ivermectina diária em cão que recebeu Comfortis/Trifexis.","mech":"Espinosade inibe glicoproteína-P → acúmulo de ivermectina no SNC (efeito semelhante ao MDR1).","sx":"Neurotoxicidade (ataxia, tremores, cegueira).","tx":"Evitar associação; preferir isoxazolinas para demodicose.","ant":"—"},{"n":"Antibióticos de espectro Gram+ em coelhos e roedores (clindamicina, lincomicina, ampicilina, amoxicilina VO, eritromicina)","t":"Interação","sp":"Coelhos, cobaias, hamsters, chinchilas","sev":"Fatal","dose":"Qualquer dose oral (e algumas parenterais).","mech":"Destruição da microbiota Gram+ → proliferação de Clostridium spiroforme/difficile (enterotoxemia).","sx":"Diarreia, anorexia, timpanismo, hipotermia, morte em 1–5 dias.","tx":"Suspender, fluidos, alimentação assistida (Critical Care), probióticos, metronidazol, colestiramina. Preferir enrofloxacino, SMZ-TMP, doxiciclina, azitromicina (com cautela), penicilina G parenteral.","ant":"—"},{"n":"Fenobarbital — indução enzimática","t":"Interação","sp":"Cães","sev":"Moderada","dose":"Uso crônico de fenobarbital.","mech":"Indução de CYP450 hepático.","sx":"Redução de eficácia de levetiracetam, zonisamida, ciclosporina, corticoides, doxiciclina, digoxina, cetamina; T4 total diminuído (falso hipotireoidismo); aumento de fosfatase alcalina.","tx":"Ajustar doses dos fármacos associados; interpretar T4 e enzimas com cautela.","ant":"—"},{"n":"Cetoconazol / Itraconazol + Ciclosporina (interação útil) ou + Cisaprida (perigosa)","t":"Interação","sp":"Cães e gatos","sev":"Moderada","dose":"Uso concomitante.","mech":"Inibição de CYP3A e glicoproteína-P.","sx":"Ciclosporina: níveis 2x maiores (permite reduzir dose em 50% e custo). Cisaprida: prolongamento QT e arritmias.","tx":"Monitorar níveis/sinais; evitar azóis com cisaprida.","ant":"—"},{"n":"Brometo de potássio + fluidos/dieta ricos em cloreto","t":"Interação","sp":"Cães","sev":"Moderada","dose":"Internação com NaCl 0,9% ou mudança de dieta.","mech":"Cloreto compete com brometo na reabsorção tubular → aumenta excreção do brometo.","sx":"Queda do nível sérico e crises convulsivas de escape.","tx":"Preferir fluidos com menos cloreto, manter dieta constante, dosar brometo.","ant":"—"},{"n":"Digoxina + Hipocalemia / Diuréticos","t":"Interação","sp":"Cães","sev":"Grave","dose":"Pacientes com ICC em furosemida.","mech":"Hipocalemia aumenta a ligação da digoxina à Na/K-ATPase.","sx":"Anorexia, vômito, arritmias (bloqueio AV, extrassístoles ventriculares).","tx":"Monitorar K e nível sérico (alvo 0,5–1 ng/mL), corrigir K, suspender digoxina.","ant":"Anticorpos Fab antidigoxina."},{"n":"Tetraciclinas / Fluoroquinolonas + Cálcio, Antiácidos, Sucralfato, Ferro","t":"Interação","sp":"Todas","sev":"Leve","dose":"Administração simultânea.","mech":"Quelação por cátions di/trivalentes reduz absorção.","sx":"Falha terapêutica.","tx":"Separar a administração em pelo menos 2 h.","ant":"—"},{"n":"Xilazina e alfa-2 em ruminantes gestantes","t":"Interação","sp":"Bovinos, ovinos, caprinos","sev":"Moderada","dose":"Terço final da gestação.","mech":"Efeito ocitócico (aumento do tônus uterino) e redução da perfusão placentária.","sx":"Aborto, parto prematuro.","tx":"Usar doses mínimas ou alternativas (anestesia local).","ant":"Atipamezol/ioimbina."},{"n":"Macrolídeos e lincosamidas em equinos adultos","t":"Interação","sp":"Equinos","sev":"Fatal","dose":"Eritromicina, azitromicina, tilosina, lincomicina, clindamicina em adultos (inclusive éguas cujos potros recebem macrolídeos — ingestão de fezes).","mech":"Disbiose do cólon (Clostridium difficile, Salmonella).","sx":"Colite aguda com diarreia profusa, endotoxemia, laminite.","tx":"Fluidoterapia intensa, plasma, polimixina B, flunixina dose antiendotóxica, di-tri-octaedral smectite.","ant":"—"},{"n":"Acepromazina em cães MDR1","t":"Interação","sp":"Collies e raças pastoras","sev":"Moderada","dose":"Doses usuais.","mech":"Deficiência de glicoproteína-P → maior acúmulo no SNC.","sx":"Sedação profunda e prolongada.","tx":"Reduzir dose em 25% (heterozigotos) a 30–50% (homozigotos). Também reduzir butorfanol, loperamida (evitar), vincristina, doxorrubicina.","ant":"—"}],"cases":[{"sp":"Cão (Canino)","spec":"Dermatologia & Infectologia","title":"Piodermite superficial canina por Staphylococcus pseudintermedius e escolha de 1ª linha","ctx":"Cão SRD, macho castrado, 4 anos, 18 kg, com prurido moderado, pápulas, pústulas foliculares e colaretes epidérmicos ventrais, sem sinais sistêmicos.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Terapia empírica de 1ª linha: Cefalexina 22–30 mg/kg VO a cada 12h por 21 dias (manter 7 dias após resolução completa das lesões).","Associar terapia tópica antisséptica (banhos com clorexidina 2% a 4%, tempo de contato de 10 minutos, 2x/semana) acelera a cura e reduz exposição sistêmica.","Se não houver melhora em 14 dias ou houver histórico prévio de antibióticos, realizar cultura bacteriana e antibiograma para descartar MRSP (Staphylococcus pseudintermedius resistente à meticilina)."],"take":""},{"sp":"Gato (Felino)","spec":"Toxicologia Clínica (Emergência)","title":"Intoxicação aguda por Paracetamol (Acetaminofeno) em felino doméstico","ctx":"Gato SRD, 2 anos, 4,0 kg, recebeu 1 comprimido humano de paracetamol 500 mg (125 mg/kg) administrado pelo tutor para febre. Chega após 3 horas com mucosas cianóticas/achocolatadas, edema facial e taquipneia.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Fisiopatologia: gatos possuem deficiência severa da enzima UDP-glicuronosiltransferase; a via oxidativa CYP450 gera NAPQI, causando oxidação da hemoglobina (meta-hemoglobinemia), corpúsculos de Heinz e necrose hepática centrolobular.","Antídoto específico: N-acetilcisteína (NAC) — dose de ataque 140 mg/kg IV (diluída a 5% em filtro de 0,22 μm) ou VO, seguida de 70 mg/kg a cada 6h por 7 doses.","Adjuvantes essenciais: Ácido ascórbico (Vitamina C) 30 mg/kg IV/VO a cada 6–12h (redutor de meta-hemoglobina), S-adenosilmetionina (SAMe) 20 mg/kg/dia VO e oxigenoterapia sem estresse."],"take":""},{"sp":"Gato (Felino)","spec":"Toxicologia Nefrológica","title":"Nefrotoxicidade aguda fatal por ingestão de Lírio (Lilium spp. / Hemerocallis spp.) em gato","ctx":"Gata Persa, 3 anos, 3,8 kg, flagrada mastigando folhas e pólen de lírio ornamental há 2 horas; apresenta êmese e sialorreia.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Todas as partes da planta (pétalas, folhas, caule, pólen e até a água do vaso) contêm toxinas hidrossolúveis que causam necrose tubular renal aguda irreversível em felinos.","Conduta imediata (< 2–4h): descontaminação gastrintestinal (indução de êmese se assintomática + carvão ativado 1–2 g/kg VO) e fluidoterapia intravenosa agressiva com Ringer com Lactato por 48–72 horas para manter diurese (2–4 mL/kg/h).","Monitorar creatinina, SDMA, fósforo, potássio e débito urinário a cada 12h; caso evolua para anúria, a hemodiálise precoce é a única terapia capaz de salvar o paciente."],"take":""},{"sp":"Cão (Canino)","spec":"Farmacogenética (Mutação ABCB1 / MDR1)","title":"Neurotoxicidade por Ivermectina em cão Pastor de Shetland homozigoto MDR1 (-/-)","ctx":"Cão Pastor de Shetland, 1,5 ano, 11 kg, recebeu ivermectina injetável extra-label (300 mcg/kg) para sarna sarcóptica e desenvolveu midríase, ataxia grave, tremores e estupor.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Mecanismo: cães das raças Collie, Pastor de Shetland, Australian Shepherd e Border Collie apresentam deleção no gene ABCB1 (MDR1), perdendo a glicoproteína-P funcional na barreira hematoencefálica.","Sem efluxo ativo pela glicoproteína-P, a ivermectina acumula-se no SNC e potencializa receptores GABA-A e canais de cloreto regulados por glutamato.","Tratamento: suporte intensivo (não há antídoto específico; flumazenil não reverte). Emulsão lipídica intravenosa (Intralipid 20% — bolus 1,5 mL/kg IV seguido de 0,25 mL/kg/min por 30–60 min) atua como 'lipid sink' sequestrando o fármaco lipofílico."],"take":""},{"sp":"Cão (Canino)","spec":"Cardiologia Veterinária (Consenso ACVIM)","title":"Doença Mixomatosa da Valva Mitral (DMVM) Estágio C — Edema Pulmonar Agudo","ctx":"Cão Poodle, 11 anos, 7,5 kg, sopro sistólico apical esquerdo grau V/VI, chega em dispneia expiratória, taquipneia (68 irpm), crepitações pulmonares difusas e tosse produtiva rosada.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Estabilização de emergência: oxigenoterapia em câmara/máscara (mínimo estresse), Furosemida 2–4 mg/kg IV/IM repetida a cada 1–2h até redução da frequência respiratória (< 35 irpm) e Butorfanol 0,2 mg/kg IM para ansiólise.","Inodilatador obrigatório: Pimobendan 0,25–0,3 mg/kg VO a cada 12h (1 hora antes da alimentação) — melhora contratilidade (sensibilizador de cálcio) e promove vasodilatação balanceada (inibidor PDE-3).","Terapia crônica quádrupla (Consenso ACVIM): Furosemida (menor dose eficaz) + Pimobendan + IECA (Benazepril ou Enalapril 0,5 mg/kg 12/12h) + Espironolactona (2 mg/kg VO 24/24h)."],"take":""},{"sp":"Gato (Felino)","spec":"Cardiologia & Emergência Vascular","title":"Cardiomiopatia Hipertrófica Felina (CMH) complicada com Tromboembolismo Aórtico (TEA)","ctx":"Gato Maine Coon, 5 anos, 6,8 kg, vocalização aguda intensa, paresia bilateral dos membros pélvicos, coxins pálidos/cianóticos, hipotermia dos membros posteriores e ausência de pulso femoral.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Analgesia imediata é prioridade ética e hemodinâmica: Metadona 0,2–0,3 mg/kg IV/IM a cada 4–6h ou Fentanil CRI 3–5 mcg/kg/h.","Anticoagulação e antiagregação: Enoxaparina 0,75–1 mg/kg SC a cada 6–12h (ou Heparina não fracionada) associada a Clopidogrel 18,75 mg/gato (1/4 de comprimido de 75 mg) VO a cada 24h.","Avaliar edema pulmonar concomitante por POCUS torácico (linhas B) antes de administrar fluidoterapia; evitar estresse e hiper-hidratação."],"take":""},{"sp":"Cão (Canino)","spec":"Doenças Infecciosas & Hemoparasitoses","title":"Erliquiose Monocítica Canina Aguda (Ehrlichia canis) com Trombocitopenia Severa","ctx":"Cão Labrador, 3 anos, 28 kg, febre (40,3°C), petéquias gengivais, epistaxe discreta, linfadenomegalia generalizada e plaquetas em 28.000/μL.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Tratamento etiológico de escolha: Doxiciclina 5 mg/kg VO a cada 12h (ou 10 mg/kg VO a cada 24h) por 28 dias consecutivos.","Administrar sempre junto com alimento e água para prevenir esofagite e vômitos; evitar antiácidos ou sucralfato nas 2 horas próximas à dose (quelação reduz absorção).","Investigar coinfecção por Babesia vogeli (esfregaço sanguíneo/PCR); se positiva, associar Dipropionato de Imidocarb 5–6,6 mg/kg IM/SC (repetir em 14 dias) com pré-medicação de atropina 0,02–0,04 mg/kg SC."],"take":""},{"sp":"Gato (Felino)","spec":"Zoonoses & Micologia Clínica","title":"Esporotricose Felina Cutâneo-Mucosa por Sporothrix brasiliensis","ctx":"Gato macho inteiro com acesso à rua, 3 anos, 4,5 kg, lesões ulceradas exsudativas no plano nasal, pavilhões auriculares e dígitos, com espirros frequentes.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Protocolo antifúngico de 1ª escolha: Itraconazol 50 a 100 mg/gato (10 mg/kg) VO a cada 24h administrado obrigatoriamente junto com alimento úmido (melhora biodisponibilidade).","Em casos refratários ou com acometimento nasal profundo, associar Iodeto de Potássio manipulado (2,5 a 5 mg/kg VO a cada 24h) monitorando sinais de iodismo (lacrimejamento, anorexia, vômitos).","Manter tratamento por no mínimo 30 dias após a cicatrização completa de todas as lesões e resolução dos sinais respiratórios; monitorar ALT e enzimas hepáticas mensalmente e orientar uso de luvas pelo tutor (zoonose)."],"take":""},{"sp":"Cão (Canino)","spec":"Neurologia & Emergência","title":"Status Epilepticus Canino — Escalonamento Terapêutico Baseado em Evidência (ACVIM)","ctx":"Cão Beagle, 4 anos, 14 kg, em atividade convulsiva tônico-clônica generalizada contínua há 12 minutos.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["1ª linha (0–5 min): Diazepam 0,5–1 mg/kg IV (ou intrarretal) ou Midazolam 0,2–0,5 mg/kg IV/intranasal (pode repetir até 3 doses).","2ª linha (manutenção de longa ação): Fenobarbital 4–6 mg/kg IV lento a cada 20–30 min até dose cumulativa máxima de 16–20 mg/kg/24h (ou Levetiracetam 30–60 mg/kg IV bolus).","3ª linha (status refratário): Propofol bolus 2–4 mg/kg IV seguido de CRI 0,1–0,4 mg/kg/min ou Midazolam CRI 0,2–0,5 mg/kg/h, controlando glicemia, temperatura corporal e edema cerebral (Manitol 0,5–1 g/kg IV em 20 min)."],"take":""},{"sp":"Cão (Canino)","spec":"Endocrinologia & Terapia Intensiva","title":"Cetoacidose Diabética (CAD) Canina com Hipocalemia Grave","ctx":"Cadela Schnauzer, 9 anos, 9,2 kg, poliúria/polidipsia prévia, chega prostrada, desidratada (8%), vômitos, hálito cetônico, glicemia 485 mg/dL, pH venoso 7,14 e potássio sérico 2,7 mEq/L.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Regra de ouro: corrigir primeiramente a volemia e o potássio ANTES de iniciar insulina regular, pois a insulina desloca K+ para o meio intracelular podendo causar parada cardíaca por hipocalemia.","Fluidoterapia inicial com NaCl 0,9% (reposição de déficit em 12–24h + manutenção) suplementada com KCl 19,1% na concentração de 30–40 mEq/L (respeitando teto de 0,5 mEq/kg/h).","Após 2–4h de fluidoterapia e K+ > 3,0 mEq/L: iniciar Insulina Regular em infusão contínua (CRI 0,05–0,1 UI/kg/h) ou protocolo IM horário (0,1–0,2 UI/kg), visando queda gradual da glicemia de 50–75 mg/dL/hora."],"take":""},{"sp":"Gato (Felino)","spec":"Emergência Urológica Felina","title":"Obstrução Uretral Felina (DTUIF) com Hipercalemia Cardiotóxica","ctx":"Gato macho castrado, 4 anos, 5,1 kg, anúria há 36h, bexiga repleta e firme, bradicardia (95 bpm), ondas T apiculadas e ausência de onda P no ECG, potássio sérico em 7,8 mEq/L.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Cardioproteção imediata (antagonismo de membrana): Gluconato de Cálcio 10% 0,5–1,5 mL/kg IV lento em 10–15 min sob monitorização eletrocardiográfica contínua.","Redistribuição intracelular rápida de potássio: Insulina Regular 0,25–0,5 UI/kg IV seguida de bolus de Glicose 50% (0,5 g/kg diluída 1:4) + fluidoterapia IV livre de potássio (NaCl 0,9%).","Analgesia e relaxamento uretral pós-desobstrução: Metadona 0,2 mg/kg IV/IM + Prazosina 0,25–0,5 mg/gato VO a cada 12h (bloqueador alfa-1 uretral)."],"take":""},{"sp":"Cão (Canino)","spec":"Toxicologia Alimentar","title":"Intoxicação por Xilitol (Goma de Mascar / Adoçante) em Cão","ctx":"Cão Golden Retriever, 2 anos, 26 kg, ingeriu 1 pacote de goma de mascar sem açúcar contendo 8 g de xilitol (~307 mg/kg) há 45 minutos.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Em cães, o xilitol provoca liberação maciça e dose-dependente de insulina pancreática (doses > 75–100 mg/kg causam hipoglicemia severa; doses > 500 mg/kg causam necrose hepática fulminante).","Conduta: se assintomático e ingestão < 60 min, induzir êmese (apomorfina 0,03 mg/kg IV ou peróxido de hidrogênio 3% 1–2 mL/kg VO); nota: carvão ativado liga-se fracamente ao xilitol.","Infusão contínua de glicose (dextrose 2,5% a 5% IV) monitorando glicemia a cada 2h por 24h, associada a hepatoprotetores (N-acetilcisteína, SAMe e silimarina) e perfil hepático (ALT, AST, bilirrubinas, TP/TTPa) por 72h."],"take":""},{"sp":"Gato (Felino)","spec":"Toxicologia Dermatológica","title":"Intoxicação por Permetrina (Pipeta Antipulgas de Uso Exclusivo Canino) em Gato","ctx":"Gato SRD, 3 anos, 4,2 kg, recebeu pipeta spot-on de permetrina 65% indicada para cães; apresenta fasciculações musculares generalizadas, hiperestesia, tremores intensos e hipertermia (40,8°C).","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Gatos possuem deficiência na glicuronidação hepática de piretroides tipo I (permetrina), resultando em abertura prolongada dos canais de sódio neuronais e hiperexcitabilidade.","Controle imediato dos tremores: Metocarbamol 55–220 mg/kg IV (máx. 330 mg/kg/dia) ou Diazepam/Midazolam 0,5 mg/kg IV (se refratário, Propofol CRI 0,1–0,3 mg/kg/min).","Descontaminação cutânea rigorosa assim que estabilizado: banho com água morna e detergente neutro (lava-louças suave) para remover o veículo oleoso; associar Emulsão Lipídica IV 20%."],"take":""},{"sp":"Cão (Canino)","spec":"Toxicologia Doméstica","title":"Intoxicação por Teobromina e Cafeína (Chocolate Amargo) em Cão","ctx":"Cão Dachshund, 6 anos, 8,0 kg, ingeriu 150 g de chocolate 70% cacau (~1.200 mg de teobromina = 150 mg/kg) há 1,5 hora; apresenta taquicardia sinusal (195 bpm), agitação e vômitos.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Metilxantinas antagonizam receptores de adenosina e inibem fosfodiesterase (doses > 20 mg/kg causam sinais GI; > 40–50 mg/kg cardiotoxicidade; > 60 mg/kg convulsões).","Descontaminação: êmese (se sem risco de aspiração) seguida de doses múltiplas de Carvão Ativado (1–2 g/kg VO a cada 6–8h por 24h) devido à recirculação êntero-hepática da teobromina.","Suporte cardiovascular: fluidoterapia IV para acelerar excreção urinária (manter bexiga esvaziada para evitar reabsorção vesical) e betabloqueador (Propranolol 0,02–0,06 mg/kg IV lento ou Esmolol) para taquiarritmias."],"take":""},{"sp":"Cão (Canino)","spec":"Gastroenterologia & Terapia Intensiva","title":"Pancreatite Aguda Grave Canina — Manejo Analgésico e Nutricional Atualizado","ctx":"Cadela Yorkshire, 8 anos, 4,5 kg, vômitos incoercíveis, dor abdominal cranial intensa (posição de prece), diarreia e cPL (lipase pancreática específica) fortemente positiva.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Analgesia multimodal potente (prioridade): Fentanil CRI (3–5 mcg/kg/h) ou Metadona 0,2–0,3 mg/kg IV/SC a cada 6h associada a Lidocaína CRI (25–50 mcg/kg/min IV — somente em cães).","Controle antiemético duplo: Maropitant (Cerenia) 1 mg/kg IV/SC a cada 24h + Ondansetrona 0,5 mg/kg IV a cada 8h (bloqueio central e periférico).","Nutrição enteral precoce: abolido o jejum prolongado histórico! Iniciar dieta hiperdigestível com baixo teor de gordura (< 15% na matéria seca) assim que o vômito estiver controlado."],"take":""},{"sp":"Equino (Cavalo)","spec":"Medicina Equina & Gastroenterologia","title":"Síndrome Cólica Equina por Compactação de Cólon Maior e Controle da Endotoxemia","ctx":"Equino Quarto de Milha, 7 anos, 480 kg, desconforto abdominal moderado, redução de motilidade cecal/cólica, TPC 2,5 s, FC 52 bpm, massa firme palpável na flexura pélvica.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Analgesia visceral sem mascarar quadros cirúrgicos: Flunixin Meglumine 1,1 mg/kg IV (ou dose antiendotóxica 0,25 mg/kg IV a cada 8h) associado a Butorfanol 0,02–0,05 mg/kg IV + Detomidina 10–20 mcg/kg IV.","Hidratação enteral e parenteral: fluidoterapia poliônica IV (Ringer com Lactato) + hidratação enteral via sonda nasogástrica com solução eletrolítica isotônica (6–8 L a cada 2h) e sulfato de magnésio (0,5–1 g/kg diluído).","Prevenção de laminite secundária à endotoxemia: crioterapia digital contínua nos cascos (botas de gelo abaixo do carpo/tarso) e Polimixina B (6.000 UI/kg IV a cada 8–12h)."],"take":""},{"sp":"Equino (Cavalo)","spec":"Ortopedia & Podologia Equina","title":"Laminite Aguda Equina Secundária a Sobrecarga de Carboidratos","ctx":"Égua Mangalarga Marchador, 6 anos, 420 kg, invadiu depósito de ração concentrada há 18 horas; apresenta claudicação grau 4 de Obel, postura de apoio nos talões, pulso digital forte e aumento de temperatura nos cascos torácicos.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Crioterapia imediata dos cascos (imersão em gelo e água < 5°C por 48–72h) reduz atividade das metaloproteinases de matriz (MMP-2 e MMP-9) e protege as lâminas dérmicas.","Controle anti-inflamatório e analgésico: Fenilbutazona 4,4 mg/kg IV no 1º dia, seguida de 2,2 mg/kg IV/VO a cada 12h, associada a Acepromazina 0,02–0,04 mg/kg IM a cada 8h (vasodilatação periférica e tranquilização).","Suporte mecânico imediato da falange distal (palmilhas de EVA/espuma de alta densidade moldadas à ranilha) e confinamento absoluto em baia com cama macia profunda."],"take":""},{"sp":"Bovino (Vaca)","spec":"Buiatria & Clínica Metabólica","title":"Hipocalcemia Puerperal Bovina (Febre do Leite) em Vaca Holandesa de Alta Produção","ctx":"Vaca Holandesa, 5 anos, 580 kg, 24 horas pós-parto, em decúbito esternal com autoauscultação (pescoço em 'S'), extremidades frias, midríase, atonia ruminal e FC 110 bpm com bulhas hipofonéticas.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Terapia específica de emergência: Borogluconato de Cálcio 20% a 25% — administrar 1 g de cálcio ionizável por 45 kg de peso vivo (400–500 mL de solução a 23% para vaca de 580 kg) por via IV LENTA em 15–20 minutos.","Ausculta cardíaca contínua obrigatória durante a infusão: se ocorrer bradicardia severa, arritmia ou bloqueio AV, interromper imediatamente a infusão IV e administrar o restante por via SC.","Prevenção de recidiva: fornecer gel ou bolus oral de propionato/cloreto de cálcio 12h após a recuperação e adotar dieta aniônica (DCAD negativo) no pré-parto."],"take":""},{"sp":"Bovino (Vaca)","spec":"Buiatria & Doenças Hemoparasitárias","title":"Tristeza Parasitária Bovina (Babesiose / Anaplasmose) em Novilha","ctx":"Novilha Girolando, 14 meses, 260 kg, febre (41,2°C), mucosas pálidas e ictéricas, hemoglobinúria ('urina cor de café'), apatia e infestação por Rhipicephalus microplus.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Tratamento etiológico duplo (quando PCR/esfregaço não diferencia imediatamente Babesia spp. de Anaplasma marginale): Dipropionato de Imidocarb 3 mg/kg SC/IM (atua contra ambos) associado a Oxitetraciclina LA 20 mg/kg IM profunda (repetir em 72h).","Em surtos confirmados de Babesia bovis (babesiose cerebral), o Aceturato de Diminazeno 3,5 mg/kg IM profunda apresenta resposta rápida.","Suporte hematopoiético e transfusão de sangue total (10–15 mL/kg IV) se hematócrito < 12% com dispneia; respeitar carência oficial MAPA para abate/leite."],"take":""},{"sp":"Ovino / Caprino","spec":"Clínica de Pequenos Ruminantes","title":"Toxemia da Prenhez em Ovelha Gestante de Gêmeos","ctx":"Ovelha Santa Inês, 4 anos, 55 kg, terço final de gestação gemelar, anorexia há 48h, cegueira central aparente, tremores auriculares, cetonúria intensa e hipoglicemia (24 mg/dL).","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Reposição energética imediata: Glicose 50% (60–100 mL IV lento) seguida de Propilenoglicol 60 mL VO a cada 12h como precursor gliconeogênico.","Correção da acidose metabólica e suporte: fluidoterapia IV com Ringer com Lactato, Vitaminas do Complexo B (especialmente tiamina/B1 10 mg/kg IM) e Cálcio SC.","Avaliar indução do parto/cesariana se não houver resposta clínica em 24h (Dexametasona 16–20 mg IM induz parto em ovinos em 36–48h)."],"take":""},{"sp":"Coelho (Lagomorfo)","spec":"Medicina de Animais Silvestres & Exóticos","title":"Síndrome da Estase Gastrintestinal em Coelho Doméstico e Disbiose por Antibióticos","ctx":"Coelho Mini Lop, 2 anos, 2,1 kg, anorexia há 20h, ausência de cíbalos fecais, distensão gástrica gasosa discreta e dor abdominal.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["NUNCA prescrever penicilinas orais (amoxicilina), cefalosporinas orais, clindamicina ou lincomicina em coelhos/cobaias — provocam enterotoxemia fatal por Clostridium spiroforme!","Analgesia visceral (essencial para restaurar motilidade): Buprenorfina 0,03 mg/kg SC a cada 8h + Meloxicam 0,5 mg/kg VO/SC a cada 24h (após hidratação).","Reidratação agressiva (80–100 mL/kg/dia SC/IV), pró-cinéticos (Metoclopramida 0,5 mg/kg SC/VO a cada 8h após descartar obstrução mecânica por radiografia) e alimentação assistida por seringa rica em fibras."],"take":""},{"sp":"Ave (Psitacídeo)","spec":"Medicina Aviária","title":"Clamidiose Aviária (Chlamydia psittaci) em Calopsita — Protocolo Terapêutico e Zoonótico","ctx":"Calopsita (Nymphicus hollandicus), 92 g, conjuntivite bilateral, secreção nasal seromucosa, penas eriçadas e fezes com uratos esverdeados (biliverdinúria).","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Tratamento de eleição (potencial zoonótico — psitacose): Doxiciclina 25 a 50 mg/kg VO a cada 24h (ou 12/12h) por 45 dias consecutivos.","Remover fontes suplementares de cálcio (osso de siba, blocos minerais) durante o tratamento oral com doxiciclina para evitar quelação e falha terapêutica.","Notificar/orientar o tutor sobre precauções de biossegurança (aerossóis de fezes secas) e realizar limpeza úmida diária do recinto."],"take":""},{"sp":"Cão (Canino)","spec":"Psiquiatria & Comportamento Veterinário (Off-Label)","title":"Fobia Sonora Severa (Fogos de Artifício / Tempestades) — Protocolo Ansiolítico Combinado","ctx":"Cão SRD, 5 anos, 16 kg, pânico extremo durante tempestades e fogos (destruição de portas, sialorreia intensa, taquipneia, tentativas de fuga).","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Uso OFF-LABEL respaldado: Trazodona 5 mg/kg VO (80 mg) administrada 90–120 minutos antes do evento previsto, isolada ou associada a Alprazolam 0,03–0,05 mg/kg VO (0,5–0,75 mg) 45–60 min antes.","Alternativa com benzodiazepínico de alta potência: Clonazepam 0,1–0,25 mg/kg VO 60–90 min antes (lembrar que estudos de longo prazo são limitados e o uso contínuo gera tolerância).","NUNCA utilizar acepromazina isolada para fobias sonoras: promove contenção motora sem ansiólise real, agravando o trauma fóbico do cão."],"take":""},{"sp":"Gato (Felino)","spec":"Medicina Felina & Manejo Cat-Friendly","title":"Ansiólise Pré-Consulta e Transporte em Felino Altamente Reativo","ctx":"Gato SRD, 4 anos, 4,8 kg, agressividade extrema por medo na caixa de transporte e clínica veterinária, impossibilitando exame físico e coleta de sangue.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Protocolo de eleição: Gabapentina 100 mg/gato (~20 mg/kg) VO administrada 90 a 120 minutos antes de colocar o gato na caixa de transporte (ou Pregabalina veterinária 5 mg/kg VO 90 min antes).","Alternativa off-label: Trazodona 50 mg/gato VO 90 min antes da consulta.","Reduz drasticamente cortisol, taquicardia e reatividade defensiva, permitindo exame físico seguro sem necessidade de contenção física traumática."],"take":""},{"sp":"Cão (Canino)","spec":"Anestesiologia & Analgesia Multimodal","title":"Infusão Contínua Analgésica (CRI — MLK) em Cirurgia Ortopédica Canina","ctx":"Cão Pastor Alemão, 6 anos, 34 kg, submetido a osteossíntese de fêmur com dor somática e neuropática intensa.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Associação sinérgica MLK (Morfina + Lidocaína + Cetamina): reduz a Concentração Alveolar Mínima (CAM) do isoflurano em até 45%, minimizando hipotensão anestésica.","Taxas padrão CRI em cães: Morfina 0,1–0,2 mg/kg/h + Lidocaína 25–50 mcg/kg/min (1,5–3 mg/kg/h) + Cetamina 2–10 mcg/kg/min (0,12–0,6 mg/kg/h), precedidas de bolus de carga.","Importante: em gatos, substituir a lidocaína sistêmica IV (risco de toxicidade cardiovascular felina) pela associação Fentanil + Cetamina (FLK sem lidocaína)."],"take":""},{"sp":"Cão (Canino)","spec":"Nefrologia & Urologia (Consenso IRIS)","title":"Doença Renal Crônica (DRC) Canina Estágio III com Proteinúria e Hipertensão","ctx":"Cadela Cocker Spaniel, 12 anos, 13 kg, creatinina 3,1 mg/dL, SDMA 32 μg/dL, Relação Proteína/Creatinina Urinária (RPCU) = 1,8 e Pressão Arterial Sistólica (PAS) = 185 mmHg.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Controle antiproteinúrico: IECA (Benazepril ou Enalapril 0,5 mg/kg VO a cada 12–24h) ou Telmisartana 1 mg/kg VO a cada 24h, monitorando creatinina e potássio 7–14 dias após início.","Controle anti-hipertensivo adicional (PAS > 160 mmHg persistente): associar bloqueador de canal de cálcio Anlodipino 0,1–0,25 mg/kg VO a cada 24h.","Dieta renal terapêutica restrita em fósforo (< 0,5% MS), quelante de fósforo entérico (Hidróxido de Alumínio 30–90 mg/kg/dia com refeições) e hidratação contínua."],"take":""},{"sp":"Cão (Canino)","spec":"Hepatologia Veterinária","title":"Hepatopatia Vacuolar Induzida por Corticoide vs. Hepatite Crônica Canina","ctx":"Cão Shih-tzu, 9 anos, 6,2 kg, em uso prolongado de prednisona para alergia; apresenta fosfatase alcalina (FA) = 1.450 U/L, ALT = 190 U/L, poliúria/polidipsia e hepatomegalia.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Cães possuem isoenzima específica da FA induzida por glicocorticoides (C-ALP), elevando acentuadamente a FA sem necessariamente indicar necrose hepatocelular grave.","Conduta: realizar desmame gradual da prednisolona (nunca suspender abruptamente pelo risco de insuficiência adrenal iatrogênica) e migrar controle alérgico para Oclacitinib (Apoquel) ou Lokivetmab (Cytopoint).","Suporte hepatoprotetor: S-adenosilmetionina (SAMe) 20 mg/kg VO em jejum + Silimarina 10–15 mg/kg VO 12/12h."],"take":""},{"sp":"Cão (Canino)","spec":"Oftalmologia Veterinária","title":"Úlcera de Córnea Profunda (Estromal) — Contraindicação Absoluta de Corticoides Tópicos","ctx":"Cão Pug, 3 anos, 8,5 kg, blefarospasmo intenso, epífora, miose reflexa (uveíte anterior secundária) e teste de fluoresceína positivo com defeito estromal central.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["PROIBIÇÃO ABSOLUTA: colírios contendo corticosteroides (dexametasona, prednisolona) potencializam colagenases corneanas, causando ceratomalácia ('melting') e perfuração ocular!","Protocolo tópico: colírio antibiótico de amplo espectro (Tobramicina 0,3% ou Moxifloxacino 0,5% — 1 gota a cada 4–6h) + colírio anticolagenase (soro autólogo refrigerado a cada 2–4h) + Atropina 1% colírio (1 gota 12/12h para cicloplegia e dor ciliar).","Analgesia sistêmica com Meloxicam 0,1 mg/kg VO 24/24h e colar elisabetano obrigatório 24h/dia."],"take":""},{"sp":"Cão (Canino)","spec":"Oncologia Veterinária (Cálculo BSA)","title":"Linfoma Multicêntrico Canino — Protocolo CHOP e Dosagem por Superfície Corporal (m²)","ctx":"Cão Boxer, 7 anos, 30 kg (BSA = 0,97 m²), linfadenomegalia periférica generalizada confirmada por citologia e imunofenotipagem como linfoma de células B de alto grau.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["Quimioterápicos de janela terapêutica estreita são dosados pela Área de Superfície Corporal (BSA em m²) — exceto em cães < 10–15 kg para doxorrubicina (1 mg/kg IV) para evitar mielossupressão.","Protocolo CHOP semanal: Vincristina 0,5–0,7 mg/m² IV (semanas 1 e 3), Ciclofosfamida 250 mg/m² VO/IV (semana 2, associada a furosemida para prevenir cistite hemorrágica estéril), Doxorrubicina 30 mg/m² IV lento (semana 4) + Prednisolona em desmame.","Realizar hemograma completo antes de cada sessão (adiar se neutrófilos segmentados < 1.500–2.000/μL) e ecocardiograma basal antes da doxorrubicina (cardiotoxicidade cumulativa)."],"take":""},{"sp":"Réptil (Quelônio)","spec":"Medicina de Répteis & Exóticos","title":"Toxicidade Fatal por Ivermectina em Quelônios (Jabuti / Tartaruga)","ctx":"Jabuti-piranga (Chelonoidis carbonaria), 2,4 kg, apresenta paresia flácida, retração ausente de cabeça e membros e depressão respiratória após aplicação de ivermectina para parasitas.","q":"Qual a sua conduta diagnóstica e terapêutica?","pts":["CONTRAINDICAÇÃO ABSOLUTA: a ivermectina atravessa facilmente a barreira hematoencefálica de quelônios (jabutis, cágados e tartarugas), causando paralisia flácida prolongada e óbito por falência respiratória.","Para endoparasitoses em quelônios, utilizar Fembendazol (25–50 mg/kg VO a cada 24h por 3–5 dias) ou Praziquantel (5–8 mg/kg VO/IM).","Tratamento de suporte na intoxicação: manutenção na zona de temperatura ótima preferida (ZTOP 28–30°C), fluidoterapia intracelomática/epicelômica e suporte ventilatório."],"take":""},{"sp":"Cão (Canino)","spec":"Oncologia","title":"Tumor Venéreo Transmissível (TVT) genital em cadela errante","ctx":"Cadela SRD, 3 anos, 14 kg, resgatada, com massa friável, sanguinolenta e em couve-flor na vulva, secreção serossanguinolenta e odor fétido. Citologia por imprint: células redondas com citoplasma vacuolizado (vacúolos em colar de contas).","q":"Qual o protocolo de escolha e o que monitorar?","pts":["Diagnóstico citológico é suficiente na maioria dos casos (células redondas com vacúolos citoplasmáticos característicos).","Quimioterapia de escolha: SULFATO DE VINCRISTINA 0,025 mg/kg (ou 0,5–0,75 mg/m²) IV estrita, semanal, por 4–8 semanas, mantendo 2 aplicações após remissão completa.","Hemograma antes de cada sessão (suspender se neutrófilos < 2.000/µL). Atenção ao extravasamento (vesicante): cateter limpo em primeira tentativa.","Casos resistentes: doxorrubicina 30 mg/m² a cada 3 semanas. Cirurgia isolada tem alta recidiva.","Castração após o tratamento e controle populacional reduzem transmissão."],"take":"Vincristina semanal cura > 90% dos TVTs — monitorar hemograma e neuropatia/constipação."},{"sp":"Cão (Canino)","spec":"Doenças Infecciosas / Zoonoses","title":"Leishmaniose visceral canina em área endêmica","ctx":"Cão macho, 5 anos, 22 kg, Fortaleza-CE. Emagrecimento, onicogrifose, descamação furfurácea periocular, linfadenomegalia generalizada e epistaxe. Hiperglobulinemia, anemia normocítica e UPC 1,8; creatinina 1,6 mg/dL. Sorologia (ELISA + TR DPP) reagente e PCR de medula positivo.","q":"Como estadiar, tratar e quais as obrigações legais?","pts":["Estadiamento LeishVet: estágio III (doença grave — proteinúria, IRIS 1–2). Medir PA e UPC.","Tratamento autorizado no Brasil: MILTEFOSINA (Milteforan) 2 mg/kg VO q24h por 28 dias + ALOPURINOL 10 mg/kg VO q12h por no mínimo 6–12 meses (dieta com baixo teor de purinas para evitar urólitos de xantina).","Proteinúria: benazepril 0,5 mg/kg q24h ou telmisartana 1 mg/kg q24h; dieta renal; tratar hipertensão.","Coleira de DELTAMETRINA 4% ou repelente de permetrina (cães) em TODOS os cães da casa — reduz transmissão pelo flebotomíneo (Lutzomyia longipalpis).","É doença de NOTIFICAÇÃO COMPULSÓRIA; tratamento não elimina o parasita — o tutor deve assinar termo de responsabilidade (Portaria Interministerial 1.426/2008 e Nota Técnica MAPA 11/2016)."],"take":"Miltefosina + alopurinol + coleira repelente; reavaliar sorologia, proteinúria e clínica a cada 3–6 meses."},{"sp":"Cão (Canino)","spec":"Gastroenterologia / Infecciosas","title":"Parvovirose canina em filhote não vacinado","ctx":"Filhote Rottweiler, 10 semanas, 6 kg, vômitos incoercíveis, diarreia hemorrágica fétida, desidratação de 8%, leucopenia (1.800/µL) e teste rápido de antígeno fecal positivo.","q":"Quais pilares do tratamento intensivo?","pts":["Fluidoterapia IV com cristaloide isotônico (déficit + manutenção + perdas) e reposição de K (KCl conforme escala) e glicose 2,5–5% se hipoglicêmico.","Antieméticos: MAROPITANT 1 mg/kg IV/SC q24h ± ondansetrona 0,5 mg/kg IV q8–12h.","Antibioticoterapia de amplo espectro pela translocação bacteriana e neutropenia: ampicilina 22 mg/kg IV q8h (ou amoxicilina-clavulanato) ± enrofloxacino (cautela em filhote) ou cefoxitina.","NUTRIÇÃO ENTERAL PRECOCE (sonda nasoesofágica em 12–24 h) reduz tempo de internação. Analgesia (metadona/buprenorfina, lidocaína IC).","Isolamento; desinfecção com hipoclorito de sódio 1:30 (o vírus resiste a quaternários de amônio comuns)."],"take":"Sobrevida > 85–90% com fluido, antiemético, antibiótico e alimentação enteral precoce."},{"sp":"Cão (Canino)","spec":"Doenças Infecciosas / Hematologia","title":"Babesiose canina (Babesia vogeli) com anemia hemolítica","ctx":"Cão Pinscher, 2 anos, 4 kg, com infestação por carrapatos, febre (40,2 °C), mucosas pálidas e ictéricas, esplenomegalia. Ht 18%, trombocitopenia 45.000/µL, merozoítos piriformes em esfregaço de sangue periférico.","q":"Qual a terapia específica e cuidados adicionais?","pts":["DIPROPIONATO DE IMIDOCARB 5–6,6 mg/kg SC/IM, 2 doses com intervalo de 14 dias, com pré-medicação de ATROPINA 0,02–0,04 mg/kg SC 15 min antes (efeitos colinérgicos).","Alternativa: aceturato de diminazeno 3,5 mg/kg IM dose única (não repetir — neurotoxicidade).","Investigar coinfecção com Ehrlichia canis (doxiciclina 10 mg/kg q24h por 28 dias) e Anaplasma.","Transfusão de sangue/concentrado de hemácias se Ht < 15% ou sinais de hipóxia. Prednisolona apenas se componente imunomediado importante.","Controle de carrapatos com isoxazolina (fluralaner, afoxolaner, sarolaner, lotilaner) no paciente e no ambiente."],"take":"Imidocarb com atropina prévia + pesquisa de hemoparasitas concomitantes."},{"sp":"Cão (Canino)","spec":"Reprodução / Emergência","title":"Piometra fechada em cadela de meia-idade","ctx":"Cadela Poodle, 8 anos, 7 kg, não castrada, último cio há 6 semanas, recebeu 'injeção anticoncepcional' no passado. Apatia, PU/PD, vômitos, distensão abdominal. Leucocitose 38.000/µL com desvio à esquerda; ultrassom com útero distendido por conteúdo anecoico com pontos ecogênicos.","q":"Qual a conduta preferencial e alternativas?","pts":["Estabilização: fluidoterapia IV, correção eletrolítica, antibiótico (ampicilina + enrofloxacino ou amoxicilina-clavulanato IV) e analgesia (metadona). Evitar AINE em sepse/azotemia.","OVÁRIO-HISTERECTOMIA de emergência após estabilização é o tratamento de escolha (piometra fechada — risco de ruptura e peritonite).","Tratamento clínico apenas para reprodutoras jovens e estáveis (piometra aberta): AGLEPRISTONE 10 mg/kg SC nos dias 1, 2, 8 e 14 ± cloprostenol 1 mcg/kg SC q48h + antibiótico; alta recidiva.","Orientar sobre os riscos dos progestágenos ('anticoncepcionais') em cadelas e gatas: piometra, tumores mamários e diabetes."],"take":"Piometra fechada = estabilizar e operar."},{"sp":"Gato (Felino)","spec":"Hematologia / Infecciosas","title":"Micoplasmose hemotrópica felina (Mycoplasma haemofelis)","ctx":"Gato macho não castrado, 3 anos, 5 kg, acesso à rua, FeLV positivo. Letargia, mucosas pálidas, febre 39,8 °C. Ht 12%, anemia regenerativa, autoaglutinação negativa, estruturas epicelulares em esfregaço e PCR positivo para M. haemofelis.","q":"Tratamento e prognóstico?","pts":["DOXICICLINA 10 mg/kg VO q24h (ou 5 mg/kg q12h) por 2–4 semanas — sempre seguida de 5–6 mL de água (risco de estenose esofágica). Alternativa: pradofloxacino 5–10 mg/kg q24h ou marbofloxacino 2 mg/kg q24h.","Prednisolona 1–2 mg/kg q12h nos casos com hemólise imunomediada importante (reduzir gradualmente).","Transfusão (tipagem sanguínea obrigatória em gatos — A/B/AB) se Ht < 12–15% com sinais clínicos.","Gatos FeLV+ têm pior prognóstico e podem permanecer portadores. Controle de pulgas e de brigas (transmissão)."],"take":"Doxiciclina com água + tipagem antes de transfundir."},{"sp":"Gato (Felino)","spec":"Gastroenterologia / Nutrição","title":"Lipidose hepática felina após anorexia prolongada","ctx":"Gata castrada, 7 anos, obesa (7,5 kg, ECC 8/9), anorexia há 10 dias após mudança de casa. Icterícia, vômito, ptialismo. ALT 380 U/L, FA 650 U/L (GGT normal), bilirrubina 6 mg/dL, K 2,9 mEq/L. Fígado hiperecogênico e aumentado.","q":"Qual a peça-chave do tratamento?","pts":["NUTRIÇÃO ENTERAL é o tratamento: sonda esofágica (após estabilização) ou nasoesofágica. Iniciar com 25–33% do RER no dia 1, chegando a 100% em 3–4 dias (prevenir síndrome de realimentação — monitorar fósforo e potássio).","RER = 70 x (peso atual)^0,75 kcal/dia; usar dieta hiperproteica (exceto se encefalopatia hepática).","Corrigir hipocalemia (KCl), hipofosfatemia, suplementar tiamina (B1) e cobalamina (B12).","Antieméticos (maropitant, ondansetrona) e mirtazapina; evitar diazepam VO (hepatotóxico em gatos). Avaliar coagulação antes da sonda (vitamina K1 se necessário).","Recuperação em 3–6 semanas; prognóstico bom (> 80%) quando a alimentação é instituída precocemente."],"take":"Gato obeso sem comer > 3 dias = risco de lipidose. Sonda e alimentar."},{"sp":"Gato (Felino)","spec":"Pneumologia / Emergência","title":"Crise asmática felina (asma / bronquite alérgica)","ctx":"Gata siamesa, 4 anos, 3,8 kg, chega com respiração de boca aberta, esforço expiratório, sibilos à auscultação e tosse crônica há meses. Radiografia (após estabilização): padrão bronquial com hiperinsuflação.","q":"Como estabilizar e manter?","pts":["Oxigenioterapia em caixa/fluxo livre e manipulação mínima (estresse pode ser fatal).","Broncodilatador: TERBUTALINA 0,01 mg/kg SC/IM (efeito em 15–30 min) ou salbutamol inalatório com espaçador felino (AeroKat).","Corticoide: DEXAMETASONA 0,2–1 mg/kg IV/IM na crise.","Manutenção: prednisolona 1–2 mg/kg/dia VO com redução gradual + FLUTICASONA inalatória 110–250 mcg q12h com espaçador (efeito pleno em 1–2 semanas).","Afastar alérgenos: areia com poeira/perfume, fumaça de cigarro, aerossóis. Descartar dirofilariose/aelurostrongilose (fembendazol)."],"take":"O2 + terbutalina + dexametasona na crise; fluticasona inalatória na manutenção."},{"sp":"Cão (Canino)","spec":"Toxicologia (Emergência)","title":"Acidente botrópico em cão de sítio","ctx":"Labrador, 4 anos, 32 kg, mordido no focinho por jararaca há 2 horas. Edema facial progressivo, equimoses, sangramento gengival, dor intensa. Tempo de coagulação (tubo seco) > 20 minutos.","q":"Qual a conduta e o que não fazer?","pts":["Diagnóstico clínico + tempo de coagulação alterado = acidente botrópico moderado a grave.","SORO ANTIBOTRÓPICO (ou antibotrópico-crotálico) IV diluído, o mais rápido possível; a dose NÃO é calculada pelo peso (neutraliza a quantidade de veneno inoculada): acidentes moderados 4–8 ampolas; graves ~12 (referência humana). Pré-medicar com anti-histamínico e ter adrenalina disponível.","Fluidoterapia (prevenção de lesão renal), analgesia com opioide (metadona/morfina) e dipirona. EVITAR AINE (coagulopatia e risco renal).","Antibiótico se necrose/abscesso (amoxicilina-clavulanato ± metronidazol). Avaliar via aérea pelo edema facial.","NÃO fazer torniquete, incisão, sucção ou aplicar substâncias no local. Repetir coagulograma 12–24 h após o soro."],"take":"Soro antibotrópico precoce; dose independe do peso; nunca torniquete."},{"sp":"Cão (Canino)","spec":"Toxicologia (Emergência)","title":"Intoxicação por carbamato (chumbinho)","ctx":"Cão SRD, 2 anos, 18 kg, encontrado após ingerir carne com grânulos escuros jogada no quintal. Sialorreia profusa, miose, diarreia, tremores, broncorreia, bradicardia (FC 50) e dispneia.","q":"Como tratar e qual o parâmetro de atropinização?","pts":["Síndrome colinérgica muscarínica + nicotínica = inibidor de colinesterase (aldicarbe — 'chumbinho').","ATROPINA 0,2–0,5 mg/kg: ¼ IV e o restante IM/SC; repetir até CESSAR A BRONCORREIA E SIALORREIA (a FC não é o parâmetro — taquicardia ocorre antes).","Oxigênio, aspiração de vias aéreas, intubação/ventilação se fraqueza respiratória; diazepam/midazolam para convulsões.","Descontaminação após estabilização: lavagem gástrica sob intubação/carvão ativado; banho se exposição cutânea (com luvas).","Pralidoxima (2-PAM) tem pouco benefício em carbamatos; indicada para organofosforados. Envenenamento intencional é crime (Lei 9.605/98, art. 32)."],"take":"Atropinizar até secar as vias aéreas."},{"sp":"Cão (Canino)","spec":"Endocrinologia / Emergência","title":"Crise addisoniana (hipoadrenocorticismo primário)","ctx":"Cadela Poodle Standard, 4 anos, 20 kg, histórico de vômitos e diarreia intermitentes ('wax and wane'). Chega em choque, bradicardia (FC 55), Na 124 e K 8,1 mEq/L (Na:K 15), azotemia, hipoglicemia leve e ausência de leucograma de estresse (linfocitose).","q":"Quais as prioridades?","pts":["Tratar a HIPERCALEMIA cardiotóxica: gluconato de cálcio 10% 0,5–1,5 mL/kg IV em 10 min (cardioproteção), insulina regular 0,25–0,5 UI/kg IV + glicose (2 g por UI), ou bicarbonato.","Fluidoterapia com NaCl 0,9% (choque) — corrigir sódio no máximo 10–12 mEq/L/24 h (mielinólise pontina).","Coletar cortisol basal/teste de estimulação com ACTH ANTES do glicocorticoide; usar DEXAMETASONA 0,1–0,2 mg/kg IV (não interfere no ensaio) ou hidrocortisona 0,5 mg/kg/h após o teste.","Cortisol pós-ACTH < 2 µg/dL confirma. Manutenção: DOCP 1,5–2,2 mg/kg a cada 25 dias ou FLUDROCORTISONA 0,01–0,02 mg/kg/dia + prednisolona 0,1–0,2 mg/kg/dia."],"take":"Cálcio protege o coração, fluido e corticoide salvam a vida."},{"sp":"Gato (Felino)","spec":"Endocrinologia","title":"Hipertireoidismo felino com DRC mascarada","ctx":"Gata SRD, 13 anos, 3,1 kg, perda de peso com polifagia, hiperatividade, vômitos, taquicardia (FC 240) e nódulo tireoidiano palpável. T4 total 9,8 µg/dL, creatinina 1,3 mg/dL, USG 1,025, PAS 170 mmHg.","q":"Como tratar com segurança renal?","pts":["METIMAZOL 1,25–2,5 mg/gato VO ou transdérmico q12h. Reavaliar T4, hemograma e creatinina após 2–3 semanas.","O hipertireoidismo aumenta a TFG e MASCARA a DRC: após eutireoidismo, a creatinina pode subir — por isso o tratamento clínico reversível antes de definitivos (iodo radioativo I-131/tireoidectomia).","Atenolol 6,25 mg/gato q12–24h se taquicardia persistente; anlodipino 0,625 mg/gato se PAS > 160 persistente.","Efeitos adversos do metimazol: vômito, prurido facial, hepatopatia, discrasias (hemograma nos 3 primeiros meses).","Alvo: T4 na metade inferior da referência. Dieta com restrição de iodo é alternativa."],"take":"Iniciar com tratamento reversível e reavaliar a função renal no eutireoidismo."},{"sp":"Gato (Felino)","spec":"Endocrinologia","title":"Diabetes mellitus felino com chance de remissão","ctx":"Gato macho castrado, 10 anos, 6,5 kg (obeso), PU/PD, polifagia e postura plantígrada. Glicemia 420 mg/dL, frutosamina 580 µmol/L, glicosúria sem cetonúria. Histórico de acetato de metilprednisolona para dermatite.","q":"Qual o protocolo com maior chance de remissão?","pts":["INSULINA GLARGINA 0,5 UI/kg (peso ideal) q12h se glicemia > 360 mg/dL (caso típico: 1–2 UI/gato) + DIETA hiperproteica e pobre em carboidratos (< 12% EM).","Remover fatores de resistência insulínica: suspender corticoides/progestágenos, tratar obesidade, infecções e doença dentária.","Monitoramento domiciliar (glicosímetro veterinário ou sensor contínuo tipo FreeStyle Libre); ajustes a cada 5–7 dias.","Remissão em até 80–90% dos gatos com controle glicêmico estrito nos primeiros 6 meses.","Inibidores de SGLT2 (bexagliflozina/velagliflozina) são opção em gatos selecionados, recém-diagnosticados e não cetóticos (risco de cetoacidose euglicêmica) — verificar disponibilidade no Brasil."],"take":"Glargina + dieta low-carb precoces = remissão."},{"sp":"Cão (Canino)","spec":"Endocrinologia","title":"Hiperadrenocorticismo hipófise-dependente","ctx":"Dachshund fêmea castrada, 10 anos, 9 kg, PU/PD, polifagia, abdome pendular, alopecia simétrica, pele fina e ofegação. FA 980 U/L, colesterol 380 mg/dL, USG 1,008. Teste de supressão com dexametasona dose baixa: cortisol 8 h = 3,2 µg/dL com escape. Adrenais simétricas aumentadas.","q":"Como tratar e monitorar?","pts":["TRILOSTANO 0,5–1 mg/kg VO q12h com alimento (protocolos atuais de dose baixa reduzem risco de hipocortisolismo).","Reavaliar em 10–14 dias, 4 semanas e a cada 3 meses: sinais clínicos + cortisol pré-trilostano ou teste de estimulação com ACTH 4–6 h pós-dose.","Orientar o tutor: suspender e procurar atendimento se apatia, vômito, diarreia ou anorexia (hipoadrenocorticismo iatrogênico).","Monitorar PA e proteinúria (hipertensão é comum) e risco de tromboembolismo e pancreatite."],"take":"Trilostano em dose baixa com alimento e monitoração regular."},{"sp":"Cão (Canino)","spec":"Cirurgia / Emergência","title":"Dilatação-vólvulo gástrico (DVG) em cão de raça gigante","ctx":"Dogue Alemão, 5 anos, 58 kg, comeu uma grande refeição e brincou. Ânsia improdutiva, sialorreia, distensão abdominal timpânica, taquicardia (FC 160), pulso fraco. Radiografia lateral direita: sinal de 'braço de Popeye' (compartimentalização).","q":"Sequência de atendimento?","pts":["Dois cateteres calibrosos em veias cefálicas (não usar membros pélvicos): cristaloide em bolus 10–20 mL/kg repetido ou salina hipertônica 7,5% 4 mL/kg.","Descompressão gástrica: trocarterização (cateter 14–16G no ponto de maior timpanismo do flanco direito) e/ou sondagem orogástrica.","Analgesia (metadona/fentanil), lidocaína 2 mg/kg IV + IC 50 mcg/kg/min (reduz lesão de reperfusão e arritmias ventriculares).","Cirurgia de emergência após estabilização: reposicionamento, avaliação do estômago/baço e GASTROPEXIA INCISIONAL direita (recidiva > 70% sem gastropexia).","Lactato > 6 mmol/L que não cai > 50% com fluidos indica pior prognóstico. Monitorar ECG por 72 h."],"take":"Fluido, descompressão, lidocaína e gastropexia."},{"sp":"Cão (Canino)","spec":"Emergência","title":"Insolação (hipertermia por calor) em cão braquicefálico","ctx":"Bulldog Francês, 3 anos, 12 kg, passeio ao meio-dia no verão. Colapso, temperatura retal 42,3 °C, mucosas vermelho-tijolo, estridor, diarreia hemorrágica.","q":"Como resfriar e quais complicações esperar?","pts":["Resfriamento ATIVO imediato com água em temperatura ambiente/fria (não gelada — causa vasoconstrição) + ventilação; PARAR em 39,5 °C para evitar hipotermia rebote.","Oxigênio e controle da via aérea (sedação leve com acepromazina/butorfanol, intubação se obstrução laríngea).","Fluidoterapia IV, glicose se hipoglicemia, monitorar coagulação (CID), função renal, hepática e enzimas musculares por 24–72 h.","Gastroprotetores e antibiótico se translocação bacteriana (diarreia hemorrágica).","Prevenção: evitar exercício em horas quentes; cirurgia da síndrome braquicefálica."],"take":"Resfriar rápido até 39,5 °C e antecipar CID e lesão renal."},{"sp":"Cão (Canino)","spec":"Dermatologia","title":"Dermatite atópica canina com piodermite secundária","ctx":"West Highland White Terrier, 3 anos, 8 kg, prurido não sazonal intenso em face, patas, axilas e região inguinal desde 1 ano de idade. Eritema, liquenificação, otite ceruminosa e pústulas/colaretes no abdome. Citologia: cocos e leveduras.","q":"Plano terapêutico multimodal?","pts":["Tratar infecções secundárias primeiro: banhos com CLOREXIDINA 2–4% (10 min de contato, 2–3x/semana); cefalexina 22–30 mg/kg q12h por 3 semanas se pioderma extensa.","Controle de pulgas rigoroso (isoxazolina) e dieta de eliminação (proteína hidrolisada ou nova por 8 semanas) para excluir alergia alimentar.","Controle do prurido: OCLACITINIBE 0,4–0,6 mg/kg q12h por 14 dias, depois q24h; ou LOKIVETMAB 1–2 mg/kg SC mensal; ou ciclosporina 5 mg/kg q24h; prednisolona em curto prazo.","Longo prazo: imunoterapia alérgeno-específica (após teste intradérmico/sorológico), reparo da barreira cutânea (ácidos graxos, ceramidas).","Otite: limpeza + otológico combinado conforme citologia."],"take":"Atopia é crônica: tratar infecções, controlar prurido e investigar alergia alimentar/pulgas."},{"sp":"Cão (Canino)","spec":"Dermatologia","title":"Demodicose generalizada juvenil","ctx":"Pit Bull, 9 meses, 18 kg, alopecia multifocal, comedões, eritema, furunculose podal e linfadenomegalia. Raspados cutâneos profundos com inúmeros Demodex canis adultos, ninfas e ovos.","q":"Qual o tratamento de escolha atualmente?","pts":["ISOXAZOLINAS são a 1ª escolha: fluralaner 25–56 mg/kg VO dose única (repetir em 12 semanas se necessário), afoxolaner, sarolaner ou lotilaner mensais.","Tratar pioderma secundária: cefalexina/antibiótico por cultura (furunculose) + banhos com clorexidina/peróxido de benzoíla.","Raspados mensais; manter tratamento até 2 raspados negativos consecutivos com 1 mês de intervalo.","Evitar corticoides. Alternativas antigas: amitraz banhos 0,025–0,05% ou ivermectina diária (somente após teste MDR1 — risco de neurotoxicidade).","Castração recomendada (componente hereditário; estro e gestação causam recidiva)."],"take":"Isoxazolina + tratamento da pioderma; raspados até cura parasitológica."},{"sp":"Gato (Felino)","spec":"Dermatologia / Zoonoses","title":"Dermatofitose felina (Microsporum canis) em gatil","ctx":"Gatil com 6 gatos Persas; filhote de 4 meses com lesões circulares alopécicas e descamativas na cabeça e orelhas; tutora com lesões anelares no antebraço. Lâmpada de Wood: fluorescência verde-maçã nos pelos; cultura positiva para M. canis.","q":"Como tratar animais e ambiente?","pts":["Terapia sistêmica: ITRACONAZOL 5 mg/kg VO q24h em pulsos (semana sim, semana não) ou TERBINAFINA 30–40 mg/kg q24h.","Terapia tópica obrigatória para todos os gatos do ambiente: banhos/imersão com cal sulfurada 2% (lime sulfur) ou xampu de miconazol + clorexidina 2x/semana.","Descontaminação ambiental: aspiração, lavagem e hipoclorito 1:10–1:100 em superfícies; isolar animais infectados.","Cura = 2 culturas fúngicas negativas consecutivas (a cada 2–4 semanas).","ZOONOSE: orientar a tutora a procurar dermatologista."],"take":"Sistêmico + tópico + ambiente; cura micológica, não clínica."},{"sp":"Cão (Canino)","spec":"Neurologia","title":"Doença do disco intervertebral toracolombar (Hansen tipo I)","ctx":"Dachshund, 5 anos, 7 kg, paraparesia aguda após pular do sofá. Dor à palpação em T13-L1, reflexos patelares normais/aumentados, propriocepção ausente nos pélvicos, dor profunda presente.","q":"Grau neurológico e conduta?","pts":["Grau 3–4 (paraparesia não ambulatória/paraplegia com dor profunda presente). Lesão de neurônio motor superior (T3-L3).","Encaminhar para TC/RM e DESCOMPRESSÃO CIRÚRGICA (hemilaminectomia): recuperação de ~90% com dor profunda presente.","Analgesia multimodal: opioide (metadona), gabapentina 10 mg/kg q8h, AINE (meloxicam) — NÃO associar corticoide (sem benefício e aumenta complicações).","Tratamento conservador (casos graus 1–2 ou sem cirurgia): repouso estrito em gaiola por 4–6 semanas.","Esvaziamento vesical manual/sondagem e fisioterapia. Ausência de dor profunda > 48 h reduz prognóstico (~50%); risco de mielomalácia progressiva."],"take":"Avaliar dor profunda; corticoide não é indicado; descompressão precoce."},{"sp":"Gato (Felino)","spec":"Doenças Infecciosas","title":"Peritonite infecciosa felina (PIF) forma efusiva","ctx":"Gato Ragdoll, 11 meses, 3,5 kg, oriundo de gatil, febre recorrente não responsiva a antibióticos, distensão abdominal, perda de peso. Efusão abdominal amarela, viscosa, proteína 6,2 g/dL, relação albumina:globulina 0,3, teste de Rivalta positivo, RT-PCR do líquido positivo para coronavírus felino.","q":"Qual a abordagem terapêutica atual?","pts":["Antivirais análogos de nucleosídeo transformaram o prognóstico: GS-441524 VO (10–15 mg/kg/dia; formas neurológicas/oculares até 15–20) ou remdesivir injetável por 84 dias (protocolos de 42 dias em estudo) — sobrevida > 80%.","Status regulatório: não são registrados no MAPA para uso veterinário; o uso exige avaliação legal/ética e termo de consentimento do tutor.","Suporte: drenagem da efusão se dispneia, nutrição, antieméticos.","Monitorar resposta pela relação A:G, globulinas, Ht, bilirrubina e desaparecimento da efusão.","Manejo de gatil: reduzir densidade e caixas de areia compartilhadas (transmissão fecal-oral do coronavírus entérico)."],"take":"PIF deixou de ser sentença de morte com antivirais — atenção ao status legal."},{"sp":"Bovino (Vaca)","spec":"Clínica de Ruminantes / Mastite","title":"Mastite clínica aguda grave por coliforme","ctx":"Vaca Holandesa, 3ª lactação, 25 dias pós-parto. Quarto mamário edemaciado, leite aquoso amarelado com grumos, febre 41 °C, anorexia, desidratação 8%, ruminação ausente. CMT +++ no quarto acometido.","q":"Qual o tratamento sistêmico e de suporte?","pts":["Mastite grave (escore 3) por Gram− é emergência: fluidoterapia (salina hipertônica 7,5% 4–5 mL/kg IV + 20–40 L de água VO por sonda) e cálcio se hipocalcemia.","AINE: FLUNIXINA MEGLUMINA 2,2 mg/kg IV q24h ou meloxicam 0,5 mg/kg IV/SC (melhora bem-estar e sobrevida).","Antimicrobiano sistêmico em casos graves (bacteremia): ceftiofur 2,2 mg/kg IM q24h por 5 dias (ou cefquinoma 1 mg/kg) + intramamário conforme cultura.","Ordenhas frequentes do quarto (com ocitocina 20 UI IM) para retirar toxinas.","Respeitar o PERÍODO DE CARÊNCIA do leite e da carne de cada produto; registrar tratamentos (rastreabilidade)."],"take":"Fluido + AINE são tão importantes quanto o antibiótico na mastite por coliforme."},{"sp":"Bovino (Bezerro/Garrote)","spec":"Clínica de Ruminantes / Respiratório","title":"Doença respiratória bovina (DRB) em garrotes de confinamento","ctx":"Lote de 120 garrotes Nelore recém-chegados ao confinamento (transporte longo). 15 animais com febre > 40,5 °C, secreção nasal mucopurulenta, tosse, depressão e redução de ingestão. Necropsia de 1 animal: broncopneumonia fibrinosa cranioventral (Mannheimia haemolytica).","q":"Tratamento dos doentes e manejo do lote?","pts":["Animais clínicos: TULATROMICINA 2,5 mg/kg SC dose única, ou FLORFENICOL 40 mg/kg SC dose única, ou ceftiofur cristalino 6,6 mg/kg (base da orelha).","AINE: flunixina 2,2 mg/kg IV ou meloxicam 0,5 mg/kg SC (reduz febre e lesão pulmonar).","Metafilaxia do lote de alto risco na chegada (tulatromicina/florfenicol) pode ser considerada — uso racional e orientado.","Prevenção: vacinação contra BoHV-1, BVDV, BRSV, PI3 e Mannheimia antes do transporte, redução do estresse, adaptação à dieta.","Reavaliar em 72 h (critério de falha terapêutica) e respeitar carências."],"take":"Diagnóstico precoce pela febre + macrolídeo/fenicol de longa ação + AINE."},{"sp":"Bovino (Vaca)","spec":"Reprodução","title":"Protocolo de IATF em vacas de corte pós-parto","ctx":"Rebanho de 200 vacas Nelore com bezerro ao pé, 45–60 dias pós-parto, escore de condição corporal 2,75–3 (1–5). Produtor quer concentrar a estação de monta e emprenhar o máximo no início.","q":"Monte um protocolo de IATF à base de progesterona e estradiol.","pts":["D0: dispositivo intravaginal de PROGESTERONA (0,5–1 g) + BENZOATO DE ESTRADIOL 2 mg IM.","D8: retirada do dispositivo + CLOPROSTENOL 500 mcg IM + CIPIONATO DE ESTRADIOL 0,5–1 mg IM + eCG 300–400 UI IM (melhora prenhez em vacas paridas/anestro).","D10: inseminação em tempo fixo 48–52 h após a retirada do dispositivo.","Taxa de prenhez esperada 45–60%; ressincronização no D22–30 com diagnóstico precoce por ultrassom.","Nutrição adequada (ECC ≥ 2,75), controle sanitário reprodutivo (IBR, BVD, leptospirose) e bem-estar."],"take":"P4 + BE (D0) → PGF + ECP + eCG (D8) → IATF (D10)."},{"sp":"Bovino (Garrote)","spec":"Toxicologia","title":"Intoxicação por ureia em bovinos","ctx":"Lote de bovinos recebeu suplemento proteico-energético com ureia mal misturado após chuva (ureia diluída na água do cocho). Em 30–60 min: tremores musculares, salivação, timpanismo, incoordenação, decúbito; 3 mortes.","q":"Como tratar os animais intoxicados?","pts":["Sinais agudos de hiperamonemia em < 1–4 h após ingestão confirmam suspeita.","ÁCIDO ACÉTICO 5% (vinagre) 2–6 L VO para bovinos adultos (0,5–1 L ovinos) + ÁGUA FRIA 20–40 L VO — reduz pH ruminal e hidrólise da ureia.","Ruminotomia e esvaziamento ruminal nos casos graves. Trocarterização se timpanismo grave.","Prevenção: adaptação gradual (2–3 semanas), mistura homogênea, cochos cobertos e com drenagem, não oferecer a animais em jejum."],"take":"Vinagre + água fria por via oral o quanto antes."},{"sp":"Ovino / Caprino","spec":"Parasitologia","title":"Hemoncose ovina com resistência anti-helmíntica","ctx":"Rebanho de 300 ovelhas Santa Inês no período chuvoso. Mortes por anemia intensa, edema submandibular (papeira), apatia. FAMACHA 4–5 em 30% do rebanho. OPG médio 4.500 com predomínio de Haemonchus contortus na coprocultura. Ivermectina usada mensalmente há anos.","q":"Como controlar sem agravar a resistência?","pts":["Tratamento SELETIVO pelo método FAMACHA (tratar apenas graus 3–5) — mantém população refugia de parasitas sensíveis.","Escolha baseada em teste de redução de OPG (TRCOF): na resistência a lactonas macrocíclicas, opções incluem CLOSANTEL 10 mg/kg VO, LEVAMISOL 7,5 mg/kg, monepantel ou associações; pesar animais (sobredose de closantel cega).","Animais grau 5: suporte (ferro, proteína, transfusão em reprodutores valiosos).","Manejo integrado: rotação de pastagens, pastejo com bovinos/equinos, seleção genética de animais resistentes, suplementação proteica, descarte de animais com tratamentos repetidos.","Evitar tratamentos supressivos mensais e subdosagem."],"take":"FAMACHA + TRCOF + manejo integrado; ivermectina mensal criou o problema."},{"sp":"Equino (Cavalo)","spec":"Doenças Infecciosas","title":"Adenite equina (garrotilho — Streptococcus equi equi)","ctx":"Potro de 14 meses, haras com novos animais, febre 40,5 °C, secreção nasal mucopurulenta bilateral, linfonodos submandibulares aumentados e quentes, um com ponto de flutuação; disfagia leve.","q":"Antibiótico sim ou não?","pts":["Fase com abscesso já formado: NÃO usar antibiótico de rotina (atrasa maturação e aumenta risco de garrotilho bastardo); compressas quentes, drenagem e lavagem com iodopovidona diluída.","Fase inicial (febre sem abscesso) ou complicações (dispneia, bastardo, púrpura hemorrágica): PENICILINA G PROCAÍNA 22.000 UI/kg IM q12h (ou penicilina potássica IV) por 7–10 dias.","Dispneia por compressão faríngea: traqueostomia de urgência.","AINE (flunixina 1,1 mg/kg) para febre e dor; ração úmida/macia.","Biossegurança: isolamento por 4–6 semanas, endoscopia das bolsas guturais e PCR para identificar portadores (condroides)."],"take":"Abscesso formado = drenar; antibiótico apenas em fases precoces ou complicações."},{"sp":"Ave (Calopsita)","spec":"Aves / Exóticos","title":"Distocia (retenção de ovo) em calopsita","ctx":"Calopsita fêmea, 2 anos, 90 g, postura crônica (vários ovos sem macho), dieta à base de sementes. Apatia, penas eriçadas, esforço abdominal, cauda balançando, cloaca protrusa; ovo palpável na região caudal do celoma.","q":"Sequência de tratamento?","pts":["Estabilização: ambiente aquecido (29–32 °C) e úmido, oxigênio se dispneia, fluidos SC aquecidos (50 mL/kg/dia).","GLUCONATO DE CÁLCIO 50–100 mg/kg IM/SC (hipocalcemia é a causa mais comum).","Após cálcio e se a junção útero-vaginal estiver relaxada: ocitocina 3–5 UI/kg IM ou prostaglandina E2 tópica na junção útero-vaginal.","Se falhar: ovocentese com aspiração do conteúdo e colapso do ovo; cirurgia (salpingo-histerectomia) nos casos recorrentes.","Correção de manejo: dieta peletizada, cálcio, luz UVB, reduzir fotoperíodo, remover estímulos de nidificação; implante de deslorelina para postura crônica."],"take":"Calor + cálcio antes de ocitocina; corrigir a dieta de sementes."},{"sp":"Réptil (Iguana)","spec":"Répteis / Exóticos","title":"Doença óssea metabólica nutricional em iguana-verde","ctx":"Iguana-verde, 1 ano, 350 g, mantida sem luz UVB e alimentada com alface e frutas. Mandíbula amolecida ('mandíbula de borracha'), membros edemaciados, fraturas patológicas, tremores e fasciculações.","q":"Quais os pilares terapêuticos?","pts":["Hipocalcemia com tremores: GLUCONATO DE CÁLCIO 10% 50–100 mg/kg IM/SC diluído, depois cálcio VO (glubionato/carbonato) por semanas.","Fornecer LUZ UVB de qualidade (10–12 h/dia, substituir lâmpada a cada 6–12 meses) e gradiente térmico adequado (zona quente 35–38 °C).","Correção dietética: folhas verde-escuras ricas em cálcio (couve, rúcula, folha de mostarda, chicória), relação Ca:P ≥ 2:1, suplementação de cálcio em pó.","Calcitonina somente após normocalcemia (hipocalcemia é fatal); evitar excesso de vitamina D3 injetável.","Manipulação cuidadosa (fraturas) e analgesia (meloxicam 0,2 mg/kg)."],"take":"A doença é de manejo: UVB + dieta + cálcio."},{"sp":"Cão (Canino)","spec":"Toxicologia (Emergência)","title":"Intoxicação por sapo-cururu (Rhinella) em cão","ctx":"Jack Russell, 2 anos, 7 kg, mordeu um sapo no quintal à noite. Hipersalivação espumosa intensa, mucosas muito avermelhadas, ataxia, vômito e FC irregular de 200 bpm.","q":"Primeiros passos?","pts":["Descontaminação IMEDIATA: lavar boca e gengivas com água corrente por 10–15 min com a cabeça voltada para baixo (evitar aspiração).","ECG contínuo: taquiarritmias ventriculares — LIDOCAÍNA 2 mg/kg IV (cães); taquicardia supraventricular — esmolol/propranolol; bradicardia/bloqueio AV — atropina 0,02–0,04 mg/kg.","Convulsões: diazepam/midazolam; hipertermia: resfriamento ativo.","Fluidoterapia e monitoramento por 12–24 h. Na maioria dos casos o prognóstico é bom com tratamento precoce.","Antídoto (Fab antidigoxina) é caro e raramente disponível."],"take":"Lavar a boca e monitorar o ECG."},{"sp":"Cão (Canino)","spec":"Toxicologia (Emergência)","title":"Ingestão de rodenticida anticoagulante (brodifacoum) por cão","ctx":"Beagle, 1 ano, 13 kg, ingeriu um pacote de raticida em blocos (brodifacoum 0,005%) há 1 hora. Assintomático, mucosas normais.","q":"Qual a conduta?","pts":["Ingestão recente (< 2–4 h) e assintomático: induzir êmese (apomorfina 0,03 mg/kg IV/IM ou peróxido de hidrogênio 3% 1–2 mL/kg VO; máx. 45 mL) + carvão ativado 1–2 g/kg.","Opção A: iniciar VITAMINA K1 2,5–5 mg/kg/dia VO (com alimento gorduroso) por 4–6 semanas, dosando TP 48–72 h após a última dose.","Opção B: não tratar e dosar TP em 48 e 72 h após a ingestão; se prolongado, iniciar vitamina K1.","Se sangramento (dias 3–7): plasma fresco congelado 10–20 mL/kg ou sangue total, oxigênio, toracocentese se hemotórax volumoso.","Nunca usar vitamina K3 (menadiona) — ineficaz e tóxica."],"take":"Êmese + vitamina K1 por 4–6 semanas para 2ª geração."},{"sp":"Gato (Felino)","spec":"Cardiologia / Emergência","title":"Edema pulmonar cardiogênico em gato com cardiomiopatia","ctx":"Gato Maine Coon, 6 anos, 6,8 kg, dispneia restritiva súbita, taquipneia (FR 80), crepitações, ritmo de galope, hipotermia 36,9 °C. POCUS: átrio esquerdo aumentado (AE:Ao 2,3), linhas B difusas, sem efusão pleural significativa.","q":"Estabilização imediata?","pts":["Oxigênio em caixa e mínimo estresse (sedação leve com butorfanol 0,2–0,3 mg/kg IM).","FUROSEMIDA 1–2 mg/kg IV/IM, repetida a cada 1–2 h até FR < 40, ou IC 0,5–1 mg/kg/h; monitorar FR em repouso e função renal/potássio.","Toracocentese se efusão pleural significativa. Pimobendan 1,25 mg/gato q12h na ICC (extra-label, evitar na obstrução dinâmica grave).","Prevenção de tromboembolismo: CLOPIDOGREL 18,75 mg/gato q24h (estudo FAT CAT) ± rivaroxabana 2,5 mg/gato.","Alta: furosemida 1–2 mg/kg q12–24h, IECA, monitoramento domiciliar de FR em repouso (< 30 mpm)."],"take":"O2 + furosemida + clopidogrel; FR em repouso guia a terapia em casa."}],"reg":[{"id":"REG-01","title":"IN MAPA nº 35/2017 — Comercialização de Substâncias Sujeitas a Controle Especial para Uso Veterinário (SIPEAGRO)","source":"Ministério da Agricultura e Pecuária (MAPA) — Gov.br","url":"https://www.gov.br/agricultura/pt-br/assuntos/insumos-agropecuarios/insumos-pecuarios/produtos-veterinarios","detail":"Estabelece os procedimentos para comercialização, prescrição, dispensação e escrituração de substâncias sujeitas a controle especial de uso exclusivo veterinário (cetamina, xilazina, butorfanol, tiletamina+zolazepam) mediante Notificação de Receita Veterinária cadastrada no sistema SIPEAGRO."},{"id":"REG-02","title":"Portaria SVS/MS nº 344/1998 — Medicamentos Controlados Humanos Prescritos por Médicos Veterinários","source":"ANVISA / Ministério da Saúde — Legislação Federal","url":"https://bvsms.saude.gov.br/bvs/saudelegis/svs/1998/prt0344_12_05_1998_rep.html","detail":"Regulamenta a prescrição e dispensação em farmácias humanas de substâncias psicotrópicas e entorpecentes (fenobarbital, clonazepam, diazepam, tramadol, morfina, gabapentina) para uso veterinário, exigindo Notificação A (amarela), Notificação B (azul) ou Receita de Controle Especial em 2 vias com CRMV, endereço e identificação do paciente animal e do tutor."},{"id":"REG-03","title":"Decreto nº 5.053/2004 — Regulamento de Fiscalização de Produtos de Uso Veterinário","source":"Presidência da República / Casa Civil (Planalto)","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2004/decreto/d5053.htm","detail":"Aprova o regulamento de registro, fabricação, controle de qualidade, rotulagem, período de carência (abate/leite/ovos) e fiscalização de produtos farmacêuticos, biológicos e farmacoquímicos de uso veterinário no Brasil."},{"id":"REG-04","title":"RDC ANVISA nº 471/2021 — Critérios para Prescrição e Dispensação de Antimicrobianos","source":"ANVISA — Agência Nacional de Vigilância Sanitária","url":"https://www.in.gov.br/en/web/dou/-/resolucao-rdc-n-471-de-23-de-fevereiro-de-2021-304923190","detail":"Dispõe sobre os critérios para prescrição, dispensação, controle, embalagem e rotulagem de medicamentos antimicrobianos de uso sob prescrição (incluindo receituário veterinário em 2 vias com retenção na farmácia e validade de 10 dias)."},{"id":"REG-05","title":"Resolução CFMV nº 1.321/2020 — Prontuário Médico-Veterinário e Receituário","source":"Conselho Federal de Medicina Veterinária (CFMV)","url":"http://ts.cfmv.gov.br/manual/arquivos/resolucao/1321.pdf","detail":"Institui normas sobre o prontuário médico-veterinário (físico ou eletrônico), guarda de documentos clínicos, termo de consentimento livre e esclarecido (TCLE) para procedimentos anestésicos/cirúrgicos e uso extra-label."},{"id":"REG-06","title":"Resolução CFMV nº 1.275/2019 — Estrutura Física, Cadeia de Frio e Boas Práticas Hospitalares","source":"Conselho Federal de Medicina Veterinária (CFMV)","url":"http://ts.cfmv.gov.br/manual/arquivos/resolucao/1275.pdf","detail":"Define os requisitos técnicos de funcionamento de consultórios, clínicas e hospitais veterinários: controle térmico da cadeia de frio (vacinas e insulinas entre 2°C e 8°C), calibração de equipamentos médicos, gestão de resíduos de serviços de saúde (PGRSS) e dupla checagem de medicamentos de alta vigilância."},{"id":"REG-07","title":"IN MAPA nº 26/2009 — Regulamento Técnico para Fabricação e Controle de Produtos Veterinários","source":"Ministério da Agricultura e Pecuária (MAPA)","url":"https://www.gov.br/agricultura/pt-br/assuntos/insumos-agropecuarios/insumos-pecuarios/produtos-veterinarios","detail":"Estabelece diretrizes de Boas Práticas de Fabricação (BPF), estabilidade, estudos de depleção de resíduos em tecidos comestíveis e farmacovigilância veterinária."},{"id":"REG-08","title":"Plano de Ação Nacional sobre Resistência aos Antimicrobianos (PAN-BR AGRO / One Health)","source":"MAPA / Organização Mundial de Saúde Animal (WOAH)","url":"https://www.gov.br/agricultura/pt-br/assuntos/insumos-agropecuarios/insumos-pecuarios/resistencia-aos-antimicrobianos","detail":"Diretrizes baseadas em evidência científica para uso prudente de antimicrobianos em medicina veterinária (priorização de cultura e antibiograma, restrição de fármacos criticamente importantes como fluoroquinolonas e cefalosporinas de 3ª/4ª geração)."}],"labref":[["ht","Hematócrito","%",[37,55],[30,45],"Hemograma","Desidratação, contração esplênica (excitação), policitemia (cardiopatia cianótica, hipóxia, tumores renais), Greyhound.","Anemia — use o assistente de anemia (regenerativa × não regenerativa)."],["hb","Hemoglobina","g/dL",[12,18],[9,15],"Hemograma","Desidratação, policitemia; falso aumento por lipemia/hemólise.","Anemia."],["hem","Hemácias","×10⁶/µL",[5.5,8.5],[5,10],"Hemograma","Desidratação, policitemia.","Anemia."],["vcm","VCM","fL",[60,77],[39,55],"Hemograma","Regeneração (reticulocitose), Poodle (macrocitose), FeLV (gatos), aglutinação.","Deficiência de ferro (perda crônica), shunt portossistêmico, raças asiáticas (Akita, Shiba)."],["chcm","CHCM","g/dL",[32,36],[30,36],"Hemograma","Hemólise intravascular, lipemia, corpúsculos de Heinz (artefato).","Regeneração intensa, deficiência de ferro."],["leu","Leucócitos","×10³/µL",[6,17],[5.5,19.5],"Hemograma","Inflamação/infecção, estresse/corticoide, excitação (gatos), leucemia.","Consumo (sepse, parvovirose), destruição imunomediada, falha medular (FeLV, erliquiose crônica, quimioterapia)."],["seg","Neutrófilos segmentados","×10³/µL",[3,11.5],[2.5,12.5],"Hemograma","Inflamação, infecção bacteriana, estresse/corticoide, necrose tecidual, neoplasias.","Parvovirose, sepse grave, FeLV/FIV, erliquiose, fármacos (quimioterápicos, cloranfenicol, griseofulvina), imunomediada."],["bas","Bastonetes","×10³/µL",[0,0.3],[0,0.3],"Hemograma","DESVIO À ESQUERDA: inflamação aguda intensa (piometra, peritonite, pneumonia) — degenerativo se bastões > segmentados (mau prognóstico).","—"],["lin","Linfócitos","×10³/µL",[1,4.8],[1.5,7],"Hemograma","Excitação (gatos), hipoadrenocorticismo (linfócitos normais/altos em animal doente = suspeitar Addison!), leucemia linfocítica, erliquiose.","Estresse/corticoide (leucograma de estresse), linfangiectasia, infecções virais."],["mon","Monócitos","×10³/µL",[0.15,1.35],[0,0.85],"Hemograma","Inflamação crônica, estresse (cães), necrose, leishmaniose.","Sem significado clínico."],["eos","Eosinófilos","×10³/µL",[0.1,1.25],[0,1.5],"Hemograma","Parasitas (endo/ecto), alergias, complexo granuloma eosinofílico, asma felina, hipoadrenocorticismo, ma
